المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":[]},{"n":1208,"surah":"النصر","from":1,"to":3,"title":"سورة النصر","theme":"البشارة بنصر الله وفتح مكة ودخول الناس في دين الله أفواجًا، والأمر عند ذلك بالتسبيح والحمد والاستغفار، وفيها إشارة إلى قرب أجل النبي ﷺ.","sections":[{"name":"الحديث","taf":false,"p":"1","items":[{"id":"m-had-ibn-abbas","a":[1,3],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"سأل عمر أشياخ بدر عن السورة فقال بعضهم: أُمرنا أن نحمد الله ونستغفره إذا نُصرنا، وقال ابن عباس: هو أجل رسول الله ﷺ أعلمه له، فقال عمر: ما أعلم منها إلا ما تقول.","g":"","b":[],"q":[{"t":"قُلْتُ: هُوَ أَجَلُ رَسُولِ اللهِ ﷺ أَعْلَمَهُ لَهُ، قَالَ: ﴿إِذَا جَاءَ نَصْرُ اللهِ وَالْفَتْحُ﴾. وَذَلِكَ عَلَامَةُ أَجَلِكَ، ﴿فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا﴾ فَقَالَ عُمَرُ: مَا أَعْلَمُ مِنْهَا إِلَّا مَا تَقُولُ».","src":"صحيح البخاري","au":"البخاري","v":"6","p":179,"h":"4970","ch":"كتاب تفسير القرآن › سورة القيامة","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]},{"id":"m-had-tawil","a":[3,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"كان النبي ﷺ يكثر أن يقول في ركوعه وسجوده: «سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي»، يتأول القرآن، أي يعمل بما أُمر به في هذه السورة.","g":"","b":[],"q":[{"t":"فِي رُكُوعِهِ وَسُجُودِهِ: سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي. يَتَأَوَّلُ الْقُرْآنَ».","src":"صحيح البخاري","au":"البخاري","v":"1","p":163,"h":"817","ch":"كتاب الأذان › باب التسبيح والدعاء في السجود","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"},{"t":"فكان ﷺ يتأول القرآن، ويقول ذلك في صلاته","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"النصر","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"تحليل الحديث","taf":true,"p":"1","items":[{"id":"m3-ha-sahih","a":[1,3],"lv":["التفقّه"],"st":"ثابت","s":"أحاديث البطاقة (تفسير ابن عباس، والتسبيح في الركوع) مخرّجة في صحيحي البخاري ومسلم، وقال ابن الصلاح: كتاباهما أصح الكتب بعد كتاب الله العزيز؛ فهي ثابتة لا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","g":"","b":[],"q":[{"t":"وكتاباهما أصح الكتب بعد كتاب الله العزيز","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":18,"h":null,"ch":"النوع الأول من أنواع علوم الحديث: معرفة الصحيح من الحديث","ed":"دار الفكر- سوريا، دار الفكر المعاصر - بيروت؛ تحقيق: نور الدين عتر"}],"sh":12},{"id":"m3-ha-zuhri","a":[1,1],"lv":["التفقّه"],"st":"ثابت","s":"رواية نزولها عام الفتح جاءت عن الزهري (تابعي) فهي مرسلة، وقال ابن الصلاح: حكم المرسل حكم الحديث الضعيف إلا أن يصح مخرجه من وجه آخر.","g":"","b":[],"q":[{"t":"أخرج عبد الرزاق في مصنفه عن معمر عن الزهري قال لما دخل رسول الله ﷺ مكة عام الفتح","src":"لباب النقول","au":"السيوطي","v":null,"p":218,"h":null,"ch":"سورة النصر","ed":"دار الكتب العلمية بيروت - لبنان"},{"t":"ثم اعلم أن حكم المرسل حكم الحديث الضعيف، إلا أن يصح مخرجه بمجيئه من وجه آخر","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":53,"h":null,"ch":"النوع التاسع: معرفة المرسل","ed":"دار الفكر- سوريا، دار الفكر المعاصر - بيروت؛ تحقيق: نور الدين عتر"}],"sh":2}]},{"name":"السيرة","taf":false,"p":"1","items":[{"id":"m-sir-fath","a":[1,2],"lv":["التمكين"],"st":"ثابت","s":"وقع ما بشّرت به السورة: فُتحت مكة، ودخل الناس في دين الله أفواجًا، وصار كثير منهم أنصارًا بعد أن كانوا أعداء.","g":"","b":[],"q":[{"t":"بحيث يكون كثير منهم من أهله وأنصاره، بعد أن كانوا من أعدائه، وقد وقع هذا المبشر به","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"النصر › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"أسباب النزول","taf":false,"p":"1","items":[{"id":"m-asb-nasr","a":[1,3],"lv":["التفقّه"],"st":"يحتاج تحققًا","s":"في زمن نزولها روايات: قال الواحدي: نزلت منصرف النبي ﷺ من غزوة حنين، وأورد السيوطي عن الزهري أنها نزلت عام الفتح لما دخل الناس في الدين. والروايات تحتاج تحققًا.","g":"رواية تحتاج تحققًا","b":[],"q":[{"t":"نَزَلَتْ فِي مُن  القاهرة، مصر، ٢٠٠٨؛ تحقيق: عبد الرحيم الطرهوني"}]}]},{"name":"المعنى الإجمالي","taf":false,"p":"2","items":[{"id":"m-gen-1","a":[1,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"في السورة بشارة بنصر الله لرسوله وفتح مكة ودخول الناس في دين الله أفواجًا، وقد وقع؛ وأمرٌ بعد حصول ذلك بالشكر: التسبيح بحمد الله والاستغفار.","g":"","b":[],"q":[{"t":"فالبشارة هي البشارة بنصر الله لرسوله، وفتحه مكة، ودخول الناس في دين الله أفواجًا، بحيث يكون كثير منهم من أهله وأنصاره، بعد أن كانوا من أعدائه، وقد وقع هذا المبشر به","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"النصر › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"فأمر رسوله أن يشكر ربه على ذلك، ويسبح بحمده ويستغفره","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"النصر","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التفسير","taf":false,"p":"2","items":[{"id":"m-taf-ajal","a":[3,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"في الأمر بالحمد والاستغفار إشارة إلى أن أجل النبي ﷺ قد قرب؛ فالأعمال الفاضلة تُختم بالاستغفار كالصلاة والحج.","g":"","b":[],"q":[{"t":"وقد عهد أن الأمور الفاضلة تختم بالاستغفار، كالصلاة والحج، وغير ذلك.","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"النصر","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"فأمر الله لرسوله بالحمد والاستغفار في هذه الحال، إشارة إلى أن أجله قد انتهى، فليستعد ويتهيأ للقاء ربه","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"النصر","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-shukr-zyada","a":[3,3],"lv":["التمكين"],"st":"ثابت","s":"وفيه إشارة إلى استمرار النصر لهذا الدين وزيادته بالتسبيح والاستغفار، فإنهما من الشكر، والله يقول: ﴿لئن شكرتم لأزيدنكم﴾.","g":"","b":[],"q":[{"t":"إشارة لأن يستمر النصر لهذا الدين (١) ، ويزداد عند حصول التسبيح بحمد الله واستغفاره من رسوله، فإن هذا من الشكر","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"النصر","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"علوم القرآن","taf":false,"p":"2","items":[{"id":"m2-qs-tawdi","a":[1,3],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"تسمى السورة أيضًا «سورة التوديع»، وكان ﷺ لما نزلت يقول: نعى الله إليّ نفسي.","g":"","b":[],"q":[{"t":"وَتسَمى أَيْضا سُورَة التوديع","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":256,"h":null,"ch":"سورة النصر","ed":"تحقيق: عبد القادر أحمد عطا [ت ١٤٠٣ هـ]"}]}]},{"name":"المناسبات","taf":false,"p":"2","items":[{"id":"m2-mun-kafirun","a":[1,1],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال البقاعي: لما دلت سورة الكافرون على أن الكفار صاروا إلى حال لا يُلتفت إليهم فيها، جاء السؤال: فهل يحصل نصر عليهم؟ فجاءت هذه السورة.","g":"","b":[],"q":[{"t":"لما دلت التي قبلها على أن الكفار قد صاروا إلى حال لا عبرة بهم فيه ولا التفات","src":"نظم الدرر","au":"البقاعي","v":"22","p":313,"h":null,"ch":"الكوثر","ed":"دائرة المعارف العثمانية، حيدر آباد - الهند، الأولى، (١٣٨٩ - ١٤٠٤ هـ) (١٩٦٩ - ١٩٨٤ م)"}]}]},{"name":"المقاصد","taf":true,"p":"2","items":[{"id":"m2-maq-nasr","a":[1,3],"lv":["التفقّه"],"st":"ثابت","s":"قال ابن عاشور: الغرض منها الوعد بنصر كامل أو بفتح مكة، والبشارة بدخول خلائق كثيرة في الإسلام، والإيماء إلى اقتراب انتقال النبي ﷺ إلى الآخرة.","g":"","b":[],"q":[{"t":"وَالْغَرَضُ مِنْهَا الْوَعْدُ بِنَصْرٍ كَامِلٍ مِنْ عِنْدِ اللَّهِ أَوْ بِفَتْحِ مَكَّةَ، وَالْبِشَارَةُ بِدُخُولِ خَلَائِقَ كَثِيرَةٍ فِي الْإِسْلَامِ","src":"التحرير والتنوير","au":"ابن عاشور","v":"30","p":589,"h":null,"ch":"١١٠- سورة النصر › أغراضها","ed":"الدار التونسية للنشر - تونس"},{"t":"وَالْإِيمَاءُ إِلَى أَنَّهُ حِينَ يَقَعُ ذَلِكَ فَقَدِ اقْتَرَبَ انْتِقَالُ رَسُولِ اللَّهِ ﷺ إِلَى الْآخِرَةِ.","src":"التحرير والتنوير","au":"ابن عاشور","v":"30","p":589,"h":null,"ch":"١١٠- سورة النصر › أغراضها","ed":"الدار التونسية للنشر - تونس"}]}]},{"name":"اللغة والإعراب","taf":true,"p":"2","items":[{"id":"m2-irab-idha","a":[1,1],"lv":["التفقّه"],"st":"ثابت","s":"قال النحاس: ﴿إذا﴾ ظرف زمان منصوب بـ﴿جاء﴾، و﴿نصر الله﴾ فاعل، و﴿الفتح﴾ معطوف عليه.","g":"","b":[],"q":[{"t":"إِذا ظرف زمان نصب بجاء نَصْرُ اللَّهِ رفع بجاء","src":"إعراب القرآن","au":"النحاس","v":"5","p":191,"h":null,"ch":"١١٠ شرح إعراب سورة إذا جاء نصر الله (النصر) › [سورة النصر (١١٠) : آية ١]","ed":"منشورات محمد علي بيضون، دار الكتب العلمية، بيروت، الأولى، ١٤٢١ هـ"}]}]},{"name":"التجويد","taf":false,"p":"q","items":[{"id":"m2-tj-jaa","a":[1,1],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"المد المتصل: حرف المد وبعده همز في كلمة واحدة، ومده واجب. مثاله في الدرس: ﴿جَاءَ﴾.","g":"","b":[],"q":[{"t":"فَوَاجِبٌ إِنْ جَاءَ هَمْزٌ بَعْدَ مَدْ ... فِي كِلْمَةٍ وَذَا بِمُتَّصِلٍ يُعَدْ","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":7,"h":null,"ch":"أحكام المد","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}],"sh":3},{"id":"m2-tj-afwajan","a":[2,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإخفاء: النون الساكنة والتنوين قبل بقية الحروف (الخمسة عشر) تُخفى مع الغنة. مثاله في الدرس: ﴿أَفْوَاجًا فَسَبِّحْ﴾.","g":"","b":[],"q":[{"t":"وَالرَّابِعُ الإِخْفَاءُ عِنْدَ الْفَاضِلِ ... مِنَ الحُرُوفِ وَاجِبٌ لِلْفَاضِلِ","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":3,"h":null,"ch":"أحكام النون الساكنة والتنوين","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}],"sh":7}]},{"name":"الوقف والابتداء","taf":false,"p":"q","items":[{"id":"m2-waqf-nasr","a":[1,3],"lv":["التمكين"],"st":"ثابت","s":"ليس في السورة وقف تام قبل آخرها؛ لأن ﴿فسبح﴾ جواب ﴿إذا﴾، والوقف على ﴿واستغفره﴾ كافٍ، وآخر السورة تام.","g":"","b":[],"q":[{"t":"ليس فيها وقف تام؛ لأنَّ قوله: «فسبح» جواب «إذا»","src":"منار الهدى","au":"الأشموني","v":"2","p":434,"h":null,"ch":"بيان الوقف والابتداء › سورة النصر","ed":"دار الحديث - القاهرة، مصر، ٢٠٠٨؛ تحقيق: عبد الرحيم الطرهوني"},{"t":"﴿وَاسْتَغْفِرْهُ﴾ [٣] كاف.","src":"منار الهدى","au":"الأشموني","v":"2","p":434,"h":null,"ch":"بيان الوقف والابتداء › سورة النصر","ed":"دار الحديث - القاهرة، مصر، ٢٠٠٨؛ تحقيق: عبد الرحيم الطرهوني"}]}]},{"name":"القراءات","taf":false,"p":"q","items":[{"id":"m3-qir-jaa","a":[1,1],"lv":["التفقّه"],"st":"ثابت","s":"أمال حمزة الألف في ﴿جاء﴾ حيث وقعت، واختُلف فيها عن هشام.","g":"","b":[],"q":[{"t":"أمالها حمزة من عشر أفعال، وهي زاد، شاء، جاء، خاب، ران، خاف، زاغ، طاب، ضاق، حاق حيث وقعت","src":"النشر في القراءات العشر","au":"ابن الجزري","v":"2","p":59,"h":null,"ch":"باب مذاهبهم في الفتح › [فصل في إمالة الألف التي هي عين من الفعل الثلاثي الماضي]","ed":"المطبعة التجارية الكبرى [تصوير دار الكتاب العلمية]؛ تحقيق: علي محمد الضباع (المتوفى ١٣٨٠ هـ)"},{"t":"واختلف عن هشام في شاء، جاء، زاد فأمالها الداجوني وفتحها الحلواني","src":"النشر في القراءات العشر","au":"ابن الجزري","v":"2","p":60,"h":null,"ch":"باب مذاهبهم في الفتح › [فصل في إمالة الألف التي هي عين من الفعل الثلاثي الماضي]","ed":"المطبعة التجارية الكبرى [تصوير دار الكتاب العلمية]؛ تحقيق: علي محمد الضباع (المتوفى ١٣٨٠ هـ)"}],"sh":2}]},{"name":"التزكية","taf":false,"p":"3","items":[{"id":"m-taz-khatm","a":[3,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الأعمال الفاضلة تُختم بالاستغفار؛ فالعبد يستغفر بعد الطاعة لا بعد المعصية وحدها.","g":"","b":[],"q":[{"t":"وقد عهد أن الأمور الفاضلة تختم بالاستغفار، كالصلاة والحج، وغير ذلك.","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"النصر","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التدبر","taf":false,"p":"3","items":[{"id":"m-tad-nasr","a":[1,3],"lv":["التأسيس","التمكين"],"st":"","s":"عند النجاح والنعمة لا يكون الجواب الفخر، بل التسبيح والحمد والاستغفار.","g":"","b":["m-gen-1","m-taz-khatm"],"q":[]}]},{"name":"التطبيق","taf":false,"p":"3","items":[{"id":"m-app-ruku","a":[3,3],"lv":["التأسيس","التمكين"],"st":"","s":"قل في ركوعك وسجودك اليوم: «سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي».","g":"","b":["m-had-tawil"],"q":[]}]}],"gaps":[{"f":"المفردات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ألفاظ السورة ظاهرة، ولم يذكر ابن قتيبة في غريبه لفظًا منها يحتاج إلى بيان."},{"f":"السياق","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"سياق السورة مسجل في المناسبات والمقاصد."},{"f":"العقيدة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يوجد في السورة مسألة عقدية مستقلة غير ما في التفسير."},{"f":"المتشابهات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ليس في البرهان للكرماني لهذه السورة غير تسميتها «سورة التوديع» (مسجل في علوم القرآن)، ولا باب لها في درة التنزيل."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"قول ابن عباس وعمر في تفسيرها مسجل في التفسير والحديث."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":["زمن نزول السورة: بعد حنين أو عام الفتح."]},{"n":1209,"surah":"المسد","from":1,"to":5,"title":"سورة المسد","theme":"ذم أبي لهب وامرأته لعداوتهما للنبي ﷺ، والإخبار بخسارته وعذابهما، وفي السورة آية على صدق النبوة.","sections":[{"name":"العقيدة","taf":false,"p":"1","items":[{"id":"m-aq-ghayb","a":[1,5],"lv":["التمكين"],"st":"ثابت","s":"في السورة آية باهرة: نزلت وأبو لهب وامرأته حيّان، وأخبرت أنهما في النار، ومن لازم ذلك أنهما لا يُسلمان، فوقع كما أخبر عالم الغيب والشهادة.","g":"","b":[],"q":[{"t":"ففي هذه السورة، آية باهرة من آيات الله، فإن الله أنزل هذه السورة، وأبو لهب وامرأته لم يهلكا، وأخبر أنهما سيعذبان في النار ولا بد، ومن لازم ذلك أنهما لا يسلمان، فوقع كما أخبر عالم الغيب والشهادة.","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"المسد › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وَقَطَعَ بِأَنَّهُ يَصْلَى نَارًا ذَاتَ لَهَبٍ وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ فِي جِيدِهَا حَبَلٌ مِنْ مَسَدٍ فَلَمْ يُسْلِمْ وَاحِدٌ مِنْهُمَا حَتَّى صَارَ الْخَبَرُ بِقَضِيَّةِ الْإِسْلَامِ صِدْقًا","src":"دلائل النبوة","au":"البيهقي","v":"2","p":181,"h":null,"ch":"المجلد الثانى › جماع أبواب المبعث › باب ما رد أبو لهب على النبي ﵌ حين دعاهم إلى الإيمان وما أنزل الله تعالى فيه من القرآن وقطع بأنه يصلى نارا ذات لهب وامرأته حمالة الحطب في جيدها حبل من مسد فلم يسلم واحد منهما حتى صار الخبر بقضية الإسلام صدقا ولا يقطع بمثل","ed":"دار الكتب العلمية، بيروت - لبنان، الأولى، ١٤٠٥ هـ - ١٩٨٥ م"}]}]},{"name":"تحليل الحديث","taf":true,"p":"1","items":[{"id":"m3-ha-sahih","a":[1,5],"lv":["التفقّه"],"st":"ثابت","s":"أحاديث البطاقة (صعود النبي ﷺ الصفا) مخرّجة في صحيحي البخاري ومسلم، وقال ابن الصلاح: كتاباهما أصح الكتب بعد كتاب الله العزيز؛ فهي ثابتة لا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","g":"","b":[],"q":[{"t":"وكتاباهما أصح الكتب بعد كتاب الله العزيز","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":18,"h":null,"ch":"النوع الأول من أنواع علوم الحديث: معرفة الصحيح من الحديث","ed":"دار الفكر- سوريا، دار الفكر المعاصر - بيروت؛ تحقيق: نور الدين عتر"}],"sh":12}]},{"name":"السيرة","taf":false,"p":"1","items":[{"id":"m2-sir-shawk","a":[4,4],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"ذكر ابن إسحاق فيما بلغه أن الله سمّى امرأة أبي لهب ﴿حمالة الحطب﴾ لأنها كانت تحمل الشوك فتطرحه على طريق رسول الله ﷺ.","g":"","b":[],"q":[{"t":"وَإِنَّمَا سَمَّاهَا اللَّهُ تَعَالَى حَمَّالَةَ الْحَطَبِ لِأَنَّهَا كَانَتْ -فِيمَا بَلَغَنِي- تَحْمِلُ الشَّوْكَ فَتَطْرَحَهُ عَلَى طَرِيقِ رَسُولِ اللَّهِ ﷺ","src":"السيرة النبوية","au":"ابن هشام","v":"2","p":5,"h":null,"ch":"المجلد: الثاني › المتن","ed":"شركة الطباعة الفنية المتحدة [وأعاد المحقق نشرها -مع تعديلات طفيفة- لدى مكتبة الكليات الأزهرية بالقاهرة، وكذلك نشرتها دار الجيل بيروت، بنفس ترقيم الصفحات]"}]}]},{"name":"أسباب النزول","taf":false,"p":"1","items":[{"id":"m-asb-safa","a":[1,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"صعد النبي ﷺ الصفا ونادى قريشًا وقال: «فإني نذير لكم بين يدي عذاب شديد»، فقال أبو لهب: تبًّا لك، ألهذا جمعتنا؟ فأنزل الله: ﴿تبت يدا أبي لهب﴾. رواه البخاري.","g":"سبب ثابت","b":[],"q":[{"t":"قَالَ: فَإِنِّي نَذِيرٌ لَكُمْ بَيْنَ يَدَيْ عَذَابٍ شَدِيدٍ، فَقَالَ أَبُو لَهَبٍ: تَبًّا لَكَ، أَلِهَذَا جَمَعْتَنَا؟ فَأَنْزَلَ اللهُ: ﴿تَبَّتْ يَدَا أَبِي لَهَبٍ﴾».","src":"صحيح البخاري","au":"البخاري","v":"6","p":122,"h":"4801","ch":"كتاب تفسير القرآن › سورة النمل › والخبء ما خبأت","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]}]},{"name":"وجه الاستنباط","taf":true,"p":"1","items":[{"id":"m3-inf-kunya","a":[1,1],"lv":["التفقّه"],"st":"خلاف معتبر","s":"ردّ القرطبي استدلال من استدل بقوله ﴿أبي لهب﴾ على جواز تكنية المشرك؛ فذكر الكنية هنا لا يدل على ذلك.","g":"","b":[],"q":[{"t":"وقد ظن قوم أن في هذا دليلا على تكنية المشرك، وهو باطل","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"20","p":236,"h":null,"ch":"تفسير سورة تبت › [سورة المسد (١١١): آية ١]","ed":"دار الكتب المصرية - القاهرة، الثانية، ١٣٨٤ هـ - ١٩٦٤ م؛ تحقيق: أحمد البردوني وإبراهيم أطفيش"}]}]},{"name":"أسباب الخلاف","taf":true,"p":"1","items":[{"id":"m2-rfd-hammala","a":[4,4],"lv":["التفقّه"],"st":"خلاف معتبر","s":"في إعراب ﴿وامرأته حمالة الحطب﴾ ثلاثة أوجه ذكرها ابن الأنباري، ويتغير بها موضع الوقف: رفعها عطفًا على ضمير ﴿سيصلى﴾، أو رفعها بالابتداء بما عاد عليها من ﴿في جيدها﴾، أو رفع كل منهما بالآخر.","g":"","b":[],"q":[{"t":"في «المرأة» ثلاثة أوجه: أحدهن أن ترفعها على النسق على ما في (سيصلى) [٣] فيحسن الوقف عليها","src":"إيضاح الوقف والابتداء","au":"ابن الأنباري","v":"2","p":990,"h":null,"ch":"[سورة] تبت","ed":"مطبوعات مجمع اللغة العربية بدمشق، ١٣٩٠هـ - ١٩٧١م؛ تحقيق: محيي الدين عبد الرحمن رمضان"}]}]},{"name":"المعنى الإجمالي","taf":false,"p":"2","items":[{"id":"m2-gm-masad","a":[1,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"ذمّ الله أبا لهب عمّ النبي ﷺ لشدة عداوته، وامرأته التي كانت شديدة الأذية للنبي ﷺ. وفي السورة آية باهرة: نزلت وأبو لهب وامرأته حيّان، وأخبرت أنهما سيعذبان في النار، ومن لازم ذلك أنهما لا يسلمان، فوقع كما أخبر.","g":"","b":[],"q":[{"t":"أبو لهب هو عم النبي ﷺ، وكان شديد العداوة [والأذية] للنبي ﷺ","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"المسد › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"فإن الله أنزل هذه السورة، وأبو لهب وامرأته لم يهلكا، وأخبر أنهما سيعذبان في النار ولا بد، ومن لازم ذلك أنهما لا يسلمان","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"المسد › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التفسير","taf":false,"p":"2","items":[{"id":"m-taf-khasira","a":[1,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿تبت يدا أبي لهب﴾ خسرت يداه وشقي ﴿وتب﴾ فلم يربح، ﴿ما أغنى عنه ماله﴾ الذي أطغاه ولا ما كسبه، ﴿سيصلى نارًا ذات لهب﴾ تحيط به من كل جانب.","g":"","b":[],"q":[{"t":"﴿تَبَّتْ يَدَا أَبِي لَهَبٍ﴾ أي: خسرت يداه، وشقى ﴿وَتَبَّ﴾ فلم يربح، ﴿مَا أَغْنَى عَنْهُ مَالُهُ﴾ الذي كان عنده وأطغاه، ولا ما كسبه فلم يرد عنه شيئًا من عذاب الله إذ نزل به، ﴿سَيَصْلَى نَارًا ذَاتَ لَهَبٍ﴾ أي: ستحيط به النار من كل جانب","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"المسد › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-imraa","a":[4,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"كانت امرأته شديدة الأذية للنبي ﷺ تعاون زوجها على الإثم، وتجمع من الأوزار كمن يجمع حطبًا في عنقه حبل من ليف؛ أو أنها تحمل الحطب على زوجها في النار.","g":"","b":[],"q":[{"t":"وكانت أيضًا شديدة الأذية لرسول الله ﷺ، تتعاون هي وزوجها على الإثم والعدوان","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"المسد › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"أو أنها تحمل في النار الحطب على زوجها، متقلدة في عنقها حبلا من مسد","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"المسد › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"السياق","taf":false,"p":"2","items":[{"id":"m-ctx-abu-lahab","a":[1,1],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"أبو لهب عم النبي ﷺ، وكان شديد العداوة والأذية له، فذمه الله ذمًّا باقيًا إلى ","code":"NO_RELATED_MATERIAL","note":"بُحث في مسائل القرطبي الفقهية لهذه السورة وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من آياتها."},{"f":"التزكية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يوجد في رياض الصالحين والأذكار نص مرتبط بآيات هذه السورة مباشرة غير ما سُجّل في الحديث والتدبر."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":["المراد بـ«حمالة الحطب»."]},{"n":1210,"surah":"الإخلاص","from":1,"to":4,"title":"سورة الإخلاص","theme":"سورة الإخلاص تعرّف بالله: الأحد المنفرد بالكمال، الصمد المقصود في الحوائج، المنزّه عن الولد والوالد والمثيل.","sections":[{"name":"العقيدة","taf":false,"p":"1","items":[{"id":"m-aq-sifat","a":[1,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"السورة في توحيد الأسماء والصفات: إثبات الأحدية والصمدية لله، ونفي الولد والوالد والكفء عنه.","g":"","b":[],"q":[{"t":"فهذه السورة مشتملة على توحيد الأسماء والصفات.","src":"تفسير السعدي","au":"السعدي","v":null,"p":937,"h":null,"ch":"الإخلاص › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"مِنْهَا «الْأَحَدُ» قَالَ الْحَلِيمِيُّ: وَهُوَ الَّذِي لَا شَبِيهَ لَهُ وَلَا نَظِيرَ , كَمَا أَنَّ الْوَاحِدَ هُوَ الَّذِي لَا شَرِيكَ لَهُ وَلَا عَدِيدَ","src":"الأسماء والصفات","au":"البيهقي","v":"1","p":90,"h":null,"ch":"باب جماع أبواب ذكر الأسماء التي تتبع نفي التشبيه عن الله تعالى جده منها \" الأحد \" قال الحليمي: وهو الذي لا شبيه له ولا نظير , كما أن الواحد هو الذي لا شريك له ولا عديد , ولهذا سمى الله ﷿ نفسه بهذا الاسم , لما وصف نفسه بأنه لم يلد ولم يولد ولم يكن","ed":"مكتبة السوادي، جدة - المملكة العربية السعودية، الأولى، ١٤١٣ هـ - ١٩٩٣ م"},{"t":"قَالَ الْحَلِيمِيُّ: مَعْنَاهُ الْمَصْمُودُ بِالْحَوَائِجِ أَيِ الْمَقْصُودُ بِهَا","src":"الأسماء والصفات","au":"البيهقي","v":"1","p":154,"h":null,"ch":"باب جماع أبواب ذكر الأسماء التي تتبع إثبات التدبير له دون ما سواه قال الحليمي: فأول ذلك \" المدبر \" ومعناه مصرف الأمور على ما يوجب حسن عواقبها واشتقاقه من الدبر فكان المدبر هو الذي ينظر إلى دبر الأمور فيدخل فيه على علم به والله ﷻ عالم بكل ما هو","ed":"مكتبة السوادي، جدة - المملكة العربية السعودية، الأولى، ١٤١٣ هـ - ١٩٩٣ م"}]},{"id":"m-aq-radd","a":[3,4],"lv":["التمكين"],"st":"ثابت","s":"نفت الآيات ما نسبه المشركون واليهود والنصارى إلى الله من الولد، فنفى الله عن ذاته الولادة والمثل.","g":"","b":[],"q":[{"t":"قَالَ مُقَاتِلٌ: قَالَ مُشْرِكُو الْعَرَبِ: الْمَلَائِكَةُ بَنَاتُ اللَّهِ، وَقَالَتِ الْيَهُودُ: عُزَيْرٌ ابْنُ اللَّهِ، وَقَالَتِ النَّصَارَى: الْمَسِيحُ ابْنُ اللَّهِ، فَأَكْذَبَهُمُ اللَّهُ وَنَفَى عَنْ ذَاتِهِ الْوِلَادَةَ وَالْمِثْلَ","src":"معالم التنزيل","au":"البغوي","v":"8","p":589,"h":null,"ch":"الإخلاص › ٣","ed":"دار طيبة للنشر والتوزيع، الرابعة، ١٤١٧ هـ - ١٩٩٧ م؛ تحقيق: حققه وخرج أحاديثه محمد عبد الله النمر - عثمان جمعة ضميرية - سليمان مسلم الحرش"},{"t":"فَكَأَنَّ قَوْلَهُ جَلَّ وَعَلَا: ﴿لَمْ يَلِدْ وَلَمْ يُولَدْ﴾ [الإخلاص: ٣] مِنْ تَفْسِيرِ قَوْلِهِ «أَحَدٌ» وَالْمَعْنَى لَمْ يَتَفَرَّعْ عَنْهُ شَيْءٌ , وَلَمْ يَتَفَرَّعْ هُوَ عَنْ شَيْءٍ","src":"الأسماء والصفات","au":"البيهقي","v":"1","p":90,"h":null,"ch":"باب جماع أبواب ذكر الأسماء التي تتبع نفي التشبيه عن الله تعالى جده منها \" الأحد \" قال الحليمي: وهو الذي لا شبيه له ولا نظير , كما أن الواحد هو الذي لا شريك له ولا عديد , ولهذا سمى الله ﷿ نفسه بهذا الاسم , لما وصف نفسه بأنه لم يلد ولم يولد ولم يكن","ed":"مكتبة السوادي، جدة - المملكة العربية السعودية، الأولى، ١٤١٣ هـ - ١٩٩٣ م"}]}]},{"name":"الحديث","taf":false,"p":"1","items":[{"id":"m-had-thuluth","a":[1,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"سمع رجل رجلًا يردد ﴿قل هو الله أحد﴾ وكأنه يستقلها، فقال النبي ﷺ: «والذي نفسي بيده إنها لتعدل ثلث القرآن».","g":"","b":[],"q":[{"t":"وَكَأَنَّ الرَّجُلَ يَتَقَالُّهَا، فَقَالَ رَسُولُ اللهِ ﷺ: وَالَّذِي نَفْسِي بِيَدِهِ، إِنَّهَا لَتَعْدِلُ ثُلُثَ الْقُرْآنِ».","src":"صحيح البخاري","au":"البخاري","v":"6","p":189,"h":"5013","ch":"كتاب فضائل القرآن › باب القراء من أصحاب النبي ﷺ","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]},{"id":"m-had-qudsi","a":[1,4],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"في الحديث القدسي: «... وأما شتمه إياي فقوله: اتخذ الله ولدًا، وأنا الأحد الصمد، لم ألد ولم أولد، ولم يكن لي كفؤًا أحد».","g":"","b":[],"q":[{"t":"وَأَمَّا شَتْمُهُ إِيَّايَ فَقَوْلُهُ: اتَّخَذَ اللهُ وَلَدًا، وَأَنَا الْأَحَدُ الصَّمَدُ، لَمْ أَلِدْ وَلَمْ أُولَدْ، وَلَمْ يَكُنْ لِي كُفْأ أَحَدٌ».","src":"صحيح البخاري","au":"البخاري","v":"6","p":180,"h":"4974","ch":"كتاب تفسير القرآن › سورة القيامة","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]},{"id":"m-had-bedtime","a":[1,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"كان النبي ﷺ إذا أوى إلى فراشه كل ليلة جمع كفيه ونفث فيهما وقرأ الإخلاص والمعوذتين، ثم مسح بهما ما استطاع من جسده، يفعل ذلك ثلاث مرات.","g":"","b":[],"q":[{"t":"«كَانَ إِذَا أَوَى إِلَى فِرَاشِهِ كُلَّ لَيْلَةٍ، جَمَعَ كَفَّيْهِ ثُمَّ نَفَثَ فِيهِمَا، فَقَرَأَ فِيهِمَا: ﴿قُلْ هُوَ اللهُ أَحَدٌ﴾، وَ ﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ﴾، وَ ﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ﴾، ثُمَّ يَمْسَحُ بِهِمَا مَا اسْتَطَاعَ مِنْ جَسَدِهِ، يَبْدَأُ بِهِمَا عَلَى رَأْسِهِ وَوَجْهِهِ، وَمَا أَقْبَلَ مِنْ جَسَدِهِ، يَفْعَلُ ذَلِكَ ثَلَاثَ مَرَّاتٍ».","src":"صحيح البخاري","au":"البخاري","v":"6","p":190,"h":"5017","ch":"كتاب فضائل القرآن › باب القراء من أصحاب النبي ﷺ","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]}]},{"name":"تحليل الحديث","taf":true,"p":"1","items":[{"id":"m3-ha-sahih","a":[1,4],"lv":["التفقّه"],"st":"ثابت","s":"أحاديث البطاقة (فضل السورة، والحديث القدسي، وقراءتها عند النوم) مخرّجة في صحيحي البخاري ومسلم، وقال ابن الصلاح: كتاباهما أصح الكتب بعد كتاب الله العزيز؛ فهي ثابتة لا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","g":"","b":[],"q":[{"t":"وكتاباهما أصح الكتب بعد كتاب الله العزيز","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":18,"h":null,"ch":"النوع الأول من أنواع علوم الحديث: معرفة الصحيح من الحديث","ed":"دار الفكر- سوريا، دار الفكر المعاصر - بيروت؛ تحقيق: نور الدين عتر"}],"sh":12},{"id":"m3-ha-nasab","a":[1,4],"lv":["التفقّه"],"st":"يحتاج تحققًا","s":"حديث «انسب لنا ربك» رواه الترمذي موصولًا عن أبي بن كعب، ثم رواه مرسلًا عن أبي العالية دون ذكر أبي، وقال: هذا أصح. وحكم المرسل عند ابن الصلاح حكم الضعيف إلا أن يجيء من وجه آخر.","g":"","b":[],"q":[{"t":"وَلَمْ يَذْكُرْ فِيهِ، عَنْ أُبَيِّ بْنِ كَعْبٍ. وَهَذَا أَصَحُّ مِنْ حَدِيثِ أَبِي سَعْدٍ","src":"سنن الترمذي","au":"الترمذي","v":"5","p":452,"h":"3365","ch":"٤٤ - أبواب تفسير القرآن › باب ومن سورة الإخلاص","ed":"شركة مكتبة ومطبعة مصطفى البابي الحلبي - مصر، الثانية، ١٣٩٥ هـ - ١٩٧٥ م"},{"t":"ثم اعلم أن حكم المرسل حكم الحديث الضعيف، إلا أن يصح مخرجه بمجيئه من وجه آخر","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":53,"h":null,"ch":"النوع التاسع: معرفة المرسل","ed":"دار الفكر- سوريا، دار الفكر المعاصر - بيروت؛ تحقيق: نور الدين عتر"}],"sh":2}]},{"name":"أسباب النزول","taf":false,"p":"1","items":[{"id":"m-asb-nasab","a":[1,4],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"رُوي عن أُبيّ بن كعب أن المشركين قالوا للنبي ﷺ: انسب لنا ربك، فنزلت السورة. ورُوي أن السائلين كانوا من اليهود. والرواية تحتاج إلى تحقق درجتها.","g":"رواية تحتاج تحققًا","b":[],"q":[{"t":"أخرج الترمذي والحاكم وابن خزيمة من طريق أبي العالية عن أبي بن كعب أن المشركين قالوا لرسول الله ﷺ انسب لنا ربك فأنزل الله قل هو الله أحد إلى آخرها","src":"لباب النقول","au":"السيوطي","v":null,"p":219,"h":null,"ch":"سورة الاخلاص","ed":"دار الكتب العلمية بيروت - لبنان"},{"t":"جَاءَ نَاسٌ مَنِ الْيَهُودِ إِلَى النَّبِيِّ ﷺ فَقَالُوا: صِفْ لَنَا رَبَّكَ","src":"أسباب النزول","au":"الواحدي","v":null,"p":471,"h":null,"ch":"سورة الإخلاص","ed":"دار الإصلاح - الدمام، الثانية، ١٤١٢ هـ - ١٩٩٢ م؛ تحقيق: عصام بن عبد المحسن الحميدان"}]}]},{"name":"وجه الاستنباط","taf":true,"p":"1","items":[{"id":"m3-inf-huwa","a":[1,1],"lv":["التفقّه"],"st":"ثابت","s":"قال القرطبي: في ﴿هو﴾ دلالة على موضع الرد ومكان الجواب عن سؤالهم؛ فإذا سقط بطل معنى الآية.","g":"","b":[],"q":[{"t":"ففي هو دلالة على موضع الرد، ومكان الجواب، فإذا سقط","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"1","p":85,"h":null,"ch":"المدخل › باب ما جاء من الحجة في الرد على من طعن في القرآن وخالف مصحف عثمان بالزيادة والنقصان","ed":"دار الكتب المصرية - القاهرة، الثانية، ١٣٨٤ هـ - ١٩٦٤ م؛ تحقيق: أحمد البردوني وإبراهيم أطفيش"}]}]},{"name":"المعنى الإجمالي","taf":false,"p":"2","items":[{"id":"m-gen-1","a":[1,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"هذه السورة مشتملة على توحيد الأسماء والصفات.","g":"","b":[],"q":[{"t":"فهذه السورة مشتملة على توحيد الأسماء والصفات.","src":"تفسير السعدي","au":"السعدي","v":null,"p":937,"h":null,"ch":"الإخلاص › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التفسير","taf":false,"p":"2","items":[{"id":"m-taf-ahad","a":[1,1],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿قل﴾ قولًا جازمًا معتقدًا عارفًا بمعناه: ﴿هو الله أحد﴾ أي انحصرت فيه الأحدية، فهو المنفرد بالكمال، له الأسماء الحسنى والصفات العليا، لا نظير له ولا مثيل.","g":"","b":[],"q":[{"t":"أي ﴿قُلْ﴾ قولا جازمًا به، معتقدًا له، عارفًا بمعناه، ﴿هُوَ اللَّهُ أَحَدٌ﴾ أي: قد انحصرت فيه الأحدية، فهو الأحد المنفرد بالكمال، الذي له الأسماء الحسنى، والصفات الكاملة العليا، والأفعال المقدسة، الذي لا نظير له ولا مثيل.","src":"تفسير السعدي","au":"السعدي","v":null,"p":937,"h":null,"ch":"الإخلاص › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-samad","a":[2,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿الله الصمد﴾: المقصود في جميع الحوائج؛ فأهل السماوات والأرض مفتقرون إليه يسألونه حاجاتهم، لأنه الكامل في أوصافه.","g":"","b":[],"q":[{"t":"﴿اللَّهُ الصَّمَدُ﴾ أي: المقصود في جميع ا af":false,"p":"q","items":[{"id":"m2-waqf-ikhlas","a":[1,4],"lv":["التمكين"],"st":"ثابت","s":"قال الأخفش وغيره: لا وقف في السورة دون آخرها، لأنها جواب أُمر النبي ﷺ أن يقرأه كله، والوقف على رأس كل آية حسن. وكان أبو عمرو يقف على ﴿أحد﴾ ثم يبتدئ ﴿الله الصمد﴾.","g":"","b":[],"q":[{"t":"قال الأخفش وغيره لا وقف فيها دون آخرها؛ لأنَّ الله أمر نبيه أن يقرأها كلها، فهي جواب، ومقصود الجواب، والوقف على رأس كل آية حسن.","src":"منار الهدى","au":"الأشموني","v":"2","p":435,"h":null,"ch":"بيان الوقف والابتداء › سورة الإخلاص","ed":"دار الحديث - القاهرة، مصر، ٢٠٠٨؛ تحقيق: عبد الرحيم الطرهوني"},{"t":"قال أبو عمرو: أدركت القراء يقرأونها ((أحد. الله الصمد)) . قال أبو عمرو: فإن وصلت نونت.","src":"المكتفى في الوقف والابتدا","au":"الداني","v":null,"p":244,"h":null,"ch":"سورة الإخلاص","ed":"دار عمار، الأولى ١٤٢٢ هـ - ٢٠٠١ م؛ تحقيق: محيي الدين عبد الرحمن رمضان"}]}]},{"name":"القراءات","taf":false,"p":"q","items":[{"id":"m-qir-kufuw","a":[4,4],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قرأ حمزة «كُفْؤًا» بسكون الفاء مع الهمز، وقرأ حفص عن عاصم ﴿كُفُوًا﴾ بضم الفاء بلا همز، وقرأ الباقون بضم الفاء مع الهمز، ومعنى الجميع: المثل.","g":"","b":[],"q":[{"t":"قَرَأَ حَمْزَةُ وَإِسْمَاعِيلُ: \"كُفْؤًا\" سَاكِنَةُ الْفَاءِ مَهْمُوزًا، وَقَرَأَ حَفْصٌ عَنْ عَاصِمٍ بِضَمِّ الْفَاءِ مِنْ غَيْرِ هَمْزٍ، وَقَرَأَ الْآخَرُونَ بِضَمِّ الْفَاءِ مَهْمُوزًا، وَكُلُّهَا لُغَاتٌ صَحِيحَةٌ","src":"معالم التنزيل","au":"البغوي","v":"8","p":588,"h":null,"ch":"الإخلاص › ٣","ed":"دار طيبة للنشر والتوزيع، الرابعة، ١٤١٧ هـ - ١٩٩٧ م؛ تحقيق: حققه وخرج أحاديثه محمد عبد الله النمر - عثمان جمعة ضميرية - سليمان مسلم الحرش"}]}]},{"name":"المفردات","taf":false,"p":"3","items":[{"id":"m-voc-samad","a":[2,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«الصمد»: السيد الذي انتهى سؤدده؛ لأن الناس يقصدونه في حوائجهم.","g":"","b":[],"q":[{"t":"﴿الصَّمَدُ﴾ السَّيد الذي قد انتهى سُودَدُه؛ لأن الناس يَصْمِدُونه في حوائجهم.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":542,"h":null,"ch":"غريب القرآن › سورة الإخلاص","ed":"دار الكتب العلمي لحديث","taf":false,"p":"1","items":[{"id":"m-had-lam-yura","a":[1,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قال النبي ﷺ: «ألم تر آيات أنزلت الليلة لم يُر مثلهن قط؟ قل أعوذ برب الفلق، وقل أعوذ برب الناس».","g":"","b":[],"q":[{"t":"\"أَلَمْ تَرَ آيَاتٍ أُنْزِلَتِ اللَّيْلَةَ لَمْ يُرَ مِثْلُهُنَّ قَطُّ؟ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ وَقُلْ أَعُوذُ بِرَبِّ النَّاسِ\".","src":"صحيح مسلم","au":"مسلم","v":"1","p":558,"h":"814","ch":"٦ - كتاب صلاة المسافرين وقصرها › (٤٦) باب فضل قراءة المعوذتين","ed":"مطبعة عيسى البابي الحلبي وشركاه، القاهرة، ١٣٧٤ هـ - ١٩٥٥ م؛ تحقيق: محمد فؤاد عبد الباقي [ت ١٣٨٨ هـ]"}],"sh":2},{"id":"m-had-bedtime","a":[1,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"كان النبي ﷺ يقرأ الإخلاص والمعوذتين في كفيه عند النوم كل ليلة ويمسح بهما جسده ثلاث مرات.","g":"","b":[],"q":[{"t":"«كَانَ إِذَا أَوَى إِلَى فِرَاشِهِ كُلَّ لَيْلَةٍ، جَمَعَ كَفَّيْهِ ثُمَّ نَفَثَ فِيهِمَا، فَقَرَأَ فِيهِمَا: ﴿قُلْ هُوَ اللهُ أَحَدٌ﴾، وَ ﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ﴾، وَ ﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ﴾","src":"صحيح البخاري","au":"البخاري","v":"6","p":190,"h":"5017","ch":"كتاب فضائل القرآن › باب القراء من أصحاب النبي ﷺ","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]}]},{"name":"تحليل الحديث","taf":true,"p":"1","items":[{"id":"m3-ha-sahih","a":[1,5],"lv":["التفقّه"],"st":"ثابت","s":"أحاديث البطاقة (آيات لم يُر مثلهن، وقراءتها عند النوم) مخرّجة في صحيحي البخاري ومسلم، وقال ابن الصلاح: كتاباهما أصح الكتب بعد كتاب الله العزيز؛ فهي ثابتة لا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","g":"","b":[],"q":[{"t":"وكتاباهما أصح الكتب بعد كتاب الله العزيز","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":18,"h":null,"ch":"النوع الأول من أنواع علوم الحديث: معرفة الصحيح من الحديث","ed":"دار الفكر- سوريا، دار الفكر المعاصر - بيروت؛ تحقيق: نور الدين عتر"}],"sh":12},{"id":"m3-ha-sihr","a":[1,5],"lv":["التفقّه"],"st":"يحتاج تحققًا","s":"قصة الغلام اليهودي وسحر النبي ﷺ ونزول المعوذتين بتفصيلها أوردها الثعلبي بلا إسناد؛ قال ابن كثير: فيها غرابة، وفي بعضها نكارة شديدة، ولبعضها شواهد. وأصل السحر ثابت في الصحيح.","g":"","b":[],"q":[{"t":"هكذا أورده بلا إسناد، وفيه [غرابة]","src":"تفسير ابن كثير","au":"ابن كثير","v":"7","p":710,"h":null,"ch":"تفسير سورتي المعوذتين وهما مدنيتان","ed":"دار ابن الجوزي للنشر والتوزيع - السعودية، الأولى، ١٤٣١ هـ؛ تحقيق: حكمت بن بشير بن ياسين"},{"t":"وفي بعضه نكارة شديدة، ولبعضه شواهد مما تقدم","src":"تفسير ابن كثير","au":"ابن كثير","v":"7","p":710,"h":null,"ch":"تفسير سورتي المعوذتين وهما مدنيتان","ed":"دار ابن الجوزي للنشر والتوزيع - السعودية، الأولى، ١٤٣١ هـ؛ تحقيق: حكمت بن بشير بن ياسين"}],"sh":2}]},{"name":"أسباب النزول","taf":false,"p":"1","items":[{"id":"m-asb-sihr","a":[1,5],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"رُوي أن المعوذتين نزلتا لما سُحر النبي ﷺ. وقال السيوطي: لأصل القصة شاهد في الصحيح دون ذكر نزول السورتين، وله شاهد بذكر نزولهما. فأصل السحر ثابت، وربطه بالنزول يحتاج تحققًا.","g":"رواية تحتاج تحققًا","b":[],"q":[{"t":"لأصله شاهد في الصحيح بدون نزول السورتين وله شاهد بنزولهما","src":"لباب النقول","au":"السيوطي","v":null,"p":220,"h":null,"ch":"سورة المعوذتين","ed":"دار الكتب العلمية بيروت - لبنان"}],"sh":2}]},{"name":"وجه الاستنباط","taf":true,"p":"1","items":[{"id":"m3-inf-khaliq","a":[1,5],"lv":["التفقّه"],"st":"ثابت","s":"استدل القرطبي بالسورة على أن الله خالق كل شر، لأنه أمر بالتعوذ من شر ما خلق.","g":"","b":[],"q":[{"t":"هذه سورة دالة على أن الله سبحانه خالق كل شر، وأمر نبيه ﷺ أن يتعوذ من جميع الشرور","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"20","p":259,"h":null,"ch":"تفسير سورة الفلق › قوله تعالى [سورة الفلق (١١٣): الآيات ١ إلى ٥]","ed":"دار الكتب المصرية - القاهرة، الثانية، ١٣٨٤ هـ - ١٩٦٤ م؛ تحقيق: أحمد البردوني وإبراهيم أطفيش"}]}]},{"name":"المعنى الإجمالي","taf":false,"p":"2","items":[{"id":"m2-gm-falaq","a":[1,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قل متعوذًا: ألجأ وأعتصم برب الفلق، فالق الحب والنوى وفالق الإصباح، من شر جميع ما خلق، ثم خص بعد العموم: شر الليل إذا أظلم، وشر السواحر، وشر الحا ],"s":"ما الفرق بين الاستعاذة في الفلق والناس عند البقاعي؟","h":"اليوم 3 · المناسبات","x":["الخيارات: الفلق للمضار العامة البدنية وغيرها، والناس لما يخص الباطن / لا فرق بينهما / الناس للمضار البدنية فقط","الإجابة: الفلق للمضار العامة البدنية وغيرها، والناس لما يخص الباطن","يسأل عن: m2-mun-nas"]},{"id":"q1212-e-3","a":[1,3],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"يستعيذ العبد في السورة بربوبية الله وملكه وألوهيته.","h":"اليوم 4 · العقيدة","x":["الخيارات: صح / خطأ","الإجابة: صح","يسأل عن: m-aq-names"]},{"id":"q1212-e-4","a":[4,6],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"ماذا تفعل إذا شعرت بدافع إلى شر أو تثبيط عن خير؟","h":"اليوم 6 · التطبيق","x":["المتوقع: أذكر الله وأقرأ سورة الناس","يسأل عن: m-app-dhikr"]},{"id":"q1212-t-1","a":[1,1],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"ما أصل كلمة ﴿الناس﴾ عند سيبويه؟","h":"اليوم 2 · اللغة والإعراب","x":["الخيارات: أناس / نوس / إنسان","الإجابة: أناس","يسأل عن: m2-irab-nas"]},{"id":"q1212-t-2","a":[1,6],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"من روى إمالة ﴿الناس﴾ في موضع الجر؟","h":"اليوم 1 · القراءات","x":["الخيارات: الدوري عن أبي عمرو / حفص عن عاصم / قالون عن نافع","الإجابة: الدوري عن أبي عمرو","يسأل عن: m3-qir-nas"]},{"id":"q1212-t-3","a":[4,5],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"متى يكفي الوقف على ﴿الخناس﴾ عند الداني؟","h":"اليوم 1 · الوقف والابتداء","x":["الخيارات: إذا جُعل ﴿الذي﴾ خبرًا لمبتدأ محذوف أو منصوبًا على الذم / إذا جُعل ﴿الذي﴾ نعتًا لما قبله / لا يكفي بحال","الإجابة: إذا جُعل ﴿الذي﴾ خبرًا لمبتدأ محذوف أو منصوبًا على الذم","يسأل عن: m2-waqf-khannas"]}]},{"name":"المهام العملية","p":"3","items":[{"id":"t1212-f","a":[1,6],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"إذا شعرت بدافع إلى شر أو تثبيط عن خير، فاذكر الله واقرأ سورة الناس","x":["متى: في اللحظة التي تشعر فيها بذلك خلال اليوم","كم مرة: كلما حدث ذلك هذا الأسبوع","أعرف أني نفذتها إذا: تذكرت أن تذكر الله مرة واحدة على الأقل في موقف كهذا","تقوم على: m-app-dhikr"]}]}],"gaps":[{"f":"السياق","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"سياق السورة مسجل في المناسبات."},{"f":"علوم القرآن","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"عدّ ﴿الخناس﴾ رأس آية في المكي والشامي مسجل في الوقف؛ ولا مسألة أخرى من علوم القرآن خاصة بها."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في مسائل القرطبي الفقهية لهذه السورة وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من آياتها."},{"f":"السيرة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في سيرة ابن هشام عن آيات هذه السورة، ولم توجد مادة مرتبطة بها."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في ﴿الوسواس الخناس﴾ مسجلة في التفسير منسوبة إلى أصحابها."},{"f":"التزكية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يوجد في رياض الصالحين والأذكار نص مرتبط بآيات هذه السورة مباشرة غير ما سُجّل في الحديث والتدبر."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"خلاف إعراب ﴿الذي يوسوس﴾ وأثره في الوقف مسجل في الوقف."}],"unc":["صحة ربط نزول المعوذتين بقصة السحر.","قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":[]}]</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const key = (n, id) => 'L' + n + '~' + id;
  const state = new Map();          // key -> {state, note}
  let db = null, writable = true, filter = 'all', section = null, pass = 'all';
  // Plan §12: everything is reviewed before publishing; the reviewers start with the weightiest material.
  const PASSES = [
    {p: 'all', label: 'كل المواد', who: 'صاحب المشروع', note: 'كل مواد الدرس بترتيب المراجعة.'},
    {p: '1', label: 'المرور الأول', who: 'العقيدة والفقه والحديث', note: 'العقيدة، والحديث ودرجته، والسيرة، وأسباب النزول، والفقه وأصوله وقواعده والاستنباط وأسباب الخلاف. لكل مادة: هل النص المنقول في موضعه؟ هل الملخص يقول ما يقوله النص فقط؟ هل الدرجة صحيحة؟ هل المستوى مناسب، فلا يدخل المختلف فيه التأسيس؟'},
    {p: '2', label: 'المرور الثاني', who: 'التفسير وعلوم القرآن', note: 'المعنى الإجمالي، والتفسير، والسياق، وعلوم القرآن، والمناسبات، والمتشابهات، وأقوال العلماء، والمقاصد، واللغة والإعراب.'},
    {p: 'q', label: 'المرور الثاني', who: 'المقرئ', note: 'التجويد، والوقف والابتداء، والقراءات. يراجعها مقرئ مجاز: القاعدة من المتن، والمثال من آيات الدرس.'},
    {p: '3', label: 'المرور الثالث', who: 'صاحب المشروع', note: 'المفردات، والتزكية، والتدبر، والتطبيق، ونصوص المستويات الثلاثة، والأسئلة، والمهام العملية. راجِع أن كل نص لا يزيد على مادته الموثقة، وأنه مناسب لمستواه.'},
  ];
  const vis = l => l.sections.filter(s => pass === 'all' || s.p === pass);
  try { const m = location.hash.match(/p=([a-z0-9]+)/); const s = m ? m[1] : localStorage.getItem('basira-pass'); if (PASSES.some(x => x.p === s)) pass = s; } catch (e) {}
  let current = DATA[0].n;
  try { const h = (location.hash.match(/l(\d+)/) || [])[1]; if (DATA.some(l => String(l.n) === h)) current = +h;
        else { const s = localStorage.getItem('basira-lesson'); if (s && DATA.some(l => String(l.n) === s)) current = +s; } } catch (e) {}

  const $ = (tag, cls, text) => { const el = document.createElement(tag); if (cls) el.className = cls; if (text != null) el.textContent = text; return el; };
  const totalOf = () => DATA.reduce((a, l) => a + vis(l).reduce((b, s) => b + s.items.length, 0), 0);
  const counts = l => { let o = 0, f = 0, t = 0; vis(l).forEach(s => s.items.forEach(it => { t++; const st = state.get(key(l.n, it.id)); if (st && st.state === 'ok') o++; else if (st && st.state === 'fix') f++; })); return {o, f, t}; };

  const secCount = (l, s) => { let d = 0; s.items.forEach(it => { const st = state.get(key(l.n, it.id)); if (st && st.state) d++; }); return d; };
  function pickSection(name){ section = name; render(); window.scrollTo({top: 0}); }
  function renderSections(l){
    const nav = document.getElementById('sections'); nav.textContent = '';
    const V = vis(l);
    if (!V.length) return;
    if (section !== 'all' && !V.some(s => s.name === section)) section = V[0].name;
    const chip = (name, label, done, total) => {
      const b = $('button', 'sec-chip'); b.type = 'button';
      b.setAttribute('aria-pressed', String(section === name));
      if (total && done === total) b.classList.add('done');
      b.append($('span', null, label), $('small', null, AR(done) + '/' + AR(total)));
      b.addEventListener('click', () => pickSection(name));
      nav.append(b);
      if (section === name) requestAnimationFrame(() => b.scrollIntoView({block: 'nearest', inline: 'center'}));
    };
    const all = V.reduce((a, s) => a + s.items.length, 0), allDone = V.reduce((a, s) => a + secCount(l, s), 0);
    V.forEach(s => chip(s.name, s.name + (s.taf ? ' (تفقّه)' : ''), secCount(l, s), s.items.length));
    chip('all', 'كل الأقسام', allDone, all);
  }
  function where(q){
    const parts = [];
    if (q.v) parts.push('ج' + AR(q.v));
    if (q.p != null) parts.push('ص' + AR(q.p));
    if (q.h) parts.push('رقم ' + AR(q.h));
    return parts.join(' ');
  }

  const setHash = () => { try { history.replaceState(null, '', '#l' + current + (pass !== 'all' ? '&p=' + pass : '')); } catch (e) {} };
  function renderPasses(){
    const nav = document.getElementById('passes'); nav.textContent = '';
    PASSES.forEach(x => {
      const b = $('button', 'pass-chip'); b.type = 'button';
      b.setAttribute('aria-pressed', String(pass === x.p));
      let n = 0, d = 0;
      DATA.forEach(l => l.sections.filter(s => x.p === 'all' || s.p === x.p).forEach(s => s.items.forEach(it => { n++; const st = state.get(key(l.n, it.id)); if (st && st.state) d++; })));
      b.append($('span', null, x.label + (x.p === 'all' ? '' : ': ' + x.who)), $('small', null, AR(d) + ' / ' + AR(n)));
      b.addEventListener('click', () => { pass = x.p; section = null; try { localStorage.setItem('basira-pass', pass); } catch (e) {} setHash(); render(); window.scrollTo({top: 0}); });
      nav.append(b);
    });
  }
  function renderNav(){
    renderPasses();
    const nav = document.getElementById('lessons'); nav.textContent = '';
    let allO = 0, allF = 0;
    DATA.forEach(l => {
      const c = counts(l); allO += c.o; allF += c.f;
      const b = $('button', 'lesson-chip'); b.type = 'button';
      b.setAttribute('aria-current', String(l.n === current));
      if (c.t && c.o === c.t) b.classList.add('done');
      b.append($('span', null, l.surah + ' ' + AR(l.from) + '–' + AR(l.to)), $('small', null, AR(c.o + c.f) + ' / ' + AR(c.t)));
      const bar = $('span', 'bar'), i = $('i'); i.style.width = (c.t ? (c.o + c.f) / c.t * 100 : 0) + '%'; bar.append(i); b.append(bar);
      b.addEventListener('click', () => { current = l.n; section = null; try { localStorage.setItem('basira-lesson', String(l.n)); } catch (e) {} setHash(); render(); window.scrollTo({top: 0}); });
      nav.append(b);
      if (l.n === current) requestAnimationFrame(() => b.scrollIntoView({block: 'nearest', inline: 'center'}));
    });
    document.getElementById('overall').innerHTML = '';
    const ov = document.getElementById('overall');
    ov.append('صحيح ', $('b', null, AR(allO)), ' · يحتاج تعديل ', $('b', null, AR(allF)), ' · من ', $('b', null, AR(totalOf())));
  }

  const noteTimers = new Map();
  const STORE = 'basira-review-v1';
  function persist(){ try { localStorage.setItem(STORE, JSON.stringify([...state])); } catch (e) { showNotice('المتصفح لا يسمح بالحفظ هنا؛ انسخ النتائج قبل إغلاق الصفحة.'); } }
  async function save(k, lesson, id, patch){
    const prev = state.get(k) || {state: '', note: ''};
    state.set(k, Object.assign({}, prev, patch, {lesson, entry: id}));
    persist();
  }
  function showNotice(t){ const n = document.getElementById('notice'); n.textContent = t; n.hidden = false; }

  function renderItem(l, it){
    const k = key(l.n, it.id), st = state.get(k) || {state: '', note: ''};
    const a = $('article', 'item'); a.dataset.state = st.state;
    if (it.h) a.append($('p', 'item-head', it.h));
    a.append($('p', 'summary', it.s));
    const meta = $('div', 'meta');
    meta.append($('span', null, 'الآيات ' + AR(it.a[0]) + (it.a[1] !== it.a[0] ? '–' + AR(it.a[1]) : '')), $('span', null, it.lv.join(' / ')));
    if (it.st) meta.append($('span', null, it.st));
    if (it.g) meta.append($('span', null, 'درجة السبب: ' + it.g));
    if (it.sh) meta.append($('span', null, 'نقل مشترك مع ' + AR(it.sh) + ' دروس: يُصحَّح في المكتبة المشتركة'));
    meta.append($('span', 'id', it.id));
    a.append(meta);
    it.q.forEach(q => {
      const bq = $('blockquote', null, q.t);
      const c = $('div', 'cite');
      c.append($('b', null, q.src), ' — ' + q.au + (where(q) ? '، ' + where(q) : ''), q.ch ? ' · ' + q.ch : '', q.ed ? ' · ط: ' + q.ed : '');
      bq.append(c); a.append(bq);
    });
    (it.x || []).forEach(x => a.append($('p', 'xline', x)));
    if (it.b.length) a.append($('p', 'based', 'مبني على: ' + it.b.join('، ') + ' — لا ينقل من كتاب؛ راجِع أنه لا يزيد على المادة التي بُني عليها.'));
    const act = $('div', 'actions');
    const ok = $('button', 'ok', '✓ صحيح'), fix = $('button', 'fix', 'يحتاج تعديل');
    ok.type = fix.type = 'button';
    ok.setAttribute('aria-pressed', String(st.state === 'ok')); fix.setAttribute('aria-pressed', String(st.state === 'fix'));
    const saved = $('span', 'saved');
    const ta = $('textarea'); ta.id = 'n-' + k; ta.placeholder = 'ملاحظتك: ما الخطأ، وما الصواب، ومن أي موضع'; ta.value = st.note || '';
    ta.hidden = !(st.state === 'fix' || st.note);
    const setState = s => {
      const cur = (state.get(k) || {}).state || '';
      const nextS = cur === s ? '' : s;
      save(k, l.n, it.id, {state: nextS}).then(() => { saved.textContent = db && writable ? 'حُفظ' : ''; });
      a.dataset.state = nextS; ok.setAttribute('aria-pressed', String(nextS === 'ok')); fix.setAttribute('aria-pressed', String(nextS === 'fix'));
      ta.hidden = !(nextS === 'fix' || ta.value); if (nextS === 'fix') ta.focus();
      renderNav(); renderProgress(l); renderSections(l);
    };
    ok.addEventListener('click', () => setState('ok'));
    fix.addEventListener('click', () => setState('fix'));
    ta.addEventListener('input', () => {
      saved.textContent = '…';
      clearTimeout(noteTimers.get(k));
      noteTimers.set(k, setTimeout(() => save(k, l.n, it.id, {note: ta.value}).then(() => { saved.textContent = db && writable ? 'حُفظت الملاحظة' : ''; }), 900));
    });
    act.append(ok, fix, saved);
    a.append(act, ta);
    return a;
  }

  function renderProgress(l){
    const p = document.getElementById('progress'); if (!p) return;
    const c = counts(l); p.textContent = '';
    const tr = $('div', 'track'), o = $('i', 'o'), f = $('i', 'f');
    o.style.width = (c.t ? c.o / c.t * 100 : 0) + '%'; f.style.width = (c.t ? c.f / c.t * 100 : 0) + '%'; tr.append(o, f);
    p.append(tr, $('span', null, AR(c.o + c.f) + ' من ' + AR(c.t)));
  }

  function render(){
    renderNav();
    const l = DATA.find(x => x.n === current), root = document.getElementById('lesson'); root.textContent = '';
    const head = $('div', 'lesson-head');
    head.append($('div', 'eyebrow', 'الدرس ' + AR(l.n) + ' · سورة ' + l.surah + ' · الآيات ' + AR(l.from) + '–' + AR(l.to)),
                $('h2', null, l.title || ('سورة ' + l.surah)));
    if (l.theme) head.append($('p', null, l.theme));
    const pr = $('div', 'progress'); pr.id = 'progress'; head.append(pr);
    head.append($('p', 'how', 'اقرأ الملخص، ثم طابق النص المنقول على الكتاب في الموضع المذكور. إن صحّ الاثنان اضغط «صحيح»، وإلا اضغط «يحتاج تعديل» واكتب ملاحظتك.'));
    const P = PASSES.find(x => x.p === pass); head.append($('p', 'pass-note', (pass === 'all' ? '' : P.label + ' (' + P.who + '): ') + P.note));
    root.append(head); renderProgress(l);
    let shown = 0;
    const V = vis(l);
    if (!V.length) { document.getElementById('sections').textContent = ''; root.append($('p', 'empty', 'لا مواد لهذا المرور في هذا الدرس.')); return; }
    if (section === null || (section !== 'all' && !V.some(s => s.name === section))) section = V[0].name;
    renderSections(l);
    V.filter(s => section === 'all' || s.name === section).forEach(s => {
      const items = s.items.filter(it => { const st = (state.get(key(l.n, it.id)) || {}).state || ''; return filter === 'all' || (filter === 'todo' ? !st : st === filter); });
      if (!items.length) return;
      const sec = $('section', 'field'), h = $('h3', null, s.name);
      if (s.taf) h.append($('span', 'taf', 'التفقّه'));
      const list = $('div', 'items'); items.forEach(it => { list.append(renderItem(l, it)); shown++; });
      sec.append(h, list); root.append(sec);
    });
    if (!shown) root.append($('p', 'empty', 'لا مواد في هذا العرض.'));
    if (section !== 'all') {
      const i = V.findIndex(s => s.name === section), nav = $('div', 'sec-nav');
      const go = (j, label) => { const b = $('button', null, label); b.type = 'button'; b.addEventListener('click', () => pickSection(V[j].name)); return b; };
      nav.append(i > 0 ? go(i - 1, '→ ' + V[i - 1].name) : $('span'), i < V.length - 1 ? go(i + 1, V[i + 1].name + ' ←') : $('span'));
      root.append(nav);
    }
    const extra = (title, rows) => { if (!rows.length) return; const d = $('details', 'extra'), sm = $('summary', null, title), ul = $('ul'); rows.forEach(r => ul.append(r)); d.append(sm, ul); root.append(d); };
    extra('نقاط عدم اليقين (' + AR(l.unc.length) + ')', l.unc.map(u => $('li', null, u)));
    extra('نقاط الخلاف (' + AR(l.dis.length) + ')', l.dis.map(u => $('li', null, u)));
    extra('الأقسام الفارغة ولماذا (' + AR(l.gaps.length) + ')', l.gaps.map(g => { const li = $('li'); li.append($('b', null, g.f), $('span', 'gcode ' + g.code, g.c), g.note ? ' — ' + g.note : ''); return li; }));
  }

  document.getElementById('filters').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });

  try { (JSON.parse(localStorage.getItem(STORE) || '[]')).forEach(([k, v]) => state.set(k, v)); } catch (e) {}
  render();
  const rv = document.getElementById('reviewer');
  try { rv.value = localStorage.getItem('basira-reviewer') || ''; } catch (e) {}
  rv.addEventListener('change', () => { try { localStorage.setItem('basira-reviewer', rv.value.trim()); } catch (e) {} });
  document.getElementById('export').addEventListener('click', async () => {
    const rows = [...state.entries()].filter(([, v]) => v.state || v.note).map(([k, v]) => ({key: k, state: v.state, note: v.note || ''}));
    const who = document.getElementById('reviewer').value.trim();
    if (!who) { showNotice('اكتب اسمك في الأعلى قبل نسخ النتائج.'); document.getElementById('reviewer').focus(); return; }
    const head = 'مراجعة بصيرة — ' + who;
    const text = head + '\n' + JSON.stringify(rows);
    const box = document.getElementById('export-box');
    box.value = text; box.hidden = false;
    try { await navigator.clipboard.writeText(text); showNotice('نُسخت النتائج (' + AR(rows.length) + ' مادة). أرسلها لصاحب المشروع.'); }
    catch (e) { box.select(); showNotice('حدّد النص في المربع وانسخه، ثم أرسله لصاحب المشروع.'); }
  });
})();
</script>

</body>
