 كل ركعة؛ فكلما قرأ ﴿وإياك نستعين﴾ و﴿اهدنا﴾ تذكّر حاجته إلى ربه.","g":"","b":["m-taf-iyyaka","m-taz-daily"],"q":[]},{"id":"m-tad-repeat","a":[1,7],"lv":["التأسيس","التمكين"],"st":"","s":"يردد المسلم الفاتحة سبع عشرة مرة في اليوم والليلة على الأقل، وفيها كليات العقيدة والمشاعر والتوجهات، وفي ذلك طرف من حكمة اختيارها للتكرار في كل ركعة.","g":"","b":["m-had-la-salat","m-fiqh-rukn"],"q":[{"t":"يردد المسلم هذه السورة القصيرة ذات الآيات السبع، سبع عشرة مرة في كل يوم وليلة على الحد الأدنى","src":"في ظلال القرآن","au":"سيد قطب","v":1,"p":21,"h":null,"ch":"سورة 1 › فقرة 78","ed":"دار الشروق، الطبعة الشرعية الثانية والثلاثون، ١٤٢٣هـ - ٢٠٠٣م (ستة مجلدات)"},{"t":"إن في هذه السورة من كليات العقيدة الإسلامية، وكليات التصور الإسلامي، وكليات المشاعر والتوجهات، ما يشير إلى طرف من حكمة اختيارها للتكرار في كل ركعة","src":"في ظلال القرآن","au":"سيد قطب","v":1,"p":21,"h":null,"ch":"سورة 1 › فقرة 79","ed":"دار الشروق، الطبعة الشرعية الثانية والثلاثون، ١٤٢٣هـ - ٢٠٠٣م (ستة مجلدات)"}]},{"id":"m-tad-hamd","a":[2,2],"lv":["التأسيس","التمكين"],"st":"","s":"الحمد هو الشعور الذي يفيض به قلب المؤمن بمجرد ذكره لله؛ لأن وجوده نفسه نعمة من الله، تستدعي الحمد والثناء.","g":"","b":["m-taf-hamd"],"q":[{"t":"والحمد لله هو الشعور الذي يفيض به قلب المؤمن بمجرد ذكره لله.. فإن وجوده ابتداء ليس إلا فيضاً من فيوضات النعمة الإلهية التي تستجيش الحمد والثناء","src":"في ظلال القرآن","au":"سيد قطب","v":1,"p":22,"h":null,"ch":"سورة 1 › فقرة 87","ed":"دار الشروق، الطبعة الشرعية الثانية والثلاثون، ١٤٢٣هـ - ٢٠٠٣م (ستة مجلدات)"}]},{"id":"m-tad-rahma","a":[3,3],"lv":["التمكين"],"st":"","s":"تكرار ﴿الرحمن الرحيم﴾ في آية مستقلة بعد ﴿رب العالمين﴾ يؤكد أن ربوبية الله لخلقه ربوبية رحمة ورعاية، والحمد هو الاستجابة الفطرية لهذه الرحمة.","g":"","b":["m2-mut-rahman","m-taf-hamd"],"q":[{"t":"تتكرر هنا في صلب السورة، في آية مستقلة، لتؤكد السمة البارزة في تلك الربوبية الشاملة","src":"في ظلال القرآن","au":"سيد قطب","v":1,"p":24,"h":null,"ch":"سورة 1 › فقرة 108","ed":"دار الشروق، الطبعة الشرعية الثانية والثلاثون، ١٤٢٣هـ - ٢٠٠٣م (ستة مجلدات)"},{"t":"فالحمد هو الاستجابة الفطرية للرحمة الندية","src":"في ظلال القرآن","au":"سيد قطب","v":1,"p":24,"h":null,"ch":"سورة 1 › فقرة 108","ed":"دار الشروق، الطبعة الشرعية الثانية والثلاثون، ١٤٢٣هـ - ٢٠٠٣م (ستة مجلدات)"}]},{"id":"m-tad-awn","a":[5,6],"lv":["التمكين"],"st":"","s":"بعد أن أعلن العبد أن الله وحده المعين، كان أعظم ما يطلب منه العون فيه وأوله: الهداية إلى الصراط المستقيم، معرفةً له واستقامةً عليه.","g":"","b":["m-taf-ihdina","m-taf-iyyaka"],"q":[{"t":"وفقنا إلى معرفة الطريق المستقيم الواصل ووفقنا للاستقامة عليه بعد معرفته","src":"في ظلال القرآن","au":"سيد قطب","v":1,"p":26,"h":null,"ch":"سورة 1 › فقرة 133","ed":"دار الشروق، الطبعة الشرعية الثانية والثلاثون، ١٤٢٣هـ - ٢٠٠٣م (ستة مجلدات)"},{"t":"والتوجه إلى الله في هذا الأمر هو ثمرة الاعتقاد بأنه وحده المعين. وهذا الأمر هو أعظم وأول ما يطلب المؤمن من ربه العون فيه","src":"في ظلال القرآن","au":"سيد قطب","v":1,"p":26,"h":null,"ch":"سورة 1 › فقرة 133","ed":"دار الشروق، الطبعة الشرعية الثانية والثلاثون، ١٤٢٣هـ - ٢٠٠٣م (ستة مجلدات)"}]}]},{"name":"التطبيق","taf":false,"p":"3","items":[{"id":"m-app-pause","a":[2,7],"lv":["التأسيس","التمكين"],"st":"","s":"في صلاة واحدة اليوم: اقرأ الفاتحة آية آية، وتذكّر بعد كل آية جواب الله الوارد في الحديث.","g":"","b":["m-had-qusimat","m-fiqh-rukn"],"q":[]},{"id":"m-app-amin","a":[7,7],"lv":["التأسيس"],"st":"","s":"قل «آمين» بعد الفاتحة في كل صلاة، ومع الإمام في الجماعة.","g":"","b":["m-had-amin","m-fiqh-amin"],"q":[]},{"id":"m-app-hudur","a":[1,7],"lv":["التمكين"],"st":"","s":"في صلاة واحدة اليوم: قف عند كل آية من الفاتحة بما يناسبها: الرجاء عند ﴿الرحمن الرحيم﴾، والتعظيم والخوف عند ﴿مالك يوم الدين﴾، والإخلاص عند ﴿إياك نعبد﴾، والافتقار عند ﴿وإياك نستعين﴾.","g":"","b":["m-taz-hudur"],"q":[]}]},{"name":"نصوص المستويات","p":"3","items":[{"id":"s1-f-01","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"سورة الفاتحة قصيرة، لكنها جمعت ما لم تجمعه سورة غيرها. ففيها توحيد الله بأنواعه الثلاثة، وفيها إثبات النبوة، وفيها أن الله يجزي الناس على أعمالهم. وفيها أن المسلم يُخلص دينه لله، فلا يعبد إلا الله ولا يستعين إلا به.","h":"اليوم 1 (تلاوة وحفظ): السورة في جملة","x":["يقوم على: m-gen-1 — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s1-f-02","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"وأنت تحفظ السورة انتبه إلى مدّين. في ﴿الضَّالِّينَ﴾ ألفٌ بعدها لام مشددة، والسكون فيها أصلي ثابت في الوصل والوقف، فهذا مد لازم تمده مدًا طويلًا. وفي ﴿نَسْتَعِينُ﴾ إذا وقفت عليها سكنت النون بسبب الوقف، فصار بعد الياء سكون عارض، فهذا مد عارض للسكون.","h":"اليوم 1 (تلاوة وحفظ): مدّان في السورة","x":["يقوم على: m2-tj-dallin، m2-tj-nastain — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s2-f-03","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"«بسم الله»: أبدأ باسم الله. «العالمين»: أصناف الخلق، وهم كل من سوى الله. «يوم الدين»: يوم القيامة، يوم الجزاء والحساب. «العبادة»: كل ما يحبه الله ويرضاه من الأقوال والأعمال، ظاهرة وباطنة. و«الاستعانة»: أن تعتمد على الله في جلب ما ينفعك ودفع ما يضرك، مع الثقة به. «الصراط»: الطريق الواضح.","h":"اليوم 2 (تثبيت وفهم): كلمات تفتح المعنى","x":["يقوم على: m-voc-bismillah، m-voc-alamin، m-voc-din، m-voc-ibada، m-voc-sirat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-f-04","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"﴿بسم الله الرحمن الرحيم﴾: تبدأ قراءتك بأسماء الله كلها. و﴿الله﴾ هو الذي يستحق وحده أن يُعبد. و﴿الرحمن الرحيم﴾ اسمان يدلان على رحمته الواسعة التي وسعت كل شيء.\n﴿الحمد لله رب العالمين﴾: نثني على الله بصفاته الكاملة وبأفعاله. وهو ﴿رب العالمين﴾ الذي يربي الخلق كلهم بخلقه لهم ونعمه عليهم، ويربي أولياءه تربية خاصة بالإيمان والتوفيق.","h":"اليوم 3 (تفسير وسياق): الآيات 1–2: الابتداء باسم الله وحمده","x":["يقوم على: m-taf-basmala، m-taf-hamd — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-f-05","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"﴿مالك يوم الدين﴾: يوم القيامة يُحاسَب فيه الناس على أعمالهم. والله مالك كل الأيام، وإنما خُص هذا اليوم بالذكر لأن فيه يظهر كمال ملكه وعدله، وتنقطع فيه أملاك الخلق.\n﴿إياك نعبد وإياك نستعين﴾: لا نعبد إلا أنت، ولا نستعين إلا بك. وتقديم ﴿إياك﴾ هو الذي أفاد معنى «وحدك». وجاءت الاستعانة بعد العبادة لأن العبد يحتاج إلى عون الله في كل عبادة.","h":"اليوم 3 (تفسير وسياق): الآيتان 4–5: الملك والعبادة","x":["يقوم على: m-taf-malik، m-taf-iyyaka — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-f-06","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"﴿اهدنا الصراط المستقيم﴾: دلّنا وأرشدنا ووفقنا للطريق الواضح الذي يوصل إلى الله وإلى جنته، وهو أن نعرف الحق ونعمل به.\nوهذا الطريق هو طريق الذين أنعم الله عليهم: النبيين والصديقين والشهداء والصالحين. وليس طريق ﴿المغضوب عليهم﴾ الذين عرفوا الحق وتركوه، ولا طريق ﴿الضالين﴾ الذين تركوه على جهل.","h":"اليوم 3 (تفسير وسياق): الآيتان 6–7: طلب الهداية","x":["يقوم على: m-taf-ihdina، m-taf-sirat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-f-07","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"من أسماء هذه السورة «أم الكتاب»؛ لأنها أول ما يُكتب في المصاحف، وأول ما يُقرأ في الصلاة. وسمّاها النبي ﷺ «السبع المثاني والقرآن العظيم». وهي سبع آيات باتفاق العلماء.","h":"اليوم 3 (تفسير وسياق): اسم السورة وعدد آياتها","x":["يقوم على: m-ctx-names، m-qs-count — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-f-08","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"أخبر النبي ﷺ أن الفاتحة أعظم سورة في القرآن، وأنها السبع المثاني والقرآن العظيم الذي أوتيه.\nوفي الحديث القدسي أن الله قسم الفاتحة في الصلاة بينه وبين عبده. فإذا قلت ﴿الحمد لله رب العالمين﴾ قال الله: حمدني عبدي. وإذا قلت ﴿الرحمن الرحيم﴾ قال: أثنى عليّ عبدي. وإذا قلت ﴿مالك يوم الدين﴾ قال: مجّدني عبدي. وإذا قلت ﴿إياك نعبد وإياك نستعين﴾ قال: هذا بيني وبين عبدي. ثم يقول فيما بعدها: هذا لعبدي، ولعبدي ما سأل.","h":"اليوم 4 (سنة وهداية): أعظم سورة، ومناجاة في كل صلاة","x":["يقوم على: m-had-azam، m-had-qusimat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-f-09","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"وأخبر النبي ﷺ أن ملكًا بشّره بنورين أوتيهما لم يؤتهما نبي قبله: فاتحة الكتاب، وخواتيم سورة البقرة، لن يقرأ بحرف منهما إلا أُعطيه.","h":"اليوم 4 (سنة وهداية): نوران","x":["يقوم على: m-had-nurayn — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-f-10","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"قال النبي ﷺ: «لا صلاة لمن لم يقرأ بفاتحة الكتاب».\nوقال ﷺ: إذا قال الإمام ﴿غير المغضوب عليهم ولا الضالين﴾ فقولوا: آمين، فمن وافق قوله قول الملائكة غُفر له ما تقدم من ذنبه.","h":"اليوم 4 (سنة وهداية): لا صلاة بدونها، وآمين بعدها","x":["يقوم على: m-had-la-salat، m-had-amin — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-f-11","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"في الفاتحة أنواع التوحيد الثلاثة. ﴿رب العالمين﴾ فيه توحيد الربوبية. ولفظ ﴿الله﴾ و﴿إياك نعبد﴾ فيهما توحيد الإلهية، وهو أن تُفرد الله بالعبادة. و﴿الحمد﴾ فيه توحيد الأسماء والصفات، وهو إثبات صفات الكمال لله.","h":"اليوم 4 (سنة وهداية): التوحيد في الفاتحة","x":["يقوم على: m-aq-tawhid — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-f-12","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"ومن أسماء الله «الديّان»، أُخذ من ﴿مالك يوم الدين﴾. هو الذي يحاسب عباده ويجازيهم، ولا يضيع عملًا: يجزي بالخير خيرًا، وبالشر شرًا.","h":"اليوم 4 (سنة وهداية): الديّان","x":["يقوم على: m-aq-dayyan — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s5-f-13","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"في المذهب الشافعي: قراءة الفاتحة متعينة في كل ركعة، إلا ركعة المسبوق. والبسملة آية منها. ويجب أن تأتي بتشديداتها، وأن تقرأها بترتيب آياتها، متتابعة.\nوبعد الفاتحة يُسن أن تقول «آمين» بتخفيف الميم مع المد، ويجوز القصر. وإذا صليت خلف الإمام فأمّن مع تأمينه.","h":"اليوم 5 (فقه وأحكام): الفاتحة في صلاتك","x":["يقوم على: m-fiqh-rukn، m-fiqh-amin — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-f-14","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"أنت تقرأ الفاتحة سبع عشرة مرة في اليوم والليلة على الأقل. وفيها أصول العقيدة، ومشاعر المؤمن وتوجهاته، وفي هذا طرف من حكمة اختيارها لتتكرر في كل ركعة.","h":"اليوم 6 (تدبر وعمل): سبع عشرة مرة كل يوم","x":["يقوم على: m-tad-repeat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-f-15","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"وحين تقول ﴿الحمد لله﴾ فهو شعور يفيض به قلبك بمجرد ذكر الله؛ لأن وجودك نفسه نعمة منه تستدعي الحمد والثناء.","h":"اليوم 6 (تدبر وعمل): الحمد شعور القلب","x":["يقوم على: m-tad-hamd — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-f-16","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"وحين تقول ﴿مالك يوم الدين﴾ يتعلق قلبك بالآخرة، فلا تستبد بك حاجات الدنيا، وتعمل لوجه الله منتظرًا جزاءه.","h":"اليوم 6 (تدبر وعمل): يوم الدين في قلبك","x":["يقوم على: m-taz-akhira، m-taf-malik — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-f-17","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"حين تقول ﴿إياك نعبد وإياك نستعين﴾ تذكّر أن القيام بعبادة الله والاستعانة به هو سبيل السعادة والنجاة. ولا تكون العبادة عبادة حتى تأخذها عن رسول الله ﷺ، وتقصد بها وجه الله.\nوأنت لا تستغني عن عون الله في أي عبادة، فكلما قرأت ﴿وإياك نستعين﴾ فتذكّر حاجتك إلى ربك.","h":"اليوم 6 (تدبر وعمل): العبادة والاستعانة","x":["يقوم على: m-taz-ibada، m-tad-need — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-f-18","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"﴿اهدنا الصراط المستقيم﴾ من أجمع الأدعية وأنفعها. ولأنك محتاج إليه دائمًا، وجب أن تدعو به في كل ركعة.","h":"اليوم 6 (تدبر وعمل): دعاء كل ركعة","x":["يقوم على: m-taz-daily — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-f-19","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"اجعل قلبك في صلاتك مع كل آية. عند ﴿الرحمن الرحيم﴾ تذكّر لطف الله بك فيقوى رجاؤك. وعند ﴿مالك يوم الدين﴾ عظّمه وخَفْه. وعند ﴿إياك نعبد﴾ جدّد إخلاصك. وعند ﴿وإياك نستعين﴾ تذكّر عجزك وحاجتك إليه. ثم اسأله أهم حاجاتك: ﴿اهدنا الصراط المستقيم﴾، ثم قل «آمين» راجيًا الإجابة.","h":"اليوم 6 (تدبر وعمل): قلبك مع كل آية","x":["يقوم على: m-taz-hudur — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-f-20","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"وأنت تقرأ الفاتحة في صلاتك فأنت تناجي ربك، وهو يجيبك عند كل آية كما جاء في الحديث. واستحضار هذا الجواب يعينك على حضور قلبك في الصلاة.","h":"اليوم 6 (تدبر وعمل): ربك يجيبك","x":["يقوم على: m-tad-dialogue، m-had-qusimat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-f-21","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"في صلاة واحدة اليوم: اقرأ الفاتحة آية آية، وتذكّر بعد كل آية جواب الله الوارد في الحديث.","h":"اليوم 6 (تدبر وعمل): في صلاة اليوم","x":["يقوم على: m-app-pause — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-f-22","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"قل «آمين» بعد الفاتحة في كل صلاة، ومع الإمام في الجماعة.","h":"اليوم 6 (تدبر وعمل): آمين","x":["يقوم على: m-app-amin — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s7-f-23","a":[1,7],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"الفاتحة على قصرها جمعت التوحيد بأنواعه الثلاثة، وإثبات النبوة، والجزاء على الأعمال، وإخلاص العبادة والاستعانة لله. سمّعها الآن من حفظك، وتذكّر معنى كل آية.","h":"اليوم 7 (مراجعة وإتقان): ما تعلمته هذا الأسبوع","x":["يقوم على: m-gen-1 — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s1-e-01","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"سورة الفاتحة على إيجازها احتوت ما لم تحتوه سورة غيرها من سور القرآن. تضمنت أنواع التوحيد الثلاثة، وإثبات النبوة، وإثبات الجزاء على الأعمال. وتضمنت إخلاص الدين لله في أمرين معًا: العبادة والاستعانة، في قوله ﴿إياك نعبد وإياك نستعين﴾.","h":"اليوم 1 (تلاوة وحفظ): ما جمعته السورة","x":["يقوم على: m-gen-1 — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s1-e-02","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"في السورة نوعان من المد يُعرف الفرق بينهما بنوع السكون الذي بعد حرف المد. المد اللازم: حرف مد بعده سكون أصلي ثابت في الوصل والوقف، ويُمد طويلًا، ومثاله ﴿الضَّالِّينَ﴾: ألف بعدها لام مشددة. والمد العارض للسكون: حرف مد بعده سكون يعرض عند الوقف فقط، ومثاله ﴿نَسْتَعِينُ﴾ إذا وقفت عليها، وهي المثال الذي ذكره الجمزوري في تحفة الأطفال.","h":"اليوم 1 (تلاوة وحفظ): المد اللازم والمد العارض","x":["يقوم على: m2-tj-dallin، m2-tj-nastain — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s1-e-03","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"ذكر الداني أن الوقف على ﴿مالك يوم الدين﴾ تام، وعلى ﴿إياك نستعين﴾ تام لانقضاء الثناء على الله، وعلى ﴿ولا الضالين﴾ تام. أما الوقف على ﴿أنعمت عليهم﴾ فحسن فقط، لأن ما بعده متعلق به. والوقف على رأس كل آية من السورة حسن، وبه وردت السنة.","h":"اليوم 1 (تلاوة وحفظ): أين تقف","x":["يقوم على: m2-waqf-fatiha — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s1-e-04","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"قرأ عاصم والكسائي ويعقوب ﴿مالك يوم الدين﴾ بالألف، وقرأ الباقون ﴿ملك يوم الدين﴾.","h":"اليوم 1 (تلاوة وحفظ): مالك وملك","x":["يقوم على: m-qir-malik — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s2-e-05","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"«بسم الله»: أبدأ باسم الله. «العالمين»: أصناف الخلق، وعند السعدي: كل من سوى الله. «يوم الدين»: يوم القيامة، سُمي بذلك لأنه يوم الجزاء والحساب. «الصراط»: الطريق، وأصله في اللغة الطريق الواضح.\n«العبادة»: اسم جامع لكل ما يحبه الله ويرضاه من الأقوال والأعمال الظاهرة والباطنة. و«الاستعانة»: الاعتماد على الله في جلب النفع ودفع الضر، مع الثقة به.\n«الحمد» أعم من الشكر: فالحمد يكون على النعمة وعلى الصفات، والشكر لا يكون إلا على النعمة.","h":"اليوم 2 (تثبيت وفهم): المفردات","x":["يقوم على: m-voc-bismillah، m-voc-alamin، m-voc-din، m-voc-sirat، m-voc-ibada، m-voc-hamd — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s2-e-06","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"سأل الكرماني: لماذا تكرر ﴿الرحمن الرحيم﴾ بعد البسملة؟ وأجاب بأن الرحمة إنعام على المحتاج. ففي البسملة ذُكر المنعِم وحده، وفي الآية الثالثة أعيد الاسمان بعد ذكر المنعَم عليهم ﴿العالمين﴾.\nوكذلك كرر ﴿إياك﴾ مع الفعلين ولم يكتف بمرة؛ لأن التقديم يقطع الاشتراك. ولو قيل «إياك نعبد ونستعين» لم يظهر أن الاستعانة مخصوصة بالله كالعبادة.","h":"اليوم 2 (تثبيت وفهم): لماذا التكرار؟","x":["يقوم على: m2-mut-rahman، m2-mut-iyyaka — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-e-07","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"﴿بسم الله﴾: أبتدئ بكل اسم لله. و﴿الله﴾ هو المعبود المستحق للعبادة وحده. و﴿الرحمن الرحيم﴾ اسمان يدلان على أنه ذو الرحمة الواسعة التي وسعت كل شيء. وللعلماء فيهما قولان: منهم من جعلهما بمعنى واحد، ومنهم من فرّق فجعل الرحمن عام الرحمة لكل الخلق، والرحيم خاصًا بالمؤمنين.\n﴿الحمد لله﴾: الثناء على الله بصفات الكمال وبأفعاله. وفي ترابط الآيات: بعد أن أثبت ﴿الحمد لله﴾ أنه المستحق لكل حمد لذاته، أتبعه بـ﴿رب﴾ ليبين أنه يستحقه أيضًا لكونه ربًّا مالكًا منعمًا. وهو ﴿رب العالمين﴾: المربي لجميع الخلق بخلقه ونعمه، وتربيته نوعان: عامة للخلق كلهم، وخاصة لأوليائه بالإيمان والتوفيق.","h":"اليوم 3 (تفسير وسياق): الآيات 1–3: أسماء الله وحمده","x":["يقوم على: m-taf-basmala، m-taf-rahman، m-taf-hamd، m2-mun-rabb — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-e-08","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"﴿مالك يوم الدين﴾: يوم القيامة يوم يُدان الناس بأعمالهم. وخصه بالذكر مع أنه مالك كل الأيام، لأن فيه يظهر كمال ملكه وعدله، وتنقطع أملاك الخلق.\n﴿إياك نعبد وإياك نستعين﴾: نخصك وحدك بالعبادة والاستعانة؛ فتقديم ﴿إياك﴾ يفيد الحصر. وقدّم العبادة لأنها حق الله، ثم ذكر الاستعانة لحاجة العبد إلى عون الله في كل عبادته.","h":"اليوم 3 (تفسير وسياق): الآيتان 4–5: يوم الدين، والعبادة والاستعانة","x":["يقوم على: m-taf-malik، m-taf-iyyaka — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-e-09","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"﴿اهدنا الصراط المستقيم﴾: دلّنا وأرشدنا ووفقنا للطريق الواضح الموصل إلى الله وجنته، وهو معرفة الحق والعمل به. والهداية نوعان: هداية إلى الصراط بلزوم الإسلام، وهداية فيه لتفاصيل الدين علمًا وعملًا.\nونُقل عن السلف في الصراط المستقيم عبارات متقاربة: هو الإسلام (ابن عباس وجابر)، وهو القرآن (ابن مسعود)، وهو طريق الجنة (سعيد بن جبير).\nوهو صراط المنعم عليهم من النبيين والصديقين والشهداء والصالحين، لا صراط المغضوب عليهم الذين عرفوا الحق وتركوه، ولا الضالين الذين تركوه على جهل.","h":"اليوم 3 (تفسير وسياق): الآيتان 6–7: الصراط المستقيم","x":["يقوم على: m-taf-ihdina، m-sch-sirat، m-taf-sirat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-e-10","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"وروى اللالكائي عن أبي العالية: «تعلّموا الإسلام… وعليكم بالصراط المستقيم فإنه الإسلام، ولا تحرّفوا الإسلام يمينًا ولا شمالًا، وعليكم بسنة نبيكم والذي كان عليه أصحابه».","h":"اليوم 3 (تفسير وسياق): وصية أبي العالية","x":["يقوم على: m-sch-aliya — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-e-11","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"من أسمائها «أم الكتاب»؛ لأنه يُبدأ بكتابتها في المصاحف وبقراءتها في الصلاة. وسمّاها النبي ﷺ «السبع المثاني والقرآن العظيم».\nوهي سبع آيات باتفاق، وإنما وقع الخلاف في عدّ البسملة آية منها.\nواختُلف في مكان نزولها: قيل مكية، وقيل مدنية، وقيل نزلت مرتين. ورجّح ابن كثير أنها مكية، لقوله تعالى ﴿ولقد آتيناك سبعًا من المثاني﴾، وهي في سورة الحجر المكية.","h":"اليوم 3 (تفسير وسياق): أسماؤها ونزولها وعدد آياتها","x":["يقوم على: m-ctx-names، m-qs-count، m-qs-makki — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-e-12","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"قال النبي ﷺ عن الفاتحة إنها أعظم سورة في القرآن، وإنها السبع المثاني والقرآن العظيم الذي أوتيه.\nوفي الحديث القدسي: قسم الله الصلاة، أي الفاتحة، بينه وبين عبده نصفين. فإذا قال العبد آية منها أجابه الله: حمدني عبدي، ثم أثنى عليّ عبدي، ثم مجّدني عبدي. فإذا بلغ ﴿إياك نعبد وإياك نستعين﴾ قال: هذا بيني وبين عبدي. وفيما بعدها: هذا لعبدي، ولعبدي ما سأل.","h":"اليوم 4 (سنة وهداية): فضلها وقسمتها","x":["يقوم على: m-had-azam، m-had-qusimat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-e-13","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"وفي صحيح مسلم أن ملكًا نزل فبشّر النبي ﷺ بنورين أوتيهما لم يؤتهما نبي قبله: فاتحة الكتاب، وخواتيم سورة البقرة، لن يقرأ بحرف منهما إلا أُعطيه.","h":"اليوم 4 (سنة وهداية): نوران لم يؤتهما نبي قبله","x":["يقوم على: m-had-nurayn — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-e-14","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"قال النبي ﷺ: «لا صلاة لمن لم يقرأ بفاتحة الكتاب». وقال: إذا قال الإمام ﴿غير المغضوب عليهم ولا الضالين﴾ فقولوا: آمين، فمن وافق قوله قول الملائكة غُفر له ما تقدم من ذنبه.","h":"اليوم 4 (سنة وهداية): مكانها في الصلاة","x":["يقوم على: m-had-la-salat، m-had-amin — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-e-15","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"تضمنت الفاتحة أنواع التوحيد الثلاثة: توحيد الربوبية من ﴿رب العالمين﴾، وتوحيد الإلهية، وهو إفراد الله بالعبادة، من لفظ ﴿الله﴾ ومن ﴿إياك نعبد﴾، وتوحيد الأسماء والصفات من لفظ ﴿الحمد﴾.\nوتضمنت إثبات الجزاء على الأعمال بالعدل من ﴿مالك يوم الدين﴾. وتضمنت إثبات النبوة من ﴿اهدنا الصراط المستقيم﴾، إذ لا تُعرف الهداية بدون الرسالة.","h":"اليوم 4 (سنة وهداية): أصول الإيمان في الفاتحة","x":["يقوم على: m-aq-tawhid، m-aq-jaza — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-e-16","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"نقل البيهقي في «الأسماء والصفات» عن الحليمي:\n«الرحمن» المزيح للعلل: عرّف عباده وجوه العبادات وبيّن حدودها وشروطها، وخلق لهم المدارك والقوى، وكلّفهم دون ما تتسع له بنيتهم، فانقطعت حجج العصاة والمقصرين.\n«الرحيم» المثيب على العمل: لا يضيع لعامل عملًا، ويناله من الثواب أضعاف عمله بفضل رحمته.\n«الديّان» أُخذ من ﴿مالك يوم الدين﴾: الذي يحاسب ويجازي، فيجزي بالخير خيرًا وبالشر شرًا.","h":"اليوم 4 (سنة وهداية): من أسماء الله في الفاتحة","x":["يقوم على: m-aq-rahman، m-aq-dayyan — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s5-e-17","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"في المذهب الشافعي تتعين قراءة الفاتحة في كل ركعة، إلا ركعة المسبوق. والبسملة آية منها. وتجب تشديداتها، وترتيبها، وموالاتها.\nويسن بعدها قول «آمين» بتخفيف الميم مع المد، ويجوز القصر. ويؤمّن المأموم مع تأمين إمامه.","h":"اليوم 5 (فقه وأحكام): أحكام قراءتها في المذهب الشافعي","x":["يقوم على: m-fiqh-rukn، m-fiqh-amin — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s5-e-18","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"في الفاتحة أربع عشرة تشديدة: ثلاث في البسملة، والباقي بعدها. ومن أخلّ بتشديدة منها بطلت قراءته.\nواللحن فيها نوعان: لحن يغيّر المعنى فيبطل الصلاة، مثل ضم التاء أو كسرها في ﴿أنعمتَ﴾، أو كسر الكاف في ﴿إياكَ نعبد﴾. ولحن لا يغيّره فلا يبطلها، مثل ضم الباء أو فتحها في ﴿ربِّ العالمين﴾.","h":"اليوم 5 (فقه وأحكام): التشديدات واللحن","x":["يقوم على: m-fiqh-lahn — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s5-e-19","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"من لم يُحسن الفاتحة قرأ بقدرها من غيرها. فإن لم يُحسن شيئًا من القرآن أتى من الأذكار، كالتسبيح والتهليل، بقدر آياتها. ومتى تمكّن من تعلّمها وجب عليه أن يتعلّمها.","h":"اليوم 5 (فقه وأحكام): من لا يُحسن الفاتحة","x":["يقوم على: m-fiqh-ajiz — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-e-20","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"يردد المسلم الفاتحة سبع عشرة مرة في اليوم والليلة على الأقل، ولا تقوم صلاة بدونها. وفيها كليات العقيدة، وكليات المشاعر والتوجهات، وفي ذلك طرف من حكمة اختيارها للتكرار في كل ركعة.","h":"اليوم 6 (تدبر وعمل): لماذا تتكرر في كل ركعة؟","x":["يقوم على: m-tad-repeat، m-had-la-salat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-e-21","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"الحمد شعور يفيض به قلب المؤمن بمجرد ذكره لله؛ لأن وجوده نفسه نعمة من الله تستدعي الحمد والثناء. ثم تتكرر ﴿الرحمن الرحيم﴾ في آية مستقلة بعد ﴿رب العالمين﴾، فتؤكد أن ربوبية الله لخلقه ربوبية رحمة ورعاية، والحمد هو الاستجابة الفطرية لهذه الرحمة.","h":"اليوم 6 (تدبر وعمل): الحمد جواب الرحمة","x":["يقوم على: m-tad-hamd، m-tad-rahma — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-e-22","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"الإيمان بيوم الدين يعلّق القلب بالآخرة، فلا تستبد به ضرورات الدنيا، ويعمل لوجه الله منتظرًا الجزاء حيث يقدّره الله.","h":"اليوم 6 (تدبر وعمل): يوم الدين في القلب","x":["يقوم على: m-taz-akhira — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-e-23","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"القيام بعبادة الله والاستعانة به هو سبيل السعادة والنجاة. ولا تكون العبادة عبادة إلا بشرطين: أن تؤخذ عن رسول الله ﷺ، وأن يُقصد بها وجه الله.\nوالعبد لا يستغني عن عون الله في أي عبادة، ولا عن سؤاله الهداية في كل ركعة. فكلما قرأ ﴿وإياك نستعين﴾ و﴿اهدنا﴾ تذكّر حاجته إلى ربه. ولهذا كان دعاء الهداية من أجمع الأدعية وأنفعها، ووجب أن يدعو به العبد في كل ركعة.","h":"اليوم 6 (تدبر وعمل): العبادة التي تنجي","x":["يقوم على: m-taz-ibada، m-tad-need، m-taz-daily — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-e-24","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"بعد أن أعلن العبد أن الله وحده المعين، كان أعظم ما يطلب منه العون فيه وأوله: الهداية إلى الصراط المستقيم، معرفةً له واستقامةً عليه.","h":"اليوم 6 (تدبر وعمل): أول ما يُطلب العون فيه","x":["يقوم على: m-tad-awn — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-e-25","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"الناس في القراءة ثلاثة: رجل يتحرك لسانه وقلبه غافل، ورجل يتبع قلبُه لسانه فيفهم ما يقرأ كأنه يسمعه من غيره، ورجل يسبق قلبه إلى المعاني ثم يترجمها لسانه.\nوحضور القلب مع الفاتحة: مع ﴿الرحمن الرحيم﴾ تستحضر أنواع لطفه فينبعث رجاؤك، ومع ﴿مالك يوم الدين﴾ تستثير التعظيم والخوف، ومع ﴿إياك نعبد﴾ تجدد الإخلاص، ومع ﴿وإياك نستعين﴾ تجدد العجز والحاجة والتبرؤ من الحول والقوة. ثم تسأل أهم حاجاتك: ﴿اهدنا الصراط المستقيم﴾، ثم تلتمس الإجابة بـ«آمين».","h":"اليوم 6 (تدبر وعمل): كيف تقرأ الفاتحة في صلاتك","x":["يقوم على: m-taz-qira، m-taz-hudur — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-e-26","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"المصلي حين يقرأ الفاتحة يناجي ربه، والله يجيبه عند كل آية كما في حديث القسمة. واستحضار هذا الجواب يعين على حضور القلب في الصلاة.","h":"اليوم 6 (تدبر وعمل): مناجاة","x":["يقوم على: m-tad-dialogue، m-had-qusimat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-e-27","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"في صلاة واحدة اليوم: اقرأ الفاتحة آية آية، وتذكّر بعد كل آية جواب الله الوارد في الحديث.","h":"اليوم 6 (تدبر وعمل): في صلاة اليوم","x":["يقوم على: m-app-pause — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-e-28","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"في صلاة واحدة اليوم: قف عند كل آية من الفاتحة بما يناسبها: الرجاء عند ﴿الرحمن الرحيم﴾، والتعظيم والخوف عند ﴿مالك يوم الدين﴾، والإخلاص عند ﴿إياك نعبد﴾، والافتقار عند ﴿وإياك نستعين﴾.","h":"اليوم 6 (تدبر وعمل): قف عند كل آية","x":["يقوم على: m-app-hudur — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s7-e-29","a":[1,7],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"الفاتحة على إيجازها جمعت أنواع التوحيد الثلاثة، وإثبات النبوة، والجزاء على الأعمال بالعدل، وإخلاص الدين لله عبادة واستعانة. سمّعها من حفظك، واربط كل آية بما تعلمته فيها من المعنى والحكم.","h":"اليوم 7 (مراجعة وإتقان): خلاصة الأسبوع","x":["يقوم على: m-gen-1 — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s1-t-01","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"نصّ السعدي على أن الفاتحة على إيجازها احتوت ما لم تحتو عليه سورة من سور القرآن: أنواع التوحيد الثلاثة، وإثبات النبوة، وإثبات الجزاء على الأعمال، وإخلاص الدين لله عبادة واستعانة في قوله ﴿إياك نعبد وإياك نستعين﴾. وهذا المضمون هو أساس ما يُدرس في بقية الأسبوع من أدلته.","h":"اليوم 1 (تلاوة وحفظ): مضمون السورة","x":["يقوم على: m-gen-1 — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s1-t-02","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"الفرق بين المد اللازم والعارض في أصالة السكون. قال الجمزوري: «ولازم إن السكون أُصّلا وصلًا ووقفًا بعد مد طُوّلا»، ومثاله ﴿الضَّالِّينَ﴾: ألف بعدها لام مشددة. وقال في العارض: «ومثل ذا إن عرض السكون وقفًا كتعلمون نستعين»، فمثّل بـ﴿نَسْتَعِينُ﴾ من هذه السورة نفسها.","h":"اليوم 1 (تلاوة وحفظ): ضابط المدّين","x":["يقوم على: m2-tj-dallin، m2-tj-nastain — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s1-t-03","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"حكم الداني في المكتفى بأن الوقف على ﴿مالك يوم الدين﴾ تام لاستغناء ما بعده، وعلى ﴿إياك نستعين﴾ تام لانقضاء الثناء على الله، وعلى ﴿ولا الضالين﴾ تام. وجعل الوقف على ﴿أنعمت عليهم﴾ حسنًا، ليس بتام ولا كافٍ، لتعلق ما بعده به. ثم قرر أن الوقف على رأس كل آية منها على مراد التقطيع والترتيل حسن، وأن السنة وردت به.","h":"اليوم 1 (تلاوة وحفظ): مراتب الوقف عند الداني","x":["يقوم على: m2-waqf-fatiha — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s1-t-04","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"ذكر البغوي أن عاصمًا والكسائي ويعقوب قرؤوا ﴿مالك﴾ بالألف، وقرأ الباقون ﴿ملك﴾.","h":"اليوم 1 (تلاوة وحفظ): القراءتان في ﴿مالك﴾","x":["يقوم على: m-qir-malik — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s2-t-05","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"«بسم الله»: قال ابن قتيبة: اختصار، كأنه قال: أبدأ باسم الله. «العالمين»: أصناف الخلق عند ابن قتيبة، وعند السعدي كل من سوى الله. «يوم الدين»: يوم القيامة، سمي به لأنه يوم الجزاء والحساب. «الصراط»: الطريق، وأصله في اللغة الطريق الواضح.\n«العبادة» عند السعدي: اسم جامع لكل ما يحبه الله ويرضاه من الأعمال والأقوال الظاهرة والباطنة. و«الاستعانة»: الاعتماد على الله في جلب المنافع ودفع المضار مع الثقة به.\n«الحمد» أعم من الشكر عند البغوي: فالشكر لا يكون إلا على النعمة، والحمد يكون عليها وعلى الصفات؛ إذ لا يقال: شكرت فلانًا على علمه.","h":"اليوم 2 (تثبيت وفهم): المفردات وضبط الفروق","x":["يقوم على: m-voc-bismillah، m-voc-alamin، m-voc-din، m-voc-sirat، m-voc-ibada، m-voc-hamd — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s2-t-06","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"تقديم المعمول ﴿إياك﴾ على عامله يفيد الحصر، وهو إثبات الحكم للمذكور ونفيه عما عداه: فتثبت العبادة والاستعانة لله، وتنتفيان عما سواه. وتقديم العبادة على الاستعانة من باب تقديم العام على الخاص، واهتمامًا بتقديم حق الله على حق عبده.","h":"اليوم 2 (تثبيت وفهم): الحصر في ﴿إياك نعبد﴾","x":["يقوم على: m-lang-hasr — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s2-t-07","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"نقل البيهقي عن الخطابي الخلاف في «الرحمن»: أمشتق من الرحمة أم لا؟ وذهب الجمهور إلى أنه مشتق منها، مبني على المبالغة، ومعناه ذو الرحمة لا نظير له فيها. ولذلك لا يُثنّى ولا يُجمع، كما يُثنّى «الرحيم» ويُجمع.","h":"اليوم 2 (تثبيت وفهم): اشتقاق «الرحمن»","x":["يقوم على: m-lang-rahman — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s2-t-08","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"وجّه الكرماني تكرار ﴿الرحمن الرحيم﴾ بأن الرحمة هي الإنعام على المحتاج؛ فذكر في البسملة المنعِم ولم يذكر المنعَم عليهم، فأعادها في الآية الثالثة مع ذكرهم.\nووجّه تكرار ﴿إياك﴾ مع الفعلين، مع أنه اقتصر على ذكر أحد المفعولين في آيات كثيرة، بأن التقديم يقطع الاشتراك، ولو قيل «إياك نعبد ونستعين» لم يظهر أن الاستعانة مخصوصة بالله كالعبادة.","h":"اليوم 2 (تثبيت وفهم): توجيه المكرر","x":["يقوم على: m2-mut-rahman، m2-mut-iyyaka — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-t-09","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"قال السعدي: ﴿بسم الله﴾ أي أبتدئ بكل اسم لله؛ لأن لفظ «اسم» مفرد مضاف فيعم جميع الأسماء الحسنى. و﴿الله﴾ هو المألوه المعبود المستحق لإفراده بالعبادة. و﴿الرحمن الرحيم﴾ يدلان على أنه ذو الرحمة الواسعة.\nوذكر البغوي الخلاف فيهما: فمنهم من قال هما بمعنى واحد، مثل ندمان ونديم. ومنهم من فرّق: فالرحمن من تصل رحمته إلى الخلق على العموم، والرحيم من تصل رحمته إليهم على الخصوص.\n﴿الحمد لله﴾: الثناء على الله بصفات الكمال وبأفعاله الدائرة بين الفضل والعدل. و﴿رب العالمين﴾: المربي لجميع الخلق؛ وتربيته عامة لخلقه، وخاصة لأوليائه بالإيمان والتوفيق.","h":"اليوم 3 (تفسير وسياق): الآيات 1–3","x":["يقوم على: m-taf-basmala، m-taf-rahman، m-taf-hamd — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-t-10","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"بيّن البقاعي في نظم الدرر وجه الترتيب: لما أثبت ﴿الحمد لله﴾ أنه المستحق لجميع المحامد لذاته الحائز لجميع الكمالات، أشار بـ﴿رب﴾ إلى أنه يستحقه أيضًا من حيث كونه ربًّا مالكًا منعمًا، ثم بـ﴿العالمين﴾ إلى ابتداء الخلق.","h":"اليوم 3 (تفسير وسياق): ترتيب ﴿الحمد لله رب العالمين﴾","x":["يقوم على: m2-mun-rabb — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-t-11","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"﴿مالك يوم الدين﴾: أضاف الملك إلى يوم الدين، يوم يُدان الناس بأعمالهم، لأن فيه يظهر للخلق تمام الظهور كمال ملكه وعدله، وتنقطع أملاك الخلائق؛ وإلا فهو المالك لكل الأيام.\n﴿إياك نعبد وإياك نستعين﴾: نعبدك ولا نعبد غيرك، ونستعين بك ولا نستعين بغيرك. وذكر الاستعانة بعد العبادة مع دخولها فيها لاحتياج العبد في جميع عباداته إلى الاستعانة بالله.\n﴿اهدنا الصراط المستقيم﴾: دلّنا وأرشدنا ووفقنا للطريق الواضح الموصل إلى الله وجنته، وهو معرفة الحق والعمل به؛ فهو سؤال للهداية إلى الصراط، وللهداية فيه. وهذا الصراط هو صراط المنعم عليهم من النبيين والصديقين والشهداء والصالحين، غير صراط المغضوب عليهم الذين عرفوا الحق وتركوه، والضالين الذين تركوه على جهل.","h":"اليوم 3 (تفسير وسياق): الآيات 4–7","x":["يقوم على: m-taf-malik، m-taf-iyyaka، m-taf-ihdina، m-taf-sirat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-t-12","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"نقل البغوي في الصراط المستقيم: قال ابن عباس وجابر: هو الإسلام، وهو قول مقاتل. وقال ابن مسعود: هو القرآن. وقال سعيد بن جبير: طريق الجنة. وهي عبارات متقاربة.","h":"اليوم 3 (تفسير وسياق): أقوال السلف في الصراط المستقيم","x":["يقوم على: m-sch-sirat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-t-13","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"وأسند اللالكائي في «شرح أصول اعتقاد أهل السنة» عن أبي العالية: «تعلّموا الإسلام، فإذا تعلمتموه فلا ترغبوا عنه، وعليكم بالصراط المستقيم فإنه الإسلام، ولا تحرّفوا الإسلام يمينًا ولا شمالًا، وعليكم بسنة نبيكم والذي كان عليه أصحابه».","h":"اليوم 3 (تفسير وسياق): أثر أبي العالية","x":["يقوم على: m-sch-aliya — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-t-14","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"في نزولها ثلاثة أقوال ذكرها ابن كثير: مكية، وهو قول ابن عباس وقتادة وأبي العالية. ومدنية، وهو قول أبي هريرة ومجاهد وعطاء بن يسار والزهري. ونزلت مرتين: بمكة والمدينة. ورجّح الأول بقوله تعالى ﴿ولقد آتيناك سبعًا من المثاني﴾، وهي في سورة الحجر المكية.\nواتفقوا على أنها سبع آيات، وإنما اختلفوا في البسملة: هل هي آية مستقلة من أولها؟\nومن أسمائها «أم الكتاب»؛ لأنه يُبدأ بكتابتها في المصاحف وبقراءتها في الصلاة، وسمّاها النبي ﷺ «السبع المثاني والقرآن العظيم».","h":"اليوم 3 (تفسير وسياق): النزول والعدّ والأسماء","x":["يقوم على: m-qs-makki، m-qs-count، m-ctx-names — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s3-t-15","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"من الأوجه التي ذكرها ابن كثير في تسميتها أم الكتاب: أن معاني القرآن كله ترجع إلى ما تضمنته.","h":"اليوم 3 (تفسير وسياق): لماذا هي أم الكتاب؟","x":["يقوم على: m2-maq-umm — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-t-16","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"في صحيح البخاري أن النبي ﷺ قال عن ﴿الحمد لله رب العالمين﴾: «هي السبع المثاني والقرآن العظيم الذي أوتيته»، وأنها أعظم سورة في القرآن. وفيه: «لا صلاة لمن لم يقرأ بفاتحة الكتاب». وفيه: «إذا قال الإمام ﴿غير المغضوب عليهم ولا الضالين﴾ فقولوا: آمين، فمن وافق قوله قول الملائكة غُفر له ما تقدم من ذنبه».\nوفي صحيح مسلم الحديث القدسي في قسمة الصلاة: إذا قال العبد ﴿الحمد لله رب العالمين﴾ قال الله: حمدني عبدي، وإذا قال ﴿الرحمن الرحيم﴾ قال: أثنى عليّ عبدي، وإذا قال ﴿مالك يوم الدين﴾ قال: مجّدني عبدي، فإذا قال ﴿إياك نعبد وإياك نستعين﴾ قال: هذا بيني وبين عبدي ولعبدي ما سأل.","h":"اليوم 4 (سنة وهداية): الأحاديث","x":["يقوم على: m-had-azam، m-had-la-salat، m-had-amin، m-had-qusimat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-t-17","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"وفي صحيح مسلم في باب فضل الفاتحة وخواتيم سورة البقرة: أن ملكًا نزل فقال للنبي ﷺ: «أبشر بنورين أوتيتهما لم يؤتهما نبي قبلك: فاتحة الكتاب، وخواتيم سورة البقرة، لن تقرأ بحرف منهما إلا أُعطيته». وأورده النووي في رياض الصالحين.","h":"اليوم 4 (سنة وهداية): حديث النورين","x":["يقوم على: m-had-nurayn — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-t-18","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"أحاديث الدرس كلها في صحيحي البخاري ومسلم. وقال ابن الصلاح: «وكتاباهما أصح الكتب بعد كتاب الله العزيز». فهي ثابتة، ولا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","h":"اليوم 4 (سنة وهداية): درجة الأحاديث","x":["يقوم على: m3-ha-sahih — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-t-19","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"قرر السعدي أن توحيد الربوبية يؤخذ من ﴿رب العالمين﴾، وتوحيد الإلهية، وهو إفراد الله بالعبادة، من لفظ ﴿الله﴾ ومن ﴿إياك نعبد﴾، وتوحيد الأسماء والصفات من ﴿الحمد﴾، وهو إثبات صفات الكمال التي أثبتها الله لنفسه وأثبتها له رسوله، من غير تعطيل ولا تمثيل ولا تشبيه.\nوأن إثبات النبوة يؤخذ من ﴿اهدنا الصراط المستقيم﴾؛ لأن ذلك ممتنع بدون الرسالة. وإثبات الجزاء من ﴿مالك يوم الدين﴾، وأنه جزاء بالعدل؛ لأن الدين معناه الجزاء بالعدل.","h":"اليوم 4 (سنة وهداية): دلالات العقيدة","x":["يقوم على: m-aq-tawhid، m-aq-jaza — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s4-t-20","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"وفي «الأسماء والصفات» للبيهقي عن الحليمي، من أئمة الشافعية: «الرحمن» المزيح للعلل، إذ عرّف العباد وجوه العبادات وحدودها وشروطها، وخلق لهم المدارك والقوى، وحمّلهم دون ما تتسع له بنيتهم، فانقطعت حجج العصاة والمقصرين. و«الرحيم» المثيب على العمل، لا يضيع لعامل عملًا ولا يهدر لساع سعيًا. و«الديّان» مأخوذ من ﴿مالك يوم الدين﴾: الحاسب والمجازي.","h":"اليوم 4 (سنة وهداية): الأسماء الحسنى في الفاتحة عند الحليمي","x":["يقوم على: m-aq-rahman، m-aq-dayyan — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s5-t-21","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"قال النووي في منهاج الطالبين: «وتتعين الفاتحة كل ركعة لا ركعة مسبوق، والبسملة منها، وتشديداتها، ولو أبدل ضادًا بظاء لم تصح في الأصح، ويجب ترتيبها وموالاتها».\nوقال: «ويسن عقب الفاتحة آمين، خفيفة الميم بالمد، ويجوز القصر، ويؤمّن مع تأمين إمامه، ويجهر به في الأظهر».","h":"اليوم 5 (فقه وأحكام): المعتمد في المذهب","x":["يقوم على: m-fiqh-rukn، m-fiqh-amin — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s5-t-22","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"وفصّل النووي في الأذكار: في الفاتحة أربع عشرة تشديدة، ثلاث في البسملة والباقي بعدها، فإن أخلّ بتشديدة واحدة بطلت قراءته. وإن لحن فيها لحنًا يخلّ بالمعنى بطلت صلاته، كضم التاء أو كسرها في ﴿أنعمت﴾ وكسر الكاف في ﴿إياك﴾، وإن لم يخلّ بالمعنى، كضم الباء أو فتحها في ﴿رب العالمين﴾، صحت قراءته.\nومن لم يُحسن الفاتحة قرأ بقدرها من غيرها، فإن لم يُحسن شيئًا من القرآن أتى من الأذكار بقدر آياتها، ومتى تمكن من التعلم وجب عليه تعلمها.","h":"اليوم 5 (فقه وأحكام): تفصيل النووي في الأذكار","x":["يقوم على: m-fiqh-lahn، m-fiqh-ajiz — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s5-t-23","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"ذكر البغوي الخلاف: ذهب قرّاء المدينة والبصرة وفقهاء الكوفة إلى أنها ليست من الفاتحة ولا من غيرها من السور، وأن الافتتاح بها للتيمن والتبرك. وذهب قرّاء مكة والكوفة وأكثر فقهاء الحجاز إلى أنها منها، وهو قول الثوري وابن المبارك والشافعي. وحجتهم أنها كُتبت في المصحف بخط سائر القرآن.\nوالمعتمد في المذهب الشافعي أن البسملة آية من الفاتحة، كما في منهاج الطالبين.","h":"اليوم 5 (فقه وأحكام): البسملة: أهي من الفاتحة؟","x":["يقوم على: m-dis-basmala، m-fiqh-rukn — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s5-t-24","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"رجّح القرطبي أن الفاتحة متعينة في كل ركعة لكل أحد على العموم، وقال: هو الصحيح من الأقوال، وهو قول الشافعي وأحمد، ومالك في قوله الآخر. ووجه الاستنباط عموم لفظ الحديث: «لا صلاة لمن لم يقرأ فيها بفاتحة الكتاب»، فلم يُخص به مصلٍّ دون آخر.","h":"اليوم 5 (فقه وأحكام): وجه الاستنباط","x":["يقوم على: m3-inf-umum، m-had-la-salat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-t-25","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"قال سيد قطب في الظلال: يردد المسلم هذه السورة سبع عشرة مرة في كل يوم وليلة على الحد الأدنى، وفيها من كليات العقيدة وكليات المشاعر والتوجهات ما يشير إلى طرف من حكمة اختيارها للتكرار في كل ركعة.\nوالحمد عنده شعور يفيض به قلب المؤمن بمجرد ذكره لله، لأن وجوده ابتداءً فيض من النعمة الإلهية. وتكرار ﴿الرحمن الرحيم﴾ في آية مستقلة يؤكد السمة البارزة في الربوبية الشاملة، فالحمد هو الاستجابة الفطرية للرحمة.\nوفي ﴿اهدنا﴾: التوجه إلى الله بطلب الهداية ثمرة الاعتقاد بأنه وحده المعين، وهو أعظم وأول ما يطلب المؤمن من ربه العون فيه: معرفة الطريق والاستقامة عليه.\nوهذه لفتات تربوية مساندة، والتفسير المعتمد للآيات ما تقدم عن السعدي والبغوي.","h":"اليوم 6 (تدبر وعمل): لفتات من الظلال","x":["يقوم على: m-tad-repeat، m-tad-hamd، m-tad-rahma، m-tad-awn — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-t-26","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"ويرى سيد قطب أن الاعتقاد بيوم الدين يعلّق القلوب بعالم آخر بعد عالم الأرض فلا تستبد بها ضروراته، فيعمل المؤمن لوجه الله منتظرًا الجزاء حيث يقدّره الله. وأن إفراد الله بالعبادة والاستعانة يخلّص الضمير من استذلال النظم والأوضاع والأشخاص، ومن استذلال الأساطير والأوهام والخرافات.","h":"اليوم 6 (تدبر وعمل): أثر العقيدة في النفس","x":["يقوم على: m-taz-akhira، m-taz-hurriya — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-t-27","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"قال السعدي: القيام بعبادة الله والاستعانة به هو الوسيلة للسعادة الأبدية والنجاة من جميع الشرور. وإنما تكون العبادة عبادة إذا كانت مأخوذة عن رسول الله ﷺ، مقصودًا بها وجه الله.\nوقال في ﴿اهدنا الصراط المستقيم﴾: هو من أجمع الأدعية وأنفعها للعبد، ولهذا وجب أن يدعو الله به في كل ركعة من صلاته، لضرورته إلى ذلك. فالعبد لا يستغني عن عون ربه في عبادة، ولا عن سؤاله الهداية في ركعة.","h":"اليوم 6 (تدبر وعمل): حقيقة العبادة وحاجة العبد","x":["يقوم على: m-taz-ibada، m-taz-daily، m-tad-need — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-t-28","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"قال الغزالي في «بداية الهداية»: عماد الصلاة الخشوع، وحضور القلب مع القراءة والذكر بالتفهم.\nوقسّم في «إحياء علوم الدين» الناسَ في القراءة ثلاثة: من يتحرك لسانه وقلبه غافل، ومن يتبع قلبه لسانه فيفهم ويسمع كأنه يسمع من غيره، ومن يسبق قلبه إلى المعاني ثم يخدم اللسانُ القلبَ فيترجمه.\nوفصّل فيه حضور القلب مع الفاتحة: عند ﴿الرحمن الرحيم﴾ إحضار أنواع لطفه لينبعث الرجاء، وعند ﴿مالك يوم الدين﴾ استثارة التعظيم والخوف، وعند ﴿إياك نعبد﴾ تجديد الإخلاص، وعند ﴿وإياك نستعين﴾ تجديد العجز والاحتياج والتبري من الحول والقوة، ثم تعيين أهم الحاجات بـ﴿اهدنا الصراط المستقيم﴾، ثم التماس الإجابة بـ«آمين». ونقل ذلك سعيد حوّى في «المستخلص». وفي «مختصر منهاج القاصدين» لابن قدامة المقدسي: أن يتفهم معنى ما يتلو، فيستحضر لطفه عند ﴿الرحمن الرحيم﴾، وعظمته عند ﴿مالك يوم الدين﴾، وكذلك في جميع ما يتلو. وما في كلام الغزالي من حديث القسمة موثق من صحيح مسلم فيما تقدم.","h":"اليوم 6 (تدبر وعمل): حق القراءة في الصلاة","x":["يقوم على: m-taz-qira، m-taz-hudur، m-had-qusimat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-t-29","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"حديث القسمة يجعل قراءة الفاتحة مناجاة: العبد يقرأ، والله يجيبه عند كل آية. واستحضار هذا الجواب يعين على حضور القلب في الصلاة.","h":"اليوم 6 (تدبر وعمل): المناجاة في حديث القسمة","x":["يقوم على: m-tad-dialogue، m-had-qusimat — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-t-30","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"في صلاة واحدة اليوم: اقرأ الفاتحة آية آية، وتذكّر بعد كل آية جواب الله الوارد في الحديث.","h":"اليوم 6 (تدبر وعمل): في صلاة اليوم","x":["يقوم على: m-app-pause — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s6-t-31","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"في صلاة واحدة اليوم: قف عند كل آية من الفاتحة بما يناسبها: الرجاء عند ﴿الرحمن الرحيم﴾، والتعظيم والخوف عند ﴿مالك يوم الدين﴾، والإخلاص عند ﴿إياك نعبد﴾، والافتقار عند ﴿وإياك نستعين﴾.","h":"اليوم 6 (تدبر وعمل): قف عند كل آية","x":["يقوم على: m-app-hudur — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]},{"id":"s7-t-32","a":[1,7],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"الفاتحة على إيجازها جمعت أنواع التوحيد الثلاثة، وإثبات النبوة، والجزاء بالعدل، وإخلاص العبادة والاستعانة لله. ووقفتَ هذا الأسبوع على أدلة ذلك، وعلى أقوال العلماء في مسائلها وأسباب خلافهم. سمّعها من حفظك، واستحضر مع كل آية ما تعلمته فيها.","h":"اليوم 7 (مراجعة وإتقان): خلاصة الأسبوع","x":["يقوم على: m-gen-1 — راجِع أنه لا يزيد على هذه المواد، وأنه مناسب لمستواه."]}]},{"name":"الأسئلة","p":"3","items":[{"id":"q-w-f-m-voc-bismillah","a":[1,1],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"ما معنى «بسم الله» كما ورد في الدرس؟","h":"اليوم 2 · المفردات","x":["الخيارات: أبدأ باسم الله / أصناف الخلق، وعند السعدي: كل من سوى الله / يوم القيامة، يوم الجزاء والحساب","الإجابة: أبدأ باسم الله","يسأل عن: m-voc-bismillah"]},{"id":"q-w-e-m-voc-bismillah","a":[1,1],"lv":["التمكين"],"st":"","g":"","b":[],"q":[],"s":"ما معنى «بسم الله» كما ورد في الدرس؟","h":"اليوم 2 · المفردات","x":["الخيارات: أبدأ باسم الله / أصناف الخلق، وعند السعدي: كل من سوى الله / يوم القيامة، يوم الجزاء والحساب","الإجابة: أبدأ باسم الله","يسأل عن: m-voc-bismillah"]},{"id":"q-w-t-m-voc-bismillah","a":[1,1],"lv":["التفقّه"],"st":"","g":"","b":[],"q":[],"s":"ما معنى «بسم الله» كما ورد في الدرس؟","h":"اليوم 2 · المفردات","x":["الخيارات: أبدأ باسم الله / أصناف الخلق، وعند السعدي: كل من سوى الله / يوم القيامة، يوم الجزاء والحساب","الإجابة: أبدأ باسم الله","يسأل عن: m-voc كلها في ج1 ص21–26 باتفاق ٩٨–١٠٠٪، ومنها أُخذ الجزء والصفحة. المقابلة الآلية ليست تحققًا: تُطابق النقول على صور الصفحات قبل التحقق.","تقسيم التوحيد إلى ربوبية وإلهية وأسماء وصفات مصدره في البطاقة تفسير السعدي وحده، وليس من مراجع العقيدة في القسم 4. ولم ترد عبارتا «توحيد الربوبية» و«توحيد الإلهية» في «الاعتقاد» و«الأسماء والصفات» للبيهقي ولا في «شرح أصول اعتقاد أهل السنة» للالكائي. يُرفع للمراجعة العلمية في موضعه من المستويات (القسم 4، البنود 2 و5 و9).","في m-aq-jaza: إثبات الجزاء مسند إلى الحليمي في «الأسماء والصفات»، أما أخذ إثبات النبوة من ﴿اهدنا الصراط المستقيم﴾ فاستنباط السعدي وحده، ولم يوجد في مراجع العقيدة. يُرفع للمراجعة العلمية (البند 26)."],"dis":["هل البسملة آية من الفاتحة؟ والمذهب الشافعي أنها منها.","مكان نزول الفاتحة: مكة أو المدينة أو مرتين.","الفرق بين «الرحمن» و«الرحيم»."]},{"n":2,"surah":"البقرة","from":1,"to":5,"title":"البقرة ١–٥: صفات المتقين","theme":"القرآن كتاب لا ريب فيه، هدى للمتقين الذين يؤمنون بالغيب ويقيمون الصلاة وينفقون ويؤمنون بما أنزل ويوقنون بالآخرة؛ فهم على هدى وهم المفلحون.","sections":[{"name":"العقيدة","taf":false,"p":"1","items":[{"id":"m-aq-ghayb","a":[3,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"يدخل في الإيمان بالغيب الإيمان بكل ما أخبر الله به من الغيوب الماضية والمستقبلة وأحوال الآخرة وصفات الله، وإن لم تُفهم كيفيتها. والإيمان باليوم الآخر أحد أركان الإيمان.","g":"","b":[],"q":[{"t":"فيؤمنون بصفات الله ووجودها، ويتيقنونها، وإن لم يفهموا كيفيتها.","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"لأن الإيمان باليوم الآخر، أحد أركان الإيمان؛ ولأنه أعظم باعث على الرغبة والرهبة والعمل","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"أَنْ تُؤْمِنَ بِاللَّهِ، وَمَلَائِكَتِهِ، وَكُتُبِهِ، وَرُسُلِهِ، وَالْيَوْمِ الآخِرِ. وَتُؤْمِنَ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ","src":"صحيح مسلم","au":"مسلم","v":"1","p":36,"h":"8","ch":"١ - كتاب الإيمان › (١) باب بيان الإيمان والإسلام والإحسان ووجوب الإيمان بإثبات قدر الله سبحانه وتعالى","ed":"مطبعة عيسى البابي الحلبي وشركاه، القاهرة، ١٣٧٤ هـ - ١٩٥٥ م؛ تحقيق: محمد فؤاد عبد الباقي [ت ١٣٨٨ هـ]"}]}]},{"name":"الحديث","taf":false,"p":"1","items":[{"id":"m-had-baqara","a":[1,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قال النبي ﷺ: «لا تجعلوا بيوتكم مقابر، إن الشيطان ينفر من البيت الذي تقرأ فيه سورة البقرة».","g":"","b":[],"q":[{"t":"\"لَا تَجْعَلُوا بُيُوتَكُمْ مَقَابِرَ. إِنَّ الشَّيْطَانَ يَنْفِرُ مِنَ الْبَيْتِ الَّذِي تُقْرَأُ فِيهِ سُورَةُ الْبَقَرَةِ\".","src":"صحيح مسلم","au":"مسلم","v":"1","p":539,"h":"780","ch":"٦ - كتاب صلاة المسافرين وقصرها › (٢٩) باب استحباب صلاة النافلة في بيته وجوازها في المسجد","ed":"مطبعة عيسى البابي الحلبي وشركاه، القاهرة، ١٣٧٤ هـ - ١٩٥٥ م؛ تحقيق: محمد فؤاد عبد الباقي [ت ١٣٨٨ هـ]"}]}]},{"name":"تحليل الحديث","taf":true,"p":"1","items":[{"id":"m3-ha-sahih","a":[1,5],"lv":["التفقّه"],"st":"ثابت","s":"أحاديث البطاقة (فضل سورة البقرة) مخرّجة في صحيحي البخاري ومسلم، وقال ابن الصلاح: كتاباهما أصح الكتب بعد كتاب الله العزيز؛ فهي ثابتة لا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","g":"","b":[],"q":[{"t":"وكتاباهما أصح الكتب بعد كتاب الله العزيز","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":18,"h":null,"ch":"النوع الأول من أنواع علوم الحديث: معرفة الصحيح من الحديث","ed":"دار الفكر- سوريا، دار الفكر المعاصر - بيروت؛ تحقيق: نور الدين عتر"}],"sh":12}]},{"name":"السيرة","taf":false,"p":"1","items":[{"id":"m2-sir-sadr","a":[1,5],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"ذكر ابن إسحاق فيما بلغه أن صدر سورة البقرة إلى الآية المائة نزل في أحبار يهود والمنافقين من الأوس والخزرج بعد الهجرة إلى المدينة.","g":"","b":[],"q":[{"t":"فَفِي هَؤُلَاءِ مِنْ أَحْبَارِ يَهُودَ، وَالْمُنَافِقِينَ مِنْ الْأَوْسِ وَالْخَزْرَجِ، نَزَلَ صدرُ سورةِ الْبَقَرَةِ إلَى المائة مِنْهَا -فِيمَا بَلَغَنِي-","src":"السيرة النبوية","au":"ابن هشام","v":"2","p":127,"h":null,"ch":"المجلد: الثاني › المتن","ed":"شركة الطباعة الفنية المتحدة [وأعاد المحقق نشرها -مع تعديلات طفيفة- لدى مكتبة الكليات الأزهرية بالقاهرة، وكذلك نشرتها دار الجيل بيروت، بنفس ترقيم الصفحات]"}]}]},{"name":"وجه الاستنباط","taf":true,"p":"1","items":[{"id":"m3-inf-nafy","a":[2,2],"lv":["التفقّه"],"st":"ثابت","s":"استنبط السعدي من ﴿لا ريب فيه﴾ قاعدة: النفي الذي يُقصد به المدح لا بد أن يتضمن ثبوت ضده من الكمال؛ فنفي الريب يستلزم اليقين، لأن النفي المحض لا مدح فيه.","g":"","b":[],"q":[{"t":"وهذه قاعدة مفيدة، أن النفي المقصود به المدح، لا بد أن يكون متضمنا لضده، وهو الكمال، لأن النفي عدم، والعدم المحض، لا مدح فيه.","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"المعنى الإجمالي","taf":false,"p":"2","items":[{"id":"m2-gm-huda","a":[2,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"هذا الكتاب لا شك فيه بوجه، وهو هدى للمتقين لأنهم حصلت لهم هدايتان: هداية البيان وهداية التوفيق، ثم وصفهم بالعقائد والأعمال الباطنة والظاهرة.","g":"","b":[],"q":[{"t":"ولأن الهداية نوعان: هداية البيان، وهداية التوفيق. فالمتقون حصلت لهم الهدايتان، وغيرهم لم تحصل لهم هداية التوفيق.","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"ثم وصف المتقين بالعقائد والأعمال الباطنة، والأعمال الظاهرة، لتضمن التقوى لذلك","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التفسير","taf":false,"p":"2","items":[{"id":"m-taf-huruf","a":[1,1],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الحروف المقطعة في أوائل السور: الأسلم السكوت عن التعرض لمعناها من غير مستند شرعي، مع الجزم بأن الله لم ينزلها عبثًا بل لحكمة.","g":"","b":[],"q":[{"t":"وأما الحروف المقطعة في أوائل السور، فالأسلم فيها، السكوت عن التعرض لمعناها [من غير مستند شرعي] ، مع الجزم بأن الله تعالى لم ينزلها عبثا بل لحكمة لا نعلمها.","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-kitab","a":[2,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿ذلك الكتاب﴾: هذا الكتاب العظيم، ﴿لا ريب فيه﴾ بوجه من الوجوه، ونفي الريب يستلزم كمال اليقين، ولما كانت الهداية لا تحصل إلا باليقين قال: ﴿هدى للمتقين﴾.","g":"","b":[],"q":[{"t":"فـ ﴿لا رَيْبَ فِيهِ﴾ ولا شك بوجه من الوجوه، ونفي الريب عنه، يستلزم ضده، إذ ضد الريب والشك اليقين، فهذا الكتاب مشتمل على علم اليقين المزيل للشك والريب","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"فلما اشتمل على اليقين وكانت الهداية لا تحصل إلا باليقين قال: ﴿هُدًى لِلْمُتَّقِينَ﴾","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-muttaqin","a":[2,2],"lv":["التمكين"],"st":"ثابت","s":"القرآن في نفسه هدى لجميع الخلق، وإنما خص المتقين لأنهم المنتفعون به؛ والهداية نوعان: هداية بيان وهداية توفيق، والمتقون حصلت لهم الهدايتان.","g":"","b":[],"q":[{"t":"ولأن الهداية نوعان: هداية البيان، وهداية التوفيق. فالمتقون حصلت لهم الهدايتان، وغيرهم لم تحصل لهم هداية التوفيق.","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-ghayb","a":[3,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإيمان بالغيب هو الذي يميز المسلم من الكافر؛ لأنه تصديق مجرد لخبر الله ورسوله فيما لم نره.","g":"","b":[],"q":[{"t":"إنما الشأن في الإيمان بالغيب، الذي لم نره ولم نشاهده، وإنما نؤمن به، لخبر الله وخبر رسوله. فهذا الإيمان الذي يميز به المسلم من الكافر","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-iqama","a":[3,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿ويقيمون الصلاة﴾: لم يقل يفعلونها؛ فإقامتها ظاهرًا بإتمام أركانها وواجباتها وشروطها، وباطنًا بحضور القلب وتدبر ما يقوله ويفعله.","g":"","b":[],"q":[{"t":"فإقامة الصلاة، إقامتها ظاهرا، بإتمام أركانها، وواجباتها، وشروطها. وإقامتها باطنا (١) بإقامة روحها، وهو حضور القلب فيها، وتدبر ما يقوله ويفعله منها","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-infaq","a":[3,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿ومما رزقناهم ينفقون﴾ يشمل الواجب كالزكاة والنفقة على الأهل، والمستحب؛ و«مِن» تدل على أنه لم يطلب إلا جزءًا يسيرًا، و﴿رزقناهم﴾ تذكير بأن المال رزق الله.","g":"","b":[],"q":[{"t":"يدخل فيه النفقات الواجبة كالزكاة، والنفقة على الزوجات والأقارب، والمماليك ونحو ذلك. والنفقات المستحبة بجميع طرق الخير.","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وأتى بـ \"من \"الدالة على التبعيض، لينبههم أنه لم يرد منهم إلا جزءا يسيرا من أموالهم","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-kutub","a":[4,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿يؤمنون بما أنزل إليك﴾: القرآن والسنة كلها دون تفريق، ﴿وما أنزل من قبلك﴾: الكتب السابقة والرسل جميعًا، ﴿وبالآخرة هم يوقنون﴾: اليقين علم تام لا شك فيه يوجب العمل.","g":"","b":[],"q":[{"t":"﴿وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنزلَ إِلَيْكَ﴾ وهو القرآن والسنة","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"و \"اليقين \"هو العلم التام الذي ليس فيه أدنى شك، الموجب للعمل.","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-huda","a": ب نزول لهذه الآيات؛ فيهما قول مجاهد في تقسيم أول السورة، وقد وُضع في السياق."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في آيات الدرس في القرطبي (مسائله الفقهية) وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من هذه الآيات."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في هذه الآيات مسجلة ضمن التفسير منسوبة إلى أصحابها، ولم تُفرد لها مادة مستقلة."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يُسجّل في آيات هذا الدرس خلاف معتبر يحتاج إلى بيان أسبابه غير ما سُجّل في القراءات والوقف."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم.","مناسبة البقرة للفاتحة منقولة في نظم الدرر من كلام الحرالي، ونص الطبعة في هذا الموضع فيه تصحيف؛ يحتاج إلى مقابلة بطبعة أخرى.","في m-aq-ghayb: كون اليوم الآخر من أركان الإيمان مسند إلى حديث جبريل في صحيح مسلم، أما تفصيل ما يدخل في الإيمان بالغيب فمن السعدي."],"dis":[]},{"n":3,"surah":"البقرة","from":6,"to":11,"title":"البقرة ٦–١١: الكافرون والمنافقون","theme":"وصف الكافرين المعاندين الذين لا ينفعهم الإنذار، ثم المنافقين الذين يظهرون الإيمان ويبطنون الكفر، ويخادعون الله والمؤمنين، ويفسدون ويزعمون الإصلاح.","sections":[{"name":"العقيدة","taf":false,"p":"1","items":[{"id":"m-aq-nifaq-types","a":[8,10],"lv":["التمكين"],"st":"ثابت","s":"النفاق نوعان: اعتقادي يُخرج من الإسلام، وهو المقصود في هذه الآيات، وعملي كالكذب وخلف الوعد والخيانة.","g":"","b":[],"q":[{"t":"واعلم أن النفاق هو: إظهار الخير وإبطان الشر، ويدخل في هذا التعريف النفاق الاعتقادي، والنفاق العملي","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وأما النفاق الاعتقادي المخرج عن دائرة الإسلام، فهو الذي وصف الله به المنافقين في هذه السورة وغيرها","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"آيَةُ الْمُنَافِقِ ثَلَاثٌ: إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ","src":"صحيح البخاري","au":"البخاري","v":"1","p":16,"h":"33","ch":"كتاب الإيمان › باب علامة المنافق","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]}]},{"name":"الحديث","taf":false,"p":"1","items":[{"id":"m-had-ayat-munafiq","a":[8,10],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قال النبي ﷺ: «آية المنافق ثلاث: إذا حدّث كذب، وإذا وعد أخلف، وإذا اؤتمن خان»؛ وهذا من النفاق العملي.","g":"","b":[],"q":[{"t":"«آيَةُ الْمُنَافِقِ ثَلَاثٌ: إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ».","src":"صحيح البخاري","au":"البخاري","v":"1","p":16,"h":"33","ch":"كتاب الإيمان › باب علامة المنافق","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]}]},{"name":"تحليل الحديث","taf":true,"p":"1","items":[{"id":"m3-ha-sahih","a":[8,11],"lv":["التفقّه"],"st":"ثابت","s":"أحاديث البطاقة (آية المنافق) مخرّجة في صحيحي البخاري ومسلم، وقال ابن الصلاح: كتاباهما أصح الكتب بعد كتاب الله العزيز؛ فهي ثابتة لا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","g":"","b":[],"q":[{"t":"وكتاباهما أصح الكتب بعد كتاب الله العزيز","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":18,"h":null,"ch":"النوع الأول من أنواع علوم الحديث: معرفة الصحيح من الحديث","ed":"دار الفكر- سوريا، دار الفكر المعاصر - بيروت؛ تحقيق: نور الدين عتر"}],"sh":12},{"id":"m3-ha-asbab6","a":[6,7],"lv":["التفقّه"],"st":"ثابت","s":"في روايات المقصودين بالآيتين: طريق ابن إسحاق عن محمد بن أبي محمد عن عكرمة أو سعيد بن جبير عن ابن عباس (يهود المدينة) ذين صار الكفر وصفًا لازمًا لهم لا يردعهم وعظ، فالإنذار وعدمه سواء عليهم، ثم ذكر الموانع التي منعتهم من الإيمان.","g":"","b":[],"q":[{"t":"يخبر تعالى أن الذين كفروا، أي: اتصفوا بالكفر، وانصبغوا به، وصار وصفا لهم لازما، لا يردعهم عنه رادع، ولا ينجع فيهم وعظ","src":"تفسير السعدي","au":"السعدي","v":null,"p":41,"h":null,"ch":"البقرة › ٦","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m2-gm-nifaq","a":[8,11],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"النفاق: إظهار الخير وإبطان الشر، ومن لطف الله بالمؤمنين أن كشف أحوال المنافقين ووصفهم بصفات يتميزون بها.","g":"","b":[],"q":[{"t":"واعلم أن النفاق هو: إظهار الخير وإبطان الشر","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"فمن لطف الله بالمؤمنين، أن جلا أحوالهم ووصفهم بأوصاف يتميزون بها، لئلا يغتر بهم المؤمنون","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التفسير","taf":false,"p":"2","items":[{"id":"m-taf-kafirun","a":[6,6],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الذين صار الكفر لهم وصفًا لازمًا لا ينفعهم وعظ؛ سواء عليهم أأنذرتهم أم لم تنذرهم لا يؤمنون. وحقيقة الكفر: جحود ما جاء به الرسول أو جحود بعضه.","g":"","b":[],"q":[{"t":"يخبر تعالى أن الذين كفروا، أي: اتصفوا بالكفر، وانصبغوا به، وصار وصفا لهم لازما، لا يردعهم عنه رادع، ولا ينجع فيهم وعظ","src":"تفسير السعدي","au":"السعدي","v":null,"p":41,"h":null,"ch":"البقرة › ٦","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وحقيقة الكفر: هو الجحود لما جاء به الرسول، أو جحد بعضه","src":"تفسير السعدي","au":"السعدي","v":null,"p":41,"h":null,"ch":"البقرة › ٦","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-khatm","a":[7,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿ختم الله على قلوبهم وعلى سمعهم﴾: طبع عليها فلا يدخلها الإيمان، ﴿وعلى أبصارهم غشاوة﴾: غطاء يمنع النظر النافع؛ وإنما منعوا ذلك بسبب كفرهم وعنادهم بعد ما تبين لهم الحق، وهذا عقاب عاجل، ولهم عذاب النار آجلًا.","g":"","b":[],"q":[{"t":"أي: طبع عليها بطابع لا يدخلها الإيمان، ولا ينفذ فيها، فلا يعون ما ينفعهم، ولا يسمعون ما يفيدهم.","src":"تفسير السعدي","au":"السعدي","v":null,"p":41,"h":null,"ch":"البقرة › ٦","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وإنما منعوا ذلك، وسدت عنهم أبواب الإيمان بسبب كفرهم وجحودهم ومعاندتهم بعد ما تبين لهم الحق","src":"تفسير السعدي","au":"السعدي","v":null,"p":41,"h":null,"ch":"البقرة › ٦","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-nifaq","a":[8,8],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"المنافقون يقولون بألسنتهم ما ليس في قلوبهم، فأكذبهم الله بقوله ﴿وما هم بمؤمنين﴾؛ لأن الإيمان الحقيقي ما تواطأ عليه القلب واللسان.","g":"","b":[],"q":[{"t":"فإنهم يقولون بألسنتهم ما ليس في قلوبهم، فأكذبهم الله بقوله: ﴿وَمَا هُمْ بِمُؤْمِنِينَ﴾ لأن الإيمان الحقيقي، ما تواطأ عليه القلب واللسان","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-khida","a":[9,9],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"المخادعة: أن يظهر شيئًا ويبطن خلافه ليصل إلى مقصوده؛ فعاد خداع المنافقين على أنفسهم، لأن الله لا يتضرر بخداعهم، والمؤمنون لا يضرهم كيدهم.","g":"","b":[],"q":[{"t":"والمخادعة: أن يظهر المخادع لمن يخادعه شيئا، ويبطن خلافه لكي يتمكن من مقصوده ممن يخادع","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"لأن الله تعالى لا يتضرر بخداعهم [شيئا] وعباده المؤمنون، لا يضرهم كيدهم شيئا","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-marad","a":[10,10],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"المرض هنا مرض الشك والنفاق. وللقلب مرضان: مرض الشبهات (كالكفر والشكوك والبدع)، ومرض الشهوات (كمحبة المعاصي). و﴿فزادهم الله مرضًا﴾: عقوبة المعصية المعصية بعدها، كما أن من ثواب الحسنة الحسنة بعدها.","g":"","b":[],"q":[{"t":"والمراد بالمرض هنا: مرض الشك والشبهات والنفاق، لأن (٦) القلب يعرض له مرضان يخرجانه عن صحته واعتداله: مرض الشبهات الباطلة، ومرض الشهوات المردية","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"فعقوبة المعصية، المعصية بعدها، كما أن من ثواب الحسنة، الحسنة بعدها","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-fasad","a":[11,11],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"إذا نُهوا عن الإفساد في الأرض بالكفر والمعاصي قالوا: إنما نحن مصلحون؛ فجمعوا بين فعل الفساد واعتقاده إصلاحًا، وهذا أعظم جناية ممن يعصي وهو يعلم أنها معصية.","g":"","b":[],"q":[{"t":"أي: إذا نهي هؤلاء المنافقون عن الإفساد في الأرض، وهو العمل بالكفر والمعاصي، ومنه إظهار سرائر المؤمنين لعدوهم وموالاتهم للكافرين ﴿قَالُوا إِنَّمَا نَحْنُ مُصْلِحُونَ﴾ فجمعوا بين العمل بالفساد في الأرض، وإظهارهم أنه ليس بإفساد بل هو إصلاح","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ١١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"السياق","taf":false,"p":"2","items":[{"id":"m-ctx-nifaq-madina","a":[8,11],"lv":["التمكين"],"st":"ثابت","s":"لم يكن النفاق موجودًا قبل الهجرة، فلما كانت وقعة بدر وأعز الله المؤمنين أظهر بعض من في المدينة الإسلام خوفًا ومخادعة لتحقن دماؤهم وأموالهم.","g":"","b":[],"q":[{"t":"ولم يكن النفاق موجودا قبل هجرة الرسول ﷺ [من مكة] إلى المدينة، وبعد أن هاجر، فلما كانت وقعة \"بدر \" (١) وأظهر الله المؤمنين وأعزهم، ذل (٢) من في المدينة ممن لم يسلم، فأظهر بعضهم الإسلام خوفا ومخادعة","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-ctx-structure","a":[6,11],"lv":["التمكين"],"st":"ثابت","s":"بعد أربع آيات في المؤمنين جاءت آيتان في الكافرين ثم آيات في المنافقين، كما قال مجاهد.","g":"","b":[],"q":[{"t":"أخرج الفريابي وابن جرير عن مجاهد قال أربع آيات من أول البقرة نزلت في المؤمنين وآيتان في الكافرين وثلاث عشرة آية في المنافقين","src":"لباب النقول","au":"السيوطي","v":null,"p":7,"h":null,"ch":"سورة البقرة","ed":"دار الكتب العلمية بيروت - لبنان"}],"sh":2}]},{"name":"المتشابهات","taf":false,"p":"2","items":[{"id":"m2-mut-sawa","a":[6,6],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"في البقرة ﴿سواء عليهم﴾ وفي يس ﴿وسواء﴾ بزيادة الواو؛ لأن ما في البقرة جملة هي خبر «إن»، وما في يس جملة معطوفة على جملة.","g":"","b":[],"q":[{"t":"قَوْله ﴿سَوَاء عَلَيْهِم﴾ وَفِي يس ﴿وَسَوَاء﴾ بِزِيَادَة وَاو لِأَن مَا فِي الْبَقَرَة جملَة هِيَ خبر عَن اسْم إِن وَمَا فِي يس جملَة عطفت بِالْوَاو على جملَة","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":67,"h":null,"ch":"سورة البقرة","ed":"تحقيق: عبد القادر أحمد عطا [ت ١٤٠٣ هـ]"}]},{"id":"m2-mut-billah","a":[8,8],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"﴿آمنا بالله وباليوم الآخر﴾ بتكرار الباء لا نظير له في القرآن؛ فالمنافقون أكدوا كلامهم نفيًا للريبة، فنفى الله عنهم الإيمان بأوكد الألفاظ: ﴿وما هم بمؤمنين﴾.","g":"","b":[],"q":[{"t":"وَهَذِه حِكَايَة كَلَام الْمُنَافِقين وهم أكدوا كَلَامهم نفيا للريبة وإبعادا للتُّهمَةِ","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":67,"h":null,"ch":"سورة البقرة","ed":"تحقيق: عبد القادر أحمد عطا [ت ١٤٠٣ هـ]"},{"t":"فنفى الله الْإِيمَان عَنْهُم بأوكد الْأَلْفَاظ فَقَالَ ﴿وَمَا هم بمؤمنين﴾","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":67,"h":null,"ch":"سورة البقرة","ed":"تحقيق: عبد القادر أحمد عطا [ت ١٤٠٣ هـ]"}]}]},{"name":"اللغة والإعراب","taf":true,"p":"2","items":[{"id":"m2-irab-inna","a":[6,6],"lv":["التفقّه"],"st":"ثابت","s":"قال النحاس: ﴿الذين﴾ منصوب بـ«إنّ»، وعملت «إن» لأنها أشبهت الفعل، وفيها معنى التح لإجابة: أكد المنافقون كلامهم نفيًا للريبة، فنفى الله عنهم الإيمان بأوكد الألفاظ","يسأل عن: m2-mut-billah"]}]},{"name":"المهام العملية","p":"3","items":[{"id":"t3-f","a":[6,11],"lv":["التأسيس"],"st":"","g":"","b":[],"q":[],"s":"راقب نفسك في ثلاث: الصدق في الحديث، والوفاء بالوعد، وأداء الأمانة","x":["متى: طوال يومك، وراجع نفسك قبل النوم","كم مرة: كل يوم حتى نهاية الأسبوع","أعرف أني نفذتها إذا: مرّ يوم كامل لم تكذب فيه ولم تخلف وعدًا ولم تضيّع أمانة","تقوم على: m-app-promises"]}]}],"gaps":[{"f":"علوم القرآن","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لا مسألة من علوم القرآن خاصة بآيات هذا الدرس غير ما سُجّل في أقسام القراءات والوقف والمتشابه."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في آيات الدرس في القرطبي (مسائله الفقهية) وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من هذه الآيات."},{"f":"المناسبات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"انتقال السورة من صفات المؤمنين إلى صفات الكفار مسجل في قسم السياق من السعدي؛ ولم يُستخرج من نظم الدرر نص مستقل لهذا الموضع."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في هذه الآيات مسجلة ضمن التفسير منسوبة إلى أصحابها، ولم تُفرد لها مادة مستقلة."},{"f":"التزكية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مادة التزكية في هذا الدرس (التحذير من صفات النفاق) مسجلة في التدبر والتطبيق؛ ولم يوجد في رياض الصالحين والأذكار نص مرتبط بالآيات مباشرة."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مقاصد سورة البقرة مسجلة في الدرس الثاني (أول السورة)؛ ولم يُذكر لهذا المقطع مقصد مستقل في المصادر."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يُسجّل في آيات هذا الدرس خلاف معتبر يحتاج إلى بيان أسبابه غير ما سُجّل في القراءات والوقف."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم.","إسناد رواية ابن عباس في لباب النقول مكتوب «محمد بن أبي عكرمة عن سعيد»، وفي الإتقان «محمد بن أبي محمد عن عكرمة أو سعيد»؛ يبدو تصحيفًا في طبعة اللباب ويحتاج إلى تحقق.","في m-aq-nifaq-types: خصال النفاق العملي مسندة إلى حديث «آية المنافق ثلاث» في البخاري، أما تقسيم النفاق إلى اعتقادي يُخرج من الإسلام وعملي فمن السعدي، ولم يوجد بهذا اللفظ في مراجع العقيدة. يُرفع للمراجعة العلمية (البند 26)."],"dis":["المراد بـ﴿الذين كفروا﴾ في الآية ٦."]},{"n":4,"surah":"البقرة","from":12,"to":16,"title":"البقرة ١٢–١٦: صفات المنافقين","theme":"كشف حال المنافقين: يفسدون ويزعمون الإصلاح، ويرمون المؤمنين بالسفه وهم السفهاء، ويظهرون للمؤمنين غير ما يبطنون، فاشتروا الضلالة بالهدى فما ربحت تجارتهم.","sections":[{"name":"العقيدة","taf":false,"p":"1","items":[{"id":"m-aq-jaza","a":[15,15],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال ابن قتيبة: ﴿الله يستهزئ بهم﴾ أي يجازيهم جزاء الاستهزاء، ومثله ﴿نسوا الله فنسيهم﴾. وقال البيهقي: ليس استهزاء الله بهم كمعناه من العباد.","g":"","b":[],"q":[{"t":"﴿اللَّهُ يَسْتَهْزِئُ بِهِمْ﴾ أي يجازيهم جزاء الاستهزاء.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":41,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"},{"t":"وَكَذَلِكَ قَوْلُهُ: ﴿اللَّهُ يَسْتَهْزِئُ بِهِمْ﴾ [البقرة: ١٥] لَيْسَ ذَلِكَ مِنَ اللَّهِ كَمَعْنَاهُ مِنَ الْعِبَادِ","src":"الأسماء والصفات","au":"البيهقي","v":"2","p":415,"h":null,"ch":"باب ما جاء في العجب وقوله تعالى: بل عجبت ويسخرون.","ed":"مكتبة السوادي، جدة - المملكة العربية السعودية، الأولى، ١٤١٣ هـ - ١٩٩٣ م"}]}]},{"name":"تحليل الحديث","taf":true,"p":"1","items":[{"id":"m3-ha-ibn-ubayy","a":[14,14],"lv":["التفقّه"],"st":"ثابت","s":"رواية نزول الآية ١٤ في عبد الله بن أبي جاءت من طريق محمد بن مروان السدي الصغير عن الكلبي عن أبي صالح؛ قال السيوطي: هذا الإسناد واهٍ جدًّا، وقال في الإتقان: إذا انضم السدي الصغير إلى طريق الكلبي فهي سلسلة الكذب.","g":"","b":[],"q":[{"t":"هذا الإسناد واه جدا فإن السدي الصغير كذاب وكذا الكلبي وأبو صالح ضعيف","src":"لباب النقول","au":"السيوطي","v":null,"p":7,"h":null,"ch":"سورة البقرة","ed":"دار الكتب العلمية بيروت - لبنان"},{"t":"فإن انضم إلى ذلك رواية محمد بن مروان السدي الصغير فهي سلسلة الكذب","src":"الإتقان","au":"السيوطي","v":"4","p":239,"h":null,"ch":"المجلد الرابع › النوع الثمانون: في طبقات المفسرين","ed":"الهيئة المصرية العامة للكتاب، ١٣٩٤ هـ/ ١٩٧٤ م؛ تحقيق: محمد أبو الفضل إبراهيم [ت ١٤٠١ هـ]"}]}]},{"name":"أسباب النزول","taf":false,"p":"1","items":[{"id":"m-asb-ibn-ubayy","a":[14,14],"lv":["التفقّه"],"st":"رواية لا تثبت","s":"رُوي أن الآية ١٤ نزلت في عبد الله بن أُبيّ حين أثنى على أبي بكر وعمر وعلي نفاقًا. قال السيوطي: هذا الإسناد واهٍ جدًّا؛ فلا يُعتمد سببًا للنزول.","g":"لا يثبت","b":[],"q":[{"t":"هذا الإسناد واه جدا فإن السدي الصغير كذاب وكذا الكلبي وأبو صالح ضعيف","src":"لباب النقول","au":"السيوطي","v":null,"p":7,"h":null,"ch":"سورة البقرة","ed":"دار الكتب العلمية بيروت - لبنان"}]}]},{"name":"وجه الاستنباط","taf":true,"p":"1","items":[{"id":"m3-inf-hasr","a":[12,12],"lv":["التفقّه"],"st":"ثابت","s":"في ﴿إنما نحن مصلحون﴾ حصرٌ للإصلاح في المنافقين يتضمن نفيه عن المؤمنين، فقلب الله عليهم الحصر بقوله ﴿ألا إنهم هم المفسدون﴾؛ فالاستنباط هنا من دلالة أداة الحصر.","g":"","b":[],"q":[{"t":"ولما كان في قولهم: ﴿إِنَّمَا نَحْنُ مُصْلِحُونَ﴾ حصر للإصلاح في جانبهم - وفي ضمنه أن المؤمنين ليسوا من أهل الإصلاح - قلب الله عليهم دعواهم","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ١١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"المعنى الإجمالي","taf":false,"p":"2","items":[{"id":"m2-gm-mufsidun","a":[12,12],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"لما حصر المنافقون الإصلاح في أنفسهم وضمنوا ذلك أن المؤمنين ليسوا مصلحين، قلب الله دعواهم فقال: ﴿ألا إنهم هم المفسدون﴾.","g":"","b":[],"q":[{"t":"قلب الله عليهم دعواهم بقوله: ﴿ألا إنهم هم المفسدون﴾","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ١١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التفسير","taf":false,"p":"2","items":[{"id":"m-taf-mufsidun","a":[12,12],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قلب الله دعواهم فقال ﴿ألا إنهم هم المفسدون﴾؛ فلا أعظم فسادًا ممن كفر بآيات الله وصد عن سبيله وخادع أولياءه ثم زعم أن هذا إصلاح. والإصلاح في الأرض أن تُعمر بطاعة الله.","g":"","b":[],"q":[{"t":"قلب الله عليهم دعواهم بقوله: ﴿ألا إنهم هم المفسدون﴾ فإنه لا أعظم فسادا (٢) ممن كفر بآيات الله، وصد عن سبيل الله، وخادع الله وأولياءه، ووالى المحاربين لله ورسوله، وزعم مع ذلك أن هذا إصلاح","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ١١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"ولأن الإصلاح في الأرض أن تعمر بطاعة الله والإيمان به","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ١١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-safah","a":[13,13],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"إذا قيل لهم آمنوا كإيمان الصحابة قالوا: أنؤمن كما آمن السفهاء؟ فرد الله عليهم بأنهم هم السفهاء؛ لأن حقيقة السفه جهل الإنسان بمصالح نفسه وسعيه فيما يضره، والعبرة بالأوصاف لا بالدعاوى.","g":"","b":[],"q":[{"t":"فرد الله ذلك عليهم، وأخبر أنهم هم السفهاء على الحقيقة، لأن حقيقة السفه (٣) جهل الإنسان بمصالح نفسه، وسعيه فيما يضرها","src":"تفسير السعدي","au":"السعدي","v":null,"p":43,"h":null,"ch":"البقرة › ١٣","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"فالعبرة بالأوصاف والبرهان، لا بالدعاوى المجردة، والأقوال الفارغة.","src":"تفسير السعدي","au":"السعدي","v":null,"p":43,"h":null,"ch":"البقرة › ١٣","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-wajhayn","a":[14,14],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"إذا اجتمعوا بالمؤمنين أظهروا أنهم معهم، وإذا خلوا إلى شياطينهم أي رؤسائهم في الشر قالوا: إنا معكم، إنما نحن مستهزئون.","g":"","b":[],"q":[{"t":"أنهم إذا اجتمعوا بالمؤمنين، أظهروا أنهم على طريقتهم وأنهم معهم، فإذا خلوا إلى شياطينهم - أي: رؤسائهم وكبرائهم في الشر - قالوا: إنا معكم في الحقيقة","src":"تفسير السعدي","au":"السعدي","v":null,"p":43,"h":null,"ch":"البقرة › ١٤","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-yastahzi","a":[15,15],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿الله يستهزئ بهم﴾ جزاءً على استهزائهم: زيّن لهم ما هم فيه حتى ظنوا أنهم مع المؤمنين، ويوم القيامة يُعطَون نورًا ثم يُطفأ فيبقون في الظلمة متحيرين.","g":"","b":[],"q":[{"t":"وهذا جزاء لهم، على استهزائهم بعباده، فمن استهزائه بهم أن زين لهم ما كانوا فيه من الشقاء والحالة الخبيثة، حتى ظنوا أنهم مع المؤمنين","src":"تفسير السعدي","au":"السعدي","v":null,"p":43,"h":null,"ch":"البقرة › ١٤","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"ومن استهزائه بهم يوم القيامة، أنه يعطيهم مع المؤمنين نورا ظاهرا، فإذا مشى المؤمنون بنورهم، طفئ نور المنافقين","src":"تفسير السعدي","au":"السعدي","v":null,"p":43,"h":null,"ch":"البقرة › ١٤","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-tijara","a":[16,16],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"رغبوا في الضلالة رغبة المشتري في السلعة فبذلوا الهدى ثمنًا لها؛ فإذا كان من بذل دينارًا في درهم خاسرًا، فكيف بمن بذل الهدى في الضلالة؟","g":"","b":[],"q":[{"t":"أي: رغبوا في الضلالة، رغبة المشتري بالسلعة، التي من رغبته فيها يبذل فيها الأثمان (١) النفيسة.","src":"تفسير السعدي","au":"السعدي","v":null,"p":43,"h":null,"ch":"البقرة › ١٦","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وإذا كان من بذل (٣) دينارا في مقابلة درهم خاسرا، فكيف من بذل جوهرة وأخذ عنها درهما؟","src":"تفسير السعدي","au":"السعدي","v":null,"p":43,"h":null,"ch":"البقرة › ١٦","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"السياق","taf":false,"p":"2","items":[{"id":"m2-ctx-nifaq","a":[12,16],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"ذكر ابن إسحاق أن هذه الآيات من صدر البقرة الذي نزل في المنافقين من الأوس والخزرج.","g":"","b":[],"q":[{"t":"يَعْنِي الْمُنَافِقِينَ مِنْ الْأَوْسِ وَالْخَزْرَجِ، وَمَنْ كَانَ عَلَى أَمْرِهِمْ","src":"السيرة النبوية","au":"ابن هشام","v":"2","p":128,"h":null,"ch":"المجلد: الثاني › المتن","ed":"شركة الطباعة الفنية المتحدة [وأعاد المحقق نشرها -مع تعديلات طفيفة- لدى مكتبة الكليات الأزهرية بالقاهرة، وكذلك نشرتها دار الجيل بيروت، بنفس ترقيم الصفحات]"}],"sh":2}]},{"name":"المناسبات","taf":false,"p":"2","items":[{"id":"m2-mun-zahir","a":[12,16],"lv":["التفقّه"],"st":"ثابت","s":"قال البقاعي: لما أخبر عن بواطنهم أتبعه من الظاهر ما يدل عليه.","g":"","b":[],"q":[{"t":"ولما أخبر تعالى عن بواطنهم أتبعه من الظاهر ما يدل عليه","src":"نظم الدرر","au":"البقاعي","v":"1","p":110,"h":null,"ch":"البقرة › ١","ed":"دائرة المعارف العثمانية، حيدر آباد - الهند، الأولى، (١٣٨٩ - ١٤٠٤ هـ) (١٩٦٩ - ١٩٨٤ م)"}]}]},{"name":"المتشابهات","taf":false,"p":"2","items":[{"id":"m2-mut-yashurun","a":[12,13],"lv":["التفقّه"],"st":"ثابت","s":"قال ابن الزبير: نفى عنهم الشعور في ﴿ولكن لا يشعرون﴾ والعلم في ﴿ولكن لا يعلمون﴾؛ لأن الشعور إدراك حسّي بلا فكر، والعلم لا يكون إلا عن فكر ونظر.","g":"","b":[],"q":[{"t":"والجواب عن ذلك: إن الشعور راجع إلى معنى الإحساس مأخوذ من الشعار وهو ما يلى الجسد ويباشره فيدرك ويحس من غير افتقار إلى فكر أو تدبر","src":"ملاك التأويل","au":"ابن الزبير الغرناطي","v":"1","p":24,"h":null,"ch":"سورة البقرة","ed":"دار الكتب العلمية، بيروت - لبنان"},{"t":"وأما العلم فلا يكون إلا عن فكر ونظر يحصله","src":"ملاك التأويل","au":"ابن الزبير الغرناطي","v":"1","p":25,"h":null,"ch":"سورة البقرة","ed":"دار الكتب العلمية، بيروت - لبنان"}]}]},{"name":"اللغة والإعراب","taf":true,"p":"2","items":[{"id":"m2-irab-ala","a":[12,12],"lv":["التفقّه"],"st":"ثابت","s":"قال النحاس: كُسرت «إنّ» في ﴿ألا إنهم هم المفسدون﴾ لأنها مبتدأة.","g":"","b":[],"q":[{"t":"أَلا إِنَّهُمْ هُمُ الْمُفْسِدُونَ كسرت «إنّ» لأنها مبتدأة.","src"
