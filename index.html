ة مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مقاصد سورة البقرة مسجلة في الدرس الثاني (أول السورة)؛ ولم يُذكر لهذا المقطع مقصد مستقل في المصادر."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يُسجّل في آيات هذا الدرس خلاف معتبر يحتاج إلى بيان أسبابه غير ما سُجّل في القراءات والوقف."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":[]},{"n":5,"surah":"البقرة","from":17,"to":20,"title":"البقرة ١٧–٢٠: مثلا المنافقين","theme":"مثلان يكشفان حال المنافقين: مستوقد النار الذي ذهب نوره فبقي في الظلمات، وأصحاب الصيب الذين يجعلون أصابعهم في آذانهم حذر الموت.","sections":[{"name":"المفردات","taf":false,"items":[{"id":"m-voc-istawqad","a":[17,17],"lv":["التأسيس"],"st":"ثابت","s":"«استوقد نارًا»: أوقدها.","g":"","b":[],"q":[{"t":"و ﴿الَّذِي اسْتَوْقَدَ نَارًا﴾ أي: أوْقَدَها.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":42,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-sayyib","a":[19,19],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«الصيّب»: المطر، من «صاب يصوب» إذا نزل من السماء.","g":"","b":[],"q":[{"t":"و (الصَّيِّبُ) المطر؛ \"فَيْعِل\" من \"صَابَ يَصُوبُ\": إذا نزل من السماء.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":42,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-yakhtaf","a":[20,20],"lv":["التأسيس"],"st":"ثابت","s":"«يخطف أبصارهم»: يذهب بها.","g":"","b":[],"q":[{"t":"﴿يَخْطَفُ أَبْصَارَهُمْ﴾ يَذْهَب بها.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":42,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]}]},{"name":"المعنى الإجمالي","taf":false,"items":[{"id":"m2-gm-mathal","a":[17,18],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"مثل المنافقين كمن استوقد نارًا في ظلمة شديدة، فلما أضاءت ما حوله ذهب نورها. فهم صم عن سماع الخير، بكم عن النطق به، عمي عن رؤية الحق، لا يرجعون إليه لأنهم تركوه بعد أن عرفوه.","g":"","b":[],"q":[{"t":"أي: مثلهم المطابق لما كانوا عليه كمثل الذي استوقد نارا، أي: كان في ظلمة عظيمة، وحاجة إلى النار شديدة","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"﴿فَهُمْ لا يَرْجِعُونَ﴾ لأنهم تركوا الحق بعد أن عرفوه، فلا يرجعون إليه","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-nari","a":[17,17],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"مثلهم كمن كان في ظلمة فاستوقد نارًا من غيره، فلما أضاءت ما حوله ذهب الله بنوره وبقي في ظلمات؛ كذلك المنافقون استوقدوا نار الإيمان من المؤمنين فانتفعوا بها في الدنيا، ثم هجم عليهم الموت فسلبهم ذلك.","g":"","b":[],"q":[{"t":"فكذلك هؤلاء المنافقون، استوقدوا نار الإيمان من المؤمنين، ولم تكن صفة لهم، فانتفعوا بها (١) وحقنت بذلك دماؤهم، وسلمت أموالهم، وحصل لهم نوع من الأمن في الدنيا، فبينما هم على ذلك (٢) إذ هجم عليهم الموت، فسلبهم الانتفاع بذلك النور","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-summ","a":[18,18],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿صم﴾ عن سماع الخير، ﴿بكم﴾ عن النطق به، ﴿عمي﴾ عن رؤية الحق، ﴿فهم لا يرجعون﴾ لأنهم تركوا الحق بعد أن عرفوه.","g":"","b":[],"q":[{"t":"﴿صُمٌّ﴾ أي: عن سماع الخير، ﴿بُكْمٌ﴾ [أي] : عن النطق به، ﴿عُمْيٌ﴾ عن رؤية الحق، ﴿فَهُمْ لا يَرْجِعُونَ﴾ لأنهم تركوا الحق بعد أن عرفوه، فلا يرجعون إليه","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-mai","a":[19,20],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"والمثل الثاني: كصاحب مطر فيه ظلمات ورعد وبرق؛ كذلك المنافقون إذا سمعوا القرآن ووعده ووعيده جعلوا أصابعهم في آذانهم وأعرضوا، والله محيط بهم قدرة وعلمًا.","g":"","b":[],"q":[{"t":"فهكذا حال (٥) المنافقين، إذا سمعوا القرآن وأوامره ونواهيه ووعده ووعيده، جعلوا أصابعهم في آذانهم، وأعرضوا عن أمره ونهيه ووعده ووعيده","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وأما المنافقون فأنى لهم السلامة، وهو تعالى محيط بهم، قدرة وعلما فلا يفوتونه ولا يعجزونه","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"السياق","taf":false,"items":[{"id":"m2-ctx-mathalan","a":[17,20],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال البقاعي: لما عُلم ذلك كله وكانت الأمثال ألصق بالبال وأكشف للأحوال، ضرب لهم الأمثال.","g":"","b":[],"q":[{"t":"فلما علم ذلك كله وكانت الأمثال ألصق بالبال وأكشف للأحوال","src":"نظم الدرر","au":"البقاعي","v":"1","p":118,"h":null,"ch":"","ed":"نظم الدرر في تناسب الآيات والسور"}]}]},{"name":"أسباب النزول","taf":false,"items":[{"id":"m-asb-sayyib","a":[19,20],"lv":["التفقّه"],"st":"يحتاج تحققًا","s":"روى ابن جرير من طريق السدي أن رجلين من المنافقين هربا إلى المشركين فأصابهما مطر فيه رعد وبرق، ثم رجعا وأسلما، فضرب الله شأنهما مثلًا. والرواية تحتاج تحققًا.","g":"رواية تحتاج تحققًا","b":[],"q":[{"t":"كان رجلان من المنافقين من أهل المدينة هربا من رسول الله إلى المشركين فأصابهما هذا المطر الذي ذكر الله فيه رعد شديد وصواعق وبرق","src":"لباب النقول","au":"السيوطي","v":null,"p":8,"h":null,"ch":"سورة البقرة","ed":"لباب النقول"}]}]},{"name":"العقيدة","taf":false,"items":[{"id":"m-aq-qudra","a":[20,20],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"في ﴿إن الله على كل شيء قدير﴾ رد على القدرية القائلين إن أفعال العباد غير داخلة في قدرة الله؛ لأن أفعالهم من جملة الأشياء.","g":"","b":[],"q":[{"t":"وفي هذه الآية وما أشبهها، رد على القدرية القائلين بأن أفعالهم غير داخلة في قدرة الله تعالى، لأن أفعالهم من جملة الأشياء الداخلة في قوله: ﴿إِنَّ اللَّهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ﴾ .","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"السيرة","taf":false,"items":[{"id":"m2-sir-haqq","a":[20,20],"lv":["التفقّه"],"st":"يحتاج تحققًا","s":"فسر ابن إسحاق ﴿كلما أضاء لهم مشوا فيه﴾ بأنهم يعرفون الحق ويتكلمون به، فإذا ارتكسوا منه وقفوا.","g":"","b":[],"q":[{"t":"كُلَّمَا أَضَاءَ لَهُمْ مَشَوْا فِيهِ وَإِذَا أَظْلَمَ عَلَيْهِمْ قَامُوا﴾ أَيْ: يَعْرِفُونَ الْحَقَّ وَيَتَكَلَّمُونَ بِهِ","src":"السيرة النبوية","au":"ابن هشام","v":"2","p":129,"h":null,"ch":"المجلد: الثاني › المتن","ed":"سيرة ابن هشام - ت طه عبد الرؤوف سعد"}]}]},{"name":"التجويد","taf":false,"items":[{"id":"m2-tj-summun","a":[18,18],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإقلاب: النون الساكنة والتنوين قبل الباء تُقلب ميمًا مخفاة مع الغنة. مثاله في الدرس: ﴿صُمٌّ بُكْمٌ﴾.","g":"","b":[],"q":[{"t":"وَالثَّالثُ الإِقْلاَبُ عِنْدَ الْبَاءِ ... مِيمًا بِغُنَّةٍ مَعَ الإِخْفَاءِ","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":3,"h":null,"ch":"أحكام النون الساكنة والتنوين","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}]},{"id":"m2-tj-zulumat","a":[19,19],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإدغام بغنة: النون الساكنة والتنوين قبل أحد حروف «ينمو» تُدغم مع الغنة. مثاله في الدرس: ﴿ظُلُمَاتٌ وَرَعْدٌ﴾.","g":"","b":[],"q":[{"t":"لَكِنَّهَا قِسْمَانِ قِسْمٌ يُدْغَمَا ... فِيهِ بِغُنَّةٍ (بِيَنْمُو) عُلِمَا","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":3,"h":null,"ch":"أحكام النون الساكنة والتنوين","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}]}]},{"name":"الوقف والابتداء","taf":false,"items":[{"id":"m2-waqf-qadir","a":[20,20],"lv":["التمكين"],"st":"ثابت","s":"الوقف على ﴿قدير﴾ في الآية العشرين تام باتفاق، لأنه آخر قصة المنافقين.","g":"","b":[],"q":[{"t":"﴿قَدِيرٌ (٢٠)﴾ [٢٠] تام؛ باتفاق؛ لأنه آخر قصة المنافقين.","src":"منار الهدى","au":"الأشموني","v":"1","p":64,"h":null,"ch":"بيان الوقف والابتداء › سورة البقرة","ed":"منار الهدى في بيان الوقف والابتدا ت عبد الرحيم الطرهوني"}]}]},{"name":"القراءات","taf":false,"items":[{"id":"m3-qir-shaa","a" "code":"NO_RELATED_MATERIAL","note":"ما في سيرة ابن هشام عن هذه الآيات هو تعيين المخاطَبين، وقد سُجّل في قسم السياق."},{"f":"القراءات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في النشر (فرش البقرة)، ولم يُذكر فيه خلاف فرشي في الآيات ٢١–٢٤."},{"f":"المناسبات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"انتقال السورة من الأصناف الثلاثة إلى خطاب الناس جميعًا مسجل من سيرة ابن هشام في السياق؛ ولم يُستخرج نص مستقل من نظم الدرر لهذا الموضع."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في هذه الآيات مسجلة ضمن التفسير منسوبة إلى أصحابها، ولم تُفرد لها مادة مستقلة."},{"f":"التزكية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مادة التزكية هنا مسجلة في التدبر؛ ولم يوجد في رياض الصالحين والأذكار نص مرتبط بالآيات مباشرة."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مقاصد سورة البقرة مسجلة في الدرس الثاني (أول السورة)؛ ولم يُذكر لهذا المقطع مقصد مستقل في المصادر."},{"f":"تحليل الحديث","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لا حديث ولا رواية مسندة في بطاقة هذا الدرس."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يُسجّل في آيات هذا الدرس خلاف معتبر يحتاج إلى بيان أسبابه غير ما سُجّل في القراءات والوقف."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":["قاعدة علقمة في ﴿يا أيها الناس﴾ مع أن السورة مدنية."]},{"n":7,"surah":"البقرة","from":25,"to":26,"title":"البقرة ٢٥–٢٦: بشارة المؤمنين وضرب الأمثال","theme":"بشارة المؤمنين العاملين بالجنات، وبيان أن الله لا يستحيي أن يضرب الأمثال بالحقير؛ فيزداد بها المؤمنون إيمانًا ويضل بها الفاسقون.","sections":[{"name":"المفردات","taf":false,"items":[{"id":"m-voc-jannat","a":[25,25],"lv":["التأسيس"],"st":"ثابت","s":"«جنات»: بساتين.","g":"","b":[],"q":[{"t":"﴿جَنَّاتٍ﴾ بساتين.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":43,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-mutashabih","a":[25,25],"lv":["التمكين"],"st":"خلاف معتبر","s":"«وأتوا به متشابهًا»: قال ابن قتيبة: يشبه بعضه بعضًا في المناظر دون الطعوم.","g":"","b":[],"q":[{"t":"﴿وَأُتُوا بِهِ مُتَشَابِهًا﴾ أي يشبه بعضه بعضا في المناظر دون الطعوم.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":44,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]}]},{"name":"المعنى الإجمالي","taf":false,"items":[{"id":"m2-gm-bushra","a":[25,25],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"لما ذكر جزاء الكافرين ذكر جزاء المؤمنين، على طريقة القرآن في الجمع بين الترغيب والترهيب، ليكون العبد راغبًا راهبًا، خائفًا راجيًا.","g":"","b":[],"q":[{"t":"لما ذكر جزاء الكافرين، ذكر جزاء المؤمنين، أهل الأعمال الصالحات، على طريقته تعالى في القرآن (١) يجمع بين الترغيب والترهيب، ليكون العبد راغبا راهبا، خائفا راجيا","src":"تفسير السعدي","au":"السعدي","v":null,"p":46,"h":null,"ch":"البقرة › ٢٥","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m2-gm-mathal","a":[26,26],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الله لا يستحيي أن يضرب أي مثل كان، بعوضة فما فوقها، لاشتمال الأمثال على الحكمة وإيضاح الحق.","g":"","b":[],"q":[{"t":"لاشتمال الأمثال على الحكمة، وإيضاح الحق، والله لا يستحيي من الحق","src":"تفسير السعدي","au":"السعدي","v":null,"p":47,"h":null,"ch":"البقرة › ٢٦","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-bushra","a":[25,25],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"لما ذكر جزاء الكافرين ذكر جزاء المؤمنين، على طريقة القرآن في الجمع بين الترغيب والترهيب، ليكون العبد راغبًا راهبًا خائفًا راجيًا.","g":"","b":[],"q":[{"t":"لما ذكر جزاء الكافرين، ذكر جزاء المؤمنين، أهل الأعمال الصالحات، على طريقته تعالى في القرآن (١) يجمع بين الترغيب والترهيب، ليكون العبد راغبا راهبا، خائفا راجيا","src":"تفسير السعدي","au":"السعدي","v":null,"p":46,"h":null,"ch":"البقرة › ٢٥","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-salihat","a":[25,25],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿الذين آمنوا﴾ بقلوبهم ﴿وعملوا الصالحات﴾ بجوارحهم، وسميت صالحات لأن بها تصلح أحوال العبد في دينه ودنياه.","g":"","b":[],"q":[{"t":"﴿الَّذِينَ آمَنُوا﴾ بقلوبهم ﴿وَعَمِلُوا الصَّالِحَاتِ﴾ بجوارحهم، فصدقوا إيمانهم بأعمالهم الصالحة.","src":"تفسير السعدي","au":"السعدي","v":null,"p":46,"h":null,"ch":"البقرة › ٢٥","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-jannah","a":[25,25],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"لهم بساتين تجري من تحتها أنهار الماء واللبن والعسل والخمر، كلما رُزقوا من ثمرها قالوا: هذا من جنس ما رزقنا من قبل؛ ولهم أزواج مطهرة خَلقًا وخُلقًا، وهم فيها خالدون.","g":"","b":[],"q":[{"t":"﴿تَجْرِي مِنْ تَحْتِهَا الأنْهَارُ﴾ أي: أنهار الماء، واللبن، والعسل، والخمر، يفجرونها كيف شاءوا، ويصرفونها أين أرادوا","src":"تفسير السعدي","au":"السعدي","v":null,"p":46,"h":null,"ch":"البقرة › ٢٥","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"﴿وَلَهُمْ فِيهَا أَزْوَاجٌ مُطَهَّرَةٌ﴾ فلم يقل \"مطهرة من ⦗٤٧⦘ العيب الفلاني \"ليشمل جميع أنواع التطهير","src":"تفسير السعدي","au":"السعدي","v":null,"p":46,"h":null,"ch":"البقرة › ٢٥","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-mathal","a":[26,26],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿إن الله لا يستحيي أن يضرب مثلًا ما بعوضة فما فوقها﴾ لاشتمال الأمثال على الحكمة وإيضاح الحق؛ فالمؤمنون يعلمون أنه الحق فيزدادون إيمانًا، والكافرون يعترضون فيزدادون كفرًا.","g":"","b":[],"q":[{"t":"لاشتمال الأمثال على الحكمة، وإيضاح الحق، والله لا يستحيي من الحق، وكأن في هذا، جوابا لمن أنكر ضرب الأمثال في الأشياء الحقيرة","src":"تفسير السعدي","au":"السعدي","v":null,"p":47,"h":null,"ch":"البقرة › ٢٦","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"فيعترضون ويتحيرون، فيزدادون كفرا إلى كفرهم، كما ازداد المؤمنون إيمانا على إيمانهم","src":"تفسير السعدي","au":"السعدي","v":null,"p":47,"h":null,"ch":"البقرة › ٢٦","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-fasiqin","a":[26,26],"lv":["التمكين"],"st":"ثابت","s":"﴿وما يضل به إلا الفاسقين﴾: الخارجين عن طاعة الله الذين صار الفسق وصفهم؛ والفسق نوعان: مخرج من الدين كهذا، وغير مخرج.","g":"","b":[],"q":[{"t":"والفسق نوعان: نوع مخرج من الدين، وهو الفسق المقتضي للخروج من الإيمان; كالمذكور في هذه الآية ونحوها، ونوع غير مخرج من الإيمان","src":"تفسير السعدي","au":"السعدي","v":null,"p":47,"h":null,"ch":"البقرة › ٢٦","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"السياق","taf":false,"items":[{"id":"m2-ctx-targhib","a":[25,25],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال البقاعي: لما ذكر ما لهم ترهيبًا أتبعه ما للمؤمنين ترغيبًا.","g":"","b":[],"q":[{"t":"ولما ذكر ما لهم ترهيباً اتبعه ما للمؤمنين ترغيباً","src":"نظم الدرر","au":"البقاعي","v":"1","p":189,"h":null,"ch":"","ed":"نظم الدرر في تناسب الآيات والسور"}]}]},{"name":"أسباب النزول","taf":false,"items":[{"id":"m-asb-26","a":[26,26],"lv":["التفقّه"],"st":"خلاف معتبر","s":"روي أن الآية نزلت لما ضرب الله مثلي المنافقين فقالوا: الله أجل من أن يضرب هذه الأمثال، وروي أنها نزلت لما ذكر الذباب والعنكبوت. ورجح السيوطي الأول لأنه أصح إسنادًا وأنسب لما في أول السورة.","g":"رواية تحتاج تحققًا","b":[],"q":[{"t":"قلت القول الأول أصح إسنادا وأنسب بما تقدم أول السورة وذكر المشركين لا يلائم كون الآية مدنية","src":"لباب النقول","au":"السيوطي","v":null,"p":9,"h":null,"ch":"سورة البقرة","ed":"لباب النقول"}]}]},{"name":"التجويد","taf":false,"items":[{"id":"m2-tj-jannatin","a":[25,25],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإخفاء: النون الساكنة والتنوين قبل بقية الحروف (الخمسة عشر) تُخفى مع الغنة. مثاله في الدرس: ﴿جَنَّاتٍ تَجْرِي﴾ و﴿مِنْ ثَمَرَةٍ﴾.","g":"","b":[],"q":[{"t":"وَالرَّابِعُ الإِخْفَاءُ عِنْدَ الْفَاضِلِ ... مِنَ الحُرُوفِ وَاجِبٌ لِلْفَاضِلِ","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":3,"h":null,"ch":"أحكام النون الساكنة والتنوين","ed":"تحفة الأطفال والغلمان في لفقهية) وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من هذه الآيات."},{"f":"السيرة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في سيرة ابن هشام عن الآيتين ٢٥–٢٦، ولم توجد مادة مرتبطة بهما."},{"f":"القراءات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في النشر فرشًا وأصولًا، ولم يُذكر في الآيتين ٢٥–٢٦ خلاف من طرقه؛ وما رواه النحاس عن ابن كثير في ﴿يستحيي﴾ بياء واحدة لم يذكره ابن الجزري في فرش البقرة."},{"f":"المتشابهات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في البرهان للكرماني ودرة التنزيل للإسكافي وملاك التأويل لابن الزبير، ولم يُذكر فيها متشابه لفظي لآيات هذا الدرس."},{"f":"المناسبات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ربط الآيتين بما قبلهما منقول من نظم الدرر في قسم السياق."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في هذه الآيات مسجلة ضمن التفسير منسوبة إلى أصحابها، ولم تُفرد لها مادة مستقلة."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مقاصد سورة البقرة مسجلة في الدرس الثاني (أول السورة)؛ ولم يُذكر لهذا المقطع مقصد مستقل في المصادر."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يُسجّل في آيات هذا الدرس خلاف معتبر يحتاج إلى بيان أسبابه غير ما سُجّل في القراءات والوقف."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":["معنى ﴿متشابهًا﴾.","سبب نزول الآية ٢٦."]},{"n":8,"surah":"البقرة","from":27,"to":29,"title":"البقرة ٢٧–٢٩: صفات الفاسقين ونعم الخلق","theme":"صفات الفاسقين الناقضين للعهد القاطعين لما أمر الله بوصله، والتعجب من الكفر بالله الذي أحيا وأمات وخلق ما في الأرض جميعًا لنا.","sections":[{"name":"المفردات","taf":false,"items":[{"id":"m-voc-naqd","a":[27,27],"lv":["التمكين"],"st":"ثابت","s":"«ينقضون عهد الله من بعد ميثاقه»: أمرهم الله بأمور فقبلوها، وهذا أخذ الميثاق، ونقضهم نبذها بعد القبول وترك العمل بها.","g":"","b":[],"q":[{"t":"يريد أن الله سبحانه أمرهم بأمور فقبلوها عنهُ، وذلك أخذ الميثاق عليهم والعهد إليهم. ونقضهم ذلك: نَبْذُهم إيّاه بعدَ القبول وتركهم العمل به.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":44,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-amwat","a":[28,28],"lv":["التمكين"],"st":"ثابت","s":"«وكنتم أمواتًا»: نطفًا في الأرحام، «فأحياكم» في الأرحام وفي الدنيا، «ثم يميتكم ثم يحييكم» في البعث.","g":"","b":[],"q":[{"t":"﴿كَيْفَ تَكْفُرُونَ بِاللَّهِ وَكُنْتُمْ أَمْوَاتًا﴾ يعني نطفا في الأرحام.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":44,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-istawa","a":[29,29],"lv":["التمكين"],"st":"ثابت","s":"«ثم استوى إلى السماء»: عمد إليها وقصد.","g":"","b":[],"q":[{"t":"﴿ثُمَّ اسْتَوَى إِلَى السَّمَاءِ﴾ عَمَدَ لها.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":45,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]}]},{"name":"المعنى الإجمالي","taf":false,"items":[{"id":"m2-gm-kayfa","a":[28,28],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿كيف تكفرون بالله﴾ استفهام بمعنى التعجب والتوبيخ والإنكار: كيف يحصل منكم الكفر بالله الذي خلقكم من العدم وأنعم عليكم؟","g":"","b":[],"q":[{"t":"هذا استفهام بمعنى التعجب والتوبيخ والإنكار، أي: كيف يحصل منكم الكفر بالله; الذي خلقكم من العدم","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٢٨","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m2-gm-khalaqa","a":[29,29],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"خلق الله لنا جميع ما في الأرض برًّا بنا ورحمة، للانتفاع والاستمتاع والاعتبار.","g":"","b":[],"q":[{"t":"أي: خلق لكم، برا بكم ورحمة، جميع ما على الأرض، للانتفاع والاست فضل آدم: أخبر الله الملائكة أنه جاعل في الأرض خليفة، ثم بيّن لهم فضله بالعلم، فأقرّوا بعلم الله وحكمته.","g":"","b":[],"q":[{"t":"هذا شروع في ذكر فضل آدم ﵇ أبي البشر (١) أن الله حين أراد خلقه أخبر الملائكة بذلك، وأن الله مستخلفه في الأرض.","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-khalifa","a":[30,30],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"أخبر الله الملائكة أنه جاعل في الأرض خليفة، فقالوا بحسب ظنهم: أتجعل فيها من يفسد ويسفك الدماء؟ ونحن نسبح بحمدك ونقدس لك. فقال: إني أعلم ما لا تعلمون؛ فالخير الحاصل بخلقه أضعاف ما فيه من الشر.","g":"","b":[],"q":[{"t":"هذا شروع في ذكر فضل آدم ﵇ أبي البشر (١) أن الله حين أراد خلقه أخبر الملائكة بذلك، وأن الله مستخلفه في الأرض.","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وأعلم أن الخير الحاصل بخلق هذا الخليفة، أضعاف أضعاف ما في ضمن ذلك من الشر","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-hikam","a":[30,30],"lv":["التمكين"],"st":"ثابت","s":"من حكم خلق آدم: أن يجتبي الله منهم الأنبياء والصديقين والشهداء والصالحين، وأن تظهر عبوديات لا تحصل بدونه، ويتبين الولي من العدو.","g":"","b":[],"q":[{"t":"إلا أن الله تعالى أراد أن يجتبي منهم الأنبياء والصديقين، والشهداء والصالحين، ولتظهر آياته للخلق","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-asma","a":[31,33],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"علّم الله آدم أسماء الأشياء ومسمياتها، ثم عرضها على الملائكة امتحانًا، فقالوا: ﴿سبحانك لا علم لنا إلا ما علمتنا﴾، فلما أنبأهم آدم بأسمائها تبين لهم فضله وحكمة الله وعلمه.","g":"","b":[],"q":[{"t":"فـ ﴿عَلَّمَ آدَمَ الأسْمَاءَ كُلَّهَا﴾ أي: أسماء الأشياء، وما هو مسمى بها، فعلمه الاسم والمسمى، أي: الألفاظ والمعاني","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"﴿فَلَمَّا أَنْبَأَهُمْ بِأَسْمَائِهِمْ﴾ تبين للملائكة فضل آدم عليهم; وحكمة الباري وعلمه في استخلاف هذا الخليفة","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"الحديث","taf":false,"items":[{"id":"m-had-khalq","a":[30,30],"lv":["التمكين"],"st":"ثابت","s":"قال النبي ﷺ: «خُلقت الملائكة من نور، وخُلق الجان من مارج من نار، وخُلق آدم مما وُصف لكم».","g":"","b":[],"q":[{"t":"\"خلقت الملائكة من نور. وخلق الجان من مارج من نار. وخلق آدم مما وصف لكم\".","src":"صحيح مسلم","au":"مسلم","v":"4","p":2294,"h":"2996","ch":"٥٣ - كتاب الزهد والرقائق › ١٠ - باب في أحاديث متفرقة","ed":"صحيح مسلم - ت عبد الباقي"}]},{"id":"m-had-sittun","a":[30,31],"lv":["التمكين"],"st":"ثابت","s":"خلق الله آدم طوله ستون ذراعًا، فلما خلقه قال: اذهب فسلّم على أولئك النفر من الملائكة واستمع ما يحيّونك فإنها تحيتك وتحية ذريتك.","g":"","b":[],"q":[{"t":"طُولُهُ سِتُّونَ ذِرَاعًا، فَلَمَّا خَلَقَهُ قَالَ: اذْهَبْ فَسَلِّمْ عَلَى أُولَئِكَ النَّفَرِ مِنَ الْمَلَائِكَةِ جُلُوسٍ فَاسْتَمِعْ مَا يُحَيُّونَكَ؛ فَإِنَّهَا تَحِيَّتُكَ وَتَحِيَّةُ ذُرِّيَّتِكَ","src":"صحيح البخاري","au":"البخاري","v":"8","p":50,"h":"6227","ch":"","ed":"صحيح البخاري - ط السلطانية"}]}]},{"name":"العقيدة","taf":false,"items":[{"id":"m-aq-kalam","a":[30,33],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"في الآيات إثبات الكلام لله تعالى، وأنه عليم حكيم؛ وأن العبد إذا خفيت عليه حكمة الله في شيء فالواجب التسليم والإقرار لله بالحكمة.","g":"","b":[],"q":[{"t":"وفي هذه الآيات من العبر والآيات; إثبات الكلام لله تعالى; وأنه لم يزل متكلما; يقول ما شاء; ويتكلم بما شاء; وأنه عليم حكيم، وفيه أن العبد إذا خفيت عليه حكمة الله في بعض المخلوقات والمأمورات فالوجب عليه; التسليم; واتهام عقله; والإقرار لله بالحكمة","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"الفقه","taf":false,"items":[{"id":"m2-fiqh-imama","a":[30,30],"lv":["التفقّه"],"st":"ثابت","s":"قال القرطبي: هذه الآية أصل في نصب إمام وخليفة يُسمع له ويُطاع. وفي المذهب الشافعي ذكر النووي في المنهاج شروط الإمام وأن الإمامة تنعقد بالبيعة وبالاستخلاف.","g":"","b":[],"q":[{"t":"هذه الآية أصل في نصب إمام وخليفة يسمع له ويطاع، لتجتمع به الكلمة، وتنفذ به أحكام الخليفة.","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"1","p":264,"h":null,"ch":"تفسير سورة البقرة › [سورة البقرة (٢): آية ٣٠]","ed":"تفسير القرطبي = الجامع لأحكام القرآن"},{"t":"شرط الإمام كونه مسلما مكلفا حرا ذكرا قرشيا مجتهدا شجاعا ذا رأي وسمع وبصر ونطق وتنعقد الإمامة بالبيعة","src":"منهاج الطالبين","au":"النووي","v":null,"p":292,"h":null,"ch":"كتاب البغاة","ed":"منهاج الطالبين وعمدة المفتين في الفقه"}]}]},{"name":"التجويد","taf":false,"items":[{"id":"m2-tj-man-yufsid","a":[30,30],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإدغام بغنة: النون الساكنة والتنوين قبل أحد حروف «ينمو» تُدغم مع الغنة. مثاله في الدرس: ﴿مَنْ يُفْسِدُ﴾.","g":"","b":[],"q":[{"t":"لَكِنَّهَا قِسْمَانِ قِسْمٌ يُدْغَمَا ... فِيهِ بِغُنَّةٍ (بِيَنْمُو) عُلِمَا","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":3,"h":null,"ch":"أحكام النون الساكنة والتنوين","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}]}]},{"name":"الوقف والابتداء","taf":false,"items":[{"id":"m2-waqf-la-talamun","a":[30,30],"lv":["التمكين"],"st":"ثابت","s":"الوقف على ﴿ما لا تعلمون﴾ في الآية الثلاثين تام، وعلى ﴿والأرض﴾ جائز، وعلى ﴿تكتمون﴾ في الآية الثالثة والثلاثين تام.","g":"","b":[],"q":[{"t":"﴿مَا لَا تَعْلَمُونَ (٣٠)﴾ [٣٠] تام","src":"منار الهدى","au":"الأشموني","v":"1","p":68,"h":null,"ch":"بيان الوقف والابتداء › سورة البقرة","ed":"منار الهدى في بيان الوقف والابتدا ت عبد الرحيم الطرهوني"},{"t":"﴿وَالْأَرْضِ﴾ [٣٣] جائز.﴿تَكْتُمُونَ﴾ [٣٣] تام.","src":"منار الهدى","au":"الأشموني","v":"1","p":"68-69","h":null,"ch":"بيان الوقف والابتداء › سورة البقرة","ed":"منار الهدى في بيان الوقف والابتدا ت عبد الرحيم الطرهوني"}]}]},{"name":"القراءات","taf":false,"items":[{"id":"m3-qir-haulai","a":[31,31],"lv":["التفقّه"],"st":"ثابت","s":"في ﴿هؤلاء إن كنتم﴾ همزتان مكسورتان من كلمتين: قرأ أبو عمرو بإسقاط الأولى، ووافقه قالون والبزي على تسهيل الأولى بين بين مع تحقيق الثانية في المكسورتين.","g":"","b":[],"q":[{"t":"فالمتفق عليه ثلاثة عشر لفظا في خمسة عشر موضعا. في البقرة هؤلاء إن كنتم","src":"النشر في القراءات العشر","au":"ابن الجزري","v":"1","p":382,"h":null,"ch":"باب في الهمزتين المجتمعتين من كلمتين › المتفقتان","ed":"النشر في القراءات العشر"},{"t":"فقرأ أبو عمرو بإسقاط الهمزة الأولى منهما في الأقسام الثلاثة","src":"النشر في القراءات العشر","au":"ابن الجزري","v":"1","p":"382-383","h":null,"ch":"باب في الهمزتين المجتمعتين من كلمتين › المتفقتان","ed":"النشر في القراءات العشر"},{"t":"وسهلا الأولى من المكسورتين، ومن المضمومتين بين بين مع تحقيق الثانية","src":"النشر في القراءات العشر","au":"ابن الجزري","v":"1","p":383,"h":null,"ch":"باب في الهمزتين المجتمعتين من كلمتين › المتفقتان","ed":"النشر في القراءات العشر"}]}]},{"name":"التزكية","taf":false,"items":[{"id":"m-taz-ilm","a":[31,33],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"في القصة فضيلة العلم من وجوه: عرّف الله ملائكته فضل آدم بالعلم، وأنه أفضل صفة تكون في العبد، وأمرهم بالسجود له لما بان فضل علمه.","g":"","b":[],"q":[{"t":"ومنها: أن الله عرفهم فضل آدم بالعلم; وأنه أفضل صفة تكون في العبد","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taz-adab","a":[32,32],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"أدب الملائكة: أقروا بقصورهم وقالوا ﴿لا علم لنا إلا ما علمتنا﴾ واعترفوا بفضل الله عليهم.","g":"","b":[],"q":[{"t":"فأقروا، واعترفوا بعلم الله وحكمته، وقصورهم عن معرفة أدنى شيء، واعترافهم بفضل الله عليهم","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m2-taz-la-adri","a":[32,32],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال القرطبي: الواجب على من سئل عن علم لا يعلمه أن يقول: الله أعلم ولا أدري، اقتداءً بالملائكة والأنبياء والعلماء.","g":"","b":[],"q":[{"t":"الواجب على م قل لهذا الموضع."},{"f":"أسباب النزول","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ليس في الواحدي ولباب النقول شيء لهذه الآيات."},{"f":"علوم القرآن","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لا مسألة من علوم القرآن خاصة بآيات هذا الدرس غير ما سُجّل في أقسام القراءات والوقف والمتشابه."},{"f":"السيرة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في سيرة ابن هشام عن قصة استخلاف آدم (الآيات ٣٠–٣٣)، ولم توجد مادة مرتبطة بها."},{"f":"المتشابهات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في البرهان للكرماني ودرة التنزيل للإسكافي وملاك التأويل لابن الزبير، ولم يُذكر فيها متشابه لفظي لآيات هذا الدرس."},{"f":"المناسبات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"انتقال السورة إلى قصة آدم مسجل في المعنى العام من السعدي («هذا شروع في ذكر فضل آدم»)؛ ولم يُستخرج نص مستقل من نظم الدرر."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في هذه الآيات مسجلة ضمن التفسير منسوبة إلى أصحابها، ولم تُفرد لها مادة مستقلة."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مقاصد سورة البقرة مسجلة في الدرس الثاني (أول السورة)؛ ولم يُذكر لهذا المقطع مقصد مستقل في المصادر."},{"f":"وجه الاستنباط","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"استنباط القرطبي (نصب الإمام) مسجل في قسم الفقه للتفقه."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يُسجّل في آيات هذا الدرس خلاف معتبر يحتاج إلى بيان أسبابه غير ما سُجّل في القراءات والوقف."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":["معنى ﴿ونقدس لك﴾."]},{"n":10,"surah":"ال فقّه"],"st":"ثابت","s":"في البقرة ﴿وكلا﴾ بالواو وفي الأعراف ﴿فكلا﴾ بالفاء؛ لأن السكنى هنا بمعنى الإقامة الممتدة، فجمع بين الإقامة والأكل بالواو، ولو كانت الفاء لوجب تأخير الأكل إلى الفراغ من الإقامة.","g":"","b":[],"q":[{"t":"وَإِنَّمَا الَّذِي فِي الْبَقَرَة من السّكُون الَّذِي مَعْنَاهُ الْإِقَامَة وَذَلِكَ يَسْتَدْعِي زَمَانا ممتدا فَلم يصلح إِلَّا بِالْوَاو","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":70,"h":null,"ch":"سورة البقرة","ed":"أسرار التكرار في القرآن = البرهان في توجيه متشابه القرآن"}]},{"id":"m2-mut-raghad","a":[35,35],"lv":["التفقّه"],"st":"ثابت","s":"وأجاب ابن الزبير بجواب آخر: آية البقرة قُصد بها الإخبار بما جرى في قصة آدم من غير ترتيب زماني فناسبها الواو، وآية الأعراف مقصودها تعداد النعم على آدم وذريته فناسبها الفاء.","g":"","b":[],"q":[{"t":"ولم يقصد غير التعريف بذلك من غير ترتيب زمانى أو تحديد غاية فناسبه الواو","src":"ملاك التأويل","au":"ابن الزبير الغرناطي","v":"1","p":28,"h":null,"ch":"سورة البقرة","ed":"ملاك التأويل القاطع بذوي الإلحاد والتعطيل"}]}]},{"name":"التزكية","taf":false,"items":[{"id":"m-taz-kibr","a":[34,34],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإباء والاستكبار عن أمر الله أصل هلاك إبليس، والمبادرة إلى الامتثال حال الملائكة.","g":"","b":[],"q":[{"t":"﴿إِلا إِبْلِيسَ أَبَى﴾ امتنع عن السجود; واستكبر عن أمر الله وعلى آدم","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التدبر","taf":false,"items":[{"id":"m-tad-tawba","a":[36,37],"lv":["التأسيس","التمكين"],"st":"","s":"الفرق بين آدم وإبليس: كلاهما خالف، لكن آدم اعترف وتاب، وإبليس أبى واستكبر؛ فالاعتراف بالذنب طريق التوبة.","g":"","b":["m-taf-tawba","m-taf-sujud"],"q":[]}]},{"name":"التطبيق","taf":false,"items":[{"id":"m-app-dua","a":[37,37],"lv":["التأسيس","التمكين"],"st":"","s":"بعد أي تقصير تذكره اليوم، قل دعاء آدم: ﴿ربنا ظلمنا أنفسنا وإن لم تغفر لنا وترحمنا لنكونن من الخاسرين﴾.","g":"","b":["m-taf-tawba"],"q":[]}]},{"name":"أصول الفقه","taf":true,"items":[{"id":"m-usul- ن","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لا مسألة من علوم القرآن خاصة بآيات هذا الدرس غير ما سُجّل في أقسام القراءات والوقف والمتشابه."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في آيات الدرس في القرطبي (مسائله الفقهية) وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من هذه الآيات."},{"f":"السيرة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في سيرة ابن هشام عن قصة سجود الملائكة وتوبة آدم، ولم توجد مادة مرتبطة بها."},{"f":"المناسبات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"اتصال الآيات بقصة استخلاف آدم قبلها ظاهر في السعدي، ولم يُستخرج نص مستقل من نظم الدرر."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في هذه الآيات مسجلة ضمن التفسير منسوبة إلى أصحابها، ولم تُفرد لها مادة مستقلة."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مقاصد سورة البقرة مسجلة في الدرس الثاني (أول السورة)؛ ولم يُذكر لهذا المقطع مقصد مستقل في المصادر."},{"f":"اللغة والإعراب","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"إعراب ﴿فتلقى آدم... كلمات﴾ مرتبط بالقراءتين المسجلتين في قسم القراءات."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"خلاف القراءة في ﴿فتلقى آدم من ربه كلمات﴾ مسجل في القراءات؛ ولم يُسجّل خلاف فقهي أو تفسيري يحتاج إلى بيان أسبابه."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":[]},{"n":1203,"surah":"الفيل","from":1,"to":5,"title":"سورة الفيل","theme":"ما فعله الله بأصحاب الفيل الذين أرادوا هدم البيت الحرام: آية على قدرته وحمايته لبيته، ومقدمة لبعثة النبي ﷺ.","sections":[{"name":"المفردات","taf":false,"items":[{"id":"m-voc-ababil","a":[3,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«أبابيل»: جماعات متفرقة.","g":"","b":[],"q":[ م الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-story","a":[1,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"أما رأيت ما فعل الله بأصحاب الفيل الذين كادوا بيته وأرادوا هدمه، وجاؤوا بجمع لا طاقة للعرب به من الحبشة واليمن؛ فلما قربوا من مكة أرسل الله عليهم طيرًا متفرقة تحمل حجارة من سجيل فرمتهم بها، فصاروا كعصف مأكول، وكفى الله شرهم.","g":"","b":[],"q":[{"t":"ما فعله الله بأصحاب الفيل، الذين كادوا بيته الحرام وأرادوا إخرابه، فتجهزوا لأجل ذلك، واستصحبوا معهم الفيلة لهدمه، وجاءوا بجمع لا قبل للعرب به، من الحبشة واليمن","src":"تفسير السعدي","au":"السعدي","v":null,"p":934,"h":null,"ch":"الفيل","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"أرسل الله عليهم طيرًا أبابيل أي: متفرقة، تحمل حجارة محماة من سجيل، فرمتهم بها، وتتبعت قاصيهم ودانيهم، فخمدوا وهمدوا، وصاروا كعصف مأكول، وكفى الله شرهم، ورد كيدهم في نحورهم","src":"تفسير السعدي","au":"السعدي","v":null,"p":934,"h":null,"ch":"الفيل","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-signs","a":[1,1],"lv":["التمكين"],"st":"ثابت","s":"في هذه الحادثة دلائل على قدرة الله وعظمته، ورحمته بعباده، وتوحيده، وصدق رسوله ﷺ.","g":"","b":[],"q":[{"t":"أي: أما رأيت من قدرة الله وعظيم شأنه، ورحمته بعباده، وأدلة توحيده، وصدق رسوله محمد ﷺ","src":"تفسير السعدي","au":"السعدي","v":null,"p":934,"h":null,"ch":"الفيل","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"السياق","taf":false,"items":[{"id":"m-ctx-mawlid","a":[1,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"كانت حادثة الفيل في السنة التي وُلد فيها رسول الله ﷺ، فصارت من مقدمات رسالته.","g":"","b":[],"q":[{"t":"وكانت تلك السنة التي ولد فيها رسول الله ﷺ، فصارت من جملة إرهاصات دعوته، ومقدمات (١) رسالته","src":"تفسير السعدي","au":"السعدي","v":null,"p":934,"h":null,"ch":"الفيل","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"أسباب النزول","taf":false,"items":[{"id":"m-asb-fil","a":[1,5],"lv":["التمكين"],"st":"ثابت","s":"نزلت السورة في قصة أصحاب الفيل وقصدهم تخريب الكعبة وما فعل الله بهم؛ وهذا بيان لموضوعها لا سبب نزول بحادثة مخصوصة.","g":"سياق تاريخ لتكرار في القرآن = البرهان في توجيه متشابه القرآن"}]}]},{"name":"المناسبات","taf":false,"items":[{"id":"m2-mun-humaza","a":[1,1],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال البقاعي: لما قدّم في سورة الهمزة أن كثرة الأموال ربما أعقبت الوبال، دلّ عليه في هذه السورة بدليل مشهود.","g":"","b":[],"q":[{"t":"لما قدم في الهمزة أن كثرة الأموال المسببة بالقوة بالرجال ربما أعقبت الوبال، دل عليه في هذه بدليل شهودي","src":"نظم الدرر","au":"البقاعي","v":"22","p":249,"h":null,"ch":"الهمزة","ed":"نظم الدرر في تناسب الآيات والسور"}]}]},{"name":"التدبر","taf":false,"items":[{"id":"m-tad-protect","a":[1,5],"lv":["التأسيس","التمكين"],"st":"","s":"جيش لا طاقة للعرب به ردّه الله بطير صغيرة؛ فالقوة كلها لله، وهو يحمي بيته.","g":"","b":["m-taf-story"],"q":[]}]},{"name":"التطبيق","taf":false,"items":[{"id":"m-app-tell","a":[1,5],"lv":["التأسيس"],"st":"","s":"احكِ قصة أصحاب الفيل لأحد من أهلك بلغتك، واذكر ما تدل عليه من قدرة الله.","g":"","b":["m-taf-story","m-taf-signs"],"q":[]}]},{"name":"المقاصد","taf":true,"items":[{"id":"m2-maq-fil","a":[1,5],"lv":["التفقّه"],"st":"ثابت","s":"قال ابن عاشور: تضمنت السورة التذكير بأن الكعبة حرم الله وأنه حماه ممن أرادوا به سوءًا، وأن ما حلّ بهم تذكرة لقريش بأن فاعل ذلك هو رب البيت، ولا حظّ فيه للأصنام.","g":"","b":[],"q":[{"t":"وَقَدْ تَضَمَّنَتِ التَّذْكِيرَ بِأَنَّ الْكَعْبَةَ حَرَمُ اللَّهِ وَأَنَّ اللَّهَ حَمَاهُ مِمَّنْ أَرَادُوا بِهِ سُوءًا","src":"التحرير والتنوير","au":"ابن عاشور","v":"30","p":543,"h":null,"ch":"١٠٥- سورة الفيل › أغراضها","ed":"تفسير ابن عاشور التحرير والتنوير"},{"t":"وَلِيَكُونَ مَا حَلَّ بِهِمْ تَذْكِرَةً لِقُرَيْشٍ بِأَنَّ فَاعِلَ ذَلِكَ هُوَ رَبُّ ذَلِكَ الْبَيْتِ وَأَنْ لَا حَظَّ فِيهِ لِلْأَصْنَامِ الَّتِي نَصَبُوهَا حَوْلَهُ.","src":"التحرير والتنوير","au":"ابن عاشور","v":"30","p":544,"h":null,"ch":"١٠٥- سورة الفيل › أغراضها","ed":"تفسير ابن عاشور التحرير والتنوير"}]}]},{"name":"اللغة والإعراب","taf":true,"items":[{"id":"m2-irab-tara","a":[1,1],"lv":["التفقّه"],"st":"ثابت","s":"قال النحاس: حُذفت الألف من ﴿تر﴾ للجزم، و﴿كيف﴾ في موضع نصب بـ﴿فعل﴾.","g":"","b":[],"q":[{"t":"حذفت الألف من ترى للجزم، والأصل الهمزة فألقيت حركة الهمزة على الراء فحذفت الهمزة «كيف» في موضع نصب بفعل","src":"إعراب القرآن","au":"النحاس","v":"5","p":183,"h":null,"ch":"١٠٥ شرح إعراب سورة الفيل › [سورة الفيل (١٠٥) : آية ١]","ed":"إعراب القرآن للنحاس"}]}]},{"name":"وجه الاستنباط","taf":true,"items":[{"id":"m3-inf-mujiza","a":[1,5],"lv":["التفقّه"],"st":"ثابت","s":"قال القرطبي: كانت قصة الفيل من معجزات النبي ﷺ وإن وقعت قبل مولده وقبل التحدي، لأنها كانت توكيدًا لأمره وتمهيدًا لشأنه.","g":"","b":[],"q":[{"t":"كانت قصة الفيل فيما بعد من معجزات النبي ﷺ وإن كانت قبله وقبل التحدي، لأنها كانت توكيدا لأمره، وتمهيدا لشأنه","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"20","p":195,"h":null,"ch":"تفسير سورة الفيل › [سورة الفيل (١٠٥): آية ١]","ed":"تفسير القرطبي = الجامع لأحكام القرآن"}]}]},{"name":"أسباب الخلاف","taf":true,"items":[{"id":"m2-rfd-lam","a":[5,5],"lv":["التفقّه"],"st":"خلاف معتبر","s":"اختُلف في تعلّق سورة الفيل بما بعدها: فقيل لا وقف في آخرها لأنها متصلة بقوله ﴿لإيلاف قريش﴾، والإجماع على أنهما سورتان يُفصل بينهما بالبسملة.","g":"","b":[],"q":[{"t":"وقيل: لا وقف في سورة الفيل، ولا في آخرها، بل هي متصلة بقوله: «لئلاف قريش»","src":"منار الهدى","au":"الأشموني","v":"2","p":432,"h":null,"ch":"بيان الوقف والابتداء › سورة الفيل","ed":"منار الهدى في بيان الوقف والابتدا ت عبد الرحيم الطرهوني"},{"t":"والإجماع على أنَّهما سورتان","src":"منار الهدى","au":"الأشموني","v":"2","p":432,"h":null,"ch":"بيان الوقف والابتداء › سورة الفيل","ed":"منار الهدى في بيان الوقف والابتدا ت عبد الرحيم الطرهوني"}]}]}],"gaps":[{"f":"الحديث","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يذكر ابن كثير في تفسير سورة الفيل حديثًا من الصحيحين، ولم يوجد في مصادر البطاقة حديث مرتبط بها مباشرة."},{"f":"العقيدة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مادة الإيمان بقدرة الله وحمايته لبيته مسجلة في المعنى العام والمقاصد؛ ولم تُفرد لها مادة من كتب العقيدة."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في مسائل القرطبي الفقهية لهذه السورة وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من آياتها."},{"f":"القراءات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في النشر فرشًا، ولم يُذكر لسورة الفيل خلاف فرشي؛ وما يجري فيها من الأصول (كالإدغام الكبير لأبي عمرو) قواعد عامة لا تخص السورة."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في ﴿أبابيل﴾ و﴿سجيل﴾ مسجلة في المفردات والتفسير منسوبة إلى أصحابها."},{"f":"التزكية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يوجد في رياض الصالحين والأذكار نص مرتبط بآيات هذه السورة مباشرة غير ما سُجّل في الحديث والتدبر."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"تحليل الحديث","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لا حديث في البطاقة يحتاج إلى تحليل."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":["معنى «مأكول»."]},{"n":1204,"surah":"قريش","from":1,"to":4,"title":"سورة قريش","theme":"نعمة الله على قريش بالأمن ورحلتي الشتاء والصيف، والأمر بشكرها بعبادة رب البيت.","sections":[{"name":"المفردات","taf":false,"items":[{"id":"m-voc-ilaf","a":[1,2],"lv":["التمكين"],"st":"ثابت","s":"«الإيلاف» مصدر «آلفت فلانًا كذا إيلافًا»، أي: فعل الله ذلك بأصحاب الفيل ليؤلف قريشًا هاتين الرحلتين فتقيم بمكة.","g":"","b":[],"q":[{"t":"(الإيلاف) مصدرُ \"آلَفْتُ فلانًا كذا إيلافًا\"؛ كما تقول: ألزمتُه إيَّاه إلزامًا.\nيقول: فَعَل هذا بأصحاب الفيل ليُؤْلِفَ قريشًا هاتَيْن الرِّحْلَتَيْنُ فتُقيمَ بمكةَ.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":540,"h":null,"ch":"غريب القرآن › سورة قريش","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]}]},{"name":"المعنى الإجمالي","taf":false,"items":[{"id":"m2-gm-quraysh","a":[1,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قال كثير من المفسرين: فعل الله ما فعل بأصحاب الفيل لأجل قريش وأمنهم وانتظام رحلتيهم، ولهذا أمرهم بالشكر: ﴿فليعبدوا رب هذا البيت﴾، أي ليوحدوه ويخلصوا له العبادة.","g":"","b":[],"q":[{"t":"فعلنا ما فعلنا بأصحاب الفيل لأجل قريش وأمنهم، واستقامة مصالحهم، وانتظام رحلتهم في الشتاء لليمن، والصيف للشام","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"قريش","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"ولهذا أمرهم الله بالشكر، فقال: ﴿فَلْيَعْبُدُوا رَبَّ هَذَا الْبَيْتِ﴾ أي: ليوحدوه ويخلصوا له العبادة","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"قريش","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-link","a":[1,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قال كثير من المفسرين: اللام في ﴿لإيلاف﴾ متعلقة بالسورة قبلها: فعل الله ما فعل بأصحاب الفيل لأجل قريش وأمنهم وانتظام رحلتهم في الشتاء إلى اليمن وفي الصيف إلى الشام للتجارة.","g":"","b":[],"q":[{"t":"قال كثير من المفسرين: إن الجار والمجرور متعلق بالسورة التي قبلها أي: فعلنا ما فعلنا بأصحاب الفيل لأجل قريش وأمنهم، واستقامة مصالحهم، وانتظام رحلتهم في الشتاء لليمن، والصيف للشام، لأجل التجارة والمكاسب.","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"قريش","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-ibada","a":[3,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"أمرهم الله بشكر هذه النعمة: ﴿فليعبدوا رب هذا البيت﴾ أي ليوحّدوه ويخلصوا له العبادة؛ فسعة الرزق والأمن من الخوف من أكبر النعم الموجبة للشكر. وخص البيت بالربوبية لشرفه، وهو رب كل شيء.","g":"","b":[],"q":[{"t":"ولهذا أمرهم الله بالشكر، فقال: ﴿فَلْيَعْبُدُوا رَبَّ هَذَا الْبَيْتِ﴾ أي: ليوحدوه ويخلصوا له العبادة، ﴿الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ خَوْفٍ﴾ فرغد الرزق والأمن من المخاوف، من أكبر النعم الدنيوية، الموجبة لشكر الله تعالى.","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"قريش","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وخص الله بالربوبية البيت ,"lv":["التمكين","التفقّه"],"st":"ثابت","s":"صلة السورة بما قبلها: إهلاك أصحاب الفيل كان لأجل أمن قريش؛ فعظّم الله أمر الحرم وأهله في قلوب العرب حتى لم يعترضوا لهم في أسفارهم.","g":"","b":[],"q":[{"t":"فأهلك الله من أرادهم بسوء، وعظم أمر الحرم وأهله في قلوب العرب، حتى احترموهم، ولم يعترضوا لهم في أي: سفر أرادوا","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"قريش","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m2-mun-fil","a":[1,1],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال البقاعي: لما كان ما فعله سبحانه من منع جيش الفيل من دخول الحرم إنعامًا على قريش، ذكّرهم به في هذه السورة.","g":"","b":[],"q":[{"t":"لما كان ما فعله سبحانه - من منع هذا الجيش العظيم","src":"نظم الدرر","au":"البقاعي","v":"22","p":259,"h":null,"ch":"الهمزة","ed":"نظم الدرر في تناسب الآيات والسور"}]}]},{"name":"التدبر","taf":false,"items":[{"id":"m-tad-shukr","a":[3,4],"lv":["التأسيس","التمكين"],"st":"","s":"الطعام والأمن نعمتان يعيش فيهما الإنسان كل يوم، وشكرهما عبادة الله وحده.","g":"","b":["m-taf-ibada"],"q":[]}]},{"name":"التطبيق","taf":false,"items":[{"id":"m-app-shukr","a":[4,4],"lv":["التأسيس"],"st":"","s":"بعد وجبة واحدة اليوم احمد الله على الطعام، وبعد عودتك إلى بيتك احمده على الأمن.","g":"","b":["m-taf-ibada"],"q":[]}]},{"name":"المقاصد","taf":true,"items":[{"id":"m2-maq-quraysh","a":[1,4],"lv":["التفقّه"],"st":"ثابت","s":"قال ابن عاشور: غرض السورة أمر قريش بتوحيد الله بالربوبية، تذكيرًا لهم بنعمة تمكينهم من التجارة برحلتي الشتاء والصيف آمنين، وبأنه أمّنهم من المجاعات والمخاوف.","g":"","b":[],"q":[{"t":"أَمْرُ قُرَيْشٍ بِتَوْحِيدِ اللَّهِ تَعَالَى بِالرُّبُوبِيَّةِ تَذْكِيرًا لَهُمْ بِنِعْمَةِ أَنَّ اللَّهَ مَكَّنَ لَهُمُ السَّيْرَ فِي الْأَرْضِ لِلتِّجَارَةِ بِرِحْلَتَيِ الشِّتَاءِ وَالصَّيْفِ","src":"التحرير والتنوير","au":"ابن عاشور","v":"30","p":554,"h":null,"ch":"١٠٦- سورة قريش › أغراضها","ed":"تفسير ابن عاشور التحرير والتنوير"}]}]},{"name":"اللغة والإعراب","taf":true,"items":[{"id":"m2-irab-akhfash","a":[1,1],"lv":["التفقّه"],"st":"ثابت","s":"ذكر النحاس أن مذهب الأخفش أن المعنى: فعل بهم ذلك ليؤلف قريشًا.","g":"","b":[],"q":[{"t":"مذهب الأخفش أن المعنى فعل بهم ذلك ليؤلف قريشا.","src":"إعراب القرآن","au":"النحاس","v":"5","p":184,"h":null,"ch":"١٠٦ شرح إعراب سورة لإيلاف (قريش) › [سورة قريش (١٠٦) : الآيات ١ إلى ٢]","ed":"إعراب القرآن للنحاس"}]}]},{"name":"وجه الاستنباط","taf":true,"items":[{"id":"m2-inf-zamanayn","a":[2,2],"lv":["التفقّه"],"st":"ثابت","s":"استنبط القرطبي من ذكر رحلتي الشتاء والصيف جواز تنقّل الرجل في الزمانين بين محلين يكون حاله في كل زمان أنعم.","g":"","b":[],"q":[{"t":"كان فيه دليل على جواز تصرف الرجل في الزمانين بين محلين، يكون حالهما في كل زمان أنعم من الآخر","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"20","p":208,"h":null,"ch":"تفسير سورة قريش › [سورة قريش (١٠٦): آية ٢]","ed":"تفسير القرطبي = الجامع لأحكام القرآن"}]}]},{"name":"أسباب الخلاف","taf":true,"items":[{"id":"m2-rfd-lam-ilaf","a":[1,1],"lv":["التفقّه"],"st":"خلاف معتبر","s":"اختُلف في متعلَّق اللام في ﴿لإيلاف﴾: قال الفراء: بفعل مضمر تقديره «اعجبوا»، وقال الخليل وسيبويه: بقوله ﴿فليعبدوا﴾، وقال الأخفش: بآخر سورة الفيل، وردّه الداني بإجماع المسلمين على الفصل بين السورتين.","g":"","b":[],"q":[{"t":"قال الفراء: اللام في قوله ﷿ ﴿لإيلاف﴾ متعلقة بفعل مضمر، والتقدير: اعجبوا لإيلاف قريش","src":"المكتفى في الوقف والابتدا","au":"الداني","v":null,"p":239,"h":null,"ch":"سورة قريش","ed":"المكتفى في الوقف والابتدا لأبي عمرو الداني"},{"t":"والمعنى عند الخليل وسيبويه: ليعبدوا رب هذا البيت لإيلاف قريش","src":"المكتفى في الوقف والابتدا","au":"الداني","v":null,"p":239,"h":null,"ch":"سورة قريش","ed":"المكتفى في الوقف والابتدا لأبي عمرو الداني"},{"t":"وقال الأخفش: اللام متعلقة بآخر الفيل، والمعنى عنده: فعل بهم ذلك ليؤلف قريشاً. وهذا خطأ بين","src":"المكتفى في الوقف والابتدا","au":"الداني","v":null,"p":239,"h":null,"ch":"سورة قريش","ed":"المكتفى في الوقف والابتدا لأبي عمرو الداني"}]}]}],"gaps":[{"f":"السياق","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"سياق السورة (اتصالها بسورة الفيل) مسجل في المناسبات وأسباب الخلاف."},{"f":"علوم القرآن","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"فصل السورة عن الفيل بالبسملة مسجل في أسباب الخلاف؛ ولا مسألة أخرى من علوم القرآن خاصة بها."},{"f":"الحديث","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يذكر ابن كثير في تفسير سورة قريش حديثًا من الصحيحين، ولم يوجد في مصادر البطاقة حديث مرتبط بها مباشرة."},{"f":"العقيدة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مادة توحيد الربوبية والعبادة مسجلة في المعنى العام والمقاصد."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في مسائل القرطبي الفقهية لهذه السورة وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من آياتها. واستنباط القرطبي في التنقل بين الزمانين مسجل في وجه الاستنباط."},{"f":"السيرة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ما في سيرة ابن هشام عن السورة جاء ضمن قصة الفيل وسُجّل في درس الفيل."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال الفراء والخليل وسيبويه والأخفش مسجلة في أسباب الخلاف."},{"f":"التزكية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يوجد في رياض الصالحين والأذكار نص مرتبط بآيات هذه السورة مباشرة غير ما سُجّل في الحديث والتدبر."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"تحليل الحديث","c":"فجوة مصدر","code":"SOURCE_GAP","note":"حديث أم هانئ (فضل الله قريشًا بسبع خصال) أخرجه الحاكم؛ ولم يوجد حكم عليه في كتب قائمة المصادر. الحكم عليه (تصحيح الحاكم وتعقب الذهبي) مذكور في حاشية محقق تفسير ابن كثير فقط، والمستدرك وتلخيصه ليسا في القائمة."}],"unc":["صحة حديث أم هانئ في نزول السورة في قريش.","قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":[]},{"n":1205,"surah":"الماعون","from":1,"to":7,"title":"سورة الماعون","theme":"ذم من ضيّع حق الله وحقوق عباده: المكذب بالجزاء الذي يدفع اليتيم ولا يحض على إطعام المسكين، والساهي عن صلاته المرائي المانع للماعون.","sections":[{"name":"المفردات","taf":false,"items":[{"id":"m-voc-yadu","a":[2,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«يدُعّ اليتيم»: يدفعه بعنف وجفوة.","g":"","b":[],"q":[{"t":"﴿يَدُعُّ الْيَتِيمَ﴾ يَدْفعه.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":540,"h":null,"ch":"غريب القرآن › سورة الماعون","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"},{"t":"وَالدَّعُّ: الدَّفْعُ بِالْعُنْفِ وَالْجَفْوَةِ.","src":"معالم التنزيل","au":"البغوي","v":"8","p":549,"h":null,"ch":"الماعون › ١","ed":"تفسير البغوي - طيبة"}]},{"id":"m-voc-din","a":[1,1],"lv":["التأسيس"],"st":"ثابت","s":"«يكذب بالدين»: بالجزاء والحساب.","g":"","b":[],"q":[{"t":"وَمَعْنَى \"يُكَذِّبُ بِالدِّينِ\" أَيْ بِالْجَزَاءِ وَالْحِسَابِ.","src":"معالم التنزيل","au":"البغوي","v":"8","p":549,"h":null,"ch":"الماعون › ١","ed":"تفسير البغوي - طيبة"}]}]},{"name":"المعنى الإجمالي","taf":false,"items":[{"id":"m-gen-1","a":[1,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"في السورة الحث على إكرام اليتيم والمساكين، والمحافظة على الصلاة والإخلاص فيها وفي كل عمل، وبذل الأشياء الخفيفة كعارية الإناء والدلو والكتاب.","g":"","b":[],"q":[{"t":"وفي هذه السورة، الحث على إكرام (٦) اليتيم، والمساكين، والتحضيض على ذلك، ومراعاة الصلاة، والمحافظة عليها، وعلى الإخلاص [فيها و] في جميع الأعمال.","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"الماعون","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-mukadhib","a":[1,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الذي يكذب بالبعث والجزاء يدفع اليتيم بعنف ولا يرحمه لقسوة قلبه ولأنه لا يرجو ثوابًا ولا يخشى عقابًا، ولا يحض غيره على إطعام المسكين، فمن باب أولى لا يطعمه بنفسه.","g":"","b":[],"q":[{"t":"﴿أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ﴾ أي: بالبعث والجزاء، فلا يؤمن بما جاءت به الرسل.","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"الماعون","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"﴿فَذَلِكَ الَّذِي يَدُعُّ الْيَتِيمَ﴾ أي: يدفعه بعنف وشدة، ولا يرحمه لقساوة قلبه، ولأنه لا يرجو ثوابًا، ولا يخشى (١) عقابًا.","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"الماعون","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-sahun","a":[4,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿فويل للمصلين الذين هم عن صلاتهم ساهون﴾: مضيّعون لها، تاركون لوقتها، مفوّتون لأركانها. والمذموم السهو عن الصلاة، أما السهو في الصلاة فيقع من كل أحد حتى من النبي ﷺ.","g":"","b":[],"q":[{"t":"﴿عَنْ صَلاتِهِمْ سَاهُونَ﴾ أي: مضيعون لها، تاركون لوقتها، مفوتون لأركانها","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"الماعون","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"والسهو عن الصلاة، هو الذي يستحق صاحبه الذم واللوم (٤) وأما السهو في الصلاة، فهذا يقع من كل أحد، حتى من النبي ﷺ.","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"الماعون","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-riya","a":[6,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿الذين هم يراؤون﴾: يعملون لأجل الناس. ﴿ويمنعون الماعون﴾: يمنعون إعطاء ما لا يضر إعطاؤه عارية أو هبة كالإناء والدلو والفأس؛ فإذا منعوا القليل فكيف بالكثير.","g":"","b":[],"q":[{"t":"﴿الَّذِينَ هُمْ يُرَاءُونَ﴾ أي يعملون الأعمال لأجل رئاء الناس.","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"الماعون","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"﴿وَيَمْنَعُونَ الْمَاعُونَ﴾ أي: يمنعون إعطاء الشيء، الذي لا يضر إعطاؤه على وجه العارية، أو الهبة، كالإناء، والدلو، والفأس، ونحو ذلك، مما جرت العادة ببذلها والسماحة به","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"الماعون","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"أسباب النزول","taf":false,"items":[{"id":"m-asb-maun","a":[1,7],"lv":["التفقّه"],"st":"يحتاج تحققًا","s":"قيل في أول السورة: نزلت في العاص بن وائل (مقاتل والكلبي)، وروى ابن المنذر عن ابن عباس أن ﴿فويل للمصلين﴾ نزلت في المنافقين كانوا يراؤون المؤمنين بصلاتهم ويتركونها إذا غابوا. والروايات تحتاج ت "تفسير السعدي = تيسير الكريم الرحمن"},{"t":"خص هاتين العبادتين بالذكر، لأنهما من أفضل العبادات وأجل القربات.","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"الكوثر","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-kawthar","a":[1,1],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿إنا أعطيناك الكوثر﴾: الخير الكثير والفضل الغزير، ومن جملته النهر الذي يعطيه الله نبيه ﷺ يوم القيامة، والحوض.","g":"","b":[],"q":[{"t":"﴿إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ﴾ أي: الخير الكثير، والفضل الغزير، الذي من جملته، ما يعطيه الله لنبيه ﷺ يوم القيامة، من النهر الذي يقال له ﴿الكوثر﴾ ومن الحوض","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"الكوثر","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-salat","a":[2,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"لما ذكر منّته أمره بشكرها بالصلاة والنحر؛ لأنهما من أفضل العبادات: الصلاة خضوع القلب والجوارح، والنحر تقرب بأفضل ما عند العبد وإخراج لمال تحبه النفوس.","g":"","b":[],"q":[{"t":"ولما ذكر منته عليه، أمره بشكرها فقال: ﴿فَصَلِّ لِرَبِّكَ وَانْحَرْ﴾ خص هاتين العبادتين بالذكر، لأنهما من أفضل العبادات وأجل القربات.","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"الكوثر","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-abtar","a":[3,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿إن شانئك﴾ أي مبغضك وذامك ﴿هو الأبتر﴾ المقطوع من كل خير، مقطوع العمل والذكر، وأما النبي ﷺ فله رفع الذكر وكثرة الأتباع.","g":"","b":[],"q":[{"t":"﴿إِنَّ شَانِئَكَ﴾ أي: مبغضك وذامك ومنتقصك ﴿هُوَ الأبْتَرُ﴾ أي: المقطوع من كل خير، مقطوع العمل، مقطوع الذكر.","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"الكوثر","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"أسباب النزول","taf":false,"items":[{"id":"m-asb-abtar","a":[3,3],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"كانت قريش تسمي من لا ولد ذكر له «أبتر»، ولما مات ابن النبي ﷺ قال بعضهم ذلك، فنزل ﴿إن شانئك هو الأبتر﴾. وأورد السيوطي رواية البزار «بسند صحيح» عن ابن عباس في {"name":"تحليل الحديث","taf":true,"items":[{"id":"m3-ha-sahih","a":[1,6],"lv":["التفقّه"],"st":"ثابت","s":"أحاديث البطاقة (القراءة بها في ركعتي الفجر) مخرّجة في صحيحي البخاري ومسلم، وقال ابن الصلاح: كتاباهما أصح الكتب بعد كتاب الله العزيز؛ فهي ثابتة لا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","g":"","b":[],"q":[{"t":"وكتاباهما أصح الكتب بعد كتاب الله العزيز","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":18,"h":null,"ch":"النوع الأول من أنواع علوم الحديث: معرفة الصحيح من الحديث","ed":"مقدمة ابن الصلاح = معرفة أنواع علوم الحديث - ت عتر"}]}]},{"name":"اللغة والإعراب","taf":true,"items":[{"id":"m2-irab-qul","a":[1,1],"lv":["التفقّه"],"st":"ثابت","s":"قال النحاس: ﴿قل﴾ في موضع جزم عند الفراء على حذف اللام، وهو عند البصريين غير معرب.","g":"","b":[],"q":[{"t":"قُلْ في موضع جزم عند الفراء على حذف اللام","src":"إعراب القرآن","au":"النحاس","v":"5","p":190,"h":null,"ch":"١٠٩ شرح إعراب سورة الكافرين › [سورة الكافرون (١٠٩) : آية ١]","ed":"إعراب القرآن للنحاس"}]}]},{"name":"وجه الاستنباط","taf":true,"items":[{"id":"m3-inf-tahdid","a":[6,6],"lv":["التفقّه"],"st":"ثابت","s":"قال القرطبي: في ﴿لكم دينكم ولي دين﴾ معنى التهديد، أي: إن رضيتم بدينكم فقد رضينا بديننا؛ فالخبر هنا مستعمل في غير معناه الظاهر.","g":"","b":[],"q":[{"t":"لكم دينكم ولي دين (٦) فيه معنى التهديد","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"20","p":229,"h":null,"ch":"تفسير سورة الكافرون › [سورة الكافرون (١٠٩): آية ٦]","ed":"تفسير القرطبي = الجامع لأحكام القرآن"}]}]}],"gaps":[{"f":"المفردات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ألفاظ السورة ظاهرة، ولم يذكر ابن قتيبة في غريبه لفظًا منها يحتاج إلى بيان."},{"f":"المعنى الإجمالي","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"المعنى العام مسجل في التفسير."},{"f":"السياق","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"سياق السورة مسجل في السيرة والمناسبات."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"قول ابن الأنباري في التكرار مسجل في المتشابه."},{"f":"التزكية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يوجد في رياض الصالحين والأذكار نص مرتبط بآيات هذه السورة مباشرة غير ما سُجّل في الحديث والتدبر."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ما في أغراضها عند ابن عاشور هو سبب النزول نفسه، وقد سُجّل من سيرة ابن هشام."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال توجيه التكرار مسجلة في المتشابه؛ ولا خلاف فقهي في السورة."}],"unc":["أسانيد روايات سبب النزول.","قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":[]},{"n":1208,"surah":"النصر","from":1,"to":3,"title":"سورة النصر","theme":"البشارة بنصر الله وفتح مكة ودخول الناس في دين الله أفواجًا، والأمر عند ذلك بالتسبيح والحمد والاستغفار، وفيها إشارة إلى قرب أجل النبي ﷺ.","sections":[{"name":"المعنى الإجمالي","taf":false,"items":[{"id":"m-gen-1","a":[1,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"في السورة بشارة بنصر الله لرسوله وفتح مكة ودخول الناس في دين الله أفواجًا، وقد وقع؛ وأمرٌ بعد حصول ذلك بالشكر: التسبيح بحمد الله والاستغفار.","g":"","b":[],"q":[{"t":"فالبشارة هي البشارة بنصر الله لرسوله، وفتحه مكة، ودخول الناس في دين الله أفواجًا، بحيث يكون كثير منهم من أهله وأنصاره، بعد أن كانوا من أعدائه، وقد وقع هذا المبشر به","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"النصر › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"فأمر رسوله أن يشكر ربه على ذلك، ويسبح بحمده ويستغفره","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"النصر","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-ajal","a":[3,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"في الأمر بالحمد والاستغفار إشارة إلى أن أجل النبي ﷺ قد قرب؛ فالأعمال الفاضلة تُختم بالاستغفار كالصلاة والحج.","g":"","b":[],"q":[{"t":"وقد عهد أن الأمور الفاضلة تختم بالاستغفار، كالصلاة والحج، وغير ذلك.","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"النصر","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"فأمر الله لرسوله بالحمد والاستغفار في هذه الحال، إشارة إلى أن أجله قد انتهى، فليستعد ويتهيأ للقاء ربه","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"النصر","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-shukr-zyada","a":[3,3],"lv":["التمكين"],"st":"ثابت","s":"وفيه إشارة إلى استمرار النصر لهذا الدين وزيادته بالتسبيح والاستغفار، فإنهما من الشكر، والله يقول: ﴿لئن شكرتم لأزيدنكم﴾.","g":"","b":[],"q":[{"t":"إشارة لأن يستمر النصر لهذا الدين (١) ، ويزداد عند حصول التسبيح بحمد الله واستغفاره من رسوله، فإن هذا من الشكر","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"النصر","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"أسباب النزول","taf":false,"items":[{"id":"m-asb-nasr","a":[1,3],"lv":["التفقّه"],"st":"يحتاج تحققًا","s":"في زمن نزولها روايات: قال الواحدي: نزلت منصرف النبي ﷺ من غزوة حنين، وأورد السيوطي عن الزهري أنها نزلت عام الفتح لما دخل الناس في الدين. والروايات تحتاج تحققًا.","g":"رواية تحتاج تحققًا","b":[],"q":[{"t":"نَزَلَتْ فِي مُنْصَرَفِ النَّبِيِّ ﷺ مِنْ غَزْوَةِ حُنَيْنٍ وَعَاشَ بَعْدَ نُزُولِهَا سَنَتَيْنِ.","src":"أسباب النزول","au":"الواحدي","v":null,"p":468,"h":null,"ch":"سورة النصر","ed":"أسباب النزول ت الحميدان"},{"t":"ثم أمر بالسلاح فرفع عنهم فدخلوا في الدين فأنزل الله إذا جاء نصر الله والفتح حتى ختمها.","src":"لباب النقول","au":"السيوطي","v":null,"p":218,"h":null,"ch":"سورة النصر","ed":"لباب النقول"}]}]},{"name":"علوم القرآن","taf":false,"items":[{"id":"m2-qs-tawdi","a":[1,3],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"تسمى السورة أيضًا «سورة التوديع»، وكان ﷺ لما نزلت يقول: نعى الله إليّ نفسي.","g":"","b":[],"q":[{"t":"وَتسَمى أَيْضا سُورَة التوديع","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":256,"h":null,"ch":"سورة النصر","ed":"أسرار التكرار في القرآن = البرهان في توجيه متشابه القرآن"}]}]},{"nam ":"إِذا ظرف زمان نصب بجاء نَصْرُ اللَّهِ رفع بجاء","src":"إعراب القرآن","au":"النحاس","v":"5","p":191,"h":null,"ch":"١١٠ شرح إعراب سورة إذا جاء نصر الله (النصر) › [سورة النصر (١١٠) : آية ١]","ed":"إعراب القرآن للنحاس"}]}]},{"name":"وجه الاستنباط","taf":true,"items":[{"id":"m3-inf-ajal","a":[1,3],"lv":["التفقّه"],"st":"ثابت","s":"فهم ابن عباس من السورة أنها إعلام بأجل رسول الله ﷺ، وأقرّه عمر؛ فهذا استنباط بدلالة الإشارة واللازم، لا بظاهر اللفظ الذي فهمه غيره (الأمر بالحمد والاستغفار عند النصر).","g":"","b":[],"q":[{"t":"هُوَ أَجَلُ رَسُولِ اللهِ ﷺ أَعْلَمَهُ اللهُ لَهُ","src":"صحيح البخاري","au":"البخاري","v":"5","p":149,"h":"4294","ch":"","ed":"صحيح البخاري - ط السلطانية"}]}]},{"name":"أسباب الخلاف","taf":true,"items":[{"id":"m2-rfd-idha","a":[1,3],"lv":["التفقّه"],"st":"خلاف معتبر","s":"اختُلف في الناصب لـ«إذا»: فعل الشرط أو فعل الجواب، وأشهرهما الثاني، وقال بالأول الزمخشري والحوفي، وردّه أبو حيان.","g":"","b":[],"q":[{"t":"وهل الناصب لها فعل الشرط أو فعل الجواب قولان أشهرهما الثاني، وقيل: الأول، قاله الزمخشري والحوفي، وردّ عليهما أبو حيان","src":"منار الهدى","au":"الأشموني","v":"2","p":434,"h":null,"ch":"بيان الوقف والابتداء › سورة النصر","ed":"منار الهدى في بيان الوقف والابتدا ت عبد الرحيم الطرهوني"}]}]}],"gaps":[{"f":"المفردات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ألفاظ السورة ظاهرة، ولم يذكر ابن قتيبة في غريبه لفظًا منها يحتاج إلى بيان."},{"f":"السياق","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"سياق السورة مسجل في المناسبات والمقاصد."},{"f":"العقيدة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يوجد في السورة مسألة عقدية مستقلة غير ما في التفسير."},{"f":"المتشابهات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ليس في البرهان للكرماني لهذه السورة غير تسميتها «سورة التوديع» (مسجل في علوم القرآن)، ولا باب لها في درة التنزيل."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"قول ابن عباس وعمر في تفسيرها مسجل في التفسير والحديث."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":["زمن نزول السورة: بعد حنين أو عام الفتح."]},{"n":1209,"surah":"المسد","from":1,"to":5,"title":"سورة المسد","theme":"ذم أبي لهب وامرأته لعداوتهما للنبي ﷺ، والإخبار بخسارته وعذابهما، وفي السورة آية على صدق النبوة.","sections":[{"name":"المفردات","taf":false,"items":[{"id":"m-voc-tabbat","a":[1,1],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«تبّت»: خسرت.","g":"","b":[],"q":[{"t":"﴿تَبَّتْ﴾ خسرتْ. وقد تقدم ذكر هذا.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":541,"h":null,"ch":"غريب القرآن › سورة اللهب","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-jid","a":[5,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«في جيدها»: في عنقها. «مسد»: ليف.","g":"","b":[],"q":[{"t":"﴿فِي جِيدِهَا﴾ أي: في عُنُقِهَا","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":542,"h":null,"ch":"غريب القرآن › سورة اللهب","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"},{"t":"قد أعد له في عنقه حبلا ﴿مِنْ مَسَدٍ﴾ أي: من ليف.","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"المسد › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"المعنى الإجمالي","taf":false,"items":[{"id":"m2-gm-masad","a":[1,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"ذمّ الله أبا لهب عمّ النبي ﷺ لشدة عداوته، وامرأته التي كانت شديدة الأذية للنبي ﷺ. وفي السورة آية باهرة: نزلت وأبو لهب وامرأته حيّان، وأخبرت أنهما سيعذبان في النار، ومن لازم ذلك أنهما لا يسلمان، فوقع كما أخبر.","g":"","b":[],"q":[{"t":"أبو لهب هو عم النبي ﷺ، وكان شديد العداوة [والأذية] للنبي ﷺ","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"المسد › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"فإن الله أنزل هذه السورة، وأبو لهب وامرأته لم يهلكا، وأخبر أنهما سيعذبان في النار ولا بد، ومن لازم ذلك أنهما لا يسلمان","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"المسد › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-khasira","a":[1,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿تبت يدا أبي لهب﴾ خسرت يداه وشقي ﴿وتب﴾ فلم يربح، ﴿ما أغنى عنه ماله﴾ الذي أطغاه ولا ما كسبه، ﴿سيصلى نارًا ذات لهب﴾ تحيط به من كل جانب.","g":"","b":[],"q":[{"t":"﴿تَبَّتْ يَدَا أَبِي لَهَبٍ﴾ أي: خسرت يداه، وشقى ﴿وَتَبَّ﴾ فلم يربح، ﴿مَا أَغْنَى عَنْهُ مَالُهُ﴾ الذي كان عنده وأطغاه، ولا ما كسبه فلم يرد عنه شيئًا من عذاب الله إذ نزل به، ﴿سَيَصْلَى نَارًا ذَاتَ لَهَبٍ﴾ أي: ستحيط به النار من كل جانب","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"المسد › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-imraa","a":[4,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"كانت امرأته شديدة الأذية للنبي ﷺ تعاون زوجها على الإثم، وتجمع من الأوزار كمن يجمع حطبًا في عنقه حبل من ليف؛ أو أنها تحمل الحطب على زوجها في النار.","g":"","b":[],"q":[{"t":"وكانت أيضًا شديدة الأذية لرسول الله ﷺ، تتعاون هي وزوجها على الإثم والعدوان","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"المسد › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"أو أنها تحمل في النار الحطب على زوجها، متقلدة في عنقها حبلا من مسد","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"المسد › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"السياق","taf":false,"items":[{"id":"m-ctx-abu-lahab","a":[1,1],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"أبو لهب عم النبي ﷺ، وكان شديد العداوة والأذية له، فذمه الله ذمًّا باقيًا إلى يوم القيامة.","g":"","b":[],"q":[{"t":"أبو لهب هو عم النبي ﷺ، وكان شديد العداوة [والأذية] للنبي ﷺ","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"المسد › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"أسباب النزول","taf":false,"items":[{"id":"m-asb-safa","a":[1,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"صعد النبي ﷺ الصفا ونادى قريشًا وقال: «فإني نذير لكم بين يدي عذاب شديد»، فقال أبو لهب: تبًّا لك، ألهذا جمعتنا؟ فأنزل الله: ﴿تبت يدا أبي لهب﴾. رواه البخاري.","g":"سبب ثابت","b":[],"q":[{"t":"قَالَ: فَإِنِّي نَذِيرٌ لَكُمْ بَيْنَ يَدَيْ عَذَابٍ شَدِيدٍ، فَقَالَ أَبُو لَهَبٍ: تَبًّا لَكَ، أَلِهَذَا جَمَعْتَنَا؟ فَأَنْزَلَ اللهُ: ﴿تَبَّتْ يَدَا أَبِي لَهَبٍ﴾».","src":"صحيح البخاري","au":"البخاري","v":"6","p":122,"h":"4801","ch":"","ed":"صحيح البخاري - ط السلطانية"}]}]},{"name":"علوم القرآن","taf":false,"items":[{"id":"m2-qs-masad","a":[1,5],"lv":["التمكين"],"st":"ثابت","s":"سورة المسد مكية.","g":"","b":[],"q":[{"t":"مكية\nولا وقف من أولها إلى «وتب».","src":"منار الهدى","au":"الأشموني","v":"2","p":434,"h":null,"ch":"بيان الوقف والابتداء › سورة تبت","ed":"منار الهدى في بيان الوقف والابتدا ت عبد الرحيم الطرهوني"}]}]},{"name":"العقيدة","taf":false,"items":[{"id":"m-aq-ghayb","a":[1,5],"lv":["التمكين"],"st":"ثابت","s":"في السورة آية باهرة: نزلت وأبو لهب وامرأته حيّان، وأخبرت أنهما في النار، ومن لازم ذلك أنهما لا يُسلمان، فوقع كما أخبر عالم الغيب والشهادة.","g":"","b":[],"q":[{"t":"ففي هذه السورة، آية باهرة من آيات الله، فإن الله أنزل هذه السورة، وأبو لهب وامرأته لم يهلكا، وأخبر أنهما سيعذبان في النار ولا بد، ومن لازم ذلك أنهما لا يسلمان، فوقع كما أخبر عالم الغيب والشهادة.","src":"تفسير السعدي","au":"السعدي","v":null,"p":936,"h":null,"ch":"المسد › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"السيرة","taf":false,"items":[{"id":"m2-sir-shawk","a":[4,4],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"ذكر ابن إسحاق فيما بلغه أن الله سمّى امرأة أبي لهب ﴿حمالة الحطب﴾ لأنها كانت تحمل الشوك فتطرحه على طريق رسول الله ﷺ.","g":"","b":[],"q":[{"t":"وَإِنَّمَا سَمَّاهَا اللَّهُ تَعَالَى حَمَّالَةَ الْحَطَبِ لِأَنَّهَا كَانَتْ -فِيمَا بَلَغَنِي- تَحْمِلُ الشَّوْكَ فَتَطْرَحَهُ عَلَى طَرِيقِ رَسُولِ اللَّهِ ﷺ","src":"السيرة النبوية","au":"ابن هشام","v":"2","p":5,"h":null,"ch":"المجلد: الثاني › المتن","ed":"سيرة ابن هشام - ت طه عبد الرؤوف سع
