يات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":["المراد بـ«حمالة الحطب»."]},{"n":1210,"surah":"الإخلاص","from":1,"to":4,"title":"سورة الإخلاص","theme":"سورة الإخلاص تعرّف بالله: الأحد المنفرد بالكمال، الصمد المقصود في الحوائج، المنزّه عن الولد والوالد والمثيل.","sections":[{"name":"المفردات","taf":false,"items":[{"id":"m-voc-samad","a":[2,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«الصمد»: السيد الذي انتهى سؤدده؛ لأن الناس يقصدونه في حوائجهم.","g":"","b":[],"q":[{"t":"﴿الصَّمَدُ﴾ السَّيد الذي قد انتهى سُودَدُه؛ لأن الناس يَصْمِدُونه في حوائجهم.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":542,"h":null,"ch":"غريب القرآن › سورة الإخلاص","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-kufuw","a":[4,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«كفوًا»: مِثلًا.","g":"","b":[],"q":[{"t":"﴿كُفُوًا﴾ مِثْلا.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":542,"h":null,"ch":"غريب القرآن › سورة الإخلاص","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-ahad","a":[1,1],"lv":["التمكين"],"st":"ثابت","s":"«أحد» أي واحد، ويدل عليه قراءة ابن مسعود: «قل هو الله الواحد».","g":"","b":[],"q":[{"t":"﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾ أَيْ وَاحِدٌ، وَلَا فَرْقَ بَيْنَ الْوَاحِدِ وَالْأَحَدِ، يَدُلُّ عَلَيْهِ قِرَاءَةُ ابْنِ مَسْعُودٍ: قُلْ هُوَ اللَّهُ الْوَاحِدُ","src":"معالم التنزيل","au":"البغوي","v":"8","p":588,"h":null,"ch":"الإخلاص › ١","ed":"تفسير البغوي - طيبة"}]}]},{"name":"المعنى الإجمالي","taf":false,"items":[{"id":"m-gen-1","a":[1,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"هذه السورة مشتملة على توحيد الأسماء والصفات.","g":"","b":[],"q":[{"t":"فهذه السورة مشتملة على توحيد الأسماء والصفات.","src":"تفسير السعدي","au":"السعدي","v":null,"p":937,"h":null,"ch":"الإخلاص › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-ahad","a":[1,1],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿قل﴾ قولًا جازمًا معتقدًا عارفًا بمعناه: ﴿هو الله أحد﴾ أي انحصرت فيه الأحدية، فهو المنفرد بالكمال، له الأسماء الحسنى والصفات العليا، لا نظير له ولا مثيل.","g":"","b":[],"q":[{"t":"أي ﴿قُلْ﴾ قولا جازمًا به، معتقدًا له، عارفًا بمعناه، ﴿هُوَ اللَّهُ أَحَدٌ﴾ أي: قد انحصرت فيه الأحدية، فهو الأحد المنفرد بالكمال، الذي له الأسماء الحسنى، والصفات الكاملة العليا، والأفعال المقدسة، الذي لا نظير له ولا مثيل.","src":"تفسير السعدي","au":"السعدي","v":null,"p":937,"h":null,"ch":"الإخلاص › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-samad","a":[2,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿الله الصمد﴾: المقصود في جميع الحوائج؛ فأهل السماوات والأرض مفتقرون إليه يسألونه حاجاتهم، لأنه الكامل في أوصافه.","g":"","b":[],"q":[{"t":"﴿اللَّهُ الصَّمَدُ﴾ أي: المقصود في جميع الحوائج. فأهل العالم العلوي والسفلي مفتقرون إليه غاية الافتقار، يسألونه حوائجهم، ويرغبون إليه في مهماتهم، لأنه الكامل في أوصافه","src":"تفسير السعدي","au":"السعدي","v":null,"p":937,"h":null,"ch":"الإخلاص › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-lam-yalid","a":[3,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"ومن كماله أنه ﴿لم يلد ولم يولد﴾ لكمال غناه، ﴿ولم يكن له كفوًا أحد﴾ لا في أسمائه ولا أوصافه ولا أفعاله.","g":"","b":[],"q":[{"t":"ومن كماله أنه ﴿لَمْ يَلِدْ وَلَمْ يُولَدْ﴾ لكمال غناه ﴿وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ﴾ لا في أسمائه ولا في أوصافه، ولا في أفعاله","src":"تفسير السعدي","au":"السعدي","v":null,"p":937,"h":null,"ch":"الإخلاص › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"السياق","taf":false,"items":[{"id":"m2-ctx-ikhlas","a":[1,4],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"روى ابن إسحاق أن النبي ﷺ غضب لما سُئل عن الله بما لا يليق، فجاءه جبريل فسكّنه، وجاءه من الله بجواب ما سألوه عنه: ﴿قل هو الله أحد...﴾.","g":"","b":[],"q":[{"t":"فَجَاءَهُ جبريلُ ﵇ فسكَّنه، فَقَالَ: خَفِّضْ عَلَيْكَ يَا مُحَمَّدُ، وَجَاءَهُ مِنْ اللَّهِ بجوابِ مَا سَأَلُوهُ عَنْهُ","src":"السيرة النبوية","au":"ابن هشام","v":"2","p":157,"h":null,"ch":"المجلد: الثاني › المتن","ed":"سيرة ابن هشام - ت طه عبد الرؤوف سعد"}]}]},{"name":"أسباب النزول","taf":false,"items":[{"id":"m-asb-nasab","a":[1,4],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"رُوي عن أُبيّ بن كعب أن المشركين قالوا للنبي ﷺ: انسب لنا ربك، فنزلت السورة. ورُوي أن السائلين كانوا من اليهود. والرواية تحتاج إلى تحقق درجتها.","g":"رواية تحتاج تحققًا","b":[],"q":[{"t":"أخرج الترمذي والحاكم وابن خزيمة من طريق أبي العالية عن أبي بن كعب أن المشركين قالوا لرسول الله ﷺ انسب لنا ربك فأنزل الله قل هو الله أحد إلى آخرها","src":"لباب النقول","au":"السيوطي","v":null,"p":219,"h":null,"ch":"سورة الاخلاص","ed":"لباب النقول"},{"t":"جَاءَ نَاسٌ مَنِ الْيَهُودِ إِلَى النَّبِيِّ ﷺ فَقَالُوا: صِفْ لَنَا رَبَّكَ","src":"أسباب النزول","au":"الواحدي","v":null,"p":471,"h":null,"ch":"سورة الإخلاص","ed":"أسباب النزول ت الحميدان"}]}]},{"name":"علوم القرآن","taf":false,"items":[{"id":"m-qs-makki","a":[1,4],"lv":["التفقّه"],"st":"خلاف معتبر","s":"اختُلف في مكيتها ومدنيتها بحسب روايات سبب النزول: فمن جعل السائلين المشركين عدّها مكية، ومن جعلهم اليهود عدّها مدنية. والبغوي يعدّها مكية.","g":"","b":[],"q":[{"t":"فاستدل بها على أن السورة مكية","src":"لباب النقول","au":"السيوطي","v":null,"p":219,"h":null,"ch":"سورة الاخلاص","ed":"لباب النقول"},{"t":"فاستدل بهذا على أنها مدنية","src":"لباب النقول","au":"السيوطي","v":null,"p":219,"h":null,"ch":"سورة الاخلاص","ed":"لباب النقول"},{"t":"مَكِّيَّةٌ\nبِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\n﴿قُلْ هُوَ اللَّهُ أَحَدٌ (١) اللَّهُ الصَّمَدُ (٢) ﴾","src":"معالم التنزيل","au":"البغوي","v":"8","p":584,"h":null,"ch":"الإخلاص","ed":"تفسير البغوي - طيبة"}]}]},{"name":"الحديث","taf":false,"items":[{"id":"m-had-thuluth","a":[1,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"سمع رجل رجلًا يردد ﴿قل هو الله أحد﴾ وكأنه يستقلها، فقال النبي ﷺ: «والذي نفسي بيده إنها لتعدل ثلث القرآن».","g":"","b":[],"q":[{"t":"وَكَأَنَّ الرَّجُلَ يَتَقَالُّهَا، فَقَالَ رَسُولُ اللهِ ﷺ: وَالَّذِي نَفْسِي بِيَدِهِ، إِنَّهَا لَتَعْدِلُ ثُلُثَ الْقُرْآنِ».","src":"صحيح البخاري","au":"البخاري","v":"6","p":189,"h":"5013","ch":"","ed":"صحيح البخاري - ط السلطانية"}]},{"id":"m-had-qudsi","a":[1,4],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"في الحديث القدسي: «... وأما شتمه إياي فقوله: اتخذ الله ولدًا، وأنا الأحد الصمد، لم ألد ولم أولد، ولم يكن لي كفؤًا أحد».","g":"","b":[],"q":[{"t":"وَأَمَّا شَتْمُهُ إِيَّايَ فَقَوْلُهُ: اتَّخَذَ اللهُ وَلَدًا، وَأَنَا الْأَحَدُ الصَّمَدُ، لَمْ أَلِدْ وَلَمْ أُولَدْ، وَلَمْ يَكُنْ لِي كُفْأ أَحَدٌ».","src":"صحيح البخاري","au":"البخاري","v":"6","p":180,"h":"4974","ch":"","ed":"صحيح البخاري - ط السلطانية"}]},{"id":"m-had-bedtime","a":[1,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"كان النبي ﷺ إذا أوى إلى فراشه كل ليلة جمع كفيه ونفث فيهما وقرأ الإخلاص والمعوذتين، ثم مسح بهما ما استطاع من جسده، يفعل ذلك ثلاث مرات.","g":"","b":[],"q":[{"t":"«كَانَ إِذَا أَوَى إِلَى فِرَاشِهِ كُلَّ لَيْلَةٍ، جَمَعَ كَفَّيْهِ ثُمَّ نَفَثَ فِيهِمَا، فَقَرَأَ فِيهِمَا: ﴿قُلْ هُوَ اللهُ أَحَدٌ﴾، وَ ﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ﴾، وَ ﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ﴾، ثُمَّ يَمْسَحُ بِهِمَا مَا اسْتَطَاعَ مِنْ جَسَدِهِ، يَبْدَأُ بِهِمَا عَلَى رَأْسِهِ وَوَجْهِهِ، وَمَا أَقْبَلَ مِنْ جَسَدِهِ، يَفْعَلُ ذَلِكَ ثَلَاثَ مَرَّاتٍ».","src":"صحيح البخاري","au":"البخاري","v":"6","p":190,"h":"5017","ch":"","ed":"صحيح البخاري - ط السلطانية"}]}]},{"name":"العقيدة","taf":false,"items":[{"id":"m-aq-sifat","a":[1,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"السورة في توحيد الأسماء والصفات: إثبات الأحدية والصمدية لله، ونفي الولد والوالد والكفء عنه.","g":"","b":[],"q":[{"t":"فهذه السورة مشتملة على توحيد الأسماء والصفات.","src":"تفسير السعدي","au":"السعدي","v":null,"p":937,"h":null,"ch":"الإخلاص › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-aq-radd","a":[3,4],"lv":["التمكين"],"st":"ثابت","s":"نفت الآيات ما نسبه المشركون واليهود والنصارى إلى الله من الولد، فنفى الله عن ذاته الولادة والمثل.","g":"","b":[],"q":[{"t":"قَالَ مُقَاتِلٌ: قَالَ مُشْرِكُو الْعَرَبِ: الْمَلَائِكَةُ بَنَاتُ اللَّهِ، وَقَالَتِ الْيَهُودُ: عُزَيْرٌ ابْنُ اللَّهِ، وَقَالَتِ النَّصَارَى: الْمَسِيحُ ابْنُ اللَّهِ، فَأَكْذَبَهُمُ اللَّهُ وَنَفَى عَنْ ذَاتِهِ الْوِلَادَةَ وَالْمِثْلَ","src":"معالم التنزيل","au":"البغوي","v":"8","p":589,"h":null,"ch":"الإخلاص › ٣","ed":"تفسير البغوي - طيبة"}]}]},{"name":"التجويد","taf":false,"items":[{"id":"m2-tj-kufuwan","a":[4,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإظهار: النون الساكنة والتنوين قبل أحد حروف الحلق الستة تُنطق واضحة بلا غنة زائدة. مثاله في الدرس: ﴿كُفُوًا أَحَدٌ﴾.","g":"","b":[],"q":[{"t":"فَالأَوَّلُ الإظْهَارُ قَبْلَ أَحْرُفِ ... لِلْحَلْقِ سِتٌّ رُتِّبَتْ فَلْتَعْرِفِ","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":2,"h":null,"ch":"أحكام النون الساكنة والتنوين","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}]},{"id":"m2-tj-lam-yalid","a":[3,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإظهار الشفوي: الميم الساكنة قبل غير الباء والميم تُظهر. مثاله في الدرس: ﴿لَمْ يَلِدْ﴾.","g":"","b":[],"q":[{"t":"وَالثَّالِثُ الإِظْهَارُ فِي الْبَقِيَّهْ ... مِنْ أَحْرُفٍ وَسَمِّهَا شَفْوِيَّهْ","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":4,"h":null,"ch":"أحكام الميم الساكنة","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}]}]},{"name":"الوقف والابتداء","taf":false,"items":[{"id":"m2-waqf-ikhlas","a":[1,4],"lv":["التمكين"],"st":"ثابت","s":"قال الأخفش وغيره: لا وقف في السورة دون آخرها، لأنها جواب أُمر النبي ﷺ أن يقرأه كله، والوقف على رأس كل آية حسن. وكان أبو عمرو يقف على ﴿أحد﴾ ثم يبتدئ ﴿الله الصمد﴾.","g":"","b":[],"q":[{"t":"قال الأخفش وغيره لا وقف فيها دون آخرها؛ لأنَّ الله أمر نبيه أن يقرأها كلها، فهي جواب، ومقصود الجواب، والوقف على رأس كل آية حسن.","src":"منار الهدى","au":"الأشموني","v":"2","p":435,"h":null,"ch":"بيان الوقف والابتداء › سورة الإخلاص","ed":"منار الهدى في بيان الوقف والابتدا ت عبد الرحيم الطرهوني"},{"t":"قال أبو عمرو: أدركت القراء يقرأونها ((أحد. الله الصمد)) . قال أبو عمرو: فإن وصلت نونت.","src":"المكتفى في الوقف والابتدا","au":"الداني","v":null,"p":244,"h":null,"ch":"سورة الإخلاص","ed":"المكتفى في الوقف والابتدا لأبي عمرو الداني"}]}]},{"name":"القراءات","taf":false,"items":[{"id":"m-qir-kufuw","a":[4,4],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قرأ حمزة «كُفْؤًا» بسكون الفاء مع الهمز، وقرأ حفص عن عاصم ﴿كُفُوًا﴾ بضم الفاء بلا همز، وقرأ الباقون بضم الفاء مع الهمز، ومعنى الجميع: المثل.","g":"","b":[],"q":[{"t":"قَرَأَ حَمْزَةُ وَإِسْمَاعِيلُ: \"كُفْؤًا\" سَاكِنَةُ الْفَاءِ مَهْمُوزًا، وَقَرَأَ حَفْصٌ عَنْ عَاصِمٍ بِضَمِّ الْفَاءِ مِنْ غَيْرِ هَمْزٍ، وَقَرَأَ الْآخَرُونَ بِضَمِّ الْفَاءِ مَهْمُوزًا، وَكُلُّهَا لُغَاتٌ صَحِيحَةٌ","src":"معالم التنزيل","au":"البغوي","v":"8","p":588,"h":null,"ch":"الإخلاص › ٣","ed":"تفسير البغوي - طيبة"}]}]},{"name":"المتشابهات","taf":false,"items":[{"id":"m2-mut-allah","a":[1,2],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال الكرماني: كُرر لفظ الجلالة في ﴿الله أحد﴾ و﴿الله الصمد﴾ لتكون كل جملة مستقلة بذاتها غير محتاجة إلى ما قبلها.","g":"","b":[],"q":[{"t":"كرر لتَكون كل جملَة مِنْهُمَا مُسْتَقلَّة بذاتها غير محتاجة إِلَى مَا قبلهَا","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":257,"h":null,"ch":"سورة الإخلاص","ed":"أسرار التكرار في القرآن = البرهان في توجيه متشابه القرآن"}]},{"id":"m2-mut-ahad","a":[1,1],"lv":["التفقّه"],"st":"ثابت","s":"ناقش ابن الزبير الفرق بين «أحد» و«واحد»: فـ«واحد» يؤنث ويجمع ويقع تابعًا، و«أحد» لا يُلحق علامة تأنيث ولا يجمع ولا يقع تابعًا إلا نادرًا.","g":"","b":[],"q":[{"t":"وقد أوضح الاعتبار الفرق بين أحد وواحد من جهة اللفظ وحكمه ومن جهة المعنى.","src":"ملاك التأويل","au":"ابن الزبير الغرناطي","v":"2","p":514,"h":null,"ch":"سورة الإخلاص","ed":"ملاك التأويل القاطع بذوي الإلحاد والتعطيل"},{"t":"وأما أحد فلم يلحقوه علامة تأنيث ولا جمعوه.","src":"ملاك التأويل","au":"ابن الزبير الغرناطي","v":"2","p":514,"h":null,"ch":"سورة الإخلاص","ed":"ملاك التأويل القاطع بذوي الإلحاد والتعطيل"}]}]},{"name":"المناسبات","taf":false,"items":[{"id":"m2-mun-ikhlas","a":[1,1],"lv":["التفقّه"],"st":"ثابت","s":"قال البقاعي: لما كان المقصود من القرآن دعوة العباد إلى المعبود، وكان المدعو إلى شيء أحوج ما يكون إلى معرفته، جاءت هذه السورة في التعريف بالله.","g":"","b":[],"q":[{"t":"ولما كان المقصود من القرآن دعوة العباد إلى المعبود، وكان المدعو إلى شيء أحوج ما يكون إلى معرفته","src":"نظم الدرر","au":"البقاعي","v":"22","p":348,"h":null,"ch":"الكوثر","ed":"نظم الدرر في تناسب الآيات والسور"}]}]},{"name":"أقوال العلماء","taf":false,"items":[{"id":"m-sch-samad","a":[2,2],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"للسلف في «الصمد» أقوال: الذي لا جوف له (ابن عباس ومجاهد والحسن وسعيد بن جبير)، والسيد الذي كمل سؤدده (أبو وائل، ورواية عن ابن عباس)، والمقصود إليه في الرغائب (السدي)، والباقي بعد فناء خلقه (قتادة).","g":"","b":[],"q":[{"t":"قَالَ ابْنُ عَبَّاسٍ، وَمُجَاهِدٌ وَالْحَسَنُ وَسَعِيدُ بْنُ جُبَيْرٍ: \"الصَّمَدُ\" الَّذِي لَا جَوْفَ لَهُ.","src":"معالم التنزيل","au":"البغوي","v":"8","p":588,"h":null,"ch":"الإخلاص › ١","ed":"تفسير البغوي - طيبة"},{"t":"قَالَ أَبُو وَائِلٍ شَقِيقُ بْنُ سَلَمَةَ: هُوَ السَّيِّدُ الَّذِي قَدِ انْتَهَى سُؤْدُدُهُ، وَهُوَ رِوَايَةُ عَلِيِّ بْنِ أَبِي طَلْحَةَ عَنِ ابْنِ عَبَّاسٍ","src":"معالم التنزيل","au":"البغوي","v":"8","p":588,"h":null,"ch":"الإخلاص › ١","ed":"تفسير البغوي - طيبة"},{"t":"هُوَ الْمَقْصُودُ إِلَيْهِ فِي الرَّغَائِبِ الْمُسْتَغَاثُ بِهِ عِنْدَ الْمَصَائِبِ","src":"معالم التنزيل","au":"البغوي","v":"8","p":588,"h":null,"ch":"الإخلاص › ٣","ed":"تفسير البغوي - طيبة"},{"t":"وَقَالَ قَتَادَةُ: \"الصَّمَدُ\" الْبَاقِي بَعْدَ فَنَاءِ خَلْقِهِ.","src":"معالم التنزيل","au":"البغوي","v":"8","p":588,"h":null,"ch":"الإخلاص › ٣","ed":"تفسير البغوي - طيبة"}]}]},{"name":"التدبر","taf":false,"items":[{"id":"m-tad-need","a":[2,2],"lv":["التأسيس","التمكين"],"st":"","s":"إذا كان الله هو المقصود في كل حاجة، فالقلب يتوجه إليه أولًا في حاجاته الصغيرة والكبيرة.","g":"","b":["m-taf-samad"],"q":[]},{"id":"m-tad-love","a":[1,4],"lv":["التأسيس"],"st":"","s":"سورة قصيرة تعدل ثلث القرآن؛ ففهم معانيها يعطي تلاوتها قدرها.","g":"","b":["m-had-thuluth","m-gen-1"],"q":[]}]},{"name":"التطبيق","taf":false,"items":[{"id":"m-app-bedtime"," -falaq","a":[1,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قل متعوذًا: ألجأ وأعتصم برب الفلق، فالق الحب والنوى وفالق الإصباح، من شر جميع ما خلق، ثم خص بعد العموم: شر الليل إذا أظلم، وشر السواحر، وشر الحاسد.","g":"","b":[],"q":[{"t":"أي: ﴿قل﴾ متعوذًا ﴿أَعُوذُ﴾ أي: ألجأ وألوذ، وأعتصم ﴿بِرَبِّ الْفَلَقِ﴾ أي: فالق الحب والنوى، وفالق الإصباح.","src":"تفسير السعدي","au":"السعدي","v":null,"p":937,"h":null,"ch":"الفلق","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وهذا يشمل جميع ما خلق الله، من إنس، وجن، وحيوانات، فيستعاذ بخالقها، من الشر الذي فيها، ثم خص بعد ما عم","src":"تفسير السعدي","au":"السعدي","v":null,"p":937,"h":null,"ch":"الفلق","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-rabb-falaq","a":[1,1],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿قل أعوذ برب الفلق﴾: ألجأ وأعتصم بفالق الحب والنوى وفالق الإصباح.","g":"","b":[],"q":[{"t":"أي: ﴿قل﴾ متعوذًا ﴿أَعُوذُ﴾ أي: ألجأ وألوذ، وأعتصم ﴿بِرَبِّ الْفَلَقِ﴾ أي: فالق الحب والنوى، وفالق الإصباح.","src":"تفسير السعدي","au":"السعدي","v":null,"p":937,"h":null,"ch":"الفلق","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-ma-khalaq","a":[2,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿من شر ما خلق﴾ يشمل كل المخلوقات، ثم خص بعد العموم شر الليل حين يغشى الناس، وتنتشر فيه الأرواح الشريرة والحيوانات المؤذية.","g":"","b":[],"q":[{"t":"﴿مِنْ شَرِّ مَا خَلَقَ﴾ وهذا يشمل جميع ما خلق الله، من إنس، وجن، وحيوانات، فيستعاذ بخالقها، من الشر الذي فيها، ثم خص بعد ما عم، فقال: ﴿وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ﴾ أي: من شر ما يكون في الليل، حين يغشى الناس، وتنتشر فيه كثير من الأرواح الشريرة، والحيوانات المؤذية.","src":"تفسير السعدي","au":"السعدي","v":null,"p":937,"h":null,"ch":"الفلق","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-naffathat","a":[4,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿ومن شر النفاثات في العقد﴾: من شر السواحر اللاتي يستعنّ على سحرهن بالنفث في العقد.","g":"","b":[],"q":[{"t":"﴿وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ﴾ أي: ومن شر السواحر، الل إله لما كُلّف بالعبادة.","g":"","b":[],"q":[{"t":"إنما اتصف الله تعالى أولا برب الناس، ثم ب (ملك الناس، ثم بإله الناس","src":"درة التنزيل","au":"الخطيب الإسكافي","v":"1","p":1372,"h":null,"ch":"سورة الناس","ed":"درة التنزيل وغرة التأويل"},{"t":"لأن ربّ الشيء هو القائم بإصلاحه وتدبير أمره","src":"درة التنزيل","au":"الخطيب الإسكافي","v":"1","p":1372,"h":null,"ch":"سورة الناس","ed":"درة التنزيل وغرة التأويل"}]},{"id":"m2-mut-nas-takrar","a":[1,6],"lv":["التفقّه"],"st":"ثابت","s":"وقال الكرماني: كُرر ﴿الناس﴾ خمس مرات؛ قيل تبجيلًا لهم، وقيل لانفصال كل آية من الأخرى لعدم حرف العطف.","g":"","b":[],"q":[{"t":"ثمَّ كرر النَّاس خمس مَرَّات قيل كرر تبجيلا لَهُم على مَا سبق وَقيل كررلانفصال كل آيَة من الْأُخْرَى لعدم حرف الْعَطف","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":"257-258","h":null,"ch":"سورة الناس","ed":"أسرار التكرار في القرآن = البرهان في توجيه متشابه القرآن"}]}]},{"name":"المناسبات","taf":false,"items":[{"id":"m2-mun-nas","a":[1,1],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال البقاعي: لما جاءت سورة الفلق للاستعاذة من شر ما خلق من المضار البدنية وغيرها، جاءت سورة الناس لما يخص الباطن.","g":"","b":[],"q":[{"t":"لما جاءت سورة الفلق للاستعاذة من شر ما خلق من جميع المضار البدنية وغيرها العامة للإنسان وغيره","src":"نظم الدرر","au":"البقاعي","v":"22","p":424,"h":null,"ch":"الكوثر","ed":"نظم الدرر في تناسب الآيات والسور"}]}]},{"name":"التدبر","taf":false,"items":[{"id":"m-tad-dhikr","a":[4,4],"lv":["التأسيس","التمكين"],"st":"","s":"الوسواس يتأخر عند ذكر الله؛ فذكر الله هو ما يدفع الوسوسة.","g":"","b":["m-taf-waswas","m-voc-khannas"],"q":[]}]},{"name":"التطبيق","taf":false,"items":[{"id":"m-app-dhikr","a":[4,6],"lv":["التأسيس","التمكين"],"st":"","s":"إذا شعرت بدافع إلى شر أو تثبيط عن خير اليوم، فاذكر الله واقرأ سورة الناس.","g":"","b":["m-taf-waswas"],"q":[]}]},{"name":"المقاصد","taf":true,"items":[{"id":"m2-maq-nas","a":[1,6],"lv":["التفقّه"],"st":"ثابت","s":"قال ابن عاشور: السورة إرشاد النبي ﷺ لأن يتعوذ بالله من شر الوسواس الذي يحاول إفساد عمله وإرشاده، ويتبع ذلك تعليم المسلمين التعوذ بذلك.","g":"","b":[],"q":[{"t":"إِرْشَادُ النَّبِيءِ ﷺ لِأَنْ يَتَعَوَّذَ بِاللَّهِ رَبِّهِ مِنْ شَرِّ الْوَسْوَاسِ","src":"التحرير والتنوير","au":"ابن عاشور","v":"30","p":632,"h":null,"ch":"١١٤- سورة الناس › أغراضها","ed":"تفسير ابن عاشور التحرير والتنوير"},{"t":"وَيَتْبَعُ ذَلِكَ تَعْلِيمُ الْمُسْلِمِينَ التَّعَوُّذَ بِذَلِكَ","src":"التحرير والتنوير","au":"ابن عاشور","v":"30","p":632,"h":null,"ch":"١١٤- سورة الناس › أغراضها","ed":"تفسير ابن عاشور التحرير والتنوير"}]}]},{"name":"تحليل الحديث","taf":true,"items":[{"id":"m3-ha-sahih","a":[1,6],"lv":["التفقّه"],"st":"ثابت","s":"أحاديث البطاقة (آيات لم يُر مثلهن، وقراءتها عند النوم) مخرّجة في صحيحي البخاري ومسلم، وقال ابن الصلاح: كتاباهما أصح الكتب بعد كتاب الله العزيز؛ فهي ثابتة لا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","g":"","b":[],"q":[{"t":"وكتاباهما أصح الكتب بعد كتاب الله العزيز","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":18,"h":null,"ch":"النوع الأول من أنواع علوم الحديث: معرفة الصحيح من الحديث","ed":"مقدمة ابن الصلاح = معرفة أنواع علوم الحديث - ت عتر"}]},{"id":"m3-ha-sihr","a":[1,6],"lv":["التفقّه"],"st":"يحتاج تحققًا","s":"قصة سبب نزول المعوذتين المفصلة أوردها الثعلبي بلا إسناد؛ قال ابن كثير: فيها غرابة، وفي بعضها نكارة شديدة، ولبعضها شواهد.","g":"","b":[],"q":[{"t":"هكذا أورده بلا إسناد، وفيه [غرابة]","src":"تفسير ابن كثير","au":"ابن كثير","v":"7","p":710,"h":null,"ch":"","ed":"تفسير ابن كثير - ط ابن الجوزي"},{"t":"وفي بعضه نكارة شديدة، ولبعضه شواهد مما تقدم","src":"تفسير ابن كثير","au":"ابن كثير","v":"7","p":710,"h":null,"ch":"","ed":"تفسير ابن كثير - ط ابن الجوزي"}]}]},{"name":"اللغة والإعراب","taf":true,"items":[{"id":"m2-irab-nas","a":[1,1],"lv":["التفقّه"],"st":"ثابت","s":"قال النحاس: الأصل في ﴿الناس﴾ عند سيبويه «أناس»، والألف واللام بدل من الهمزة.","g":"","b":[],"q":[{"t":"الأصل عند سيبويه أناس والألف واللام بدل من الهمزة.","src":"إعراب القرآن","au":"النحاس","v":"5","p":199,"h":null,"ch":"١١٤ شرح إعراب سورة الناس › [سورة الناس (١١٤) : آية ١]","ed":"إعراب القرآن للنحاس"}]}]},{"name":"وجه الاستنباط","taf":true,"items":[{"id":"m3-inf-jinna","a":[6,6],"lv":["التفقّه"],"st":"ثابت","s":"استنبط السعدي من ﴿من الجنة والناس﴾ أن الوسواس كما يكون من الجن يكون من الإنس.","g":"","b":[],"q":[{"t":"والوسواس كما يكون من الجن يكون من الإنس، ولهذا قال: ﴿مِنَ الْجِنَّةِ وَالنَّاسِ﴾","src":"تفسير السعدي","au":"السعدي","v":null,"p":937,"h":null,"ch":"الناس","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]}],"gaps":[{"f":"السياق","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"سياق السورة مسجل في المناسبات."},{"f":"علوم القرآن","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"عدّ ﴿الخناس﴾ رأس آية في المكي والشامي مسجل في الوقف؛ ولا مسألة أخرى من علوم القرآن خاصة بها."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في مسائل القرطبي الفقهية لهذه السورة وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من آياتها."},{"f":"السيرة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في سيرة ابن هشام عن آيات هذه السورة، ولم توجد مادة مرتبطة بها."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في ﴿الوسواس الخناس﴾ مسجلة في التفسير منسوبة إلى أصحابها."},{"f":"التزكية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يوجد في رياض الصالحين والأذكار نص مرتبط بآيات هذه السورة مباشرة غير ما سُجّل في الحديث والتدبر."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"خلاف إعراب ﴿الذي يوسوس﴾ وأثره في الوقف مسجل في الوقف."}],"unc":["صحة ربط نزول المعوذتين بقصة السحر.","قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":[]}]</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const key = (n, id) => 'L' + n + '~' + id;
  const state = new Map();          // key -> {state, note}
  let db = null, writable = true, filter = 'all', section = null;
  let current = DATA[0].n;
  try { const h = location.hash.replace('#l', ''); if (DATA.some(l => String(l.n) === h)) current = +h;
        else { const s = localStorage.getItem('basira-lesson'); if (s && DATA.some(l => String(l.n) === s)) current = +s; } } catch (e) {}

  const $ = (tag, cls, text) => { const el = document.createElement(tag); if (cls) el.className = cls; if (text != null) el.textContent = text; return el; };
  const total = DATA.reduce((a, l) => a + l.sections.reduce((b, s) => b + s.items.length, 0), 0);
  const counts = l => { let o = 0, f = 0, t = 0; l.sections.forEach(s => s.items.forEach(it => { t++; const st = state.get(key(l.n, it.id)); if (st && st.state === 'ok') o++; else if (st && st.state === 'fix') f++; })); return {o, f, t}; };

  const secCount = (l, s) => { let d = 0; s.items.forEach(it => { const st = state.get(key(l.n, it.id)); if (st && st.state) d++; }); return d; };
  function pickSection(name){ section = name; render(); window.scrollTo({top: 0}); }
  function renderSections(l){
    const nav = document.getElementById('sections'); nav.textContent = '';
    if (section !== 'all' && !l.sections.some(s => s.name === section)) section = l.sections[0].name;
    const chip = (name, label, done, total) => {
      const b = $('button', 'sec-chip'); b.type = 'button';
      b.setAttribute('aria-pressed', String(section === name));
      if (total && done === total) b.classList.add('done');
      b.append($('span', null, label), $('small', null, AR(done) + '/' + AR(total)));
      b.addEventListener('click', () => pickSection(name));
      nav.append(b);
      if (section === name) requestAnimationFrame(() => b.scrollIntoView({block: 'nearest', inline: 'center'}));
    };
    const all = l.sections.reduce((a, s) => a + s.items.length, 0), allDone = l.sections.reduce((a, s) => a + secCount(l, s), 0);
    l.sections.forEach(s => chip(s.name, s.name + (s.taf ? ' (تفقّه)' : ''), secCount(l, s), s.items.length));
    chip('all', 'كل الأقسام', allDone, all);
  }
  function where(q){
    const parts = [];
    if (q.v) parts.push('ج' + AR(q.v));
    if (q.p != null) parts.push('ص' + AR(q.p));
    if (q.h) parts.push('رقم ' + AR(q.h));
    return parts.join(' ');
  }

  function renderNav(){
    const nav = document.getElementById('lessons'); nav.textContent = '';
    let allO = 0, allF = 0;
    DATA.forEach(l => {
      const c = counts(l); allO += c.o; allF += c.f;
      const b = $('button', 'lesson-chip'); b.type = 'button';
      b.setAttribute('aria-current', String(l.n === current));
      if (c.o === c.t) b.classList.add('done');
      b.append($('span', null, l.surah + ' ' + AR(l.from) + '–' + AR(l.to)), $('small', null, AR(c.o + c.f) + ' / ' + AR(c.t)));
      const bar = $('span', 'bar'), i = $('i'); i.style.width = ((c.o + c.f) / c.t * 100) + '%'; bar.append(i); b.append(bar);
      b.addEventListener('click', () => { current = l.n; section = null; try { localStorage.setItem('basira-lesson', String(l.n)); } catch (e) {} history.replaceState(null, '', '#l' + l.n); render(); window.scrollTo({top: 0}); });
      nav.append(b);
      if (l.n === current) requestAnimationFrame(() => b.scrollIntoView({block: 'nearest', inline: 'center'}));
    });
    document.getElementById('overall').innerHTML = '';
    const ov = document.getElementById('overall');
    ov.append('صحيح ', $('b', null, AR(allO)), ' · يحتاج تعديل ', $('b', null, AR(allF)), ' · من ', $('b', null, AR(total)));
  }

  const noteTimers = new Map();
  const STORE = 'basira-review-v1';
  function persist(){ try { localStorage.setItem(STORE, JSON.stringify([...state])); } catch (e) { showNotice('المتصفح لا يسمح بالحفظ هنا؛ انسخ النتائج قبل إغلاق الصفحة.'); } }
  async function save(k, lesson, id, patch){
    const prev = state.get(k) || {state: '', note: ''};
    state.set(k, Object.assign({}, prev, patch, {lesson, entry: id}));
    persist();
  }
  function showNotice(t){ const n = document.getElementById('notice'); n.textContent = t; n.hidden = false; }

  function renderItem(l, it){
    const k = key(l.n, it.id), st = state.get(k) || {state: '', note: ''};
    const a = $('article', 'item'); a.dataset.state = st.state;
    a.append($('p', 'summary', it.s));
    const meta = $('div', 'meta');
    meta.append($('span', null, 'الآيات ' + AR(it.a[0]) + (it.a[1] !== it.a[0] ? '–' + AR(it.a[1]) : '')), $('span', null, it.lv.join(' / ')));
    if (it.st) meta.append($('span', null, it.st));
    if (it.g) meta.append($('span', null, 'درجة السبب: ' + it.g));
    meta.append($('span', 'id', it.id));
    a.append(meta);
    it.q.forEach(q => {
      const bq = $('blockquote', null, q.t);
      const c = $('div', 'cite');
      c.append($('b', null, q.src), ' — ' + q.au + (where(q) ? '، ' + where(q) : ''), q.ch ? ' · ' + q.ch : '', q.ed ? ' · ط: ' + q.ed : '');
      bq.append(c); a.append(bq);
    });
    if (it.b.length) a.append($('p', 'based', 'مبني على: ' + it.b.join('، ') + ' — لا ينقل من كتاب؛ راجِع أنه لا يزيد على المادة التي بُني عليها.'));
    const act = $('div', 'actions');
    const ok = $('button', 'ok', '✓ صحيح'), fix = $('button', 'fix', 'يحتاج تعديل');
    ok.type = fix.type = 'button';
    ok.setAttribute('aria-pressed', String(st.state === 'ok')); fix.setAttribute('aria-pressed', String(st.state === 'fix'));
    const saved = $('span', 'saved');
    const ta = $('textarea'); ta.id = 'n-' + k; ta.placeholder = 'ملاحظتك: ما الخطأ، وما الصواب، ومن أي موضع'; ta.value = st.note || '';
    ta.hidden = !(st.state === 'fix' || st.note);
    const setState = s => {
      const cur = (state.get(k) || {}).state || '';
      const nextS = cur === s ? '' : s;
      save(k, l.n, it.id, {state: nextS}).then(() => { saved.textContent = db && writable ? 'حُفظ' : ''; });
      a.dataset.state = nextS; ok.setAttribute('aria-pressed', String(nextS === 'ok')); fix.setAttribute('aria-pressed', String(nextS === 'fix'));
      ta.hidden = !(nextS === 'fix' || ta.value); if (nextS === 'fix') ta.focus();
      renderNav(); renderProgress(l); renderSections(l);
    };
    ok.addEventListener('click', () => setState('ok'));
    fix.addEventListener('click', () => setState('fix'));
    ta.addEventListener('input', () => {
      saved.textContent = '…';
      clearTimeout(noteTimers.get(k));
      noteTimers.set(k, setTimeout(() => save(k, l.n, it.id, {note: ta.value}).then(() => { saved.textContent = db && writable ? 'حُفظت الملاحظة' : ''; }), 900));
    });
    act.append(ok, fix, saved);
    a.append(act, ta);
    return a;
  }

  function renderProgress(l){
    const p = document.getElementById('progress'); if (!p) return;
    const c = counts(l); p.textContent = '';
    const tr = $('div', 'track'), o = $('i', 'o'), f = $('i', 'f');
    o.style.width = (c.o / c.t * 100) + '%'; f.style.width = (c.f / c.t * 100) + '%'; tr.append(o, f);
    p.append(tr, $('span', null, AR(c.o + c.f) + ' من ' + AR(c.t)));
  }

  function render(){
    renderNav();
    const l = DATA.find(x => x.n === current), root = document.getElementById('lesson'); root.textContent = '';
    const head = $('div', 'lesson-head');
    head.append($('div', 'eyebrow', 'الدرس ' + AR(l.n) + ' · سورة ' + l.surah + ' · الآيات ' + AR(l.from) + '–' + AR(l.to)),
                $('h2', null, l.title || ('سورة ' + l.surah)));
    if (l.theme) head.append($('p', null, l.theme));
    const pr = $('div', 'progress'); pr.id = 'progress'; head.append(pr);
    head.append($('p', 'how', 'اقرأ الملخص، ثم طابق النص المنقول على الكتاب في الموضع المذكور. إن صحّ الاثنان اضغط «صحيح»، وإلا اضغط «يحتاج تعديل» واكتب ملاحظتك.'));
    root.append(head); renderProgress(l);
    let shown = 0;
    if (section === null) section = l.sections[0].name;
    renderSections(l);
    l.sections.filter(s => section === 'all' || s.name === section).forEach(s => {
      const items = s.items.filter(it => { const st = (state.get(key(l.n, it.id)) || {}).state || ''; return filter === 'all' || (filter === 'todo' ? !st : st === filter); });
      if (!items.length) return;
      const sec = $('section', 'field'), h = $('h3', null, s.name);
      if (s.taf) h.append($('span', 'taf', 'التفقّه'));
      const list = $('div', 'items'); items.forEach(it => { list.append(renderItem(l, it)); shown++; });
      sec.append(h, list); root.append(sec);
    });
    if (!shown) root.append($('p', 'empty', 'لا مواد في هذا العرض.'));
    if (section !== 'all') {
      const i = l.sections.findIndex(s => s.name === section), nav = $('div', 'sec-nav');
      const go = (j, label) => { const b = $('button', null, label); b.type = 'button'; b.addEventListener('click', () => pickSection(l.sections[j].name)); return b; };
      nav.append(i > 0 ? go(i - 1, '→ ' + l.sections[i - 1].name) : $('span'), i < l.sections.length - 1 ? go(i + 1, l.sections[i + 1].name + ' ←') : $('span'));
      root.append(nav);
    }
    const extra = (title, rows) => { if (!rows.length) return; const d = $('details', 'extra'), sm = $('summary', null, title), ul = $('ul'); rows.forEach(r => ul.append(r)); d.append(sm, ul); root.append(d); };
    extra('نقاط عدم اليقين (' + AR(l.unc.length) + ')', l.unc.map(u => $('li', null, u)));
    extra('نقاط الخلاف (' + AR(l.dis.length) + ')', l.dis.map(u => $('li', null, u)));
    extra('الأقسام الفارغة ولماذا (' + AR(l.gaps.length) + ')', l.gaps.map(g => { const li = $('li'); li.append($('b', null, g.f), $('span', 'gcode ' + g.code, g.c), g.note ? ' — ' + g.note : ''); return li; }));
  }

  document.getElementById('filters').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });

  try { (JSON.parse(localStorage.getItem(STORE) || '[]')).forEach(([k, v]) => state.set(k, v)); } catch (e) {}
  render();
  const rv = document.getElementById('reviewer');
  try { rv.value = localStorage.getItem('basira-reviewer') || ''; } catch (e) {}
  rv.addEventListener('change', () => { try { localStorage.setItem('basira-reviewer', rv.value.trim()); } catch (e) {} });
  document.getElementById('export').addEventListener('click', async () => {
    const rows = [...state.entries()].filter(([, v]) => v.state || v.note).map(([k, v]) => ({key: k, state: v.state, note: v.note || ''}));
    const who = document.getElementById('reviewer').value.trim();
    if (!who) { showNotice('اكتب اسمك في الأعلى قبل نسخ النتائج.'); document.getElementById('reviewer').focus(); return; }
    const head = 'مراجعة بصيرة — ' + who;
    const text = head + '\n' + JSON.stringify(rows);
    const box = document.getElementById('export-box');
    box.value = text; box.hidden = false;
    try { await navigator.clipboard.writeText(text); showNotice('نُسخت النتائج (' + AR(rows.length) + ' مادة). أرسلها لصاحب المشروع.'); }
    catch (e) { box.select(); showNotice('حدّد النص في المربع وانسخه، ثم أرسله لصاحب المشروع.'); }
  });
})();
</script>

</body>
</html>
