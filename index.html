<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مراجعة بصيرة للمراجعين</title>
<meta name="description" content="مراجعة دروس بصيرة مادةً مادة على كتبها، بترتيب المرور الثلاثة: العقيدة والفقه والحديث، ثم التفسير والتجويد، ثم التعليم">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F1F4F2; --surface:#FFFFFF; --sunk:#E6ECE8; --line:#D3DCD7;
  --ink:#17231F; --muted:#5B6B65; --accent:#0E6655; --accent-soft:#D6EAE4;
  --ok:#23724A; --ok-soft:#DCEFE3; --fix:#A8520B; --fix-soft:#F8E6D3;
  --quote:#223029; --shadow:0 1px 2px rgba(20,40,32,.06);
  --ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --book:"Amiri","Traditional Arabic","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#101714; --surface:#17201C; --sunk:#1E2A25; --line:#2C3B35;
    --ink:#E3ECE7; --muted:#97A8A1; --accent:#5CC4AC; --accent-soft:#183A32;
    --ok:#6BCB93; --ok-soft:#173826; --fix:#F0A45C; --fix-soft:#3A2715;
    --quote:#D9E4DE; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#101714; --surface:#17201C; --sunk:#1E2A25; --line:#2C3B35;
  --ink:#E3ECE7; --muted:#97A8A1; --accent:#5CC4AC; --accent-soft:#183A32;
  --ok:#6BCB93; --ok-soft:#173826; --fix:#F0A45C; --fix-soft:#3A2715;
  --quote:#D9E4DE; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.7;direction:rtl;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:12px 16px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:0}
.brand h1 span{color:var(--accent)}
.overall{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.overall b{color:var(--ink)}
.lessons{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.lesson-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 10px 6px;font:inherit;font-size:13px;cursor:pointer;display:grid;justify-items:center;gap:2px;min-width:74px}
.lesson-chip small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.lesson-chip .bar{width:100%;height:3px;background:var(--sunk);border-radius:2px;overflow:hidden}
.lesson-chip .bar i{display:block;height:100%;background:var(--ok)}
.lesson-chip[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lesson-chip.done{border-color:var(--ok)}
.sections{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.sec-chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 12px;font:inherit;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.sec-chip small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sec-chip[aria-pressed="true"] small{color:#fff}
.sec-chip.done:not([aria-pressed="true"]){border-color:var(--ok)}
.sec-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.sec-nav button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 14px;cursor:pointer}
.passes{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.pass-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer;display:grid;gap:0;text-align:start}
.pass-chip small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pass-chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pass-note{margin:0;font-size:13px;color:var(--muted);max-width:65ch}
.item-head{margin:0;font-size:12.5px;font-weight:600;color:var(--accent)}
.xline{margin:0;font-size:13.5px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 12px;font:inherit;font-size:13px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{margin:14px 0 0;padding:10px 12px;border-radius:8px;background:var(--fix-soft);color:var(--ink);font-size:13px}
.lesson-head{padding-block:22px 6px;display:grid;gap:6px}
.lesson-head .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.02em}
.lesson-head h2{margin:0;font-size:24px;line-height:1.35;text-wrap:balance}
.lesson-head p{margin:0;color:var(--muted);max-width:65ch}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress .track{flex:1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;display:flex}
.progress .track .o{background:var(--ok)} .progress .track .f{background:var(--fix)}
.how{font-size:13px;color:var(--muted);margin:4px 0 0;max-width:65ch}
section.field{margin-top:26px}
section.field>h3{font-size:14px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:var(--accent)}
section.field>h3 .taf{font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.items{display:grid;gap:10px}
article.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;box-shadow:var(--shadow);display:grid;gap:10px;border-inline-start:4px solid var(--line)}
article.item[data-state="ok"]{border-inline-start-color:var(--ok)}
article.item[data-state="fix"]{border-inline-start-color:var(--fix)}
.summary{margin:0;font-size:15.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.meta span{background:var(--sunk);border-radius:6px;padding:1px 8px}
.meta .id{font-family:ui-monospace,Menlo,monospace;direction:ltr;background:transparent;padding:0}
blockquote{margin:0;padding:10px 12px;background:var(--sunk);border-radius:8px;font-family:var(--book);font-size:18px;line-height:1.9;color:var(--quote);overflow-wrap:anywhere}
.cite{font-size:12px;color:var(--muted);margin-top:4px;font-family:var(--ui);line-height:1.6}
.cite b{color:var(--ink);font-weight:600}
.based{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions button{font:inherit;font-size:13px;border-radius:8px;padding:5px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.actions button.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.actions button.fix[aria-pressed="true"]{background:var(--fix);border-color:var(--fix);color:#fff}
.actions .saved{font-size:12px;color:var(--muted);margin-inline-start:auto}
textarea{width:100%;min-height:70px;resize:vertical;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--ground);color:var(--ink)}
details.extra{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.extra summary{cursor:pointer;font-weight:600;font-size:14px}
details.extra ul{margin:8px 0 4px;padding-inline-start:18px;display:grid;gap:6px;font-size:13.5px}
.gcode{font-size:11px;border-radius:999px;padding:0 8px;margin-inline-start:6px;background:var(--sunk);color:var(--muted)}
.gcode.SOURCE_GAP{background:var(--fix-soft);color:var(--fix)}
.reviewer{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--surface);color:var(--ink);width:120px}
.export-btn{font:inherit;font-size:13px;border:0;border-radius:8px;padding:6px 14px;background:var(--accent);color:#fff;cursor:pointer}
#export-box{margin-top:12px;min-height:90px;direction:ltr}
.empty{padding:30px 0;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: no-preference){article.item{transition:border-color .2s}}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>مراجعة دروس <span>بصيرة</span></h1>
      <div class="overall" id="overall"></div>
      <input id="reviewer" class="reviewer" type="text" placeholder="اسمك" aria-label="اسم المراجع">
      <button type="button" id="export" class="export-btn">انسخ النتائج لإرسالها</button>
    </div>
    <nav class="passes" id="passes" aria-label="مرور المراجعة"></nav>
    <nav class="lessons" id="lessons" aria-label="الدروس"></nav>
    <nav class="sections" id="sections" aria-label="أقسام الدرس"></nav>
    <div class="filters" id="filters" role="group" aria-label="عرض">
      <button type="button" data-f="all" aria-pressed="true">الكل</button>
      <button type="button" data-f="todo" aria-pressed="false">لم يُراجع</button>
      <button type="button" data-f="fix" aria-pressed="false">يحتاج تعديل</button>
      <button type="button" data-f="ok" aria-pressed="false">صحيح</button>
    </div>
  </div>
</header>
<main class="wrap">
  <p class="notice" id="notice" hidden></p>
  <textarea id="export-box" hidden readonly aria-label="نتائج المراجعة"></textarea>
  <div id="lesson"></div>
</main>

بها واشتقاقه من الدبر فكان المدبر هو الذي ينظر إلى دبر الأمور فيدخل فيه على علم به والله ﷻ عالم بكل ما هو","ed":"مكتبة السوادي، جدة - المملكة العربية السعودية، الأولى، ١٤١٣ هـ - ١٩٩٣ م"},{"t":"عَرَّفَهُمْ وُجُوهَ الْعِبَادَاتِ وَبَيَّنَ لَهُمْ حُدُودَهَا وَشُرُوطَهَا , وَخَلَقَ لَهُمْ مَدَارِكَ وَمَشَاعِرَ , وَقُوًى وَجَوَارِحَ , فَخَاطَبَهُمْ وَكَلَّفَهُمْ وَبَشَّرَهُمْ وَأَنْذَرَهُمْ , وَأَمْهَلَهُمْ وَحَمَّلَهُمْ دُونَ مَا تَتَّسِعُ لَهُ بُنْيَتُهُمْ , فَصَارَتِ الْعِلَلُ مُزَاحَةً , وَحِجَجُ الْعُصَاةِ وَالْمُقَصِّرِينَ مُنْقَطِعَةٌ","src":"الأسماء والصفات","au":"البيهقي","v":"1","p":134,"h":null,"ch":"باب جماع أبواب ذكر الأسماء التي تتبع إثبات التدبير له دون ما سواه قال الحليمي: فأول ذلك \" المدبر \" ومعناه مصرف الأمور على ما يوجب حسن عواقبها واشتقاقه من الدبر فكان المدبر هو الذي ينظر إلى دبر الأمور فيدخل فيه على علم به والله ﷻ عالم بكل ما هو","ed":"مكتبة السوادي، جدة - المملكة العربية السعودية، الأولى، ١٤١٣ هـ - ١٩٩٣ م"},{"t":"وَقَالَ فِي مَعْنَى «الرَّحِيمِ» : إِنَّهُ الْمُثِيبُ عَلَى الْعَمَلِ فَلَا يُضِيعُ لِعَامِلٍ عَمَلًا , وَلَا يُهْدِرُ لِسَاعٍ سَعِيًا , وَيُنِيلُهُ بِفَضْلِ رَحْمَتِهِ مِنَ الثَّوَابِ أَضْعَافَ عَمَلِهِ","src":"الأسماء والصفات","au":"البيهقي","v":"1","p":134,"h":null,"ch":"باب جماع أبواب ذكر الأسماء التي تتبع إثبات التدبير له دون ما سواه قال الحليمي: فأول ذلك \" المدبر \" ومعناه مصرف الأمور على ما يوجب حسن عواقبها واشتقاقه من الدبر فكان المدبر هو الذي ينظر إلى دبر الأمور فيدخل فيه على علم به والله ﷻ عالم بكل ما هو","ed":"مكتبة السوادي، جدة - المملكة العربية السعودية، الأولى، ١٤١٣ هـ - ١٩٩٣ م"}]}]},{"name":"الحديث","taf":false,"p":"1","items":[{"id":"m-had-azam","a":[1,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قال النبي ﷺ عن الفاتحة إنها أعظم سورة في القرآن، وإنها السبع المثاني والقرآن العظيم الذي أوتيه.","g":"","b":[],"q":[{"t":"أَلَمْ تَقُلْ: لَأُعَلِّمَنَّكَ سُورَةً هِيَ أَعْظَمُ سُورَةٍ فِي الْقُرْآنِ، قَالَ: ﴿الْحَمْدُ لِلهِ رَبِّ الْعَالَمِينَ﴾. هِيَ السَّبْعُ الْمَثَانِي، وَالْقُرْآنُ الْعَظِيمُ الَّذِي أُوتِيتُهُ","src":"صحيح البخاري","au":"البخاري","v":"6","p":17,"h":"4474","ch":"كتاب تفسير القرآن › سورة الفاتحة › باب ما جاء في فاتحة الكتاب","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]},{"id":"m-had-qusimat","a":[2,7],"lv":["التأسيس","التمكين","التفقّه"],"st":"ثابت","s":"في الحديث القدسي: قسم الله الصلاة (أي الفاتحة) بينه وبين عبده نصفين؛ فإذا قال العبد آية منها أجابه الله: حمدني عبدي، أثنى عليّ عبدي، مجّدني عبدي، ثم: هذا بيني وبين عبدي، ثم: هذا لعبدي ولعبدي ما سأل.","g":"","b":[],"q":[{"t":"فَإِذَا قال العبد: الحمد لله رب العالمين، قَالَ اللَّهُ تَعَالَى: حَمِدَنِي عَبْدِي. وَإِذَا قَالَ؛ الرحمن الرحيم. قَالَ اللَّهُ تَعَالَى؛ أَثْنَى عَلَيَّ عَبْدِي. وَإِذَا قال مالك يوم الدين. قَالَ: مَجَّدَنِي عَبْدِي","src":"صحيح مسلم","au":"مسلم","v":"1","p":296,"h":"395","ch":"٤ - كتاب الصلاة › (١١) باب وجوب قراءة الفاتحة في كل ركعة، وإنه إذا لم يحسن الفاتحة ولا أمكنه تعلمها قرأ ما تيسر له من غيرها","ed":"مطبعة عيسى البابي الحلبي وشركاه، القاهرة، ١٣٧٤ هـ - ١٩٥٥ م؛ تحقيق: محمد فؤاد عبد الباقي [ت ١٣٨٨ هـ]"},{"t":"فَإِذَا قَالَ: إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ. قَالَ: هَذَا بَيْنِي وَبَيْنَ عَبْدِي وَلِعَبْدِي مَا سَأَلَ.","src":"صحيح مسلم","au":"مسلم","v":"1","p":296,"h":"395","ch":"٤ - كتاب الصلاة › (١١) باب وجوب قراءة الفاتحة في كل ركعة، وإنه إذا لم يحسن الفاتحة ولا أمكنه تعلمها قرأ ما تيسر له من غيرها","ed":"مطبعة عيسى البابي الحلبي وشركاه، القاهرة، ١٣٧٤ هـ - ١٩٥٥ م؛ تحقيق: محمد فؤاد عبد الباقي [ت ١٣٨٨ هـ]"}]},{"id":"m-had-la-salat","a":[1,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قال النبي ﷺ: «لا صلاة لمن لم يقرأ بفاتحة الكتاب».","g":"","b":[],"q":[{"t":"«لَا صَلَاةَ لِمَنْ لَمْ يَقْرَأْ بِفَاتِحَةِ الْكِتَابِ.»","src":"صحيح البخاري","au":"البخاري","v":"1","p":151,"h":"756","ch":"كتاب الأذان › باب وجوب القراءة للإمام والمأموم في الصلوات كلها في الحضر والسفر","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]},{"id":"m-had-amin","a":[7,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"إذا قال الإمام ﴿غير المغضوب عليهم ولا الضالين﴾ فقولوا: آمين، فمن وافق قوله قول الملائكة غُفر له ما تقدم من ذنبه.","g":"","b":[],"q":[{"t":"«إِذَا قَالَ الْإِمَامُ: ﴿غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلا الضَّالِّينَ﴾ فَقُولُوا آمِينَ، فَمَنْ وَافَقَ قَوْلُهُ قَوْلَ الْمَلَائِكَةِ غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ»","src":"صحيح البخاري","au":"البخاري","v":"6","p":17,"h":"4475","ch":"كتاب تفسير القرآن › سورة الفاتحة › باب غير المغضوب عليهم ولا الضالين","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]},{"id":"m-had-nurayn","a":[1,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"بشّر ملكٌ النبيَّ ﷺ بنورين أوتيهما لم يؤتهما نبي قبله: فاتحة الكتاب وخواتيم سورة البقرة، لن يقرأ بحرف منهما إلا أُعطيه.","g":"","b":[],"q":[{"t":"أَبْشِرْ بِنُورَيْنِ أُوتِيتَهُمَا لَمْ يُؤْتَهُمَا نَبِيٌّ قَبْلَكَ. فَاتِحَةُ الْكِتَابِ وَخَوَاتِيمُ سُورَةِ الْبَقَرَةِ. لَنْ تَقْرَأَ بِحَرْفٍ مِنْهُمَا إِلَّا أُعْطِيتَهُ","src":"صحيح مسلم","au":"مسلم","v":"1","p":554,"h":"806","ch":"٦ - كتاب صلاة المسافرين وقصرها › (٤٣) باب فضل الفاتحة وخواتيم سورة البقرة، والحث على قراءة الآيتين من آخر البقرة","ed":"مطبعة عيسى البابي الحلبي وشركاه، القاهرة، ١٣٧٤ هـ - ١٩٥٥ م؛ تحقيق: محمد فؤاد عبد الباقي [ت ١٣٨٨ هـ]"},{"t":"أبْشِرْ بِنُورَيْنِ أُوتِيتَهُمَا لَمْ يُؤتَهُمَا نَبيٌّ قَبْلَكَ: فَاتِحَةُ الكِتَابِ، وَخَواتِيمُ سُورَةِ البَقَرَةِ","src":"رياض الصالحين","au":"النووي","v":null,"p":303,"h":"1022","ch":"٨ - كتاب الفضائل › ١٨٣ - باب الحث على سور وآيات مخصوصة","ed":"دار ابن كثير للطباعة والنشر والتوزيع، دمشق - بيروت، الأولى، ١٤٢٨ هـ - ٢٠٠٧ م"}]}]},{"name":"تحليل الحديث","taf":true,"p":"1","items":[{"id":"m3-ha-sahih","a":[1,7],"lv":["التفقّه"],"st":"ثابت","s":"أحاديث البطاقة (فضل الفاتحة، والتأمين، ولا صلاة إلا بها، وقسمت الصلاة) مخرّجة في صحيحي البخاري ومسلم، وقال ابن الصلاح: كتاباهما أصح الكتب بعد كتاب الله العزيز؛ فهي ثابتة لا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","g":"","b":[],"q":[{"t":"وكتاباهما أصح الكتب بعد كتاب الله العزيز","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":18,"h":null,"ch":"النوع الأول من أنواع علوم الحديث: معرفة الصحيح من الحديث","ed":"دار الفكر- سوريا، دار الفكر المعاصر - بيروت؛ تحقيق: نور الدين عتر"}],"sh":12}]},{"name":"الفقه","taf":false,"p":"1","items":[{"id":"m-fiqh-rukn","a":[1,7],"lv":["التأسيس","التمكين","التفقّه"],"st":"ثابت","s":"في المذهب الشافعي: تتعين قراءة الفاتحة في كل ركعة (إلا ركعة المسبوق)، والبسملة آية منها، وتجب تشديداتها وترتيبها وموالاتها.","g":"","b":[],"q":[{"t":"وتتعين الفاتحة كل ركعة لا ركعة مسبوق والبسملة منها وتشديداتها ولو أبدل ضادا بظاء لم تصح في الأصح ويجب ترتيبها وموالاتها","src":"منهاج الطالبين","au":"النووي","v":null,"p":26,"h":null,"ch":"كتاب الصلاة › باب صفة الصلاة","ed":"دار الفكر، الأولى، ١٤٢٥هـ/٢٠٠٥م؛ تحقيق: عوض قاسم أحمد عوض"}]},{"id":"m-fiqh-amin","a":[7,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"يسن بعد الفاتحة قول «آمين» بتخفيف الميم مع المد، ويجوز القصر، ويؤمّن المأموم مع إمامه.","g":"","b":[],"q":[{"t":"ويسن عقب الفاتحة آمين خفيفة الميم بالمد ويجوز القصر ويؤمن مع تأمين إمامه ويجهر به في الأظهر","src":"منهاج الطالبين","au":"النووي","v":null,"p":26,"h":null,"ch":"كتاب الصلاة › باب صفة الصلاة","ed":"دار الفكر، الأولى، ١٤٢٥هـ/٢٠٠٥م؛ تحقيق: عوض قاسم أحمد عوض"}]},{"id":"m-fiqh-lahn","a":[1,7],"lv":["التمكين"],"st":"ثابت","s":"في الفاتحة أربع عشرة تشديدة: ثلاث في البسملة والباقي بعدها، ومن أخلّ بتشديدة منها بطلت قراءته. واللحن الذي يغيّر المعنى، مثل ضم التاء أو كسرها في ﴿أنعمتَ﴾ أو كسر الكاف في ﴿إياكَ﴾، يبطل الصلاة، والذي لا يغيّره، مثل ضم الباء أو فتحها في ﴿ربِّ العالمين﴾، لا يبطلها.","g":"","b":[],"q":[{"t":"وهي أربع عشرة تشديدة: ثلاث في البسملة، والباقي بعدها، فإن أخلّ بتشديدة واحدة بطلت قراءته","src":"الأذكار","au":"النووي","v":null,"p":47,"h":null,"ch":"أبواب › باب القراءة بعد التعوذ","ed":"دار الفكر للطباعة والنشر والتوزيع، بيروت - لبنان؛ تحقيق: عبد القادر الأرنؤوط [ت ١٤٢٥ هـ]"},{"t":"فإن لحن في الفاتحة لحناً يخلّ المعنى، بطلت صلاته، وإن لم يخلّ المعنى صحّت قراءته، فالذي يخلّه مثل أن يقول: أنعمت، بضم التاء أو كسرها، أو يقول: إياك نعبد، بكسر الكاف، والذي لا يخلّ مثل أن يقول: ربّ العالمين، بضم الباء أو فتحها","src":"الأذكار","au":"النووي","v":null,"p":47,"h":null,"ch":"أبواب › باب القراءة بعد التعوذ","ed":"دار الفكر للطباعة والنشر والتوزيع، بيروت - لبنان؛ تحقيق: عبد القادر الأرنؤوط [ت ١٤٢٥ هـ]"}]},{"id":"m-fiqh-ajiz","a":[1,7],"lv":["التمكين"],"st":"ثابت","s":"من لم يُحسن الفاتحة قرأ بقدرها من غيرها، فإن لم يُحسن شيئًا من القرآن أتى من الأذكار كالتسبيح والتهليل بقدر آياتها، ومتى تمكّن من تعلّمها وجب عليه تعلّمها.","g":"","b":[],"q":[{"t":"فإن لم يُحسن الفاتحة قرأ بقدرها من غيرها، فإن لم يُحسن شيئاً من القرآن أتى من الأذكار كالتسبيح والتهليل ونحوهما بقدر آيات الفاتحة","src":"الأذكار","au":"النووي","v":null,"p":47,"h":null,"ch":"أبواب › باب القراءة بعد التعوذ","ed":"دار الفكر للطباعة والنشر والتوزيع، بيروت - لبنان؛ تحقيق: عبد القادر الأرنؤوط [ت ١٤٢٥ هـ]"},{"t":"وعلى كلّ تقدير متى تمكَّن من التعلم وجب عليه تعلّم الفاتحة","src":"الأذكار","au":"النووي","v":null,"p":47,"h":null,"ch":"أبواب › باب القراءة بعد التعوذ","ed":"دار الفكر للطباعة والنشر والتوزيع، بيروت - لبنان؛ تحقيق: عبد القادر الأرنؤوط [ت ١٤٢٥ هـ]"}]}]},{"name":"وجه الاستنباط","taf":true,"p":"1","items":[{"id":"m3-inf-umum","a":[1,7],"lv":["التفقّه"],"st":"ثابت","s":"رجّح القرطبي أن الفاتحة متعينة في كل ركعة لكل مصلٍّ، أخذًا بعموم قوله ﷺ: «لا صلاة لمن لم يقرأ فيها بفاتحة الكتاب»؛ فالاستنباط هنا من عموم لفظ الحديث.","g":"","b":[],"q":[{"t":"الصحيح من هذه الأقوال قول الشافعي وأحمد ومالك في القول الآخر، وأن الفاتحة متعينة في كل ركعة لكل أحد على العموم","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"1","p":119,"h":null,"ch":"تفسير سورة الفاتحة › الباب الثاني في نزولها وأحكامها، وفيه عشرون مسألة","ed":"دار الكتب المصرية - القاهرة، الثانية، ١٣٨٤ هـ - ١٩٦٤ م؛ تحقيق: أحمد البردوني وإبراهيم أطفيش"}]}]},{"name":"أسباب الخلاف","taf":true,"p":"1","items":[{"id":"m-dis-basmala","a":[1,1],"lv":["التفقّه"],"st":"خلاف معتبر","s":"اختُلف في البسملة: أهي من الفاتحة؟ فذهب قرّاء المدينة والبصرة وفقهاء الكوفة إلى أنها ليست منها، وذهب قرّاء مكة والكوفة وأكثر فقهاء الحجاز إلى أنها منها، وهو قول الشافعي، واحتجوا بأنها كتبت في المصحف بخط سائر القرآن.","g":"","b":[],"q":[{"t":"فَذَهَبَ قُرَّاءُ الْمَدِينَةِ وَالْبَصْرَةِ وَفُقَهَاءُ الْكُوفَةِ إِلَى أَنَّهَا لَيْسَتْ مِنْ فَاتِحَةِ الْكِتَابِ، وَلَا مِنْ غَيْرِهَا مِنَ السُّوَرِ وَالِافْتِتَاحُ بِهَا لِلتَّيَمُّنِ وَالتَّبَرُّكِ. وَذَهَبَ قُرَّاءُ مَكَّةَ وَالْكُوفَةِ وَأَكْثَرُ فُقَهَاءِ الْحِجَازِ إِلَى أَنَّهَا مِنَ الْفَاتِحَةِ وَلَيْسَتْ مِنْ سَائِرِ السُّوَرِ","src":"معالم التنزيل","au":"البغوي","v":"1","p":51,"h":null,"ch":"الفاتحة › ١","ed":"دار طيبة للنشر والتوزيع، الرابعة، ١٤١٧ هـ - ١٩٩٧ م؛ تحقيق: حققه وخرج أحاديثه محمد عبد الله النمر - عثمان جمعة ضميرية - سليمان مسلم الحرش"},{"t":"وَهُوَ قَوْلُ الثَّوْرِيِّ وَابْنِ الْمُبَارَكِ وَالشَّافِعِيِّ لِأَنَّهَا كُتِبَتْ فِي الْمُصْحَفِ بِخَطِّ سَائِرِ الْقُرْآنِ.","src":"معالم التنزيل","au":"البغوي","v":"1","p":51,"h":null,"ch":"الفاتحة › ١","ed":"دار طيبة للنشر والتوزيع، الرابعة، ١٤١٧ هـ - ١٩٩٧ م؛ تحقيق: حققه وخرج أحاديثه محمد عبد الله النمر - عثمان جمعة ضميرية - سليمان مسلم الحرش"}]}]},{"name":"المعنى الإجمالي","taf":false,"p":"2","items":[{"id":"m-gen-1","a":[1,7],"lv":["التأسيس","التمكين","التفقّه"],"st":"ثابت","s":"هذه السورة على قصرها احتوت ما لم تحتوه سورة غيرها: أنواع التوحيد الثلاثة، وإثبات النبوة، والجزاء على الأعمال، وإخلاص الدين لله عبادة واستعانة.","g":"","b":[],"q":[{"t":"فهذه السورة على إيجازها، قد احتوت على ما لم تحتو عليه سورة من سور القرآن، فتضمنت أنواع التوحيد الثلاثة","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وتضمنت إخلاص الدين لله تعالى، عبادة واستعانة في قوله: ﴿إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ﴾","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التفسير","taf":false,"p":"2","items":[{"id":"m-taf-basmala","a":[1,1],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿بسم الله﴾: أبتدئ بكل اسم لله. و﴿الله﴾ هو المعبود المستحق للعبادة وحده. و﴿الرحمن الرحيم﴾ اسمان يدلان على أنه ذو الرحمة الواسعة التي وسعت كل شيء.","g":"","b":[],"q":[{"t":"﴿بِسْمِ اللَّهِ﴾ أي: أبتدئ بكل اسم لله تعالى، لأن لفظ ﴿اسم﴾ مفرد مضاف، فيعم جميع الأسماء [الحسنى] . ﴿اللَّهِ﴾ هو المألوه المعبود، المستحق لإفراده بالعبادة، لما اتصف به من صفات الألوهية وهي صفات الكمال. ﴿الرَّحْمَنِ الرَّحِيمِ﴾ اسمان دالان على أنه تعالى ذو الرحمة الواسعة العظيمة التي وسعت كل شيء، وعمت كل حي، وكتبها للمتقين المتبعين لأنبيائه ورسله.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-hamd","a":[2,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿الحمد لله﴾: الثناء على الله بصفات الكمال وأفعاله. ﴿رب العالمين﴾: المربي لجميع الخلق بخلقه ونعمه، وتربيته نوعان: عامة للخلق كلهم، وخاصة لأوليائه بالإيمان والتوفيق.","g":"","b":[],"q":[{"t":"﴿الْحَمْدُ لِلَّهِ﴾ [هو] الثناء على الله بصفات الكمال، وبأفعاله الدائرة بين الفضل والعدل، فله الحمد الكامل، بجميع الوجوه.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وتربيته تعالى لخلقه نوعان: عامة وخاصة.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"والخاصة: تربيته لأوليائه، فيربيهم بالإيمان، ويوفقهم له، ويكمله لهم، ويدفع عنهم الصوارف، والعوائق الحائلة بينهم وبينه","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-rahman","a":[3,3],"lv":["التمكين","التفقّه"],"st":"خلاف معتبر","s":"من العلماء من جعل «الرحمن» و«الرحيم» بمعنى واحد، ومنهم من فرّق: الرحمن عام الرحمة لكل الخلق، والرحيم خاص بالمؤمنين.","g":"","b":[],"q":[{"t":"وَاخْتَلَفُوا فِيهِمَا مِنْهُمْ مَنْ قَالَ: هُمَا بِمَعْنًى وَاحِدٍ مِثْلَ نَدْمَانٍ وَنَدِيمٍ وَمَعْنَاهُمَا ذُو الرَّحْمَةِ","src":"معالم التنزيل","au":"البغوي","v":"1","p":51,"h":null,"ch":"الفاتحة › ١","ed":"دار طيبة للنشر والتوزيع، الرابعة، ١٤١٧ هـ - ١٩٩٧ م؛ تحقيق: حققه وخرج أحاديثه محمد عبد الله النمر - عثمان جمعة ضميرية - سليمان مسلم الحرش"},{"t":"فَالرَّحْمَنُ مَنْ تَصِلُ رَحْمَتُهُ إِلَى الْخَلْقِ عَلَى الْعُمُومِ، وَالرَّحِيمُ مَنْ تَصِلُ رَحْمَتُهُ إِلَيْهِمْ عَلَى الْخُصُوصِ","src":"معالم التنزيل","au":"البغوي","v":"1","p":51,"h":null,"ch":"الفاتحة › ١","ed":"دار طيبة للنشر والتوزيع، الرابعة، ١٤١٧ هـ - ١٩٩٧ م؛ تحقيق: حققه وخرج أحاديثه محمد عبد الله النمر - عثمان جمعة ضميرية - سليمان مسلم الحرش"}]},{"id":"m-taf-malik","a":[4,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿مالك يوم الدين﴾: يوم القيامة يوم يدان الناس بأعمالهم، وخصّه بالذكر لأن فيه يظهر كمال ملكه وعدله وتنقطع أملاك الخلق، وهو مالك لكل الأيام.","g":"","b":[],"q":[{"t":"وأضاف الملك ليوم الدين، وهو يوم القيامة، يوم يدان الناس فيه بأعمالهم، خيرها وشرها، لأن في ذلك اليوم، يظهر للخلق تمام الظهور، كمال ملكه وعدله وحكمته، وانقطاع أملاك الخلائق.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"فلذلك خصه بالذكر، وإلا فهو المالك ليوم الدين ولغيره من الأيام.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-iyyaka","a":[5,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿إياك نعبد وإياك نستعين﴾: نخصك وحدك بالعبادة والاستعانة؛ فتقديم «إياك» يفيد الحصر. وقدّم العبادة لأنها حق الله، وذكر الاستعانة بعدها لحاجة العبد إلى عون الله في كل عبادته.","g":"","b":[],"q":[{"t":"فكأنه يقول: نعبدك، ولا نعبد غيرك، ونستعين بك، ولا نستعين بغيرك.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وذكر ﴿الاستعانة﴾ بعد ﴿العبادة﴾ مع دخولها فيها، لاحتياج العبد في جميع عباداته إلى الاستعانة بالله تعالى.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-ihdina","a":[6,6],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿اهدنا الصراط المستقيم﴾: دلّنا وأرشدنا ووفقنا للطريق الواضح الموصل إلى الله وجنته، وهو معرفة الحق والعمل به؛ هداية إلى الصراط بلزوم الإسلام، وهداية فيه لتفاصيل الدين علمًا وعملًا.","g":"","b":[],"q":[{"t":"أي: دلنا وأرشدنا، ووفقنا للصراط المستقيم، وهو الطريق الواضح الموصل إلى الله، وإلى جنته، وهو معرفة الحق والعمل به، فاهدنا إلى الصراط واهدنا في الصراط.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-sirat","a":[7,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الصراط المستقيم صراط المنعم عليهم من النبيين والصديقين والشهداء والصالحين، لا صراط المغضوب عليهم الذين عرفوا الحق وتركوه، ولا الضالين الذين تركوه على جهل.","g":"","b":[],"q":[{"t":"وهذا الصراط المستقيم هو: ﴿صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ﴾ من النبيين والصديقين والشهداء والصالحين. ﴿غَيْرِ﴾ صراط ﴿الْمَغْضُوبِ عَلَيْهِمْ﴾ الذين عرفوا الحق وتركوه كاليهود ونحوهم. وغير صراط ﴿الضَّالِّينَ﴾ الذين تركوا الحق على جهل وضلال، كالنصارى ونحوهم.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"السياق","taf":false,"p":"2","items":[{"id":"m-ctx-names","a":[1,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"من أسمائها «أم الكتاب»؛ لأنه يبدأ بكتابتها في المصاحف وبقراءتها في الصلاة. وسمّاها النبي ﷺ «السبع المثاني والقرآن العظيم».","g":"","b":[],"q":[{"t":"وسميت أم الكتاب؛ لأنه يبدأ بكتابتها في المصاحف، ويبدأ بقراءتها في الصلاة.","src":"تفسير ابن كثير","au":"ابن كثير","v":"1","p":147,"h":null,"ch": ","ed":"دار ابن الجوزي للنشر والتوزيع - السعودية، الأولى، ١٤٣١ هـ؛ تحقيق: حكمت بن بشير بن ياسين"}]}]},{"name":"المناسبات","taf":false,"p":"2","items":[{"id":"m2-mun-rabb","a":[1,2],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"في ترابط آيات السورة: بعد أن أثبت ﴿الحمد لله﴾ أنه المستحق لكل حمد لذاته، أتبعه بـ﴿رب﴾ ليبين أنه يستحقه أيضًا لكونه ربًّا مالكًا منعمًا، وبـ﴿العالمين﴾ إلى ابتداء الخلق.","g":"","b":[],"q":[{"t":"ولما أثبت بقوله: ﴿الحمد لله﴾ أنه المستحق لجميع المحامد لا لشيء غير ذاته الحائز لجميع الكمالات أشار إلى أنه يستحقه أيضاً من حيث كونه رباً مالكاً منعماً فقال: ﴿رب﴾","src":"نظم الدرر","au":"البقاعي","v":"1","p":27,"h":null,"ch":"الفاتحة","ed":"دائرة المعارف العثمانية، حيدر آباد - الهند، الأولى، (١٣٨٩ - ١٤٠٤ هـ) (١٩٦٩ - ١٩٨٤ م)"}]}]},{"name":"المتشابهات","taf":false,"p":"2","items":[{"id":"m2-mut-rahman","a":[1,3],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"سأل الكرماني: لماذا تكرر ﴿الرحمن الرحيم﴾ بعد البسملة؟ وأجاب: لأن الرحمة إنعام على المحتاج، ففي البسملة ذُكر المنعم وحده، وفي الآية الثالثة أعيدت مع ذكر المنعَم عليهم.","g":"","b":[],"q":[{"t":"قلت إِنَّمَا كرر لِأَن الرَّحْمَة هِيَ الإنعام على الْمُحْتَاج وَذكر فِي الْآيَة الأولى الْمُنعم وَلم يذكر الْمُنعم عَلَيْهِم فَأَعَادَهَا مَعَ ذكرهم","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":65,"h":null,"ch":"سورة الفاتحة","ed":"تحقيق: عبد القادر أحمد عطا [ت ١٤٠٣ هـ]"}]},{"id":"m2-mut-iyyaka","a":[5,5],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"كرر ﴿إياك﴾ مع الفعلين ولم يكتف بمرة؛ لأن التقديم يقطع الاشتراك، ولو قيل «إياك نعبد ونستعين» لم يظهر أن الاستعانة مخصوصة بالله كالعبادة.","g":"","b":[],"q":[{"t":"كرر ﴿إياك﴾ وَقدمه وَلم يقْتَصر على ذكره مرّة كَمَا اقْتصر على ذكر أحد المفعولين فِي آيَات كَثِيرَة","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":65,"h":null,"ch":"سورة الفاتحة","ed":"تحقيق: عبد القادر أحمد عطا [ت ١٤٠٣ هـ]"}]}]},{"name":"أقوال العلماء","taf":false,"p":"2","items":[{"id":"m-sch-sirat","a":[6,6],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"نُقل عن السلف في الصراط المستقيم عبارات متقاربة: الإسلام (ابن عباس وجابر)، والقرآن (ابن مسعود)، وطريق الجنة (سعيد بن جبير).","g":"","b":[],"q":[{"t":"وَالصِّرَاطُ الْمُسْتَقِيمُ قَالَ ابْنُ عَبَّاسٍ وَجَابِرٌ ﵄: هُوَ الْإِسْلَامُ وَهُوَ قَوْلُ مُقَاتِلٍ. وَقَالَ ابْنُ مَسْعُودٍ ﵁: هو القرآن","src":"معالم التنزيل","au":"البغوي","v":"1","p":54,"h":null,"ch":"الفاتحة › ١","ed":"دار طيبة للنشر والتوزيع، الرابعة، ١٤١٧ هـ - ١٩٩٧ م؛ تحقيق: حققه وخرج أحاديثه محمد عبد الله النمر - عثمان جمعة ضميرية - سليمان مسلم الحرش"},{"t":"وَقَالَ سَعِيدُ بْنُ جُبَيْرٍ ﵁: طَرِيقُ الْجَنَّةِ.","src":"معالم التنزيل","au":"البغوي","v":"1","p":54,"h":null,"ch":"الفاتحة › ١","ed":"دار طيبة للنشر والتوزيع، الرابعة، ١٤١٧ هـ - ١٩٩٧ م؛ تحقيق: حققه وخرج أحاديثه محمد عبد الله النمر - عثمان جمعة ضميرية - سليمان مسلم الحرش"}]},{"id":"m-sch-aliya","a":[6,6],"lv":["التمكين"],"st":"ثابت","s":"أوصى أبو العالية: تعلّموا الإسلام، وعليكم بالصراط المستقيم فإنه الإسلام، ولا تحرّفوا الإسلام يمينًا ولا شمالًا، وعليكم بسنة نبيكم وما كان عليه أصحابه.","g":"","b":[],"q":[{"t":"تَعَلَّمُوا الْإِسْلَامَ , فَإِذَا تَعَلَّمْتُوهُ فَلَا تَرْغَبُوا عَنْهُ , وَعَلَيْكُمْ بِالصِّرَاطِ الْمُسْتَقِيمِ , فَإِنَّهُ الْإِسْلَامُ , وَلَا تُحَرِّفُوا الْإِسْلَامَ يَمِينًا وَلَا شِمَالًا , وَعَلَيْكُمْ بِسُنَّةِ نَبِيِّكُمْ وَالَّذِي كَانَ عَلَيْهِ أَصْحَابُهُ","src":"شرح أصول اعتقاد أهل السنة والجماعة","au":"اللالكائي","v":"1","p":62,"h":null,"ch":"باب سياق ذكر من رسم بالإمامة في السنة › سياق ما روي عن النبي ﷺ في ثواب من حفظ السنة ومن أحياها ودعا إليها","ed":"دار طيبة - السعودية، الثامنة، ١٤٢٣ هـ / ٢٠٠٣ م؛ تحقيق: أحمد بن سعد بن حمدان الغامدي [ت ١٤٣٤ هـ]"}]}]},{"name":"المقاصد","taf":true,"p":"2","items":[{"id":"m2-maq-umm","a":[1,7],"lv":["التفقّه"],"st":"ثابت","s":"من أوجه تسميتها أم الكتاب: أن معاني القرآن كله ترجع إلى ما تضمنته.","g":"","b":[],"q":[{"t":"وقيل: إنما سميت بذلك لرجوع معاني القرآن كله إلى ما تضمنته.","src":"تفسير ابن كثير","au":"ابن كثير","v":"1","p":147,"h":null,"ch":"سورة الفاتحة › ﷽","ed":"دار ابن الجوزي للنشر والتوزيع - السعودية، الأولى، ١٤٣١ هـ؛ تحقيق: حكمت بن بشير بن ياسين"}]}]},{"name":"اللغة والإعراب","taf":true,"p":"2","items":[{"id":"m-lang-hasr","a":[5,5],"lv":["التفقّه"],"st":"ثابت","s":"تقديم المفعول ﴿إياك﴾ على الفعل يفيد الحصر: إثبات العبادة والاستعانة لله ونفيهما عما سواه. وقدّم العبادة على الاستعانة من تقديم العام على الخاص وتقديم حق الله على حق العبد.","g":"","b":[],"q":[{"t":"لأن تقديم المعمول يفيد الحصر، وهو إثبات الحكم للمذكور، ونفيه عما عداه.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"من باب تقديم العام على الخاص، واهتماما بتقديم حقه تعالى على حق عبده.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-lang-rahman","a":[1,3],"lv":["التفقّه"],"st":"خلاف معتبر","s":"نقل البيهقي عن الخطابي: اختُلف في «الرحمن»: أمشتق من الرحمة أم لا؟ وذهب الجمهور إلى أنه مشتق منها مبني على المبالغة، ومعناه ذو الرحمة لا نظير له فيها، ولذلك لا يُثنّى ولا يُجمع كما يُثنّى «الرحيم» ويُجمع.","g":"","b":[],"q":[{"t":"اخْتَلَفَ النَّاسُ فِي تَفْسِيرِ «الرَّحْمَنِ» وَمَعْنَاهُ وَهَلْ هُوَ مُشْتَقٌّ مِنَ الرَّحْمَةِ أَمْ لَا؟","src":"الأسماء والصفات","au":"البيهقي","v":"1","p":134,"h":null,"ch":"باب جماع أبواب ذكر الأسماء التي تتبع إثبات التدبير له دون ما سواه قال الحليمي: فأول ذلك \" المدبر \" ومعناه مصرف الأمور على ما يوجب حسن عواقبها واشتقاقه من الدبر فكان المدبر هو الذي ينظر إلى دبر الأمور فيدخل فيه على علم به والله ﷻ عالم بكل ما هو","ed":"مكتبة السوادي، جدة - المملكة العربية السعودية، الأولى، ١٤١٣ هـ - ١٩٩٣ م"},{"t":"وَذَهَبَ الْجُمْهُورُ مِنَ النَّاسِ إِلَى أَنَّهُ مُشْتَقٌّ مِنَ الرَّحْمَةِ مَبْنِيٌّ عَلَى الْمُبَالَغَةِ , وَمَعْنَاهُ ذُو الرَّحْمَةِ لَا نَظِيرَ لَهُ فِيهَا , وَلِذَلِكَ لَا يُثَنَّى وَلَا يُجْمَعُ , كَمَا يُثَنَّى الرَّحِيمُ وَيُجْمَعُ","src":"الأسماء والصفات","au":"البيهقي","v":"1","p":134,"h":null,"ch":"باب جماع أبواب ذكر الأسماء التي تتبع إثبات التدبير له دون ما سواه قال الحليمي: فأول ذلك \" المدبر \" ومعناه مصرف الأمور على ما يوجب حسن عواقبها واشتقاقه من الدبر فكان المدبر هو الذي ينظر إلى دبر الأمور فيدخل فيه على علم به والله ﷻ عالم بكل ما هو","ed":"مكتبة السوادي، جدة - المملكة العربية السعودية، الأولى، ١٤١٣ هـ - ١٩٩٣ م"}]}]},{"name":"التجويد","taf":false,"p":"q","items":[{"id":"m2-tj-dallin","a":[7,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"المد اللازم: حرف مد بعده سكون أصلي وصلًا ووقفًا، ويُمد طويلًا. مثاله في الدرس: ﴿الضَّالِّينَ﴾: ألف بعدها لام مشددة.","g":"","b":[],"q":[{"t":"وَلاَزِمٌ إِنِ السُّكُونُ أُصِّلاَ ... وَصْلاً وَوَقْفًا بَعْدَ مَدٍّ طُوِّلاَ","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":7,"h":null,"ch":"أحكام المد","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}]},{"id":"m2-tj-nastain","a":[5,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"المد العارض للسكون: حرف مد بعده سكون عارض عند الوقف. مثاله في الدرس: ﴿نَسْتَعِينُ﴾ عند الوقف عليها، وهو مثال الناظم نفسه.","g":"","b":[],"q":[{"t":"وَمِثْلُ ذَا إِنْ عَرَضَ السُّكُونُ ... وَقْفًا كَتَعْلَمُونَ نَسْتَعِينُ","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":7,"h":null,"ch":"أحكام المد","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}]}]},{"name":"الوقف والابتداء","taf":false,"p":"q","items":[{"id":"m2-waqf-fatiha","a":[1,7],"lv":["التمكين"],"st":"ثابت","s":"قال الداني: الوقف على ﴿مالك يوم الدين﴾ تام، وعلى ﴿إياك نستعين﴾ تام لانقضاء الثناء على الله، وعلى ﴿أنعمت عليهم﴾ حسن فقط لتعلق ما بعده به، وعلى ﴿ولا الضالين﴾ تام. والوقف على رأس كل آية منها حسن، وبه وردت السنة.","g":"","b":[],"q":[{"t":"وعلى قوله ﴿مالك يوم الدين﴾ تام، لأن ما بعده مستغن. وعلى ﴿إياك نستعين﴾ تام، لأنه انقضاء الثناء على الله ﷿. وعلى ﴿أنعمت عليهم﴾ حسن، وليس بتام ولا كاف","src":"المكتفى في الوقف والابتدا","au":"الداني","v":null,"p":17,"h":null,"ch":"أم القرآن سورة أم القرآن","ed":"دار عمار، الأولى ١٤٢٢ هـ - ٢٠٠١ م؛ تحقيق: محيي الدين عبد الرحمن رمضان"},{"t":"وإن وقف على رأس كل آية من هذه السورة على مراد التقطيع والترتيل فحسن، وقد وردت السنة بذلك عن رسول الله.","src":"المكتفى في الوقف والابتدا","au":"الداني","v":null,"p":17,"h":null,"ch":"أم القرآن سورة أم القرآن","ed":"دار عمار، الأولى ١٤٢٢ هـ - ٢٠٠١ م؛ تحقيق: محيي الدين عبد الرحمن رمضان"}]}]},{"name":"القراءات","taf":false,"p":"q","items":[{"id":"m-qir-malik","a":[4,4],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قرأ عاصم والكسائي ويعقوب ﴿مالك﴾ بالألف، وقرأ الباقون ﴿ملك﴾.","g":"","b":[],"q":[{"t":"قَرَأَ عَاصِمٌ وَالْكِسَائِيُّ وَيَعْقُوبُ ﴿مَالِكِ﴾ وَقَرَأَ الْآخَرُونَ ﴿مَلِكِ﴾","src":"معالم التنزيل","au":"البغوي","v":"1","p":53,"h":null,"ch":"الفاتحة › ١","ed":"دار طيبة للنشر والتوزيع، الرابعة، ١٤١٧ هـ - ١٩٩٧ م؛ تحقيق: حققه وخرج أحاديثه محمد عبد الله النمر - عثمان جمعة ضميرية - سليمان مسلم الحرش"}]}]},{"name":"المفردات","taf":false,"p":"3","items":[{"id":"m-voc-bismillah","a":[1,1],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«بسم الله»: أبدأ باسم الله.","g":"","b":[],"q":[{"t":"﴿بِسْمِ اللَّهِ﴾ اختصار كأنه قال: أبدأ باسم الله. أو بدأت باسم الله.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":38,"h":null,"ch":"غريب القرآن › سورة الحمد","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"}]},{"id":"m-voc-alamin","a":[2,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«العالمين»: أصناف الخلق، وعند السعدي: كل من سوى الله.","g":"","b":[],"q":[{"t":"و (العالَمُونَ) أصناف الخلق الرُّوحانِيِّين، وهم الإنس والجن والملائكة، كلُّ صِنْفٍ منهم عالَم.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":38,"h":null,"ch":"غريب القرآن › سورة الحمد","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"},{"t":"الرب، هو المربي جميع العالمين -وهم من سوى الله-","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-voc-hamd","a":[2,2],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"«الحمد» أعم من الشكر: يكون على النعمة وعلى الصفات، والشكر لا يكون إلا على النعمة.","g":"","b":[],"q":[{"t":"وَالشُّكْرُ لَا يَكُونُ إِلَّا عَلَى النِّعْمَةِ، فَالْحَمْدُ أَعَمُّ مِنَ الشُّكْرِ إِذْ لَا يُقَالُ شَكَرْتُ فُلَانًا عَلَى عِلْمِهِ","src":"معالم التنزيل","au":"البغوي","v":"1","p":52,"h":null,"ch":"الفاتحة › ١","ed":"دار طيبة للنشر والتوزيع، الرابعة، ١٤١٧ هـ - ١٩٩٧ م؛ تحقيق: حققه وخرج أحاديثه محمد عبد الله النمر - عثمان جمعة ضميرية - سليمان مسلم الحرش"}]},{"id":"m-voc-din","a":[4,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«يوم الدين»: يوم القيامة، يوم الجزاء والحساب.","g":"","b":[],"q":[{"t":"و ﴿يَوْمِ الدِّينِ﴾ يوم القيامة. سمِّي بذلك لأنه يوم الجزاء والحساب","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":38,"h":null,"ch":"غريب القرآن › سورة الحمد","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"}]},{"id":"m-voc-ibada","a":[5,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"العبادة: اسم جامع لكل ما يحبه الله ويرضاه من الأقوال والأعمال الظاهرة والباطنة. والاستعانة: الاعتماد على الله في جلب النفع ودفع الضر مع الثقة به.","g":"","b":[],"q":[{"t":"و ﴿العبادة﴾ اسم جامع لكل ما يحبه الله ويرضاه من الأعمال، والأقوال الظاهرة والباطنة. و ﴿الاستعانة﴾ هي الاعتماد على الله تعالى في جلب المنافع، ودفع المضار، مع الثقة به في تحصيل ذلك.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-voc-sirat","a":[6,6],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«الصراط»: الطريق، وأصله في اللغة الطريق الواضح.","g":"","b":[],"q":[{"t":"و ﴿الصِّرَاطَ﴾ الطريق.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":38,"h":null,"ch":"غريب القرآن › سورة الحمد","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"},{"t":"وَأَصْلُهُ فِي اللُّغَةِ الطَّرِيقُ الْوَاضِحُ.","src":"معالم التنزيل","au":"البغوي","v":"1","p":54,"h":null,"ch":"الفاتحة › ١","ed":"دار طيبة للنشر والتوزيع، الرابعة، ١٤١٧ هـ - ١٩٩٧ م؛ تحقيق: حققه وخرج أحاديثه محمد عبد الله النمر - عثمان جمعة ضميرية - سليمان مسلم الحرش"}]}]},{"name":"التزكية","taf":false,"p":"3","items":[{"id":"m-taz-daily","a":[6,6],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"دعاء الهداية من أجمع الأدعية وأنفعها، ولضرورة العبد إليه وجب أن يدعو به في كل ركعة.","g":"","b":[],"q":[{"t":"فهذا الدعاء من أجمع الأدعية وأنفعها للعبد ولهذا وجب على الإنسان أن يدعو الله به في كل ركعة من صلاته، لضرورته إلى ذلك.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taz-ibada","a":[5,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"القيام بعبادة الله والاستعانة به هو سبيل السعادة والنجاة، ولا تكون العبادة عبادة إلا إذا أُخذت عن رسول الله ﷺ وقُصد بها وجه الله.","g":"","b":[],"q":[{"t":"والقيام بعبادة الله والاستعانة به هو الوسيلة للسعادة الأبدية، والنجاة من جميع الشرور","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وإنما تكون العبادة عبادة، إذا كانت مأخوذة عن رسول الله ﷺ مقصودا بها وجه الله.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taz-hudur","a":[1,7],"lv":["التأسيس","التمكين"],"st":"","s":"حضور القلب مع آيات الفاتحة في الصلاة: مع ﴿الرحمن الرحيم﴾ تستحضر أنواع لطفه فينبعث رجاؤك، ومع ﴿مالك يوم الدين﴾ تستثير التعظيم والخوف، ومع ﴿إياك نعبد﴾ تجدد الإخلاص، ومع ﴿وإياك نستعين﴾ تجدد العجز والحاجة والتبرؤ من الحول والقوة، ثم تسأل أهم حاجاتك: ﴿اهدنا الصراط المستقيم﴾، ثم تلتمس الإجابة بـ«آمين».","g":"","b":["m-taf-rahman","m-taf-malik","m-taf-iyyaka","m-taf-ihdina","m-had-qusimat"],"q":[{"t":"وتفهم معنى ما تتلو، وأحضر التفهم بقلبك عند قولك: ﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾، واستحضر لطفه عند قولك: ﴿الرَّحْمَنِ الرَّحِيمِ﴾، وعظمته عند قولك: ﴿مَالِكِ يَوْمِ الدِّينِ﴾ , وكذلك فى جميع ما تتلو.","src":"مختصر منهاج القاصدين","au":"ابن قدامة المقدسي","v":null,"p":32,"h":null,"ch":"الربع الأول من الكتاب: ربع العبادات › كتاب: الطهارة وأسرارها والصلاة وما يتعلق بها › ١ ـ فصل [في فضائل الصلاة]","ed":"مكتَبَةُ دَارِ البَيَانْ، دمشق، ١٣٩٨ هـ - ١٩٧٨ م"},{"t":"وعماد الصلاة الخشوع، وحضور القلب مع القراءة والذكر بالتفهم.","src":"بداية الهداية","au":"أبو حامد الغزالي","v":null,"p":47,"h":null,"ch":"القسم الأول في الطاعات › آداب الصلاة","ed":"مكتبة مدبولي، القاهرة، الأولى، ١٤١٣ هـ - ١٩٩٣ م"},{"t":"فَإِذَا قُلْتَ الرَّحْمَنِ الرَّحِيمِ فَأَحْضِرْ فِي قَلْبِكَ جَمِيعَ أَنْوَاعِ لطفه لتتضح لك رحمته فينبعث بها رَجَاؤُكَ\nثُمَّ اسْتَثِرْ مِنْ قَلْبِكَ التَّعْظِيمَ وَالْخَوْفَ بِقَوْلِكَ مَالِكِ يَوْمِ الدِّينِ","src":"إحياء علوم الدين","au":"أبو حامد الغزالي","v":"1","p":167,"h":null,"ch":"ربع العبادات › كتاب أسرار الصلاة ومهماتها › الباب الثالث في الشروط الباطنة من أعمال القلب › بيان تفصيل ما ينبغي أن يحضر في القلب عند كل ركن وشرط من أعمال الصلاة","ed":"دار المعرفة - بيروت"},{"t":"ثُمَّ جَدِّدِ الْإِخْلَاصَ بِقَوْلِكَ إِيَّاكَ نعبد وجدد العجز والاحتياج والتبري مِنَ الْحَوْلِ وَالْقُوَّةِ بِقَوْلِكَ وَإِيَّاكَ نَسْتَعِينُ","src":"إحياء علوم الدين","au":"أبو حامد الغزالي","v":"1","p":168,"h":null,"ch":"ربع العبادات › كتاب أسرار الصلاة ومهماتها › الباب الثالث في الشروط الباطنة من أعمال القلب › بيان تفصيل ما ينبغي أن يحضر في القلب عند كل ركن وشرط من أعمال الصلاة","ed":"دار المعرفة - بيروت"},{"t":"فعين سؤالك ولا تطلب إلا أهم حاجاتك وَقُلِ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","src":"إحياء علوم الدين","au":"أبو حامد الغزالي","v":"1","p":168,"h":null,"ch":"ربع العبادات › كتاب أسرار الصلاة ومهماتها › الباب الثالث في الشروط الباطنة من أعمال القلب › بيان تفصيل ما ينبغي أن يحضر في القلب عند كل ركن وشرط من أعمال الصلاة","ed":"دار المعرفة - بيروت"},{"t":"ثم التمس الإجابة وقل آمين","src":"إحياء علوم الدين","au":"أبو حامد الغزالي","v":"1","p":168,"h":null,"ch":"ربع العبادات › كتاب أسرار الصلاة ومهماتها › الباب الثالث في الشروط الباطنة من أعمال القلب › بيان تفصيل ما ينبغي أن يحضر في القلب عند كل ركن وشرط من أعمال الصلاة","ed":"دار المعرفة - بيروت"},{"t":"فإذا قلت : ( الرحمن الرحيم ) فأحضر في قلبك أنواع لطفه لتتضح لك رحمته ، فينبعث بها رجاؤك . ثم استثر من قلبك التعظيم والخوف بقولك : ( مالك
