ة الثانية من الأقسام الخمسة، وتسهيلها عندهم أن تجعل في القسم الأول والثاني بين بين، وتبدل في القسم الثالث واوا محضة","src":"النشر في القراءات العشر","au":"ابن الجزري","v":"1","p":388,"h":null,"ch":"باب في الهمزتين المجتمعتين من كلمتين › المختلفتان","ed":"المطبعة التجارية الكبرى [تصوير دار الكتاب العلمية]؛ تحقيق: علي محمد الضباع (المتوفى ١٣٨٠ هـ)"},{"t":"مضمومة ومفتوحة، ووقع متفقا عليه ومختلفا فيه، فالمتفق عليه أحد عشر موضعا، وهي (السفهاء ألا) في البقرة","src":"النشر في القراءات العشر","au":"ابن الجزري","v":"1","p":386,"h":null,"ch":"باب في الهمزتين المجتمعتين من كلمتين › المختلفتان","ed":"المطبعة التجارية الكبرى [تصوير دار الكتاب العلمية]؛ تحقيق: علي محمد الضباع (المتوفى ١٣٨٠ هـ)"}]}]},{"name":"المفردات","taf":false,"p":"3","items":[{"id":"m-voc-sufaha","a":[13,13],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«السفهاء»: الجهلة، والسفه: الجهل.","g":"","b":[],"q":[{"t":"﴿قَالُوا أَنُؤْمِنُ كَمَا آمَنَ السُّفَهَاءُ﴾ ؟! أي: الجهلة","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":41,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"}]},{"id":"m-voc-yamudd","a":[15,15],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«يمدهم»: يتمادى بهم ويطيل لهم. «طغيانهم»: عتوهم وتكبرهم. «يعمهون»: يركبون رؤوسهم فلا يبصرون.","g":"","b":[],"q":[{"t":"﴿وَيَمُدُّهُمْ﴾ أي: يتمادى بهم، ويطيل لهم.\n﴿فِي طُغْيَانِهِمْ﴾ أي: في عُتُوِّهِمْ وتكبُّرهم.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":41,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"},{"t":"﴿يَعْمَهُونَ﴾ يركبون رءُوسهم فلا يُبصرون.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":41,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"}]},{"id":"m-voc-ishtaraw","a":[16,16],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«اشتروا الضلالة بالهدى»: استبدلوا.","g":"","b":[],"q":[{"t":"﴿أُولَئِكَ الَّذِينَ اشْتَرَوُا الضَّلالَةَ بِالْهُدَى﴾ أي: استبد  مرتبطة بآيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مقاصد سورة البقرة مسجلة في الدرس الثاني (أول السورة)؛ ولم يُذكر لهذا المقطع مقصد مستقل في المصادر."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يُسجّل في آيات هذا الدرس خلاف معتبر يحتاج إلى بيان أسبابه غير ما سُجّل في القراءات والوقف."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":[]},{"n":5,"surah":"البقرة","from":17,"to":20,"title":"البقرة ١٧–٢٠: مثلا المنافقين","theme":"مثلان يكشفان حال المنافقين: مستوقد النار الذي ذهب نوره فبقي في الظلمات، وأصحاب الصيب الذين يجعلون أصابعهم في آذانهم حذر الموت.","sections":[{"name":"العقيدة","taf":false,"p":"1","items":[{"id":"m-aq-qudra","a":[20,20],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"في ﴿إن الله على كل شيء قدير﴾ رد على القدرية القائلين إن أفعال العباد غير داخلة في قدرة الله؛ لأن أفعالهم من جملة الأشياء.","g":"","b":[],"q":[{"t":"وفي هذه الآية وما أشبهها، رد على القدرية القائلين بأن أفعالهم غير داخلة في قدرة الله تعالى، لأن أفعالهم من جملة الأشياء الداخلة في قوله: ﴿إِنَّ اللَّهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ﴾ .","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"فَدَخَلَ فِيهِ الْأَعْيَانُ وَالْأَفْعَالُ مِنَ الْخَيْرِ وَالشَّرِّ","src":"الاعتقاد والهداية إلى سبيل الرشاد","au":"البيهقي","v":null,"p":142,"h":null,"ch":"باب القول في خلق الأفعال قال الله ﷿ ذلكم الله ربكم خالق كل شيء فدخل فيه الأعيان والأفعال من الخير والشر، وقال: أم جعلوا لله شركاء خلقوا كخلقه فتشابه الخلق عليهم قل الله خالق كل شيء فنفى أن يكون خالق غيره ونفى أن يكون شيء سواه غير مخلوق، فلو كانت","ed":"دار الآفاق الجديدة - بيروت، الأولى، ١٤٠١؛ تحقيق: أحمد عصام الكاتب"},{"t":"فَلَوْ كَانَتِ الْأَفْعَالُ غَيْرَ مَخْلُوقَةٍ لَكَانَ اللَّهُ سُبْحَانَهُ خَالِقَ بَعْضِ الْأَشْيَاءِ دُونَ جَمِيعِهَا، وَهَذَا خِلَافُ الْآيَةِ","src":"الاعتقاد والهداية إلى سبيل الرشاد","au":"البيهقي","v":null,"p":142,"h":null,"ch":"باب القول في خلق الأفعال قال الله ﷿ ذلكم الله ربكم خالق كل شيء فدخل فيه الأعيان والأفعال من الخير والشر، وقال: أم جعلوا لله شركاء خلقوا كخلقه فتشابه الخلق عليهم قل الله خالق كل شيء فنفى أن يكون خالق غيره ونفى أن يكون شيء سواه غير مخلوق، فلو كانت","ed":"دار الآفاق الجديدة - بيروت، الأولى، ١٤٠١؛ تحقيق: أحمد عصام الكاتب"}]}]},{"name":"تحليل الحديث","taf":true,"p":"1","items":[{"id":"m3-ha-suddi","a":[19,19],"lv":["التفقّه"],"st":"يحتاج تحققًا","s":"رواية الرجلين من المنافقين أخرجها ابن جرير من طريق السدي بإسناده عن أبي مالك وأبي صالح عن ابن عباس، وعن مرة عن ابن مسعود وناس من الصحابة. قال السيوطي: لم يورد ابن أبي حاتم من هذا التفسير شيئًا لأنه التزم أصح ما ورد، والحاكم يصحح منه طريق مرة عن ابن مسعود وناس فقط.","g":"","b":[],"q":[{"t":"وَلَمْ يُورِدْ مِنْهُ ابْنُ أَبِي حَاتِمٍ شَيْئًا لِأَنَّهُ الْتَزَمَ أَنْ يُخَرِّجَ أَصَحَّ مَا وَرَدَ وَالْحَاكِمُ يُخَرِّجُ مِنْهُ فِي مُسْتَدْرَكِهِ أَشْيَاءَ وَيُصَحِّحُهُ لَكِنْ مِنْ طَرِيقِ مُرَّةَ عَنِ ابْنِ مَسْعُودٍ وَنَاسٍ فَقَطْ دُونَ الطَّرِيقِ الْأَوَّلِ","src":"الإتقان","au":"السيوطي","v":"4","p":238,"h":null,"ch":"المجلد الرابع › النوع الثمانون: في طبقات المفسرين","ed":"الهيئة المصرية العامة للكتاب، ١٣٩٤ هـ/ ١٩٧٤ م؛ تحقيق: محمد أبو الفضل إبراهيم [ت ١٤٠١ هـ]"},{"t":"مسعود وناس من الصحابة قالوا كان رجلان من المنافقين","src":"لباب النقول","au":"السيوطي","v":null,"p":8,"h":null,"ch":"سورة البقرة","ed":"دار الكتب العلمية بيروت - لبنان"}]}]},{"name":"السيرة","taf":false,"p":"1","items":[{"id":"m2-sir-haqq","a":[20,20],"lv":["التفقّه"],"st":"يحتاج تحققًا","s":"فسر ابن إسحاق ﴿كلما أضاء لهم مشوا فيه﴾ بأنهم يعرفون الحق ويتكلمون به، فإذا ارتكسوا منه وقفوا.","g":"","b":[],"q":[{"t":"كُلَّمَا أَضَاءَ لَهُمْ مَشَوْا فِيهِ وَإِذَا أَظْلَمَ عَلَيْهِمْ قَامُوا﴾ أَيْ: يَعْرِفُونَ الْحَقَّ وَيَتَكَلَّمُونَ بِهِ","src":"السيرة النبوية","au":"ابن هشام","v":"2","p":129,"h":null,"ch":"المجلد: الثاني › المتن","ed":"شركة الطباعة الفنية المتحدة [وأعاد المحقق نشرها -مع تعديلات طفيفة- لدى مكتبة الكليات الأزهرية بالقاهرة، وكذلك نشرتها دار الجيل بيروت، بنفس ترقيم الصفحات]"}]}]},{"name":"أسباب النزول","taf":false,"p":"1","items":[{"id":"m-asb-sayyib","a":[19,20],"lv":["التفقّه"],"st":"يحتاج تحققًا","s":"روى ابن جرير من طريق السدي أن رجلين من المنافقين هربا إلى المشركين فأصابهما مطر فيه رعد وبرق، ثم رجعا وأسلما، فضرب الله شأنهما مثلًا. والرواية تحتاج تحققًا.","g":"رواية تحتاج تحققًا","b":[],"q":[{"t":"كان رجلان من المنافقين من أهل المدينة هربا من رسول الله إلى المشركين فأصابهما هذا المطر الذي ذكر الله فيه رعد شديد وصواعق وبرق","src":"لباب النقول","au":"السيوطي","v":null,"p":8,"h":null,"ch":"سورة البقرة","ed":"دار الكتب العلمية بيروت - لبنان"}]}]},{"name":"وجه الاستنباط","taf":true,"p":"1","items":[{"id":"m3-inf-qadariyya","a":[20,20],"lv":["التفقّه"],"st":"ثابت","s":"استدل السعدي بعموم ﴿إن الله على كل شيء قدير﴾ على الرد على القدرية؛ لأن أفعال العباد من جملة الأشياء الداخلة في هذا العموم.","g":"","b":[],"q":[{"t":"وفي هذه الآية وما أشبهها، رد على القدرية القائلين بأن أفعالهم غير داخلة في قدرة الله تعالى، لأن أفعالهم من جملة الأشياء الداخلة في قوله","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"المعنى الإجمالي","taf":false,"p":"2","items":[{"id":"m2-gm-mathal","a":[17,18],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"مثل المنافقين كمن استوقد نارًا في ظلمة شديدة، فلما أضاءت ما حوله ذهب نورها. فهم صم عن سماع الخير، بكم عن النطق به، عمي عن رؤية الحق، لا يرجعون إليه لأنهم تركوه بعد أن عرفوه.","g":"","b":[],"q":[{"t":"أي: مثلهم المطابق لما كانوا عليه كمثل الذي استوقد نارا، أي: كان في ظلمة عظيمة، وحاجة إلى النار شديدة","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"﴿فَهُمْ لا يَرْجِعُونَ﴾ لأنهم تركوا الحق بعد أن عرفوه، فلا يرجعون إليه","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التفسير","taf":false,"p":"2","items":[{"id":"m-taf-nari","a":[17,17],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"مثلهم كمن كان في ظلمة فاستوقد نارًا من غيره، فلما أضاءت ما حوله ذهب الله بنوره وبقي في ظلمات؛ كذلك المنافقون استوقدوا نار الإيمان من المؤمنين فانتفعوا بها في الدنيا، ثم هجم عليهم الموت فسلبهم ذلك.","g":"","b":[],"q":[{"t":"فكذلك هؤلاء المنافقون، استوقدوا نار الإيمان من المؤمنين، ولم تكن صفة لهم، فانتفعوا بها (١) وحقنت بذلك دماؤهم، وسلمت أموالهم، وحصل لهم نوع من الأمن في الدنيا، فبينما هم على ذلك (٢) إذ هجم عليهم الموت، فسلبهم الانتفاع بذلك النور","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-summ","a":[18,18],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿صم﴾ عن سماع الخير، ﴿بكم﴾ عن النطق به، ﴿عمي﴾ عن رؤية الحق، ﴿فهم لا يرجعون﴾ لأنهم تركوا الحق بعد أن عرفوه.","g":"","b":[],"q":[{"t":"﴿صُمٌّ﴾ أي: عن سماع الخير، ﴿بُكْمٌ﴾ [أي] : عن النطق به، ﴿عُمْيٌ﴾ عن رؤية الحق، ﴿فَهُمْ لا يَرْجِعُونَ﴾ لأنهم تركوا الحق بعد أن عرفوه، فلا يرجعون إليه","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-mai","a":[19,20],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"والمثل الثاني: كصاحب مطر فيه ظلمات ورعد وبرق؛ كذلك المنافقون إذا سمعوا القرآن ووعده ووعيده جعلوا أصابعهم في آذانهم وأعرضوا، والله محيط بهم قدرة وعلمًا.","g":"","b":[],"q":[{"t":"فهكذا حال (٥) المنافقين، إذا سمعوا القرآن وأوامره ونواهيه ووعده ووعيده، جعلوا أصابعهم في آذانهم، وأعرضوا عن أمره ونهيه ووعده ووعيده","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وأما المنافقون فأنى لهم السلامة، وهو تعالى محيط بهم، قدرة وعلما فلا يفوتونه ولا يعجزونه","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ١٧","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"السياق","taf":false,"p":"2","items":[{"id":"m2-ctx-mathalan","a":[17,20],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال البقاعي: لما عُلم ذلك كله وكانت الأمثال ألصق بالبال وأكشف للأحوال، ضرب لهم الأمثال.","g":"","b":[],"q":[{"t":"فلما علم ذلك كله وكانت الأمثال ألصق بالبال وأكشف للأحوال","src":"نظم الدرر","au":"البقاعي","v":"1","p":118,"h":null,"ch":"البقرة › ١٧","ed":"دائرة المعارف العثمانية، حيدر آباد - الهند، الأولى، (١٣٨٩ - ١٤٠٤ هـ) (١٩٦٩ - ١٩٨٤ م)"}]}]},{"name":"المتشابهات","taf":false,"p":"2","items":[{"id":"m2-mut-yarjiun","a":[18,18],"lv":["التفقّه"],"st":"ثابت","s":"ختمت الآية هنا بـ﴿فهم لا يرجعون﴾ وفي آية الناعق (البقرة ١٧١) بـ﴿فهم لا يعقلون﴾؛ لأنه مثّل حال المنافقين بمستوقد النار الذي ذهب ضوؤه، فنفى عنهم وجود ما يرجعون إليه من ضياء.","g":"","b":[],"q":[{"t":"والجواب عنه: أنه لما مثل حال المنافقين بحال مستوقد النار لطلب الإضاءة وأنه لما أضاءت ما حولها أذهبها الله وطفيت فلم يكن له ما يستضئ به ويرجع إليه","src":"ملاك التأويل","au":"ابن الزبير الغرناطي","v":"1","p":25,"h":null,"ch":"سورة البقرة","ed":"دار الكتب العلمية، بيروت - لبنان"}]}]},{"name":"اللغة والإعراب","taf":true,"p":"2","items":[{"id":"m2-irab-mathal","a":[17,17],"lv":["التفقّه"],"st":"ثابت","s":"قال النحاس: ﴿مثلهم﴾ مبتدأ، و﴿كمثل الذي﴾ خبره، والكاف بمعنى «مثل».","g":"","b":[],"q":[{"t":"كَمَثَلِ الَّذِي خبره والكاف بمعنى مثل والَّذِي خفض بالإضافة.","src":"إعراب القرآن","au":"النحاس","v":"1","p":33,"h":null,"ch":"[٢] شرح إعراب سورة البقرة › [سورة البقرة (٢) : آية ١٧]","ed":"منشورات محمد علي بيضون، دار الكتب العلمية، بيروت، الأولى، ١٤٢١ هـ"}]}]},{"name":"التجويد","taf":false,"p":"q","items":[{"id":"m2-tj-summun","a":[18,18],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإقلاب: النون الساكنة والتنوين قبل الباء تُقلب ميمًا مخفاة مع الغنة. مثاله في الدرس: ﴿صُمٌّ بُكْمٌ﴾.","g":"","b":[],"q":[{"t":"وَالثَّالثُ الإِقْلاَبُ عِنْدَ الْبَاءِ هـ)"}],"sh":2}]},{"name":"المفردات","taf":false,"p":"3","items":[{"id":"m-voc-istawqad","a":[17,17],"lv":["التأسيس"],"st":"ثابت","s":"«استوقد نارًا»: أوقدها.","g":"","b":[],"q":[{"t":"و ﴿الَّذِي اسْتَوْقَدَ نَارًا﴾ أي: أوْقَدَها.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":42,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"}]},{"id":"m-voc-sayyib","a":[19,19],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«الصيّب»: المطر، من «صاب يصوب» إذا نزل من السماء.","g":"","b":[],"q":[{"t":"و (الصَّيِّبُ) المطر؛ \"فَيْعِل\" من \"صَابَ يَصُوبُ\": إذا نزل من السماء.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":42,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"}]},{"id":"m-voc-yakhtaf","a":[20,20],"lv":["التأسيس"],"st":"ثابت","s":"«يخطف أبصارهم»: يذهب بها.","g":"","b":[],"q":[{"t":"﴿يَخْطَفُ أَبْصَارَهُمْ﴾ يَذْهَب بها.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":42,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"}]}]},{"name":"التدبر","taf":false,"p":"3","items":[{"id":"m-tad-noor","a":[17,18],"lv":["التأسيس","التمكين"],"st":"","s":"نور الإيمان لا ينفع من استعاره ظاهرًا ولم يجعله صفة له؛ فالإيمان يُطلب في القلب لا في المظهر.","g":"","b":["m-taf-nari"],"q":[]}]},{"name":"التطبيق","taf":false,"p":"3","items":[{"id":"m-app-listen","a":[19,19],"lv":["التأسيس"],"st":"","s":"استمع اليوم إلى آيات فيها وعد ووعيد، وأقبل عليها بقلبك بدل الإعراض عنها.","g":"","b":["m-taf-mai"],"q":[]}]}],"gaps":[{"f":"علوم القرآن","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لا مسألة من علوم القرآن خاصة بآيات هذا الدرس غير ما سُجّل في أقسام القراءات والوقف والمتشابه."},{"f":"الحديث","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يذكر ابن كثير في تفسير آيات هذا الدرس حديثًا من الصحيحين، ولم يوجد في مصادر البطاقة حديث مرتبط بها مباشرة."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في آيات الدرس في القرطبي (مسائله الفقهية) وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من هذه الآيات."},{"f":"المناسبات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ربط الأمثال بما قبلها منقول من نظم الدرر في قسم السياق."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في هذه الآيات مسجلة ضمن التفسير منسوبة إلى أصحابها، ولم تُفرد لها مادة مستقلة."},{"f":"التزكية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مادة التزكية هنا مسجلة في التدبر؛ ولم يوجد في رياض الصالحين والأذكار نص مرتبط بالآيات مباشرة."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مقاصد سورة البقرة مسجلة في الدرس الثاني (أول السورة)؛ ولم يُذكر لهذا المقطع مقصد مستقل في المصادر."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يُسجّل في آيات هذا الدرس خلاف معتبر يحتاج إلى بيان أسبابه غير ما سُجّل في القراءات والوقف."}],"unc":["رواية الرجلين من المنافقين.","قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":[]},{"n":6,"surah":"البقرة","from":21,"to":24,"title":"البقرة ٢١–٢٤: الأمر بالعبادة والتحدي بالقرآن","theme":"أول أمر في المصحف: عبادة الرب الخالق الرازق وحده وترك الأنداد، ثم التحدي بالإتيان بسورة من مثل القرآن دليلًا على صدق الرسول ﷺ.","sections":[{"name":"العقيدة","taf":false,"p":"1","items":[{"id":"m-aq-rububiyya","a":[21,22],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الآية جمعت بين الأمر بعبادة الله وحده والنهي عن عبادة غيره، ودليل ذلك توحيد الربوبية: فمن أقر أنه لا شريك لله في الخلق والرزق والتدبير لزمه أن لا يشرك به في العبادة.","g":"","b":[],"q":[{"t":"وهذه الآية جمعت بين الأمر بعبادة الله وحده، والنهي عن عبادة ما سواه، وبيان الدليل الباهر على وجوب عبادته، وبطلان عبادة من سواه","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ٢١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"فإذا كان كل أحد مقرا بأنه ليس له شريك في ذلك، فكذلك فليكن إقراره بأن [الله] لا شريك له في العبادة","src":"تفسير السعدي","au":"السعدي","v":null,"p":44,"h":null,"ch":"البقرة › ٢١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-aq-nar","a":[24,24],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"في ﴿أعدت للكافرين﴾ دليل لأهل السنة على أن الجنة والنار مخلوقتان الآن، وأن الموحدين من أهل الكبائر لا يخلدون في النار.","g":"","b":[],"q":[{"t":"دليل لمذهب أهل السنة والجماعة، أن الجنة والنار مخلوقتان خلافا للمعتزلة، وفيها أيضا، أن الموحدين وإن ارتكبوا بعض الكبائر لا يخلدون في النار","src":"تفسير السعدي","au":"السعدي","v":null,"p":45,"h":null,"ch":"البقرة › ٢٣","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وَالْجَنَّةُ وَالنَّارُ مَخْلُوقَتَانِ , قَدْ خُلِقَتَا كَمَا جَاءَ عَنْ رَسُولِ اللَّهِ ﷺ","src":"شرح أصول اعتقاد أهل السنة والجماعة","au":"اللالكائي","v":"1","p":175,"h":null,"ch":"باب سياق ذكر من رسم بالإمامة في السنة › اعتقاد أحمد بن حنبل رضي الله عنه","ed":"دار طيبة - السعودية، الثامنة، ١٤٢٣ هـ / ٢٠٠٣ م؛ تحقيق: أحمد بن سعد بن حمدان الغامدي [ت ١٤٣٤ هـ]"},{"t":"وَالَّذِي عِنْدَنَا أَنْ نَقُولَ: لَا يُخَلَّدُ مُوَحِّدٌ فِي النَّارِ","src":"شرح أصول اعتقاد أهل السنة والجماعة","au":"اللالكائي","v":"1","p":193,"h":null,"ch":"باب سياق ذكر من رسم بالإمامة في السنة › اعتقاد أبي ثور إبراهيم بن خالد الكلبي الفقيه رحمه الله","ed":"دار طيبة - السعودية، الثامنة، ١٤٢٣ هـ / ٢٠٠٣ م؛ تحقيق: أحمد بن سعد بن حمدان الغامدي [ت ١٤٣٤ هـ]"}]},{"id":"m-aq-abd","a":[23,23],"lv":["التمكين"],"st":"ثابت","s":"وصف الرسول ﷺ بالعبودية في مقام إنزال القرآن دليل على أن أعظم أوصافه قيامه بالعبودية.","g":"","b":[],"q":[{"t":"وفي وصف ا ":null,"ch":"البقرة › ٢١","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-tahaddi","a":[23,24],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"دليل على صدق الرسول ﷺ: إن كنتم في شك فأتوا بسورة من مثله واستعينوا بمن شئتم، ولن تفعلوا؛ فاتقوا النار التي وقودها الناس والحجارة أُعدت للكافرين.","g":"","b":[],"q":[{"t":"وهذا دليل عقلي على صدق رسول الله ﷺ، وصحة ما جاء به","src":"تفسير السعدي","au":"السعدي","v":null,"p":45,"h":null,"ch":"البقرة › ٢٣","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وهذه الآية ونحوها يسمونها آيات التحدي، وهو تعجيز الخلق أن يأتوا بمثل هذا القرآن","src":"تفسير السعدي","au":"السعدي","v":null,"p":45,"h":null,"ch":"البقرة › ٢٣","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"السياق","taf":false,"p":"2","items":[{"id":"m2-ctx-fariqayn","a":[21,21],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"قال ابن إسحاق: الخطاب في ﴿يا أيها الناس اعبدوا ربكم﴾ للفريقين جميعًا: الكفار والمنافقين، أي: وحّدوا.","g":"","b":[],"q":[{"t":"لِلْفَرِيقَيْنِ جَمِيعًا: مِنْ الْكُفَّارِ وَالْمُنَافِقِينَ. أَيْ وحِّدوا","src":"السيرة النبوية","au":"ابن هشام","v":"2","p":129,"h":null,"ch":"المجلد: الثاني › المتن","ed":"شركة الطباعة الفنية المتحدة [وأعاد المحقق نشرها -مع تعديلات طفيفة- لدى مكتبة الكليات الأزهرية بالقاهرة، وكذلك نشرتها دار الجيل بيروت، بنفس ترقيم الصفحات]"}]}]},{"name":"علوم القرآن","taf":false,"p":"2","items":[{"id":"m-qs-ya-ayyuha","a":[21,21],"lv":["التفقّه"],"st":"خلاف معتبر","s":"قال علقمة: كل شيء نزل فيه ﴿يا أيها الناس﴾ فهو مكي، و﴿يا أيها الذين آمنوا﴾ فهو مدني؛ وعلى هذا عدّ الواحدي خطاب هذه الآية لمشركي مكة، مع أن السورة مدنية.","g":"","b":[],"q":[{"t":"عَنْ عَلْقَمَةَ قَالَ: كُلُّ شَيْءٍ نَزَلَ فِيهِ: ﴿يَا أَيّهَا النَّاسُ﴾ فَهُوَ مَكِّيٌّ وَ ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا﴾ فَهُوَ مَدَنِيٌّ","src":"أسباب النزول","au":"الواحدي","v":null,"p":22,"h":null,"ch":"سورة البقرة","ed":"دار الإصلاح - الدمام، الثانية، ١٤١٢ هـ - ١٩٩٢ م؛ تحقيق: عصام بن عبد المحسن الحميدان"}]},{"id":"m2-qs-tartib","a":[21,21],"lv":["التفقّه"],"st":"ثابت","s":"ذكر الكرماني أن ترتيب المصحف: الفاتحة ثم البقرة ثم آل عمران إلى الناس، وأن النبي ﷺ كان يعرضه على جبريل كل سنة، وعرضه مرتين في السنة التي توفي فيها.","g":"","b":[],"q":[{"t":"قلت أول الْقُرْآن سُورَة الْفَاتِحَة ثمَّ الْبَقَرَة ثمَّ آل عمرَان على هَذَا التَّرْتِيب إِلَى سُورَة النَّاس","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":68,"h":null,"ch":"سورة البقرة","ed":"تحقيق: عبد القادر أحمد عطا [ت ١٤٠٣ هـ]"}]}]},{"name":"المتشابهات","taf":false,"p":"2","items":[{"id":"m2-mut-yaayyuha","a":[21,21],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال الكرماني: ﴿يا أيها الناس اعبدوا ربكم﴾ ليس في القرآن غيره؛ لأن العبادة هنا التوحيد، وهو أول ما يلزم العبد، فكان أول خطاب خاطب الله به الناس في المصحف.","g":"","b":[],"q":[{"t":"لِأَن الْعِبَادَة فِي الْآيَة التَّوْحِيدوالتوحيد أول مَا يلْزم العَبْد من المعارف فَكَانَ هَذَا أول خطاب خَاطب الله بِهِ النَّاس فِي الْقُرْآن","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":"67-68","h":null,"ch":"سورة البقرة","ed":"تحقيق: عبد القادر أحمد عطا [ت ١٤٠٣ هـ]"}]},{"id":"m2-mut-min-mithlih","a":[23,23],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"زيدت ﴿من﴾ في ﴿بسورة من مثله﴾ هنا دون غيرها؛ لأن البقرة سنام القرآن وأوله بعد الفاتحة، فدخول «من» يُعلم أن التحدي واقع على جميع سور القرآن.","g":"","b":[],"q":[{"t":"وَلما كَانَت هَذِه السُّورَة سَنَام الْقُرْآن وأوله بعد الْفَاتِحَة حسن دُخُول ﴿من﴾ فِيهَا ليعلم أَن التحدي وَاقع على جَمِيع سور الْقُرْآن من أَوله إِلَى آخِره","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":69,"h":null,"ch":"سورة البقرة","ed":"تحقيق: عبد القادر أحمد عطا [ت ١٤٠٣ هـ]"}]}]},{"name":"اللغة والإعراب","taf":true,"p":"2","items":[{"id":"m2-irab-yaayyuha","a":[21,21],"lv":["التفقّه"],"st":"ثابت","s":"قال النحاس: «يا» حرف نداء، و«أيّ» نداء مفرد مضموم.","g":"","b":[],"q":[{"t":"يا: حرف النداء، وأيّ: نداء مفرد ضمّ لأنه في موضع المكنيّ","src":"إعراب القرآن","au":"النحاس","v":"1","p":35,"h" هداءكم»: ادعوهم ليعاونوكم على سورة مثله، والدعاء هنا الاستغاثة.","g":"","b":[],"q":[{"t":"﴿وَادْعُوا شُهَدَاءَكُمْ﴾ أي: ادعوهم لِيُعَاوِنُوكم على سورةٍ مثلِه. ومعنى الدعاء هاهنا الاستغاثة.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":43,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"}]},{"id":"m-voc-waqud","a":[24,24],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«وقودها»: حطبها؛ الوَقود بالفتح الحطب، والوُقود بالضم توقّدها.","g":"","b":[],"q":[{"t":"﴿فَاتَّقُوا النَّارَ الَّتِي وَقُودُهَا النَّاسُ﴾ أي حطَبُها. والوَقود: الحطب؛ بفتح الواو. والوُقود بضمها: تَوَقُّدُها.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":43,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"}]}]},{"name":"التدبر","taf":false,"p":"3","items":[{"id":"m-tad-nimam","a":[22,22],"lv":["التأسيس","التمكين"],"st":"","s":"الأرض التي تمشي عليها والمطر والثمار التي تأكلها أدلة يومية على أن الذي أنعم بها هو المستحق للعبادة وحده.","g":"","b":["m-taf-dalil","m-aq-rububiyya"],"q":[]}]},{"name":"التطبيق","taf":false,"p":"3","items":[{"id":"m-app-nima","a":[22,22],"lv":["التأسيس"],"st":"","s":"عند طعامك اليوم تذكّر أن الماء والثمر من إنزال الله وإخراجه، واحمده عليه.","g":"","b":["m-taf-dalil"],"q":[]}]}],"gaps":[{"f":"أسباب النزول","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ليس في الواحدي ولباب النقول سبب نزول مخصوص لهذه الآيات؛ فيهما قول علقمة في المكي والمدني، وقد وُضع في علوم القرآن."},{"f":"الحديث","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يذكر ابن كثير في تفسير آيات هذا الدرس حديثًا من الصحيحين، ولم يوجد في مصادر البطاقة حديث مرتبط بها مباشرة."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في آيات الدرس في القرطبي (مسائله الفقهية) وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من هذه الآيات."},{"f":"السيرة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ما في سيرة ابن هشام عن هذه الآيات هو تعيين المخاطَبين، وقد سُجّل في قسم السياق."},{"f":"القراءات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في النشر (فرش البقرة)، ولم يُذكر فيه خلاف فرشي في الآيات ٢١–٢٤."},{"f":"المناسبات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"انتقال السورة من الأصناف الثلاثة إلى خطاب الناس جميعًا مسجل من سيرة ابن هشام في السياق؛ ولم يُستخرج نص مستقل من نظم الدرر لهذا الموضع."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في هذه الآيات مسجلة ضمن التفسير منسوبة إلى أصحابها، ولم تُفرد لها مادة مستقلة."},{"f":"التزكية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مادة التزكية هنا مسجلة في التدبر؛ ولم يوجد في رياض الصالحين والأذكار نص مرتبط بالآيات مباشرة."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مقاصد سورة البقرة مسجلة في الدرس الثاني (أول السورة)؛ ولم يُذكر لهذا المقطع مقصد مستقل في المصادر."},{"f":"تحليل الحديث","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لا حديث ولا رواية مسندة في بطاقة هذا الدرس."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يُسجّل في آيات هذا الدرس خلاف معتبر يحتاج إلى بيان أسبابه غير ما سُجّل في القراءات والوقف."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم.","مادة عقدية مصدرها تفسير السعدي وحده، ولم تُسند بعد إلى مرجع من مراجع العقيدة في القسم 4. تُوثَّق منها، أو تُرفع للمراجعة العلمية قبل اعتمادها (القسم 4، والبند 26)."],"dis":["قاعدة علقمة في ﴿يا أيها الناس﴾ مع أن السورة مدنية."]},{"n":7,"surah":"البقرة","from":25,"to":26,"title":"البقرة ٢٥–٢٦: بشارة المؤمنين وضرب الأمثال","theme":"بشارة المؤمنين العاملين بالجنات، وبيان أن الله لا يستحيي أن يضرب الأمثال بالحقير؛ فيزداد بها المؤمنون إيمانًا ويضل بها الفاسقون.","sections":[{"name":"تحليل الحديث","taf":true,"p":"1","items":[{"id":"m3-ha-asbab26","a":[26,26],"lv":["التفقّه"],"st":"ثابت","s":"في سبب نزول الآية ٢٦ روايتان، رجّح السيوطي أولاهما لأنها أصح إسنادًا وأنسب لسياق أول السورة، ولأن ذكر المشركين لا يلائم كون الآية مدنية؛ فهذا ترجيح بالإسناد وبالسياق معًا.","g":"","b":[],"q":[{"t":"قلت القول الأول أصح إسنادا وأنسب بما تقدم أول السورة وذكر المشركين لا يلائم كون الآية مدنية","src":"لباب النقول","au":"السيوطي","v":null,"p":9,"h":null,"ch":"سورة البقرة","ed":"دار الكتب العلمية بيروت - لبنان"}]}]},{"name":"أسباب النزول","taf":false,"p":"1","items":[{"id":"m-asb-26","a":[26,26],"lv":["التفقّه"],"st":"خلاف معتبر","s":"روي أن الآية نزلت لما ضرب الله مثلي المنافقين فقالوا: الله أجل من أن يضرب هذه الأمثال، وروي أنها نزلت لما ذكر الذباب والعنكبوت. ورجح السيوطي الأول لأنه أصح إسنادًا وأنسب لما في أول السورة.","g":"رواية تحتاج تحققًا","b":[],"q":[{"t":"قلت القول الأول أصح إسنادا وأنسب بما تقدم أول السورة وذكر المشركين لا يلائم كون الآية مدنية","src":"لباب النقول","au":"السيوطي","v":null,"p":9,"h":null,"ch":"سورة البقرة","ed":"دار الكتب العلمية بيروت - لبنان"}]}]},{"name":"وجه الاستنباط","taf":true,"p":"1","items":[{"id":"m3-inf-atf","a":[25,25],"lv":["التفقّه"],"st":"ثابت","s":"استدل القرطبي بعطف ﴿وعملوا الصالحات﴾ على ﴿آمنوا﴾ على الرد على من يقول إن الإيمان بمجرده يقتضي الطاعات؛ لأنه لو كان كذلك لما أعادها، فالعطف يقتضي المغايرة.","g":"","b":[],"q":[{"t":"رد على من يقول: إن الإيمان بمجرده يقتضي الطاعات، لأنه لو كان ذلك ما أعادها","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"1","p":238,"h":null,"ch":"تفسير سورة البقرة › [سورة البقرة (٢): آية ٢٥]","ed":"دار الكتب المصرية - القاهرة، الثانية، ١٣٨٤ هـ - ١٩٦٤ م؛ تحقيق: أحمد البردوني وإبراهيم أطفيش"}]}]},{"name":"المعنى الإجمالي","taf":false,"p":"2","items":[{"id":"m2-gm-bushra","a":[25,25],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"لما ذكر جزاء الكافرين ذكر جزاء المؤمنين، على طريقة القرآن في الجمع بين الترغيب والترهيب، ليكون العبد راغبًا راهبًا، خائفًا راجيًا.","g":"","b":[],"q":[{"t":"لما ذكر جزاء الكافرين، ذكر جزاء المؤمنين، أهل الأعمال الصالحات، على طريقته تعالى في القرآن (١) يجمع بين الترغيب والترهيب، ليكون العبد راغبا راهبا، خائفا راجيا","src":"تفسير السعدي","au":"السعدي","v":null,"p":46,"h":null,"ch":"البقرة › ٢٥","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m2-gm-mathal","a":[26,26],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الله لا يستحيي أن يضرب أي مثل كان، بعوضة فما فوقها، لاشتمال الأمثال على الحكمة وإيضاح الحق.","g":"","b":[],"q":[{"t":"لاشتمال الأمثال على الحكمة، وإيضاح الحق، والله لا يستحيي من الحق","src":"تفسير السعدي","au":"السعدي","v":null,"p":47,"h":null,"ch":"البقرة › ٢٦","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التفسير","taf":false,"p":"2","items":[{"id":"m-taf-bushra","a":[25,25],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"لما ذكر جزاء الكافرين ذكر جزاء المؤمنين، على طريقة القرآن في الجمع بين الترغيب والترهيب، ليكون العبد راغبًا راهبًا خائفًا راجيًا.","g":"","b":[],"q":[{"t":"لما ذكر جزاء الكافرين، ذكر جزاء المؤمنين، أهل الأعمال الصالحات، على طريقته تعالى في القرآن (١) يجمع بين الترغيب والترهيب، ليكون العبد راغبا راهبا، خائفا راجيا","src":"تفسير السعدي","au":"السعدي","v":null,"p":46,"h":null,"ch":"البقرة › ٢٥","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-salihat","a":[25,25],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿الذين آمنوا﴾ بقلوبهم ﴿وعملوا الصالحات﴾ بجوارحهم، وسميت صالحات لأن بها تصلح أحوال العبد في دينه ودنياه.","g":"","b":[],"q":[{"t":"﴿الَّذِينَ آمَنُوا﴾ بقلوبهم ﴿وَعَمِلُوا الصَّالِحَاتِ﴾ بجوارحهم، فصدقوا إيمانهم بأعمالهم الصالحة.","src":"تفسير السعدي","au":"السعدي","v":null,"p":46,"h":null,"ch":"البقرة › ٢٥","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-jannah","a":[25,25],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"لهم بساتين تجري من تحتها أنهار الماء واللبن والعسل والخمر، كلما رُزقوا من ثمرها قالوا: هذا من جنس ما رزقنا من قبل؛ ولهم أزواج مطهرة خَلقًا وخُلقًا، وهم فيها خالدون.","g":"","b":[],"q":[{"t":"﴿تَجْرِي مِنْ تَحْتِهَا الأنْهَارُ﴾ أي: أنهار الماء، واللبن، والعسل، والخمر، يفجرونها كيف شاءوا، ويصرفونها أين أرادوا","src":"تفسير السعدي","au":"السعدي","v":null,"p":46,"h":null,"ch":"البقرة › ٢٥","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"﴿وَلَهُمْ فِيهَا أَزْوَاجٌ مُطَهَّرَةٌ﴾ فلم يقل \"مطهرة من ⦗٤٧⦘ العيب الفلاني \"ليشمل جميع أنواع التطهير","src":"تفسير السعدي","au":"السعدي","v":null,"p":46,"h":null,"ch":"البقرة › ٢٥","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-mathal","a":[26,26],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿إن الله لا يستحيي أن يضرب مثلًا ما بعوضة فما فوقها﴾ لاشتمال الأمثال على الحكمة وإيضاح الحق؛ فالمؤمنون يعلمون أنه الحق فيزدادون إيمانًا، والكافرون يعترضون فيزدادون كفرًا.","g":"","b":[],"q":[{"t":"لاشتمال الأمثال على الحكمة، وإيضاح الحق، والله لا يستحيي من الحق، وكأن في هذا، جوابا لمن أنكر ضرب الأمثال في الأشياء الحقيرة","src":"تفسير السعدي","au":"السعدي","v":null,"p":47,"h":null,"ch":"البقرة › ٢٦","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"فيعترضون ويتحيرون، فيزدادون كفرا إلى كفرهم، كما ازداد المؤمنون إيمانا على إيمانهم","src":"تفسير السعدي","au":"السعدي","v":null,"p":47,"h":null,"ch":"البقرة › ٢٦","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-fasiqin","a":[26,26],"lv":["التمكين"],"st":"ثابت","s":"﴿وما يضل به إلا الفاسقين﴾: الخارجين عن طاعة الله الذين صار الفسق وصفهم؛ والفسق نوعان: مخرج من الدين كهذا، وغير مخرج.","g":"","b":[],"q":[{"t":"والفسق نوعان: نوع مخرج من الدين، وهو الفسق المقتضي للخروج من الإيمان; كالمذكور في هذه الآية ونحوها، ونوع غير مخرج من الإيمان","src":"تفسير السعدي","au":"السعدي","v":null,"p":47,"h":null,"ch":"البقرة › ٢٦","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"السياق","taf":false,"p":"2","items":[{"id":"m2-ctx-targhib","a":[25,25],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال البقاعي: لما ذكر ما لهم ترهيبًا أتبعه ما للمؤمنين ترغيبًا.","g":"","b":[],"q":[{"t":"ولما ذكر ما لهم ترهيباً اتبعه ما للمؤمنين ترغيباً","src":"نظم الدرر","au":"البقاعي","v":"1","p":189,"h":null,"ch":"البقرة › ٢٣","ed":"دائرة المعارف العثمانية، حيدر آباد - الهند، الأولى، (١٣٨٩ - ١٤٠٤ هـ) (١٩٦٩ - ١٩٨٤ م)"}]}]},{"name":"اللغة والإعراب","taf":true,"p":"2","items":[{"id":"m2-irab-ba3uda","a":[26,26],"lv":["التفقّه"],"st":"ثابت","s":"قال النحاس: في نصب ﴿بعوضة﴾ ثلاثة أوجه، منها أن تكون «ما» زائدة و«بعوضة» بدلًا من «مثلًا».","g":"","b":[],"q":[{"t":"ما بَعُوضَةً في نصبها ثلاثة أوجه: تكون «ما» زائدة و «بعوضة» بدلا من مثل","src":"إعراب القرآن","au":"النحاس","v":"1","p":39,"h":null,"ch":"[٢] شرح إعراب سورة البقرة › [سورة البقرة (٢) : آية ٢٦]","ed":"منشورات محمد علي بيضون، دار الكتب العلمية، بيروت، الأولى، ١٤٢١ هـ"}]}]},{"name":"التجويد","taf":false,"p":"q","items":[{"id":"m2-tj-jannatin","a":[25,25],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإخفاء: النون الساكنة والتنوين قبل بقية الحروف (الخمسة عشر) تُخفى مع الغنة. مثاله في الدرس: ﴿جَنَّاتٍ تَجْرِي﴾ و﴿مِنْ ثَمَرَةٍ﴾.","g":"","b":[],"q":[{"t":"وَالرَّابِعُ الإِخْفَاءُ عِنْدَ الْفَاضِلِ ... مِنَ الحُرُوفِ وَاجِبٌ لِلْفَاضِلِ","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":3,"h":null,"ch":"أحكام النون الساكنة والتنوين","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}],"sh":7},{"id":"m2-tj-azwaj","a":[25,25],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإدغام بغنة: النون الساكنة والتنوين قبل أحد حروف «ينمو» تُدغم مع الغنة. مثاله في الدرس: ﴿أَزْوَاجٌ مُطَهَّرَةٌ﴾.","g":"","b":[],"q":[{"t":"لَكِنَّهَا قِسْمَانِ قِسْمٌ يُدْغَمَا ... فِيهِ بِغُنَّةٍ (بِيَنْمُو) عُلِمَا","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":3,"h":null,"ch":"أحكام النون الساكنة والتنوين","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}],"sh":7}]},{"name":"الوقف والابتداء","taf":f ":false,"p":"3","items":[{"id":"m-app-bushra","a":[25,25],"lv":["التأسيس"],"st":"","s":"بشّر أحد أقاربك أو أصدقائك اليوم بفضل عمل صالح يقوم به، لتنشطه عليه.","g":"","b":["m-taz-bushra"],"q":[]}]}],"gaps":[{"f":"علوم القرآن","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لا مسألة من علوم القرآن خاصة بآيات هذا الدرس غير ما سُجّل في أقسام القراءات والوقف والمتشابه."},{"f":"الحديث","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يذكر ابن كثير في تفسير آيات هذا الدرس حديثًا من الصحيحين، ولم يوجد في مصادر البطاقة حديث مرتبط بها مباشرة."},{"f":"العقيدة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مادة الإيمان بالجنة ونعيمها مسجلة في التفسير؛ ولم تُفرد لها مادة عقدية مستقلة من كتب العقيدة في هذه المرحلة."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في آيات الدرس في القرطبي (مسائله الفقهية) وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من هذه الآيات."},{"f":"السيرة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في سيرة ابن هشام عن الآيتين ٢٥–٢٦، ولم توجد مادة مرتبطة بهما."},{"f":"القراءات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في النشر فرشًا وأصولًا، ولم يُذكر في الآيتين ٢٥–٢٦ خلاف من طرقه؛ وما رواه النحاس عن ابن كثير في ﴿يستحيي﴾ بياء واحدة لم يذكره ابن الجزري في فرش البقرة."},{"f":"المتشابهات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في البرهان للكرماني ودرة التنزيل للإسكافي وملاك التأويل لابن الزبير، ولم يُذكر فيها متشابه لفظي لآيات هذا الدرس."},{"f":"المناسبات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ربط الآيتين بما قبلهما منقول من نظم الدرر في قسم السياق."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في هذه الآيات مسجلة ضمن التفسير منسوبة إلى أصحابها، ولم تُفرد لها مادة مستقلة."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مقاصد سورة البقرة مسجلة في الدرس الثاني (أول السورة)؛ ولم يُذكر لهذا المقطع مقصد مستقل في المصادر."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يُسجّل في آيات هذا الدرس خلاف معتبر يحتاج إلى بيان أسبابه غير ما سُجّل في القراءات والوقف."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":["معنى ﴿متشابهًا﴾.","سبب نزول الآية ٢٦."]},{"n":8,"surah":"البقرة","from":27,"to":29,"title":"البقرة ٢٧–٢٩: صفات الفاسقين ونعم الخلق","theme":"صفات الفاسقين الناقضين للعهد القاطعين لما أمر الله بوصله، والتعجب من الكفر بالله الذي أحيا وأمات وخلق ما في الأرض جميعًا لنا.","sections":[{"name":"العقيدة","taf":false,"p":"1","items":[{"id":"m-aq-istawa","a":[29,29],"lv":["التمكين","التفقّه"],"st":"خلاف معتبر","s":"«استوى» في القرآن على ثلاثة معانٍ عند السعدي: بلا حرف بمعنى الكمال، وبـ«على» بمعنى علا وارتفع، وبـ«إلى» بمعنى قصد. واختُلف في ﴿ثم استوى إلى السماء﴾: فقال السعدي: قصد، ونقل اللالكائي عن ثعلب: أقبل، وعلّق البخاري عن أبي العالية: ارتفع.","g":"","b":[],"q":[{"t":"﴿اسْتَوَى﴾ ترد في القرآن على ثلاثة معاني: فتارة لا تعدى بالحرف، فيكون معناها، الكمال والتمام","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٢٩","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وتارة تكون بمعنى \"قصد \"كما إذا عديت بـ \"إلى \"كما في هذه الآية، أي: لما خلق تعالى الأرض، قصد إلى خلق السماوات","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٢٩","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"اسْتَوَى: أَقْبَلَ عَلَيْهِ وَإِنْ لَمْ يَكُنْ مُعْوَجًّا ﴿ثُمَّ اسْتَوَى إِلَى السَّمَاءِ﴾ [البقرة: ٢٩] أَقْبَلَ","src":"شرح أصول اعتقاد أهل السنة والجماعة","au":"اللالكائي","v":"3","p":443,"h":null,"ch":"باب جماع توحيد الله ﷿ وصفاته وأسمائه وأنه حي قادر عالم سميع بصير متكلم مريد باق › قول عمر","ed":"دار طيبة - السعودية، الثامنة، ١٤٢٣ هـ / ٢٠٠٣ م؛ تحقيق: أحمد بن سعد بن حمدان الغامدي [ت ١٤٣٤ هـ]"},{"t":"قَالَ أَبُو الْعَالِيَةِ ﴿اسْتَوَى إِلَى السَّمَاءِ﴾ ارْتَفَعَ ﴿فَسَوَّاهُنَّ﴾ خَلَقَهُنَّ","src":"صحيح البخاري","au":"البخاري","v":"9","p":124,"h":null,"ch":"كتاب التوحيد › باب وكان عرشه على الماء","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]},{"id":"m-aq-ilm","a":[29,29],"lv":["التمكين"],"st":"ثابت","s":"كثيرًا ما يقرن الله بين خلقه للخلق وإثبات علمه؛ لأن خلق المخلوقات أدل دليل على علمه وحكمته وقدرته.","g":"","b":[],"q":[{"t":"لأن خلقه للمخلوقات، أدل دليل على علمه، وحكمته، وقدرته.","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٢٩","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وَخَلَقَ كُلَّ شَيْءٍ وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ﴾ [الأنعام: ١٠١] فَامْتَدَحَ بِالْقَوْلَيْنِ جَمِيعًا، فَكَمَا لَا يَخْرُجُ شَيْءٌ مِنْ عِلْمِهِ لَا يَخْرُجُ شَيْءٌ غَيْرُهُ مِنْ خَلْقِهِ","src":"الاعتقاد والهداية إلى سبيل الرشاد","au":"البيهقي","v":null,"p":142,"h":null,"ch":"باب القول في خلق الأفعال قال الله ﷿ ذلكم الله ربكم خالق كل شيء فدخل فيه الأعيان والأفعال من الخير والشر، وقال: أم جعلوا لله شركاء خلقوا كخلقه فتشابه الخلق عليهم قل الله خالق كل شيء فنفى أن يكون خالق غيره ونفى أن يكون شيء سواه غير مخلوق، فلو كانت","ed":"دار الآفاق الجديدة - بيروت، الأولى، ١٤٠١؛ تحقيق: أحمد عصام الكاتب"}]}]},{"name":"القواعد الفقهية","taf":true,"p":"1","items":[{"id":"m-max-ibaha","a":[29,29],"lv":["التفقّه"],"st":"ثابت","s":"في قوله ﴿خلق لكم ما في الأرض جميعًا﴾ دليل على أن الأصل في الأشياء الإباحة والطهارة؛ لأنها سيقت في معرض الامتنان، ويخرج منها الخبائث بفحوى الآية لأنها خُلقت لنفعنا.","g":"","b":[],"q":[{"t":"وفي هذه الآية العظيمة (١) دليل على أن الأصل في الأشياء الإباحة والطهارة، لأنها سيقت في معرض الامتنان، يخرج بذلك الخبائث","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٢٩","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"وجه الاستنباط","taf":true,"p":"1","items":[{"id":"m2-inf-ahd","a":[27,27],"lv":["التفقّه"],"st":"ثابت","s":"استنبط القرطبي من ذم ناقضي العهد: وجوب الوفاء بكل عهد جائز ألزمه المرء نفسه، مع مسلم أو غيره، لأن الله ذم من نقض عهده.","g":"","b":[],"q":[{"t":"في هذه الآية دليل على أن الوفاء بالعهد والتزامه وكل عهد جائز ألزمه المرء نفسه فلا يحل له نقضه سواء أكان بين مسلم أم غيره، لذم الله تعالى من نقض عهده.","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"1","p":248,"h":null,"ch":"تفسير سورة البقرة › [سورة البقرة (٢): آية ٢٧]","ed":"دار الكتب المصرية - القاهرة، الثانية، ١٣٨٤ هـ - ١٩٦٤ م؛ تحقيق: أحمد البردوني وإبراهيم أطفيش"}]}]},{"name":"المعنى الإجمالي","taf":false,"p":"2","items":[{"id":"m2-gm-kayfa","a":[28,28],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿كيف تكفرون بالله﴾ استفهام بمعنى التعجب والتوبيخ والإنكار: كيف يحصل منكم الكفر بالله الذي خلقكم من العدم وأنعم عليكم؟","g":"","b":[],"q":[{"t":"هذا استفهام بمعنى التعجب والتوبيخ والإنكار، أي: كيف يحصل منكم الكفر بالله; الذي خلقكم من العدم","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٢٨","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m2-gm-khalaqa","a":[29,29],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"خلق الله لنا جميع ما في الأرض برًّا بنا ورحمة، للانتفاع والاستمتاع والاعتبار.","g":"","b":[],"q":[{"t":"أي: خلق لكم، برا بكم ورحمة، جميع ما على الأرض، للانتفاع والاستمتاع والاعتبار.","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٢٩","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التفسير","taf":false,"p":"2","items":[{"id":"m-taf-ahd","a":[27,27],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"ينقضون العهد الذي بينهم وبين الله والذي بينهم وبين الخلق، ويقطعون ما أمر الله بوصله: الإيمان بالله والقيام بعبوديته، والإيمان برسوله، وحقوق الوالدين والأقارب والخلق؛ فهم الخاسرون.","g":"","b":[],"q":[{"t":"وهذا يعم العهد الذي بينهم وبينه (٢) والذي بينهم وبين عباده (٣) الذي أكده عليهم بالمواثيق الثقيلة والإلزامات","src":"تفسير السعدي","au":"السعدي","v":null,"p":47,"h":null,"ch":"البقرة › ٢٦","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"فإن الله أمرنا أن نصل ما بيننا وبينه بالإيمان به والقيام بعبوديته، وما بيننا وبين رسوله بالإيمان به ومحبته وتعزيره والقيام بحقوقه، وما بيننا وبين الوالدين والأقارب والأصحاب; وسائر الخلق بالقيام بتلك الحقوق","src":"تفسير السعدي","au":"السعدي","v":null,"p":47,"h":null,"ch":"البقرة › ٢٦","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-kayfa","a":[28,28],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"استفهام تعجب وتوبيخ: كيف تكفرون بالله الذي خلقكم من العدم، ثم يميتكم، ثم يحييكم بعد البعث، ثم إليه ترجعون؟","g":"","b":[],"q":[{"t":"هذا استفهام بمعنى التعجب والتوبيخ والإنكار، أي: كيف يحصل منكم الكفر بالله; الذي خلقكم من العدم; وأنعم عليكم بأصناف النعم; ثم يميتكم عند استكمال آجالكم","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٢٨","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-khalaq","a":[29,29],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿هو الذي خلق لكم ما في الأرض جميعًا﴾ برًّا بكم ورحمة، للانتفاع والاستمتاع والاعتبار. ثم قصد إلى خلق السماوات فسواهن سبعًا وأحكمها، وهو بكل شيء عليم.","g":"","b":[],"q":[{"t":"﴿هُوَ الَّذِي خَلَقَ لَكُمْ مَا فِي الأرْضِ جَمِيعًا﴾ أي: خلق لكم، برا بكم ورحمة، جميع ما على الأرض، للانتفاع والاستمتاع والاعتبار.","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٢٩","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"السياق","taf":false,"p":"2","items":[{"id":"m2-ctx-tarhib","a":[27,29],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال البقاعي: لما كان المقام للترهيب كما مضى، جاء وصف الفاسقين ثم تذكيرهم بنعم الخلق.","g":"","b":[],"q":[ لعهد إليهم. ونقضهم ذلك: نَبْذُهم إيّاه بعدَ القبول وتركهم العمل به.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":44,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"}]},{"id":"m-voc-amwat","a":[28,28],"lv":["التمكين"],"st":"ثابت","s":"«وكنتم أمواتًا»: نطفًا في الأرحام، «فأحياكم» في الأرحام وفي الدنيا، «ثم يميتكم ثم يحييكم» في البعث.","g":"","b":[],"q":[{"t":"﴿كَيْفَ تَكْفُرُونَ بِاللَّهِ وَكُنْتُمْ أَمْوَاتًا﴾ يعني نطفا في الأرحام.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":44,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"}]},{"id":"m-voc-istawa","a":[29,29],"lv":["التمكين"],"st":"ثابت","s":"«ثم استوى إلى السماء»: عمد إليها وقصد.","g":"","b":[],"q":[{"t":"﴿ثُمَّ اسْتَوَى إِلَى السَّمَاءِ﴾ عَمَدَ لها.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":45,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"}]}]},{"name":"التزكية","taf":false,"p":"3","items":[{"id":"m-taz-wasl","a":[27,27],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"المؤمنون وصلوا ما أمر الله به أن يوصل من الحقوق وقاموا بها، والفاسقون قطعوها.","g":"","b":[],"q":[{"t":"فأما المؤمنون فوصلوا ما أمر الله به أن يوصل من هذه الحقوق، وقاموا بها أتم القيام","src":"تفسير السعدي","au":"السعدي","v":null,"p":47,"h":null,"ch":"البقرة › ٢٦","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التدبر","taf":false,"p":"3","items":[{"id":"m-tad-rihla","a":[28,28],"lv":["التأسيس","التمكين"],"st":"","s":"الإنسان كان عدمًا ثم حيًّا ثم يموت ثم يُبعث ثم يرجع إلى الله؛ وتذكّر هذه الرحلة يدعو إلى الإيمان والشكر.","g":"","b":["m-taf-kayfa"],"q":[]}]},{"name":"التطبيق","taf":false,"p":"3","items":[{"id":"m-app-rahim","a":[27,27],"lv":["التأسيس","التمكين"],"st":"","s":"صِل اليوم قريبًا قطعته أو قصّرت في حقه: بزيارة أو اتصال أو رسالة.","g":"","b":["m-taf-ahd","m-taz-wasl"],"q":[]}]}],"gaps":[{"f":"أسباب النزول","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ليس في الواحدي ولباب النقول شيء لهذه الآيات."},{"f":"علوم القرآن","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لا مسألة من علوم القرآن خاصة بآيات هذا الدرس غير ما سُجّل في أقسام القراءات والوقف والمتشابه."},{"f":"الحديث","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يذكر ابن كثير في تفسير آيات هذا الدرس حديثًا من الصحيحين، ولم يوجد في مصادر البطاقة حديث مرتبط بها مباشرة."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في آيات الدرس في القرطبي (مسائله الفقهية) وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من هذه الآيات."},{"f":"السيرة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في سيرة ابن هشام عن الآيات ٢٧–٢٩، ولم توجد مادة مرتبطة بها."},{"f":"المتشابهات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في البرهان للكرماني ودرة التنزيل للإسكافي وملاك التأويل لابن الزبير، ولم يُذكر فيها متشابه لفظي لآيات هذا الدرس."},{"f":"المناسبات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ربط الآيات بما قبلها منقول من نظم الدرر في قسم السياق."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في هذه الآيات مسجلة ضمن التفسير منسوبة إلى أصحابها، ولم تُفرد لها مادة مستقلة."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مقاصد سورة البقرة مسجلة في الدرس الثاني (أول السورة)؛ ولم يُذكر لهذا المقطع مقصد مستقل في المصادر."},{"f":"تحليل الحديث","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لا حديث ولا رواية مسندة في بطاقة هذا الدرس."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يُسجّل في آيات هذا الدرس خلاف معتبر يحتاج إلى بيان أسبابه غير ما سُجّل في القراءات والوقف."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":["معنى ﴿ثم استوى إلى السماء﴾: قصد (السعدي)، أو أقبل (ثعلب عند اللالكائي)، أو ارتفع (أبو العالية عند البخاري)."]},{"n":9,"surah":"البقرة","from":30,"to":33,"title":"البقرة ٣٠–٣٣: خلافة آدم وتعليمه الأسماء","theme":"إخبار الله الملائكة بجعل آدم خليفة في الأرض، وتعليمه الأسماء كلها، وإظهار فضله عليهم بالعلم، وإقرار الملائكة بعلم الله وحكمته.","sections":[{"name":"العقيدة","taf":false,"p":"1","items":[{"id":"m-aq-kalam","a":[30,33],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"في الآيات إثبات الكلام لله تعالى، وأنه عليم حكيم؛ وأن العبد إذا خفيت عليه حكمة الله في شيء فالواجب التسليم والإقرار لله بالحكمة.","g":"","b":[],"q":[{"t":"وفي هذه الآيات من العبر والآيات; إثبات الكلام لله تعالى; وأنه لم يزل متكلما; يقول ما شاء; ويتكلم بما شاء; وأنه عليم حكيم، وفيه أن العبد إذا خفيت عليه حكمة الله في بعض المخلوقات والمأمورات فالوجب عليه; التسليم; واتهام عقله; والإقرار لله بالحكمة","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"الْقُرْآنُ كَلَامُ اللَّهِ ﷿، وَكلَامُ اللَّهِ صِفَةٌ مِنْ صِفَاتِ ذَاتِهِ","src":"الاعتقاد والهداية إلى سبيل الرشاد","au":"البيهقي","v":null,"p":94,"h":null,"ch":"باب القول في القرآن القرآن كلام الله ﷿، وكلام الله صفة من صفات ذاته، ولا يجوز أن يكون شيء من صفات ذاته مخلوقا ولا محدثا ولا حادثا، قال الله جل ثناؤه: إنما قولنا لشيء إذا أردناه أن نقول له كن فيكون. فلو كان القرآن مخلوقا لكان الله سبحانه قائلا","ed":"دار الآفاق الجديدة - بيروت، الأولى، ١٤٠١؛ تحقيق: أحمد عصام الكاتب"}]}]},{"name":"الحديث","taf":false,"p":"1","items":[{"id":"m-had-khalq","a":[30,30],"lv":["التمكين"],"st":"ثابت","s":"قال النبي ﷺ: «خُلقت الملائكة من نور، وخُلق الجان من مارج من نار، وخُلق آدم مما وُصف لكم».","g":"","b":[],"q":[{"t":"\"خلقت الملائكة من نور. وخلق الجان من مارج من نار. وخلق آدم مما وصف لكم\".","src":"صحيح مسلم","au":"مسلم","v":"4","p":2294,"h":"2996","ch":"٥٣ - كتاب الزهد والرقائق › ١٠ - باب في أحاديث متفرقة","ed":"مطبعة عيسى البابي الحلبي وشركاه، القاهرة، ١٣٧٤ هـ - ١٩٥٥ م؛ تحقيق: محمد فؤاد عبد الباقي [ت ١٣٨٨ هـ]"}]},{"id":"m-had-sittun","a":[30,31],"lv":["التمكين"],"st":"ثابت","s":"خلق الله آدم طوله ستون ذراعًا، فلما خلقه قال: اذهب فسلّم على أولئك النفر من الملائكة واستمع ما يحيّونك فإنها تحيتك وتحية ذريتك.","g":"","b":[],"q":[{"t":"طُولُهُ سِتُّونَ ذِرَاعًا، فَلَمَّا خَلَقَهُ قَالَ: اذْهَبْ فَسَلِّمْ عَلَى أُولَئِكَ النَّفَرِ مِنَ الْمَلَائِكَةِ جُلُوسٍ فَاسْتَمِعْ مَا يُحَيُّونَكَ؛ فَإِنَّهَا تَحِيَّتُكَ وَتَحِيَّةُ ذُرِّيَّتِكَ","src":"صحيح البخاري","au":"البخاري","v":"8","p":50,"h":"6227","ch":"كتاب الاستئذان","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]}]},{"name":"تحليل الحديث","taf":true,"p":"1","items":[{"id":"m3-ha-sahih","a":[30,33],"lv":["التفقّه"],"st":"ثابت","s":"أحاديث البطاقة (خلق الملائكة والجان وآدم، وطول آدم ستون ذراعًا) مخرّجة في صحيحي البخاري ومسلم، وقال ابن الصلاح: كتاباهما أصح الكتب بعد كتاب الله العزيز؛ فهي ثابتة لا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","g":"","b":[],"q":[{"t":"وكتاباهما أصح الكتب بعد كتاب الله العزيز","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":18,"h":null,"ch":"النوع الأول من أنواع علوم الحديث: معرفة الصحيح من الحديث","ed":"دار الفكر- سوريا، دار الفكر المعاصر - بيروت؛ تحقيق: نور الدين عتر"}],"sh":12}]},{"name":"الفقه","taf":false,"p":"1","items":[{"id":"m2-fiqh-imama","a":[30,30],"lv":["التفقّه"],"st":"ثابت","s":"قال القرطبي: هذه الآية أصل في نصب إمام وخليفة يُسمع له ويُطاع. وفي المذهب الشافعي ذكر النووي في المنهاج شروط الإمام وأن الإمامة تنعقد بالبيعة وبالاستخلاف.","g":"","b":[],"q":[{"t":"هذه الآية أصل في نصب إمام وخليفة يسمع له ويطاع، لتجتمع به الكلمة، وتنفذ به أحكام الخليفة.","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"1","p":264,"h":null,"ch":"تفسير سورة البقرة › [سورة البقرة (٢): آية ٣٠]","ed":"دار الكتب المصرية - القاهرة، الثانية، ١٣٨٤ هـ - ١٩٦٤ م؛ تحقيق: أحمد البردوني وإبراهيم أطفيش"},{"t":"شرط الإمام كونه مسلما مكلفا حرا ذكرا قرشيا مجتهدا شجاعا ذا رأي وسمع وبصر ونطق وتنعقد الإمامة بالبيعة","src":"منهاج الطالبين","au":"النووي","v":null,"p":292,"h":null,"ch":"كتاب البغاة","ed":"دار الفكر، الأولى، ١٤٢٥هـ/٢٠٠٥م؛ تحقيق: عوض قاسم أحمد عوض"}]}]},{"name":"المعنى الإجمالي","taf":false,"p":"2","items":[{"id":"m2-gm-adam","a":[30,33],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"هذا شروع في ذكر فضل آدم: أخبر الله الملائكة أنه جاعل في الأرض خليفة، ثم بيّن لهم فضله بالعلم، فأقرّوا بعلم الله وحكمته.","g":"","b":[],"q":[{"t":"هذا شروع في ذكر فضل آدم ﵇ أبي البشر (١) أن الله حين أراد خلقه أخبر الملائكة بذلك، وأن الله مستخلفه في الأرض.","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التفسير","taf":false,"p":"2","items":[{"id":"m-taf-khalifa","a":[30,30],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"أخبر الله الملائكة أنه جاعل في الأرض خليفة، فقالوا بحسب ظنهم: أتجعل فيها من يفسد ويسفك الدماء؟ ونحن نسبح بحمدك ونقدس لك. فقال: إني أعلم ما لا تعلمون؛ فالخير الحاصل بخلقه أضعاف ما فيه من الشر.","g":"","b":[],"q":[{"t":"هذا شروع في ذكر فضل آدم ﵇ أبي البشر (١) أن الله حين أراد خلقه أخبر الملائكة بذلك، وأن الله مستخلفه في الأرض.","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وأعلم أن الخير الحاصل بخلق هذا الخليفة، أضعاف أضعاف ما في ضمن ذلك من الشر","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-hikam","a":[30,30],"lv":["التمكين"],"st":"ثابت","s":"من حكم خلق آدم: أن يجتبي الله منهم الأنبياء والصديقين والشهداء والصالحين، وأن تظهر عبوديات لا تحصل بدونه، ويتبين الولي من العدو.","g":"","b":[],"q":[{"t":"إلا أن الله تعالى أراد أن يجتبي منهم الأنبياء والصديقين، والشهداء والصالحين، ولتظهر آياته للخلق","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-asma","a":[31,33],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"علّم الله آدم أسماء الأشياء ومسمياتها، ثم عرضها على الملائكة امتحانًا، فقالوا: ﴿سبحانك لا علم لنا إلا ما علمتنا﴾، فلما أنبأهم آدم بأسمائها تبين لهم فضله وحكمة الله وعلمه.","g":"","b":[],"q":[{"t":"فـ ﴿عَلَّمَ آدَمَ الأسْمَاءَ كُلَّهَا﴾ أي: أسماء الأشياء، وما هو مسمى بها، فعلمه الاسم والمسمى، أي: الألفاظ والمعاني","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"﴿فَلَمَّا أَنْبَأَهُمْ بِأَسْمَائِهِمْ﴾ تبين للملائكة فضل آدم عليهم; وحكمة الباري وعلمه في استخلاف هذا الخليفة","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"اللغة والإعراب","taf":true,"p":"2","items":[{"id":"m-lang-nuqaddis","a":[30,30],"lv":["التفقّه"],"st":"خلاف معتبر","s":"﴿ونقدس لك﴾ يحتمل: ونقدسك، فتكون اللام للتخصيص والإخلاص، ويحتمل: ونقدس لك أنفسنا، أي نطهرها بالأخلاق الجميلة.","g":"","b":[],"q":[{"t":"﴿وَنُقَدِّسُ لَكَ﴾ يحتمل أن معناها: ونقدسك، فتكون اللام مفيدة للتخصيص والإخلاص، ويحتمل أن يكون: ونقدس لك أنفسنا","src":"تفسير السعدي","au":"السعدي","v":null,"p":48,"h":null,"ch":"البقرة › ٣٠","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التجويد","taf":false,"p":"q","items":[{"id":"m2-tj-man-yufsid","a":[30,30],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإدغام بغنة: النون الساكنة والتنوين قبل أحد حروف «ينمو» تُدغم مع الغنة. مثاله في الدرس: ﴿مَنْ يُفْسِدُ﴾.","g":"","b":[],"q":[{"t":"لَكِنَّهَا قِسْمَانِ قِسْمٌ يُدْغَمَا ... فِيهِ بِغُنَّةٍ (بِيَنْمُو) عُلِمَا","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":3,"h":null,"ch":"أحكام النون الساكنة والتنوين","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}],"sh":7}]},{"na f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مقاصد سورة البقرة مسجلة في الدرس الثاني (أول السورة)؛ ولم يُذكر لهذا المقطع مقصد مستقل في المصادر."},{"f":"وجه الاستنباط","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"استنباط القرطبي (نصب الإمام) مسجل في قسم الفقه للتفقه."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يُسجّل في آيات هذا الدرس خلاف معتبر يحتاج إلى بيان أسبابه غير ما سُجّل في القراءات والوقف."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":["معنى ﴿ونقدس لك﴾."]},{"n":10,"surah":"البقرة","from":34,"to":37,"title":"البقرة ٣٤–٣٧: سجود الملائكة وإباء إبليس وتوبة آدم","theme":"أمر الملائكة بالسجود لآدم فسجدوا إلا إبليس أبى واستكبر، ثم إسكان آدم وزوجه الجنة ونهيهما عن الشجرة، وإزلال الشيطان لهما، ثم توبة آدم وقبول الله توبته.","sections":[{"name":"العقيدة","taf":false,"p":"1","items":[{"id":"m-aq-aduw","a":[36,36],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"في ﴿بعضكم لبعض عدو﴾ تحذير لبني آدم من الشيطان؛ فالعدو يجتهد في إيصال الشر إلى عدوه وحرمانه الخير بكل طريق.","g":"","b":[],"q":[{"t":"ففي ضمن هذا، تحذير بني آدم من الشيطان","src":"تفسير السعدي","au":"السعدي","v":null,"p":49,"h":null,"ch":"البقرة › ٣٥","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"الحديث","taf":false,"p":"1","items":[{"id":"m-had-sajda","a":[34,34],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قال النبي ﷺ: «إذا قرأ ابن آدم السجدة فسجد اعتزل الشيطان يبكي، يقول: يا ويله، أُمر ابن آدم بالسجود فسجد فله الجنة، وأُمرت بالسجود فأبيت فلي النار».","g":"","b":[],"q":[{"t":"\"إِذَا قَرَأَ ابْنُ آدَمَ السَّج  مسجل هناك."},{"f":"أسباب النزول","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ليس في الواحدي ولباب النقول شيء لهذه الآيات."},{"f":"علوم القرآن","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لا مسألة من علوم القرآن خاصة بآيات هذا الدرس غير ما سُجّل في أقسام القراءات والوقف والمتشابه."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في آيات الدرس في القرطبي (مسائله الفقهية) وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من هذه الآيات."},{"f":"السيرة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في سيرة ابن هشام عن قصة سجود الملائكة وتوبة آدم، ولم توجد مادة مرتبطة بها."},{"f":"المناسبات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"اتصال الآيات بقصة استخلاف آدم قبلها ظاهر في السعدي، ولم يُستخرج نص مستقل من نظم الدرر."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في هذه الآيات مسجلة ضمن التفسير منسوبة إلى أصحابها، ولم تُفرد لها مادة مستقلة."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مقاصد سورة البقرة مسجلة في الدرس الثاني (أول السورة)؛ ولم يُذكر لهذا المقطع مقصد مستقل في المصادر."},{"f":"اللغة والإعراب","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"إعراب ﴿فتلقى آدم... كلمات﴾ مرتبط بالقراءتين المسجلتين في قسم القراءات."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"خلاف القراءة في ﴿فتلقى آدم من ربه كلمات﴾ مسجل في القراءات؛ ولم يُسجّل خلاف فقهي أو تفسيري يحتاج إلى بيان أسبابه."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم.","مادة عقدية مصدرها تفسير السعدي وحده، ولم تُسند بعد إلى مرجع من مراجع العقيدة في القسم 4. تُوثَّق منها، أو تُرفع للمراجعة العلمية قبل اعتمادها (القسم 4، والبند 26)."],"dis":[]},{"n":1203,"surah":"الفيل","from":1,"to":5,"title":"سورة الفيل","theme":"ما فعله الله بأصحاب الفيل الذين أرادوا هدم البيت الحرام: آية على قدرته وحمايته لبيته، ومقدمة لبعثة النبي ﷺ.","sections":[{"name":"السيرة","taf":false,"p":"1","items":[{"id":"m-sir-hudaybiya","a":[1,1],"lv":["التمكين"],"st":"ثابت","s":"لما بركت ناقة النبي ﷺ في طريق الحديبية قال: «ما خلأت القصواء... ولكن حبسها حابس الفيل»، أي الذي حبس الفيل عن مكة.","g":"","b":[],"q":[{"t":"مَا خَلَأَتِ الْقَصْوَاءُ، وَمَا ذَاكَ لَهَا بِخُلُقٍ، وَلَكِنْ حَبَسَهَا حَابِسُ الْفِيلِ","src":"صحيح البخاري","au":"البخاري","v":"3","p":193,"h":"2731","ch":"كتاب الشروط › باب الشروط في الجهاد","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]},{"id":"m2-sir-rabb-bayt","a":[1,5],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"في قصة الفيل قال عبد المطلب لأبرهة: «إني أنا رب الإبل، وإن للبيت ربًّا سيمنعه».","g":"","b":[],"q":[{"t":"إنِّي أَنَا رَبُّ الْإِبِلِ وَإِنَّ لِلْبَيْتِ رَبًّا سَيَمْنَعُهُ","src":"السيرة النبوية","au":"ابن هشام","v":"1","p":44,"h":null,"ch":"المجلد: الأول › المتن","ed":"شركة الطباعة الفنية المتحدة [وأعاد المحقق نشرها -مع تعديلات طفيفة- لدى مكتبة الكليات الأزهرية بالقاهرة، وكذلك نشرتها دار الجيل بيروت، بنفس ترقيم الصفحات]"}]},{"id":"m2-sir-am-fil","a":[1,1],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"قال قيس بن مخرمة: وُلدت أنا ورسول الله ﷺ عام الفيل.","g":"","b":[],"q":[{"t":"وُلدت أَنَا وَرَسُولُ اللَّهِ ﷺ عام الفيل","src":"السيرة النبوية","au":"ابن هشام","v":"1","p":147,"h":null,"ch":"المجلد: الأول › المتن","ed":"شركة الطباعة الفنية المتحدة [وأعاد المحقق نشرها -مع تعديلات طفيفة- لدى مكتبة الكليات الأزهرية بالقاهرة، وكذلك نشرتها دار الجيل بيروت، بنفس ترقيم الصفحات]"}]}]},{"name":"أسباب النزول","taf":false,"p":"1","items":[{"id":"m-asb-fil","a":[1,5],"lv":["التمكين"],"st":"ثابت","s":"نزلت السورة في قصة أصحاب الفيل وقصدهم تخريب الكعبة وما فعل الله بهم؛ وهذا بيان لموضوعها لا سبب نزول بحادثة مخصوصة.","g":"سياق تاريخي","b":[],"q":[{"t":"نَزَلَتْ فِي قِصَّةِ أَصْحَابِ الْفِيلِ وَقَصْدِهِمْ تَخْرِيبَ الْكَعْبَةِ، وَمَا فَعَلَ اللَّهُ تَعَالَى بِهِمْ مِنْ إِهْلَاكِهِمْ وَصَرْفِهِمْ عَنِ الْبَيْتِ وَهِيَ مَعْرُوفَةٌ.","src":"أسباب النزول","au":"الواحدي","v":null,"p":464,"h":null,"ch":"سورة الفيل","ed":"دار الإصلاح - الدمام، الثانية، ١٤١٢ هـ - ١٩٩٢ م؛ تحقيق: عصام بن عبد المحسن الحميدان"}]}]},{"name":"وجه الاستنباط","taf":true,"p":"1","items":[{"id":"m3-inf-mujiza","a":[1,5],"lv":["التفقّه"],"st":"ثابت","s":"قال القرطبي: كانت قصة الفيل من معجزات النبي ﷺ وإن وقعت قبل مولده وقبل التحدي، لأنها كانت توكيدًا لأمره وتمهيدًا لشأنه.","g":"","b":[],"q":[{"t":"كانت قصة الفيل فيما بعد من معجزات النبي ﷺ وإن كانت قبله وقبل التحدي، لأنها كانت توكيدا لأمره، وتمهيدا لشأنه","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"20","p":195,"h":null,"ch":"تفسير سورة الفيل › [سورة الفيل (١٠٥): آية ١]","ed":"دار الكتب المصرية - القاهرة، الثانية، ١٣٨٤ هـ - ١٩٦٤ م؛ تحقيق: أحمد البردوني وإبراهيم أطفيش"}]}]},{"name":"أسباب الخلاف","taf":true,"p":"1","items":[{"id":"m2-rfd-lam","a":[5,5],"lv":["التفقّه"],"st":"خلاف معتبر","s":"اختُلف في تعلّق سورة الفيل بما بعدها: فقيل لا وقف في آخرها لأنها متصلة بقوله ﴿لإيلاف قريش﴾، والإجماع على أنهما سورتان يُفصل بينهما بالبسملة.","g":"","b":[],"q":[{"t":"وقيل: لا وقف في سورة الفيل، ولا في آخرها، بل هي متصلة بقوله: «لئلاف قريش»","src":"منار الهدى","au":"الأشموني","v":"2","p":432,"h":null,"ch":"بيان الوقف والابتداء › سورة الفيل","ed":"دار الحديث - القاهرة، مصر، ٢٠٠٨؛ تحقيق: عبد الرحيم الطرهوني"},{"t":"والإجماع على أنَّهما سورتان","src":"منار الهدى","au":"الأشموني","v":"2","p":432,"h":null,"ch":"بيان الوقف والابتداء › سورة الفيل","ed":"دار الحديث - القاهرة، مصر، ٢٠٠٨؛ تحقيق: عبد الرحيم الطرهوني"}]}]},{"name":"المعنى الإجمالي","taf":false,"p":"2","items":[{"id":"m2-gm-fil","a":[1,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"ألم تر ما فعله الله بأصحاب الفيل الذين كادوا بيته الحرام وأرادوا إخرابه؟ وفي ذلك دليل على قدرته ورحمته بعباده وأدلة توحيده وصدق رسوله ﷺ.","g":"","b":[],"q":[{"t":"أي: أما رأيت من قدرة الله وعظيم شأنه، ورحمته بعباده، وأدلة توحيده، وصدق رسوله محمد ﷺ، ما فعله الله بأصحاب الفيل، الذين كادوا بيته الحرام وأرادوا إخرابه","src":"تفسير السعدي","au":"السعدي","v":null,"p":934,"h":null,"ch":"الفيل","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"التفسير","taf":false,"p":"2","items":[{"id":"m-taf-story","a":[1,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"أما رأيت ما فعل الله بأصحاب الفيل الذين كادوا بيته وأرادوا هدمه، وجاؤوا بجمع لا طاقة للعرب به من الحبشة واليمن؛ فلما قربوا من مكة أرسل الله عليهم طيرًا متفرقة تحمل حجارة من سجيل فرمتهم بها، فصاروا كعصف مأكول، وكفى الله شرهم.","g":"","b":[],"q":[{"t":"ما فعله الله بأصحاب الفيل، الذين كادوا بيته الحرام وأرادوا إخرابه، فتجهزوا لأجل ذلك، واستصحبوا معهم الفيلة لهدمه، وجاءوا بجمع لا قبل للعرب به، من الحبشة واليمن","src":"تفسير السعدي","au":"السعدي","v":null,"p":934,"h":null,"ch":"الفيل","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"أرسل الله عليهم طيرًا أبابيل أي: متفرقة، تحمل حجارة محماة من سجيل، فرمتهم بها، وتتبعت قاصيهم ودانيهم، فخمدوا وهمدوا، وصاروا كعصف مأكول، وكفى الله شرهم، ورد كيدهم في نحورهم","src":"تفسير السعدي","au":"السعدي","v":null,"p":934,"h":null,"ch":"الفيل","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-signs","a":[1,1],"lv":["التمكين"],"st":"ثابت","s":"في هذه الحادثة دلائل على قدرة الله وعظمته، ورحمته بعباده، وتوحيده، وصدق رسوله ﷺ.","g":"","b":[],"q":[{"t":"أي: أما رأيت من قدرة الله وعظيم شأنه، ورحمته بعباده، وأدلة توحيده، وصدق رسوله محمد ﷺ","src":"تفسير السعدي","au":"السعدي","v":null,"p":934,"h":null,"ch":"الفيل","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"السياق","taf":false,"p":"2","items":[{"id":"m-ctx-mawlid","a":[1,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"كانت حادثة الفيل في السنة التي وُلد فيها رسول الله ﷺ، فصارت من مقدمات رسالته.","g":"","b":[],"q":[{"t":"وكانت تلك السنة التي ولد فيها رسول الله ﷺ، فصارت من جملة إره د الرحمن بن معلا اللويحق"}]}]},{"name":"التفسير","taf":false,"p":"2","items":[{"id":"m-taf-link","a":[1,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قال كثير من المفسرين: اللام في ﴿لإيلاف﴾ متعلقة بالسورة قبلها: فعل الله ما فعل بأصحاب الفيل لأجل قريش وأمنهم وانتظام رحلتهم في الشتاء إلى اليمن وفي الصيف إلى الشام للتجارة.","g":"","b":[],"q":[{"t":"قال كثير من المفسرين: إن الجار والمجرور متعلق بالسورة التي قبلها أي: فعلنا ما فعلنا بأصحاب الفيل لأجل قريش وأمنهم، واستقامة مصالحهم، وانتظام رحلتهم في الشتاء لليمن، والصيف للشام، لأجل التجارة والمكاسب.","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"قريش","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]},{"id":"m-taf-ibada","a":[3,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"أمرهم الله بشكر هذه النعمة: ﴿فليعبدوا رب هذا البيت﴾ أي ليوحّدوه ويخلصوا له العبادة؛ فسعة الرزق والأمن من الخوف من أكبر النعم الموجبة للشكر. وخص البيت بالربوبية لشرفه، وهو رب كل شيء.","g":"","b":[],"q":[{"t":"ولهذا أمرهم الله بالشكر، فقال: ﴿فَلْيَعْبُدُوا رَبَّ هَذَا الْبَيْتِ﴾ أي: ليوحدوه ويخلصوا له العبادة، ﴿الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ خَوْفٍ﴾ فرغد الرزق والأمن من المخاوف، من أكبر النعم الدنيوية، الموجبة لشكر الله تعالى.","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"قريش","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"},{"t":"وخص الله بالربوبية البيت (١) لفضله وشرفه، وإلا فهو رب كل شيء","src":"تفسير السعدي","au":"السعدي","v":null,"p":935,"h":null,"ch":"قريش","ed":"مؤسسة الرسالة، الأولى ١٤٢٠هـ -٢٠٠٠ م؛ تحقيق: عبد الرحمن بن معلا اللويحق"}]}]},{"name":"المناسبات","taf":false,"p":"2","items":[{"id":"m-mun-fil","a":[1,1],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"صلة السورة بما قبلها: إهلاك أصحاب الفيل كان لأجل أمن قريش؛ فعظّم الله أمر الحرم وأهله في قلوب العرب حتى لم يعترضوا لهم في أسفارهم.","g":"","b":[],"q":[{"t":"فأهلك الله من أرادهم بسوء، وعظم أمر الحرم وأهله في قلوب العرب، حتى احترموهم، ولم يعترضوا لهم في أي: سفر أرادوا","sr ":"m2-qir-li-ilaf","a":[1,1],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"في ﴿لإيلاف﴾: قرأ ابن عامر «لإلاف» بغير ياء بعد الهمزة، وقرأ أبو جعفر «لِيلاف» بياء ساكنة من غير همز.","g":"","b":[],"q":[{"t":"فَقَرَأَ ابْنُ عَامِرٍ بِغَيْرِ يَاءٍ بَعْدَ الْهَمْزَةِ","src":"النشر في القراءات العشر","au":"ابن الجزري","v":"2","p":403,"h":null,"ch":"باب فرش الحروف › ومن سورة الأعلى إلى آخر القرآن","ed":"المطبعة التجارية الكبرى [تصوير دار الكتاب العلمية]؛ تحقيق: علي محمد الضباع (المتوفى ١٣٨٠ هـ)"},{"t":"وَقَرَأَ أَبُو جَعْفَرٍ بِيَاءٍ سَاكِنَةٍ مِنْ غَيْرِ هَمْزٍ","src":"النشر في القراءات العشر","au":"ابن الجزري","v":"2","p":403,"h":null,"ch":"باب فرش الحروف › ومن سورة الأعلى إلى آخر القرآن","ed":"المطبعة التجارية الكبرى [تصوير دار الكتاب العلمية]؛ تحقيق: علي محمد الضباع (المتوفى ١٣٨٠ هـ)"}]},{"id":"m2-qir-ilafihim","a":[2,2],"lv":["التفقّه"],"st":"ثابت","s":"في ﴿إيلافهم﴾: قرأ أبو جعفر «إلافهم» بهمزة مكسورة من غير ياء.","g":"","b":[],"q":[{"t":"فَقَرَأَ أَبُو جَعْفَرٍ بِهَمْزَةٍ مَكْسُورَةٍ مِنْ غَيْرِ يَاءٍ","src":"النشر في القراءات العشر","au":"ابن الجزري","v":"2","p":403,"h":null,"ch":"باب فرش الحروف › ومن سورة الأعلى إلى آخر القرآن","ed":"المطبعة التجارية الكبرى [تصوير دار الكتاب العلمية]؛ تحقيق: علي محمد الضباع (المتوفى ١٣٨٠ هـ)"}]}]},{"name":"المفردات","taf":false,"p":"3","items":[{"id":"m-voc-ilaf","a":[1,2],"lv":["التمكين"],"st":"ثابت","s":"«الإيلاف» مصدر «آلفت فلانًا كذا إيلافًا»، أي: فعل الله ذلك بأصحاب الفيل ليؤلف قريشًا هاتين الرحلتين فتقيم بمكة.","g":"","b":[],"q":[{"t":"(الإيلاف) مصدرُ \"آلَفْتُ فلانًا كذا إيلافًا\"؛ كما تقول: ألزمتُه إيَّاه إلزامًا.\nيقول: فَعَل هذا بأصحاب الفيل ليُؤْلِفَ قريشًا هاتَيْن الرِّحْلَتَيْنُ فتُقيمَ بمكةَ.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":540,"h":null,"ch":"غريب القرآن › سورة قريش","ed":"دار الكتب العلمية (لعلها مصورة عن الطبعة المصرية)؛ تحقيق: أحمد صقر"}]}]},{"name":"التدبر","taf":false,"p":"3","items":[{"id":"m-tad-shukr","a":[3,4],"lv":["التأسيس","التمكين"],"st":"","s":"الطعام والأمن نعمتان يعيش فيهما الإنسان كل يوم، وشكرهما عبادة الله وحده.","g":"","b":["m-taf-ibada"],"q":[]}]},{"name":"التطبيق","taf":false,"p":"3","items":[{"id":"m-app-shukr","a":[4,4],"lv":["التأسيس"],"st":"","s":"بعد وجبة واحدة اليوم احمد الله على الطعام، وبعد عودتك إلى بيتك احمده على الأمن.","g":"","b":["m-taf-ibada"],"q":[]}]}],"gaps":[{"f":"السياق","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"سياق السورة (اتصالها بسورة الفيل) مسجل في المناسبات وأسباب الخلاف."},{"f":"علوم القرآن","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"فصل السورة عن الفيل بالبسملة مسجل في أسباب الخلاف؛ ولا مسألة أخرى من علوم القرآن خاصة بها."},{"f":"الحديث","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يذكر ابن كثير في تفسير سورة قريش حديثًا من الصحيحين، ولم يوجد في مصادر البطاقة حديث مرتبط بها مباشرة."},{"f":"العقيدة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مادة توحيد الربوبية والعبادة مسجلة في المعنى العام والمقاصد."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في مسائل القرطبي الفقهية لهذه السورة وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من آياتها. واستنباط القرطبي في التنقل بين الزمانين مسجل في وجه الاستنباط."},{"f":"السيرة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ما في سيرة ابن هشام عن السورة جاء ضمن قصة الفيل وسُجّل في درس الفيل."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال الفراء والخليل وسيبويه والأخفش مسجلة في أسباب الخلاف."},{"f":"التزكية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يوجد في رياض الصالحين والأذكار نص مرتبط بآيات هذه السورة مباشرة غير ما سُجّل في الحديث والتدبر."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"تحليل الحديث","c":"فجوة مصدر","code":"SOURCE_GAP","note":"حديث أم هانئ (فضل الله قريشًا بسبع خصال) أخرجه الحاكم؛ ولم يوجد حكم عليه في كتب قائمة المصادر. الحكم عليه (تصحيح الحاكم وتعقب الذهبي) مذكور في حاشية محقق تفسير ابن كثير فقط، والمستدرك وتلخيصه ليسا في القائمة."}],"unc":["صحة حديث أم هانئ في نزول السورة في قريش.","قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":[]},{"n":1205,"surah":"الماعون","from":1,"to":7,"title":"سورة الماعون","theme":"ذم من ضيّع حق الله وحقوق عباده: المكذب بالجزاء الذي يدفع اليتيم ولا يحض على إطعام المسكين، والساهي عن صلاته المرائي المانع للماعون.","sections":[{"name":"تحليل الحديث","taf":true,"p":"1","items":[{"id":"m3-ha-maun","a":[1,7],"lv":["التفقّه"],"st":"ثابت","s":"قول مقاتل والكلبي في نزول أول السورة في العاص بن وائل من طريقين ضعيفين: قال السيوطي: أوهى طرق التفسير عن ابن عباس طريق الكلبي، ومقاتل ضعّفوه في نفسه.","g":"","b":[],"q":[{"t":"وأوهى طرقه طريق الكلبي عن أبي صالح عن ابن عباس","src":"الإتقان","au":"السيوطي","v":"4","p":239,"h":null,"ch":"المجلد الرابع › النوع الثمانون: في طبقات المفسرين","ed":"الهيئة المصرية العامة للكتاب، ١٣٩٤ هـ/ ١٩٧٤ م؛ تحقيق: محمد أبو الفضل إبراهيم [ت ١٤٠١ هـ]"},{"t":"فمقاتل في نفسه ضعفوه","src":"الإتقان","au":"السيوطي","v":"4","p":238,"h":null,"ch":"المجلد الرابع › النوع الثمانون: في طبقات المفسرين","ed":"الهيئة المصرية العامة للكتاب، ١٣٩٤ هـ/ ١٩٧٤ م؛ تحقيق: محمد أبو الفضل إبراهيم [ت ١٤٠١ هـ]"}],"sh":2}]},{"name":"أسباب النزول","taf":false,"p":"1","items":[{"id":"m-asb-maun","a":[1,7],"lv":["التفقّه"],"st":"يحتاج تحققًا","s":"قيل في أول السورة: نزلت في العاص بن وائل (مقاتل والكلبي)، وروى ابن المنذر عن ابن عباس أن ﴿فويل للمصلين﴾ نزلت في المنافقين كانوا يراؤون المؤمنين بصلاتهم ويتركونها إذا غابوا. والروايات تحتاج تحققًا.","g":"رواية تحتاج تحققًا","b":[],"q":[{"t":"قَالَ مُقَاتِلٌ وَالْكَلْبِيُّ: نَزَلَتْ فِي الْعَاصِ بْنِ وَائِلٍ السَّهْمِيِّ.","src":"أسباب النزول","au":"الواحدي","v":null,"p":465,"h":null,"ch":"سورة الماعون","ed":"دار الإصلاح - الدمام، الثانية، ١٤١٢ هـ - ١٩٩٢ م؛ تحقيق: عصام بن عبد المحسن الحميدان"},{"t":"أخرج ابن المنذر عن طريف بن أبي طلحة عن ابن عباس في قوله فويل للمصلين الآية قال نزلت في المنافقين كانوا يراؤون المؤمنين بصلاتهم إذا حضروا ويتركونها إذا غابوا ويمنعونهم العارية","src":"لباب النقول","au":"السيوطي","v":null,"p":216,"h":null,"ch":"سورة الماعون","ed":"دار الكتب العلمية بيروت - لبنان"}]}]},{"name":"الفقه","taf":false,"p":"1","items":[{"id":"m2-fiqh-ariya","a":[7,7],"lv":["التفقّه"],"st":"ثابت","s":"منع الماعون ذُمّ في السورة، والعارية باب في الفقه الشافعي: شرط المعير صحة تبرعه وملكه المنفعة.","g":"","b":[],"q":[{"t":"كتاب العارية\nشرط المعير صحة تبرعه وملكه المنفعة","src":"منهاج الطالبين","au":"النووي","v":null,"p":144,"h":null,"ch":"كتاب العارية","ed":"دار الفكر، الأولى، ١٤٢٥هـ/٢٠٠٥م؛ تحقيق: عوض قاسم أحمد عوض"}]}]},{"name":"وجه الاستنباط","taf":true,"p":"1","items":[{"id":"m2-inf-riya","a":[6,6],"lv":["التفقّه"],"st":"ثابت","s":"قال القرطبي: لا يكون الرجل مرائيًا بإظهار الفريضة، فحق الفرائض الإعلان بها، أما التطوع فحقه أن يخفى، وإنما الرياء أن يقصد بالإظهار أن تراه الأعين فتثني عليه.","g":"","b":[],"q":[{"t":"ولا يكون الرجل مرائيا بإظهار العمل الصالح إن كان فريضة، فمن حق الفرائض الإعلان بها وتشهيرها","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"20","p":213,"h":null,"ch":"تفسير سورة الماعون › [سورة الماعون (١٠٧): الآيات ١ إلى ٧]","ed":"دار الكتب المصرية - القاهرة، الثانية، ١٣٨٤ هـ - ١٩٦٤ م؛ تحقيق: أحمد البردوني وإبراهيم أطفيش"},{"t":"وإنما الرياء أن يقصد بالإظهار أن تراه الأعين، فتثني عليه بالصلاح.","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"20","p":213,"h":null,"ch":"تفسير سورة الماعون › [سورة الماعون (١٠٧): الآيات ١ إلى ٧]","ed":"دار الكتب المصرية - القاهرة، الثانية، ١٣٨٤ هـ - ١٩٦٤ م؛ تحقيق: أحمد البردوني وإبراهيم أطفيش"}]}]},{"name":"المعنى الإجمالي","taf":false,"p":"2","items":[{"id":"m-gen-1","a":[1,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"في السورة الحث على إكرام اليتيم والمساكين، والمحافظة على الصلاة والإخلاص فيها وفي كل عمل، وبذل الأشياء الخفيفة كعارية الإناء والدلو والكتاب.","g":"","b":[],"q":[{"t":"وفي هذه ال :"مسلم","v":"1","p":300,"h":"400","ch":"٤ - كتاب الصلاة › (١٤) باب حجة من قال: البسملة آية من أول كل سورة، سوى براءة","ed":"مطبعة عيسى البابي الحلبي وشركاه، القاهرة، ١٣٧٤ هـ - ١٩٥٥ م؛ تحقيق: محمد فؤاد عبد الباقي [ت ١٣٨٨ هـ]"}]},{"id":"m-had-khayr","a":[1,1],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال ابن عباس: الكوثر هو الخير الذي أعطاه الله إياه، وقال سعيد بن جبير: النهر الذي في الجنة من الخير الذي أعطاه الله إياه؛ فلا تعارض بين القولين.","g":"","b":[],"q":[{"t":"«فِي الْكَوْثَرِ: هُوَ الْخَيْرُ الَّذِي أَعْطَاهُ اللهُ إِيَّاهُ». قَالَ أَبُو بِشْرٍ: قُلْتُ لِسَعِيدِ بْنِ جُبَيْرٍ: فَإِنَّ النَّاسَ يَزْعُمُونَ أَنَّهُ نَهَرٌ فِي الْجَنَّةِ؟ فَقَالَ سَعِيدٌ: النَّهَرُ الَّذِي فِي الْجَنَّةِ مِنَ الْخَيْرِ الَّذِي أَعْطَاهُ اللهُ إِيَّاهُ.","src":"صحيح البخاري","au":"البخاري","v":"6","p":178,"h":"4966","ch":"كتاب تفسير القرآن › سورة القيامة","ed":"السلطانية، بالمطبعة الكبرى الأميرية، ببولاق مصر، ١٣١١ هـ، بأمر السلطان عبد الحميد الثاني؛ تحقيق: جماعة من العلماء"}]}]},{"name":"تحليل الحديث","taf":true,"p":"1","items":[{"id":"m3-ha-sahih","a":[1,3],"lv":["التفقّه"],"st":"ثابت","s":"أحاديث البطاقة (نزول السورة، والكوثر نهر في الجنة) مخرّجة في صحيحي البخاري ومسلم، وقال ابن الصلاح: كتاباهما أصح الكتب بعد كتاب الله العزيز؛ فهي ثابتة لا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","g":"","b":[],"q":[{"t":"وكتاباهما أصح الكتب بعد كتاب الله العزيز","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":18,"h":null,"ch":"النوع الأول من أنواع علوم الحديث: معرفة الصحيح من الحديث","ed":"دار الفكر- سوريا، دار الفكر المعاصر - بيروت؛ تحقيق: نور الدين عتر"}],"sh":12}]},{"name":"السيرة","taf":false,"p":"1","items":[{"id":"m2-sir-abtar","a":[1,3],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"ذكر ابن إسحاق فيما بلغه أن العاص بن وائل كان إذا ذُكر رسول الله ﷺ قال: دعوه فإنما هو رجل أبتر لا عقب له، فأنزل الله السورة.","g":"","b":[],"q":[{"t":"وَكَانَ الْعَاصُ بْنُ وَائِلٍ السَّهْمي فِيمَا بَلَغَنِي إذَا ذُكر رسول الله ﷺ قال: دَعُوهُ فَإِنَّمَا هُوَ رَجُلٌ أَبْتَرُ لَا عَقِب لَهُ",
