<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مراجعة بصيرة للمراجعين</title>
<meta name="description" content="مراجعة المادة العلمية لعشرين درسًا من بصيرة، مادةً مادة، على كتبها">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F1F4F2; --surface:#FFFFFF; --sunk:#E6ECE8; --line:#D3DCD7;
  --ink:#17231F; --muted:#5B6B65; --accent:#0E6655; --accent-soft:#D6EAE4;
  --ok:#23724A; --ok-soft:#DCEFE3; --fix:#A8520B; --fix-soft:#F8E6D3;
  --quote:#223029; --shadow:0 1px 2px rgba(20,40,32,.06);
  --ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --book:"Amiri","Traditional Arabic","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#101714; --surface:#17201C; --sunk:#1E2A25; --line:#2C3B35;
    --ink:#E3ECE7; --muted:#97A8A1; --accent:#5CC4AC; --accent-soft:#183A32;
    --ok:#6BCB93; --ok-soft:#173826; --fix:#F0A45C; --fix-soft:#3A2715;
    --quote:#D9E4DE; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#101714; --surface:#17201C; --sunk:#1E2A25; --line:#2C3B35;
  --ink:#E3ECE7; --muted:#97A8A1; --accent:#5CC4AC; --accent-soft:#183A32;
  --ok:#6BCB93; --ok-soft:#173826; --fix:#F0A45C; --fix-soft:#3A2715;
  --quote:#D9E4DE; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.7;direction:rtl;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:12px 16px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:0}
.brand h1 span{color:var(--accent)}
.overall{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.overall b{color:var(--ink)}
.lessons{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.lesson-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 10px 6px;font:inherit;font-size:13px;cursor:pointer;display:grid;justify-items:center;gap:2px;min-width:74px}
.lesson-chip small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.lesson-chip .bar{width:100%;height:3px;background:var(--sunk);border-radius:2px;overflow:hidden}
.lesson-chip .bar i{display:block;height:100%;background:var(--ok)}
.lesson-chip[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lesson-chip.done{border-color:var(--ok)}
.sections{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.sec-chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 12px;font:inherit;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.sec-chip small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sec-chip[aria-pressed="true"] small{color:#fff}
.sec-chip.done:not([aria-pressed="true"]){border-color:var(--ok)}
.sec-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.sec-nav button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 14px;cursor:pointer}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 12px;font:inherit;font-size:13px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{margin:14px 0 0;padding:10px 12px;border-radius:8px;background:var(--fix-soft);color:var(--ink);font-size:13px}
.lesson-head{padding-block:22px 6px;display:grid;gap:6px}
.lesson-head .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.02em}
.lesson-head h2{margin:0;font-size:24px;line-height:1.35;text-wrap:balance}
.lesson-head p{margin:0;color:var(--muted);max-width:65ch}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress .track{flex:1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;display:flex}
.progress .track .o{background:var(--ok)} .progress .track .f{background:var(--fix)}
.how{font-size:13px;color:var(--muted);margin:4px 0 0;max-width:65ch}
section.field{margin-top:26px}
section.field>h3{font-size:14px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:var(--accent)}
section.field>h3 .taf{font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.items{display:grid;gap:10px}
article.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;box-shadow:var(--shadow);display:grid;gap:10px;border-inline-start:4px solid var(--line)}
article.item[data-state="ok"]{border-inline-start-color:var(--ok)}
article.item[data-state="fix"]{border-inline-start-color:var(--fix)}
.summary{margin:0;font-size:15.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.meta span{background:var(--sunk);border-radius:6px;padding:1px 8px}
.meta .id{font-family:ui-monospace,Menlo,monospace;direction:ltr;background:transparent;padding:0}
blockquote{margin:0;padding:10px 12px;background:var(--sunk);border-radius:8px;font-family:var(--book);font-size:18px;line-height:1.9;color:var(--quote);overflow-wrap:anywhere}
.cite{font-size:12px;color:var(--muted);margin-top:4px;font-family:var(--ui);line-height:1.6}
.cite b{color:var(--ink);font-weight:600}
.based{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions button{font:inherit;font-size:13px;border-radius:8px;padding:5px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.actions button.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.actions button.fix[aria-pressed="true"]{background:var(--fix);border-color:var(--fix);color:#fff}
.actions .saved{font-size:12px;color:var(--muted);margin-inline-start:auto}
textarea{width:100%;min-height:70px;resize:vertical;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--ground);color:var(--ink)}
details.extra{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.extra summary{cursor:pointer;font-weight:600;font-size:14px}
details.extra ul{margin:8px 0 4px;padding-inline-start:18px;display:grid;gap:6px;font-size:13.5px}
.gcode{font-size:11px;border-radius:999px;padding:0 8px;margin-inline-start:6px;background:var(--sunk);color:var(--muted)}
.gcode.SOURCE_GAP{background:var(--fix-soft);color:var(--fix)}
.reviewer{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--surface);color:var(--ink);width:120px}
.export-btn{font:inherit;font-size:13px;border:0;border-radius:8px;padding:6px 14px;background:var(--accent);color:#fff;cursor:pointer}
#export-box{margin-top:12px;min-height:90px;direction:ltr}
.empty{padding:30px 0;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: no-preference){article.item{transition:border-color .2s}}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>مراجعة دروس <span>بصيرة</span></h1>
      <div class="overall" id="overall"></div>
      <input id="reviewer" class="reviewer" type="text" placeholder="اسمك" aria-label="اسم المراجع">
      <button type="button" id="export" class="export-btn">انسخ النتائج لإرسالها</button>
    </div>
    <nav class="lessons" id="lessons" aria-label="الدروس"></nav>
    <nav class="sections" id="sections" aria-label="أقسام الدرس"></nav>
    <div class="filters" id="filters" role="group" aria-label="عرض">
      <button type="button" data-f="all" aria-pressed="true">الكل</button>
      <button type="button" data-f="todo" aria-pressed="false">لم يُراجع</button>
      <button type="button" data-f="fix" aria-pressed="false">يحتاج تعديل</button>
      <button type="button" data-f="ok" aria-pressed="false">صحيح</button>
    </div>
  </div>
</header>
<main class="wrap">
  <p class="notice" id="notice" hidden></p>
  <textarea id="export-box" hidden readonly aria-label="نتائج المراجعة"></textarea>
  <div id="lesson"></div>
</main>

أسيس","التمكين"],"st":"ثابت","s":"العبادة: اسم جامع لكل ما يحبه الله ويرضاه من الأقوال والأعمال الظاهرة والباطنة. والاستعانة: الاعتماد على الله في جلب النفع ودفع الضر مع الثقة به.","g":"","b":[],"q":[{"t":"و ﴿العبادة﴾ اسم جامع لكل ما يحبه الله ويرضاه من الأعمال، والأقوال الظاهرة والباطنة. و ﴿الاستعانة﴾ هي الاعتماد على الله تعالى في جلب المنافع، ودفع المضار، مع الثقة به في تحصيل ذلك.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-voc-sirat","a":[6,6],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«الصراط»: الطريق، وأصله في اللغة الطريق الواضح.","g":"","b":[],"q":[{"t":"و ﴿الصِّرَاطَ﴾ الطريق.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":38,"h":null,"ch":"غريب القرآن › سورة الحمد","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"},{"t":"وَأَصْلُهُ فِي اللُّغَةِ الطَّرِيقُ الْوَاضِحُ.","src":"معالم التنزيل","au":"البغوي","v":"1","p":54,"h":null,"ch":"الفاتحة › ١","ed":"تفسير البغوي - طيبة"}]}]},{"name":"المعنى الإجمالي","taf":false,"items":[{"id":"m-gen-1","a":[1,7],"lv":["التأسيس","التمكين","التفقّه"],"st":"ثابت","s":"هذه السورة على قصرها احتوت ما لم تحتوه سورة غيرها: أنواع التوحيد الثلاثة، وإثبات النبوة، والجزاء على الأعمال، وإخلاص الدين لله عبادة واستعانة.","g":"","b":[],"q":[{"t":"فهذه السورة على إيجازها، قد احتوت على ما لم تحتو عليه سورة من سور القرآن، فتضمنت أنواع التوحيد الثلاثة","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وتضمنت إخلاص الدين لله تعالى، عبادة واستعانة في قوله: ﴿إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ﴾","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-basmala","a":[1,1],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿بسم الله﴾: أبتدئ بكل اسم لله. و﴿الله﴾ هو المعبود المستحق للعبادة وحده. و﴿الرحمن الرحيم﴾ اسمان يدلان على أنه ذو الرحمة الواسعة التي وسعت كل شيء.","g":"","b":[],"q":[{"t":"﴿بِسْمِ اللَّهِ﴾ أي: أبتدئ بكل اسم لله تعالى، لأن لفظ ﴿اسم﴾ مفرد مضاف، فيعم جميع الأسماء [الحسنى] . ﴿اللَّهِ﴾ هو المألوه المعبود، المستحق لإفراده بالعبادة، لما اتصف به من صفات الألوهية وهي صفات الكمال. ﴿الرَّحْمَنِ الرَّحِيمِ﴾ اسمان دالان على أنه تعالى ذو الرحمة الواسعة العظيمة التي وسعت كل شيء، وعمت كل حي، وكتبها للمتقين المتبعين لأنبيائه ورسله.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-hamd","a":[2,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿الحمد لله﴾: الثناء على الله بصفات الكمال وأفعاله. ﴿رب العالمين﴾: المربي لجميع الخلق بخلقه ونعمه، وتربيته نوعان: عامة للخلق كلهم، وخاصة لأوليائه بالإيمان والتوفيق.","g":"","b":[],"q":[{"t":"﴿الْحَمْدُ لِلَّهِ﴾ [هو] الثناء على الله بصفات الكمال، وبأفعاله الدائرة بين الفضل والعدل، فله الحمد الكامل، بجميع الوجوه.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وتربيته تعالى لخلقه نوعان: عامة وخاصة.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"والخاصة: تربيته لأوليائه، فيربيهم بالإيمان، ويوفقهم له، ويكمله لهم، ويدفع عنهم الصوارف، والعوائق الحائلة بينهم وبينه","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-rahman","a":[3,3],"lv":["التمكين","التفقّه"],"st":"خلاف معتبر","s":"من العلماء من جعل «الرحمن» و«الرحيم» بمعنى واحد، ومنهم من فرّق: الرحمن عام الرحمة لكل الخلق، والرحيم خاص بالمؤمنين.","g":"","b":[],"q":[{"t":"وَاخْتَلَفُوا فِيهِمَا مِنْهُمْ مَنْ قَالَ: هُمَا بِمَعْنًى وَاحِدٍ مِثْلَ نَدْمَانٍ وَنَدِيمٍ وَمَعْنَاهُمَا ذُو الرَّحْمَةِ","src":"معالم التنزيل","au":"البغوي","v":"1","p":51,"h":null,"ch":"الفاتحة › ١","ed":"تفسير البغوي - طيبة"},{"t":"فَالرَّحْمَنُ مَنْ تَصِلُ رَحْمَتُهُ إِلَى الْخَلْقِ عَلَى الْعُمُومِ، وَالرَّحِيمُ مَنْ تَصِلُ رَحْمَتُهُ إِلَيْهِمْ عَلَى الْخُصُوصِ","src":"معالم التنزيل","au":"البغوي","v":"1","p":51,"h":null,"ch":"الفاتحة › ١","ed":"تفسير البغوي - طيبة"}]},{"id":"m-taf-malik","a":[4,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿مالك يوم الدين﴾: يوم القيامة يوم يدان الناس بأعمالهم، وخصّه بالذكر لأن فيه يظهر كمال ملكه وعدله وتنقطع أملاك الخلق، وهو مالك لكل الأيام.","g":"","b":[],"q":[{"t":"وأضاف الملك ليوم الدين، وهو يوم القيامة، يوم يدان الناس فيه بأعمالهم، خيرها وشرها، لأن في ذلك اليوم، يظهر للخلق تمام الظهور، كمال ملكه وعدله وحكمته، وانقطاع أملاك الخلائق.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"فلذلك خصه بالذكر، وإلا فهو المالك ليوم الدين ولغيره من الأيام.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-iyyaka","a":[5,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿إياك نعبد وإياك نستعين﴾: نخصك وحدك بالعبادة والاستعانة؛ فتقديم «إياك» يفيد الحصر. وقدّم العبادة لأنها حق الله، وذكر الاستعانة بعدها لحاجة العبد إلى عون الله في كل عبادته.","g":"","b":[],"q":[{"t":"فكأنه يقول: نعبدك، ولا نعبد غيرك، ونستعين بك، ولا نستعين بغيرك.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وذكر ﴿الاستعانة﴾ بعد ﴿العبادة﴾ مع دخولها فيها، لاحتياج العبد في جميع عباداته إلى الاستعانة بالله تعالى.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-ihdina","a":[6,6],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿اهدنا الصراط المستقيم﴾: دلّنا وأرشدنا ووفقنا للطريق الواضح الموصل إلى الله وجنته، وهو معرفة الحق والعمل به؛ هداية إلى الصراط بلزوم الإسلام، وهداية فيه لتفاصيل الدين علمًا وعملًا.","g":"","b":[],"q":[{"t":"أي: دلنا وأرشدنا، ووفقنا للصراط المستقيم، وهو الطريق الواضح الموصل إلى الله، وإلى جنته، وهو معرفة الحق والعمل به، فاهدنا إلى الصراط واهدنا في الصراط.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-sirat","a":[7,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الصراط المستقيم صراط المنعم عليهم من النبيين والصديقين والشهداء والصالحين، لا صراط المغضوب عليهم الذين عرفوا الحق وتركوه، ولا الضالين الذين تركوه على جهل.","g":"","b":[],"q":[{"t":"وهذا الصراط المستقيم هو: ﴿صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ﴾ من النبيين والصديقين والشهداء والصالحين. ﴿غَيْرِ﴾ صراط ﴿الْمَغْضُوبِ عَلَيْهِمْ﴾ الذين عرفوا الحق وتركوه كاليهود ونحوهم. وغير صراط ﴿الضَّالِّينَ﴾ الذين تركوا الحق على جهل وضلال، كالنصارى ونحوهم.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"السياق","taf":false,"items":[{"id":"m-ctx-names","a":[1,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"من أسمائها «أم الكتاب»؛ لأنه يبدأ بكتابتها في المصاحف وبقراءتها في الصلاة. وسمّاها النبي ﷺ «السبع المثاني والقرآن العظيم».","g":"","b":[],"q":[{"t":"وسميت أم الكتاب؛ لأنه يبدأ بكتابتها في المصاحف، ويبدأ بقراءتها في الصلاة.","src":"تفسير ابن كثير","au":"ابن كثير","v":"1","p":147,"h":null,"ch":"","ed":"تفسير ابن كثير - ط ابن الجوزي"},{"t":"﴿الْحَمْدُ لِلهِ رَبِّ الْعَالَمِينَ﴾. هِيَ السَّبْعُ الْمَثَانِي، وَالْقُرْآنُ الْعَظِيمُ الَّذِي أُوتِيتُهُ","src":"صحيح البخاري","au":"البخاري","v":"6","p":17,"h":"4474","ch":"","ed":"صحيح البخاري - ط السلطانية"}]}]},{"name":"علوم القرآن","taf":false,"items":[{"id":"m-qs-count","a":[1,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الفاتحة سبع آيات باتفاق، وإنما وقع الخلاف في عدّ البسملة آية منها.","g":"","b":[],"q":[{"t":"وَاتَّفَقُوا عَلَى أَنَّ الْفَاتِحَةَ سَبْعُ آيَاتٍ","src":"معالم التنزيل","au":"البغوي","v":"1","p":51,"h":null,"ch":"الفاتحة › ١","ed":"تفسير البغوي - طيبة"},{"t":"وإنما اختلفوا في البسملة؛ هل هي آية مستقلة من أولها","src":"تفسير ابن كثير","au":"ابن كثير","v":"1","p":147,"h":null,"ch":"","ed":"تفسير ابن كثير - ط ابن الجوزي"}]},{"id":"m-qs-makki","a":[1,7],"lv":["التمكين","التفقّه"],"st":"خلاف معتبر","s":"قيل: مكية، وقيل: مدنية، وقيل: نزلت مرتين. ورجّح ابن كثير أنها مكية لقوله تعالى ﴿ولقد آتيناك سبعًا من المثاني﴾ وهي في سورة الحجر المكية.","g":"","b":[],"q":[{"t":"وهي مكية؛ (قاله ابن عباس، وقتادة وأبو العالية) (¬٤)، وقيل: مدنية؛ (قاله أبو هريرة، ومجاهد، وعطاء بن يسار، والزهري)","src":"تفسير ابن كثير","au":"ابن كثير","v":"1","p":147,"h":null,"ch":"","ed":"تفسير ابن كثير - ط ابن الجوزي"},{"t":"ويقال: نزلت مرتين؛ مرةً بمكة، ومرةً بالمدينة. والأول أشبه، (¬٥) (لقوله تعالى: ﴿وَلَقَدْ آتَيْنَاكَ سَبْعًا مِنَ الْمَثَانِي﴾ [الحجر: ٨٧])","src":"تفسير ابن كثير","au":"ابن كثير","v":"1","p":147,"h":null,"ch":"","ed":"تفسير ابن كثير - ط ابن الجوزي"}]}]},{"name":"الحديث","taf":false,"items":[{"id":"m-had-azam","a":[1,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قال النبي ﷺ عن الفاتحة إنها أعظم سورة في القرآن، وإنها السبع المثاني والقرآن العظيم الذي أوتيه.","g":"","b":[],"q":[{"t":"أَلَمْ تَقُلْ: لَأُعَلِّمَنَّكَ سُورَةً هِيَ أَعْظَمُ سُورَةٍ فِي الْقُرْآنِ، قَالَ: ﴿الْحَمْدُ لِلهِ رَبِّ الْعَالَمِينَ﴾. هِيَ السَّبْعُ الْمَثَانِي، وَالْقُرْآنُ الْعَظِيمُ الَّذِي أُوتِيتُهُ","src":"صحيح البخاري","au":"البخاري","v":"6","p":17,"h":"4474","ch":"","ed":"صحيح البخاري - ط السلطانية"}]},{"id":"m-had-qusimat","a":[2,7],"lv":["التأسيس","التمكين","التفقّه"],"st":"ثابت","s":"في الحديث القدسي: قسم الله الصلاة (أي الفاتحة) بينه وبين عبده نصفين؛ فإذا قال العبد آية منها أجابه الله: حمدني عبدي، أثنى عليّ عبدي، مجّدني عبدي، ثم: هذا بيني وبين عبدي، ثم: هذا لعبدي ولعبدي ما سأل.","g":"","b":[],"q":[{"t":"فَإِذَا قال العبد: الحمد لله رب العالمين، قَالَ اللَّهُ تَعَالَى: حَمِدَنِي عَبْدِي. وَإِذَا قَالَ؛ الرحمن الرحيم. قَالَ اللَّهُ تَعَالَى؛ أَثْنَى عَلَيَّ عَبْدِي. وَإِذَا قال مالك يوم الدين. قَالَ: مَجَّدَنِي عَبْدِي","src":"صحيح مسلم","au":"مسلم","v":"1","p":296,"h":"395","ch":"٤ - كتاب الصلاة › (١١) باب وجوب قراءة الفاتحة في كل ركعة، وإنه إذا لم يحسن الفاتحة ولا أمكنه تعلمها قرأ ما تيسر له من غيرها","ed":"صحيح مسلم - ت عبد الباقي"},{"t":"فَإِذَا قَالَ: إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ. قَالَ: هَذَا بَيْنِي وَبَيْنَ عَبْدِي وَلِعَبْدِي مَا سَأَلَ.","src":"صحيح مسلم","au":"مسلم","v":"1","p":296,"h":"395","ch":"٤ - كتاب الصلاة › (١١) باب وجوب قراءة الفاتحة في كل ركعة، وإنه إذا لم يحسن الفاتحة ولا أمكنه تعلمها قرأ ما تيسر له من غيرها","ed":"صحيح مسلم - ت عبد الباقي"}]},{"id":"m-had-la-salat","a":[1,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قال النبي ﷺ: «لا صلاة لمن لم يقرأ بفاتحة الكتاب».","g":"","b":[],"q":[{"t":"«لَا صَلَاةَ لِمَنْ لَمْ يَقْرَأْ بِفَاتِحَةِ الْكِتَابِ.»","src":"صحيح البخاري","au":"البخاري","v":"1","p":151,"h":"756","ch":"","ed":"صحيح البخاري - ط السلطانية"}]},{"id":"m-had-amin","a":[7,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"إذا قال الإمام ﴿غير المغضوب عليهم ولا الضالين﴾ فقولوا: آمين، فمن وافق قوله قول الملائكة غُفر له ما تقدم من ذنبه.","g":"","b":[],"q":[{"t":"«إِذَا قَالَ الْإِمَامُ: ﴿غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلا الضَّالِّينَ﴾ فَقُولُوا آمِينَ، فَمَنْ وَافَقَ قَوْلُهُ قَوْلَ الْمَلَائِكَةِ غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ»","src":"صحيح البخاري","au":"البخاري","v":"6","p":17,"h":"4475","ch":"","ed":"صحيح البخاري - ط السلطانية"}]}]},{"name":"العقيدة","taf":false,"items":[{"id":"m-aq-tawhid","a":[1,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"تضمنت الفاتحة أنواع التوحيد الثلاثة: توحيد الربوبية من ﴿رب العالمين﴾، وتوحيد الإلهية (إفراد الله بالعبادة) من لفظ ﴿الله﴾ و﴿إياك نعبد﴾، وتوحيد الأسماء والصفات من لفظ ﴿الحمد﴾.","g":"","b":[],"q":[{"t":"توحيد الربوبية يؤخذ من قوله: ﴿رَبِّ الْعَالَمِينَ﴾ .","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وتوحيد الإلهية وهو إفراد الله بالعبادة، يؤخذ من لفظ: ﴿اللَّهِ﴾ ومن قوله: ﴿إِيَّاكَ نَعْبُدُ﴾ وتوحيد الأسماء والصفات، وهو إثبات صفات الكمال لله تعالى، التي أثبتها لنفسه، وأثبتها له رسوله من غير تعطيل ولا تمثيل ولا تشبيه، وقد دل على ذلك لفظ ﴿الْحَمْدُ﴾ كما تقدم.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-aq-jaza","a":[4,6],"lv":["التمكين"],"st":"ثابت","s":"وتضمنت إثبات الجزاء على الأعمال بالعدل من ﴿مالك يوم الدين﴾، وإثبات النبوة من ﴿اهدنا الصراط المستقيم﴾ إذ لا تُعرف الهداية بدون الرسالة.","g":"","b":[],"q":[{"t":"وتضمنت إثبات النبوة في قوله: ﴿اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ﴾ لأن ذلك ممتنع بدون الرسالة.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وإثبات الجزاء على الأعمال في قوله: ﴿مَالِكِ يَوْمِ الدِّينِ﴾ وأن الجزاء يكون بالعدل، لأن الدين معناه الجزاء بالعدل.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"الفقه","taf":false,"items":[{"id":"m-fiqh-rukn","a":[1,7],"lv":["التأسيس","التمكين","التفقّه"],"st":"ثابت","s":"في المذهب الشافعي: تتعين قراءة الفاتحة في كل ركعة (إلا ركعة المسبوق)، والبسملة آية منها، وتجب تشديداتها وترتيبها وموالاتها.","g":"","b":[],"q":[{"t":"وتتعين الفاتحة كل ركعة لا ركعة مسبوق والبسملة منها وتشديداتها ولو أبدل ضادا بظاء لم تصح في الأصح ويجب ترتيبها وموالاتها","src":"منهاج الطالبين","au":"النووي","v":null,"p":26,"h":null,"ch":"كتاب الصلاة › باب صفة الصلاة","ed":"منهاج الطالبين وعمدة المفتين في الفقه"}]},{"id":"m-fiqh-amin","a":[7,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"يسن بعد الفاتحة قول «آمين» بتخفيف الميم مع المد، ويجوز القصر، ويؤمّن المأموم مع إمامه.","g":"","b":[],"q":[{"t":"ويسن عقب الفاتحة آمين خفيفة الميم بالمد ويجوز القصر ويؤمن مع تأمين إمامه ويجهر به في الأظهر","src":"منهاج الطالبين","au":"النووي","v":null,"p":26,"h":null,"ch":"كتاب الصلاة › باب صفة الصلاة","ed":"منهاج الطالبين وعمدة المفتين في الفقه"}]}]},{"name":"التجويد","taf":false,"items":[{"id":"m2-tj-dallin","a":[7,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"المد اللازم: حرف مد بعده سكون أصلي وصلًا ووقفًا، ويُمد طويلًا. مثاله في الدرس: ﴿الضَّالِّينَ﴾: ألف بعدها لام مشددة.","g":"","b":[],"q":[{"t":"وَلاَزِمٌ إِنِ السُّكُونُ أُصِّلاَ ... وَصْلاً وَوَقْفًا بَعْدَ مَدٍّ طُوِّلاَ","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":7,"h":null,"ch":"أحكام المد","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}]},{"id":"m2-tj-nastain","a":[5,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"المد العارض للسكون: حرف مد بعده سكون عارض عند الوقف. مثاله في الدرس: ﴿نَسْتَعِينُ﴾ عند الوقف عليها، وهو مثال الناظم نفسه.","g":"","b":[],"q":[{"t":"وَمِثْلُ ذَا إِنْ عَرَضَ السُّكُونُ ... وَقْفًا كَتَعْلَمُونَ نَسْتَعِينُ","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":7,"h":null,"ch":"أحكام المد","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}]}]},{"name":"الوقف والابتداء","taf":false,"items":[{"id":"m2-waqf-fatiha","a":[1,7],"lv":["التمكين"],"st":"ثابت","s":"قال الداني: الوقف على ﴿مالك يوم الدين﴾ تام، وعلى ﴿إياك نستعين﴾ تام لانقضاء الثناء على الله، وعلى ﴿أنعمت عليهم﴾ حسن فقط لتعلق ما بعده به، وعلى ﴿ولا الضالين﴾ تام. والوقف على رأس كل آية منها حسن، وبه وردت السنة.","g":"","b":[],"q":[{"t":"وعلى قوله ﴿مالك يوم الدين﴾ تام، لأن ما بعده مستغن. وعلى ﴿إياك نستعين﴾ تام، لأنه انقضاء الثناء على الله ﷿. وعلى ﴿أنعمت عليهم﴾ حسن، وليس بتام ولا كاف","src":"المكتفى في الوقف والابتدا","au":"الداني","v":null,"p":17,"h":null,"ch":"أم القرآن سورة أم القرآن","ed":"المكتفى في الوقف والابتدا لأبي عمرو الداني"},{"t":"وإن وقف على رأس كل آية من هذه السورة على مراد التقطيع والترتيل فحسن، وقد وردت السنة بذلك عن رسول الله.","src":"المكتفى في الوقف والابتدا","au":"الداني","v":null,"p":17,"h":null,"ch":"أم القرآن سورة أم القرآن","ed":"المكتفى في الوقف والابتدا لأبي عمرو الداني"}]}]},{"name":"القراءات","taf":false,"items":[{"id":"m-qir-malik","a":[4,4],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قرأ عاصم والكسائي ويعقوب ﴿مالك﴾ بالألف، وقرأ الباقون ﴿ملك﴾.","g":"","b":[],"q":[{"t":"قَرَأَ عَاصِمٌ وَالْكِسَائِيُّ وَيَعْقُوبُ ﴿مَالِكِ﴾ وَقَرَأَ الْآخَرُونَ ﴿مَلِكِ﴾","src":"معالم التنزيل","au":"البغوي","v":"1","p":53,"h":null,"ch":"الفاتحة › ١","ed":"تفسير البغوي - طيبة"}]}]},{"name":"المتشابهات","taf":false,"items":[{"id":"m2-mut-rahman","a":[1,3],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"سأل الكرماني: لماذا تكرر ﴿الرحمن الرحيم﴾ بعد البسملة؟ وأجاب: لأن الرحمة إنعام على المحتاج، ففي البسملة ذُكر المنعم وحده، وفي الآية الثالثة أعيدت مع ذكر المنعَم عليهم.","g":"","b":[],"q":[{"t":"قلت إِنَّمَا كرر لِأَن الرَّحْمَة هِيَ الإنعام على الْمُحْتَاج وَذكر فِي الْآيَة الأولى الْمُنعم وَلم يذكر الْمُنعم عَلَيْهِم فَأَعَادَهَا مَعَ ذكرهم","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":65,"h":null,"ch":"سورة الفاتحة","ed":"أسرار التكرار في القرآن = البرهان في توجيه متشابه القرآن"}]},{"id":"m2-mut-iyyaka","a":[5,5],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"كرر ﴿إياك﴾ مع الفعلين ولم يكتف بمرة؛ لأن التقديم يقطع الاشتراك، ولو قيل «إياك نعبد ونستعين» لم يظهر أن الاستعانة مخصوصة بالله كالعبادة.","g":"","b":[],"q":[{"t":"كرر ﴿إياك﴾ وَقدمه وَلم يقْتَصر على ذكره مرّة كَمَا اقْتصر على ذكر أحد المفعولين فِي آيَات كَثِيرَة","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":65,"h":null,"ch":"سورة الفاتحة","ed":"أسرار التكرار في القرآن = البرهان في توجيه متشابه القرآن"}]}]},{"name":"المناسبات","taf":false,"items":[{"id":"m2-mun-rabb","a":[1,2],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"في ترابط آيات السورة: بعد أن أثبت ﴿الحمد لله﴾ أنه المستحق لكل حمد لذاته، أتبعه بـ﴿رب﴾ ليبين أنه يستحقه أيضًا لكونه ربًّا مالكًا منعمًا، وبـ﴿العالمين﴾ إلى ابتداء الخلق.","g":"","b":[],"q":[{"t":"ولما أثبت بقوله: ﴿الحمد لله﴾ أنه المستحق لجميع المحامد لا لشيء غير ذاته الحائز لجميع الكمالات أشار إلى أنه يستحقه أيضاً من حيث كونه رباً مالكاً منعماً فقال: ﴿رب﴾","src":"نظم الدرر","au":"البقاعي","v":"1","p":27,"h":null,"ch":"","ed":"نظم الدرر في تناسب الآيات والسور"}]}]},{"name":"أقوال العلماء","taf":false,"items":[{"id":"m-sch-sirat","a":[6,6],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"نُقل عن السلف في الصراط المستقيم عبارات متقاربة: الإسلام (ابن عباس وجابر)، والقرآن (ابن مسعود)، وطريق الجنة (سعيد بن جبير).","g":"","b":[],"q":[{"t":"وَالصِّرَاطُ الْمُسْتَقِيمُ قَالَ ابْنُ عَبَّاسٍ وَجَابِرٌ ﵄: هُوَ الْإِسْلَامُ وَهُوَ قَوْلُ مُقَاتِلٍ. وَقَالَ ابْنُ مَسْعُودٍ ﵁: هو القرآن","src":"معالم التنزيل","au":"البغوي","v":"1","p":54,"h":null,"ch":"الفاتحة › ١","ed":"تفسير البغوي - طيبة"},{"t":"وَقَالَ سَعِيدُ بْنُ جُبَيْرٍ ﵁: طَرِيقُ الْجَنَّةِ.","src":"معالم التنزيل","au":"البغوي","v":"1","p":54,"h":null,"ch":"الفاتحة › ١","ed":"تفسير البغوي - طيبة"}]}]},{"name":"التزكية","taf":false,"items":[{"id":"m-taz-daily","a":[6,6],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"دعاء الهداية من أجمع الأدعية وأنفعها، ولضرورة العبد إليه وجب أن يدعو به في كل ركعة.","g":"","b":[],"q":[{"t":"فهذا الدعاء من أجمع الأدعية وأنفعها للعبد ولهذا وجب على الإنسان أن يدعو الله به في كل ركعة من صلاته، لضرورته إلى ذلك.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taz-ibada","a":[5,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"القيام بعبادة الله والاستعانة به هو سبيل السعادة والنجاة، ولا تكون العبادة عبادة إلا إذا أُخذت عن رسول الله ﷺ وقُصد بها وجه الله.","g":"","b":[],"q":[{"t":"والقيام بعبادة الله والاستعانة به هو الوسيلة للسعادة الأبدية، والنجاة من جميع الشرور","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وإنما تكون العبادة عبادة، إذا كانت مأخوذة عن رسول الله ﷺ مقصودا بها وجه الله.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التدبر","taf":false,"items":[{"id":"m-tad-dialogue","a":[2,7],"lv":["التأسيس","التمكين"],"st":"","s":"المصلي حين يقرأ الفاتحة يناجي ربه، والله يجيبه عند كل آية؛ فاستحضار هذا الجواب يعين على حضور القلب في الصلاة.","g":"","b":["m-had-qusimat"],"q":[]},{"id":"m-tad-need","a":[5,6],"lv":["التأسيس","التمكين"],"st":"","s":"العبد لا يستغني عن عون الله في أي عبادة، ولا عن سؤاله الهداية في كل ركعة؛ فكلما قرأ ﴿وإياك نستعين﴾ و﴿اهدنا﴾ تذكّر حاجته إلى ربه.","g":"","b":["m-taf-iyyaka","m-taz-daily"],"q":[]}]},{"name":"التطبيق","taf":false,"items":[{"id":"m-app-pause","a":[2,7],"lv":["التأسيس","التمكين"],"st":"","s":"في صلاة واحدة اليوم: اقرأ الفاتحة آية آية، وتذكّر بعد كل آية جواب الله الوارد في الحديث.","g":"","b":["m-had-qusimat","m-fiqh-rukn"],"q":[]},{"id":"m-app-amin","a":[7,7],"lv":["التأسيس"],"st":"","s":"قل «آمين» بعد الفاتحة في كل صلاة، ومع الإمام في الجماعة.","g":"","b":["m-had-amin","m-fiqh-amin"],"q":[]}]},{"name":"المقاصد","taf":true,"items":[{"id":"m2-maq-umm","a":[1,7],"lv":["التفقّه"],"st":"ثابت","s":"من أوجه تسميتها أم الكتاب: أن معاني القرآن كله ترجع إلى ما تضمنته.","g":"","b":[],"q":[{"t":"وقيل: إنما سميت بذلك لرجوع معاني القرآن كله إلى ما تضمنته.","src":"تفسير ابن كثير","au":"ابن كثير","v":"1","p":147,"h":null,"ch":"","ed":"تفسير ابن كثير - ط ابن الجوزي"}]}]},{"name":"تحليل الحديث","taf":true,"items":[{"id":"m3-ha-sahih","a":[1,7],"lv":["التفقّه"],"st":"ثابت","s":"أحاديث البطاقة (فضل الفاتحة، والتأمين، ولا صلاة إلا بها، وقسمت الصلاة) مخرّجة في صحيحي البخاري ومسلم، وقال ابن الصلاح: كتاباهما أصح الكتب بعد كتاب الله العزيز؛ فهي ثابتة لا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","g":"","b":[],"q":[{"t":"وكتاباهما أصح الكتب بعد كتاب الله العزيز","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":18,"h":null,"ch":"النوع الأول من أنواع علوم الحديث: معرفة الصحيح من الحديث","ed":"مقدمة ابن الصلاح = معرفة أنواع علوم الحديث - ت عتر"}]}]},{"name":"اللغة والإعراب","taf":true,"items":[{"id":"m-lang-hasr","a":[5,5],"lv":["التفقّه"],"st":"ثابت","s":"تقديم المفعول ﴿إياك﴾ على الفعل يفيد الحصر: إثبات العبادة والاستعانة لله ونفيهما عما سواه. وقدّم العبادة على الاستعانة من تقديم العام على الخاص وتقديم حق الله على حق العبد.","g":"","b":[],"q":[{"t":"لأن تقديم المعمول يفيد الحصر، وهو إثبات الحكم للمذكور، ونفيه عما عداه.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"من باب تقديم العام على الخاص، واهتماما بتقديم حقه تعالى على حق عبده.","src":"تفسير السعدي","au":"السعدي","v":null,"p":39,"h":null,"ch":"الفاتحة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"وجه الاستنباط","taf":true,"items":[{"id":"m3-inf-umum","a":[1,7],"lv":["التفقّه"],"st":"ثابت","s":"رجّح القرطبي أن الفاتحة متعينة في كل ركعة لكل مصلٍّ، أخذًا بعموم قوله ﷺ: «لا صلاة لمن لم يقرأ فيها بفاتحة الكتاب»؛ فالاستنباط هنا من عموم لفظ الحديث.","g":"","b":[],"q":[{"t":"الصحيح من هذه الأقوال قول الشافعي وأحمد ومالك في القول الآخر، وأن الفاتحة متعينة في كل ركعة لكل أحد على العموم","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"1","p":119,"h":null,"ch":"تفسير سورة الفاتحة › الباب الثاني في نزولها وأحكامها، وفيه عشرون مسألة","ed":"تفسير القرطبي = الجامع لأحكام القرآن"}]}]},{"name":"أسباب الخلاف","taf":true,"items":[{"id":"m-dis-basmala","a":[1,1],"lv":["التفقّه"],"st":"خلاف معتبر","s":"اختُلف في البسملة: أهي من الفاتحة؟ فذهب قرّاء المدينة والبصرة وفقهاء الكوفة إلى أنها ليست منها، وذهب قرّاء مكة والكوفة وأكثر فقهاء الحجاز إلى أنها منها، وهو قول الشافعي، واحتجوا بأنها كتبت في المصحف بخط سائر القرآن.","g":"","b":[],"q":[{"t":"فَذَهَبَ قُرَّاءُ الْمَدِينَةِ وَالْبَصْرَةِ وَفُقَهَاءُ الْكُوفَةِ إِلَى أَنَّهَا لَيْسَتْ مِنْ فَاتِحَةِ الْكِتَابِ، وَلَا مِنْ غَيْرِهَا مِنَ السُّوَرِ وَالِافْتِتَاحُ بِهَا لِلتَّيَمُّنِ وَالتَّبَرُّكِ. وَذَهَبَ قُرَّاءُ مَكَّةَ وَالْكُوفَةِ وَأَكْثَرُ فُقَهَاءِ الْحِجَازِ إِلَى أَنَّهَا مِنَ الْفَاتِحَةِ وَلَيْسَتْ مِنْ سَائِرِ السُّوَرِ","src":"معالم التنزيل","au":"البغوي","v":"1","p":51,"h":null,"ch":"الفاتحة › ١","ed":"تفسير البغوي - طيبة"},{"t":"وَهُوَ قَوْلُ الثَّوْرِيِّ وَابْنِ الْمُبَارَكِ وَالشَّافِعِيِّ لِأَنَّهَا كُتِبَتْ فِي الْمُصْحَفِ بِخَطِّ سَائِرِ الْقُرْآنِ.","src":"معالم التنزيل","au":"البغوي","v":"1","p":51,"h":null,"ch":"الفاتحة › ١","ed":"تفسير البغوي - طيبة"}]}]}],"gaps":[{"f":"أسباب النزول","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في أسباب النزول للواحدي ولباب النقول للسيوطي، ولم يُذكر للفاتحة سبب نزول خاص."},{"f":"السيرة","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في سيرة ابن هشام عن آيات الفاتحة، ولم توجد مادة سيرة مرتبطة بها."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات الفاتحة؛ مسألة البسملة مسجلة في أسباب الخلاف."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات الفاتحة."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم."],"dis":["هل البسملة آية من الفاتحة؟ والمذهب الشافعي أنها منها.","مكان نزول الفاتحة: مكة أو المدينة أو مرتين.","الفرق بين «الرحمن» و«الرحيم»."]},{"n":2,"surah":"البقرة","from":1,"to":5,"title":"البقرة ١–٥: صفات المتقين","theme":"القرآن كتاب لا ريب فيه، هدى للمتقين الذين يؤمنون بالغيب ويقيمون الصلاة وينفقون ويؤمنون بما أنزل ويوقنون بالآخرة؛ فهم على هدى وهم المفلحون.","sections":[{"name":"المفردات","taf":false,"items":[{"id":"m-voc-rayb","a":[2,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«لا ريب فيه»: لا شك فيه. «هدى للمتقين»: رشد لهم إلى الحق.","g":"","b":[],"q":[{"t":"﴿لا رَيْبَ فِيهِ﴾ لا شكَّ فيه.\n﴿هُدًى لِلْمُتَّقِينَ﴾ أي: رُشدًا لهم إلى الحق.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":39,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-ghayb","a":[3,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«يؤمنون بالغيب»: يصدقون بإخبار الله عن الجنة والنار والحساب والقيامة. «ينفقون»: يزكّون ويتصدقون.","g":"","b":[],"q":[{"t":"﴿الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ﴾ أي: يصدِّقون بإخبار الله ﷿ عن الجنة والنار، والحساب والقيامة، وأشباهِ ذلك.\n﴿وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ﴾ أي: يُزَكُّونَ ويتصدقون.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":39,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-falah","a":[5,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«المفلحون»: الفلاح الفوز بالمطلوب والنجاة من المرهوب، وأصله في اللغة البقاء.","g":"","b":[],"q":[{"t":"والفلاح [هو] الفوز بالمطلوب والنجاة من المرهوب","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"﴿وَأُولَئِكَ هُمُ الْمُفْلِحُونَ﴾ من الفلاح؛ وأصله البقاء.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":39,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-taqwa","a":[2,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"التقوى: اتخاذ ما يقي سخط الله وعذابه بامتثال أوامره واجتناب نواهيه.","g":"","b":[],"q":[{"t":"وهو التقوى التي حقيقتها: اتخاذ ما يقي سخط الله وعذابه، بامتثال أوامره، واجتناب النواهي","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"المعنى الإجمالي","taf":false,"items":[{"id":"m2-gm-huda","a":[2,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"هذا الكتاب لا شك فيه بوجه، وهو هدى للمتقين لأنهم حصلت لهم هدايتان: هداية البيان وهداية التوفيق، ثم وصفهم بالعقائد والأعمال الباطنة والظاهرة.","g":"","b":[],"q":[{"t":"ولأن الهداية نوعان: هداية البيان، وهداية التوفيق. فالمتقون حصلت لهم الهدايتان، وغيرهم لم تحصل لهم هداية التوفيق.","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"ثم وصف المتقين بالعقائد والأعمال الباطنة، والأعمال الظاهرة، لتضمن التقوى لذلك","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-huruf","a":[1,1],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الحروف المقطعة في أوائل السور: الأسلم السكوت عن التعرض لمعناها من غير مستند شرعي، مع الجزم بأن الله لم ينزلها عبثًا بل لحكمة.","g":"","b":[],"q":[{"t":"وأما الحروف المقطعة في أوائل السور، فالأسلم فيها، السكوت عن التعرض لمعناها [من غير مستند شرعي] ، مع الجزم بأن الله تعالى لم ينزلها عبثا بل لحكمة لا نعلمها.","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-kitab","a":[2,2],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿ذلك الكتاب﴾: هذا الكتاب العظيم، ﴿لا ريب فيه﴾ بوجه من الوجوه، ونفي الريب يستلزم كمال اليقين، ولما كانت الهداية لا تحصل إلا باليقين قال: ﴿هدى للمتقين﴾.","g":"","b":[],"q":[{"t":"فـ ﴿لا رَيْبَ فِيهِ﴾ ولا شك بوجه من الوجوه، ونفي الريب عنه، يستلزم ضده، إذ ضد الريب والشك اليقين، فهذا الكتاب مشتمل على علم اليقين المزيل للشك والريب","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"فلما اشتمل على اليقين وكانت الهداية لا تحصل إلا باليقين قال: ﴿هُدًى لِلْمُتَّقِينَ﴾","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-muttaqin","a":[2,2],"lv":["التمكين"],"st":"ثابت","s":"القرآن في نفسه هدى لجميع الخلق، وإنما خص المتقين لأنهم المنتفعون به؛ والهداية نوعان: هداية بيان وهداية توفيق، والمتقون حصلت لهم الهدايتان.","g":"","b":[],"q":[{"t":"ولأن الهداية نوعان: هداية البيان، وهداية التوفيق. فالمتقون حصلت لهم الهدايتان، وغيرهم لم تحصل لهم هداية التوفيق.","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-ghayb","a":[3,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإيمان بالغيب هو الذي يميز المسلم من الكافر؛ لأنه تصديق مجرد لخبر الله ورسوله فيما لم نره.","g":"","b":[],"q":[{"t":"إنما الشأن في الإيمان بالغيب، الذي لم نره ولم نشاهده، وإنما نؤمن به، لخبر الله وخبر رسوله. فهذا الإيمان الذي يميز به المسلم من الكافر","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-iqama","a":[3,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿ويقيمون الصلاة﴾: لم يقل يفعلونها؛ فإقامتها ظاهرًا بإتمام أركانها وواجباتها وشروطها، وباطنًا بحضور القلب وتدبر ما يقوله ويفعله.","g":"","b":[],"q":[{"t":"فإقامة الصلاة، إقامتها ظاهرا، بإتمام أركانها، وواجباتها، وشروطها. وإقامتها باطنا (١) بإقامة روحها، وهو حضور القلب فيها، وتدبر ما يقوله ويفعله منها","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-infaq","a":[3,3],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿ومما رزقناهم ينفقون﴾ يشمل الواجب كالزكاة والنفقة على الأهل، والمستحب؛ و«مِن» تدل على أنه لم يطلب إلا جزءًا يسيرًا، و﴿رزقناهم﴾ تذكير بأن المال رزق الله.","g":"","b":[],"q":[{"t":"يدخل فيه النفقات الواجبة كالزكاة، والنفقة على الزوجات والأقارب، والمماليك ونحو ذلك. والنفقات المستحبة بجميع طرق الخير.","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وأتى بـ \"من \"الدالة على التبعيض، لينبههم أنه لم يرد منهم إلا جزءا يسيرا من أموالهم","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-kutub","a":[4,4],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿يؤمنون بما أنزل إليك﴾: القرآن والسنة كلها دون تفريق، ﴿وما أنزل من قبلك﴾: الكتب السابقة والرسل جميعًا، ﴿وبالآخرة هم يوقنون﴾: اليقين علم تام لا شك فيه يوجب العمل.","g":"","b":[],"q":[{"t":"﴿وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنزلَ إِلَيْكَ﴾ وهو القرآن والسنة","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"و \"اليقين \"هو العلم التام الذي ليس فيه أدنى شك، الموجب للعمل.","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-huda","a":[5,5],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿أولئك على هدى من ربهم﴾: هدى عظيم، وعبّر بـ«على» لأن صاحب الهدى مستعلٍ به، ﴿وأولئك هم المفلحون﴾: حصر الفلاح فيهم، فلا فلاح إلا بسلوك سبيلهم.","g":"","b":[],"q":[{"t":"لأن صاحب الهدى مستعل بالهدى، مرتفع به، وصاحب الضلال منغمس فيه محتَقر.","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"حصر الفلاح فيهم؛ لأنه لا سبيل إلى الفلاح إلا بسلوك سبيلهم","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch au":"السيوطي","v":null,"p":7,"h":null,"ch":"سورة البقرة","ed":"لباب النقول"}]},{"id":"m3-maq-baqara","a":[1,5],"lv":["التفقّه"],"st":"ثابت","s":"قال البقاعي: مقصود سورة البقرة إقامة الدليل على أن الكتاب هدى يُتّبع في كل ما قال، وأعظم ما يهدي إليه الإيمان بالغيب.","g":"","b":[],"q":[{"t":"مقصودها إقامة الدليل على أن الكتاب هدى ليتبع","src":"نظم الدرر","au":"البقاعي","v":"1","p":55,"h":null,"ch":"","ed":"نظم الدرر في تناسب الآيات والسور"}]}]},{"name":"تحليل الحديث","taf":true,"items":[{"id":"m3-ha-sahih","a":[1,5],"lv":["التفقّه"],"st":"ثابت","s":"أحاديث البطاقة (فضل سورة البقرة) مخرّجة في صحيحي البخاري ومسلم، وقال ابن الصلاح: كتاباهما أصح الكتب بعد كتاب الله العزيز؛ فهي ثابتة لا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","g":"","b":[],"q":[{"t":"وكتاباهما أصح الكتب بعد كتاب الله العزيز","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":18,"h":null,"ch":"النوع الأول من أنواع علوم الحديث: معرفة الصحيح من الحديث","ed":"مقدمة ابن الصلاح = معرفة أنواع علوم الحديث - ت عتر"}]}]},{"name":"اللغة والإعراب","taf":true,"items":[{"id":"m-lang-ala","a":[5,5],"lv":["التفقّه"],"st":"ثابت","s":"جاء بـ«على» مع الهدى الدالة على الاستعلاء، وبـ«في» مع الضلالة؛ لأن صاحب الهدى مرتفع به وصاحب الضلال منغمس فيه. والتنكير في ﴿هدى﴾ للتعظيم.","g":"","b":[],"q":[{"t":"وأتى بـ \"على \"في هذا الموضع، الدالة على الاستعلاء، وفي الضلالة يأتي بـ \"في \"","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"أي: على هدى عظيم، لأن التنكير للتعظيم","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"وجه الاستنباط","taf":true,"items":[{"id":"m3-inf-nafy","a":[2,2],"lv":["التفقّه"],"st":"ثابت","s":"استنبط السعدي من ﴿لا ريب فيه﴾ قاعدة: النفي الذي يُقصد به المدح لا بد أن يتضمن ثبوت ضده من الكمال؛ فنفي الريب يستلزم اليقين، لأن النفي المحض لا مدح فيه.","g":"","b":[],"q":[{"t":"وهذه قاعدة مفيدة، أن النفي المقصود به المدح، لا بد أن يكون متضمنا لضده، وهو الكمال، لأن النفي عدم، والعدم المحض، لا مدح فيه.","src":"تفسير السعدي","au":"السعدي","v":null,"p":40,"h":null,"ch":"البقرة › ١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]}],"gaps":[{"f":"أسباب النزول","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"ليس في الواحدي ولباب النقول سبب نزول لهذه الآيات؛ فيهما قول مجاهد في تقسيم أول السورة، وقد وُضع في السياق."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في آيات الدرس في القرطبي (مسائله الفقهية) وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من هذه الآيات."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في هذه الآيات مسجلة ضمن التفسير منسوبة إلى أصحابها، ولم تُفرد لها مادة مستقلة."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يُسجّل في آيات هذا الدرس خلاف معتبر يحتاج إلى بيان أسبابه غير ما سُجّل في القراءات والوقف."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم.","مناسبة البقرة للفاتحة منقولة في نظم الدرر من كلام الحرالي، ونص الطبعة في هذا الموضع فيه تصحيف؛ يحتاج إلى مقابلة بطبعة أخرى."],"dis":[]},{"n":3,"surah":"البقرة","from":6,"to":11,"title":"البقرة ٦–١١: الكافرون والمنافقون","theme":"وصف الكافرين المعاندين الذين لا ينفعهم الإنذار، ثم المنافقين الذين يظهرون الإيمان ويبطنون الكفر، ويخادعون الله والمؤمنين، ويفسدون ويزعمون الإصلاح.","sections":[{"name":"المفردات","taf":false,"items":[{"id":"m-voc-khatm","a":[7,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«ختم الله على قلوبهم»: بمنزلة طبع عليها، أي أقفلها وأغلقها فلا تعي خيرًا ولا تسمعه. «غشاوة»: غطاء.","g":"","b":[],"q":[{"t":"بمنزلة طَبَعَ الله عليها. والخَاتَمُ بمنزلة الطابَع. وإنما أراد: أنه أقفل عليها وأغلقها، فليست تعي خيرا ولا تسمعه.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":40,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"},{"t":"والغِشَاوَة: الغِطاء.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":40,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-marad","a":[10,10],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«في قلوبهم مرض»: شك ونفاق.","g":"","b":[],"q":[{"t":"﴿فِي قُلُوبِهِمْ مَرَضٌ﴾ أي: شك ونفاق","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":41,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-yukhadiun","a":[9,9],"lv":["التمكين"],"st":"ثابت","s":"«يخادعون الله»: يخادعون المؤمنين بالله، فكأنهم خادعوا الله؛ ووبال الخديعة راجع عليهم.","g":"","b":[],"q":[{"t":"يريد: أنهم يُخَادِعُونَ المؤمنين بالله؛ فإذا خادعوا المؤمنين بالله: فكأنهم خادعوا الله.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":40,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]}]},{"name":"المعنى الإجمالي","taf":false,"items":[{"id":"m2-gm-kufr","a":[6,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الذين صار الكفر وصفًا لازمًا لهم لا يردعهم وعظ، فالإنذار وعدمه سواء عليهم، ثم ذكر الموانع التي منعتهم من الإيمان.","g":"","b":[],"q":[{"t":"يخبر تعالى أن الذين كفروا، أي: اتصفوا بالكفر، وانصبغوا به، وصار وصفا لهم لازما، لا يردعهم عنه رادع، ولا ينجع فيهم وعظ","src":"تفسير السعدي","au":"السعدي","v":null,"p":41,"h":null,"ch":"البقرة › ٦","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m2-gm-nifaq","a":[8,11],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"النفاق: إظهار الخير وإبطان الشر، ومن لطف الله بالمؤمنين أن كشف أحوال المنافقين ووصفهم بصفات يتميزون بها.","g":"","b":[],"q":[{"t":"واعلم أن النفاق هو: إظهار الخير وإبطان الشر","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"فمن لطف الله بالمؤمنين، أن جلا أحوالهم ووصفهم بأوصاف يتميزون بها، لئلا يغتر بهم المؤمنون","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-kafirun","a":[6,6],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الذين صار الكفر لهم وصفًا لازمًا لا ينفعهم وعظ؛ سواء عليهم أأنذرتهم أم لم تنذرهم لا يؤمنون. وحقيقة الكفر: جحود ما جاء به الرسول أو جحود بعضه.","g":"","b":[],"q":[{"t":"يخبر تعالى أن الذين كفروا، أي: اتصفوا بالكفر، وانصبغوا به، وصار وصفا لهم لازما، لا يردعهم عنه رادع، ولا ينجع فيهم وعظ","src":"تفسير السعدي","au":"السعدي","v":null,"p":41,"h":null,"ch":"البقرة › ٦","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وحقيقة الكفر: هو الجحود لما جاء به الرسول، أو جحد بعضه","src":"تفسير السعدي","au":"السعدي","v":null,"p":41,"h":null,"ch":"البقرة › ٦","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-khatm","a":[7,7],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿ختم الله على قلوبهم وعلى سمعهم﴾: طبع عليها فلا يدخلها الإيمان، ﴿وعلى أبصارهم غشاوة﴾: غطاء يمنع النظر النافع؛ وإنما منعوا ذلك بسبب كفرهم وعنادهم بعد ما تبين لهم الحق، وهذا عقاب عاجل، ولهم عذاب النار آجلًا.","g":"","b":[],"q":[{"t":"أي: طبع عليها بطابع لا يدخلها الإيمان، ولا ينفذ فيها، فلا يعون ما ينفعهم، ولا يسمعون ما يفيدهم.","src":"تفسير السعدي","au":"السعدي","v":null,"p":41,"h":null,"ch":"البقرة › ٦","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وإنما منعوا ذلك، وسدت عنهم أبواب الإيمان بسبب كفرهم وجحودهم ومعاندتهم بعد ما تبين لهم الحق","src":"تفسير السعدي","au":"السعدي","v":null,"p":41,"h":null,"ch":"البقرة › ٦","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-nifaq","a":[8,8],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"المنافقون يقولون بألسنتهم ما ليس في قلوبهم، فأكذبهم الله بقوله ﴿وما هم بمؤمنين﴾؛ لأن الإيمان الحقيقي ما تواطأ عليه القلب واللسان.","g":"","b":[],"q":[{"t":"فإنهم يقولون بألسنتهم ما ليس في قلوبهم، فأكذبهم الله بقوله: ﴿وَمَا هُمْ بِمُؤْمِنِينَ﴾ لأن الإيمان الحقيقي، ما تواطأ عليه القلب واللسان","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-khida","a":[9,9],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"المخادعة: أن يظهر شيئًا ويبطن خلافه ليصل إلى مقصوده؛ فعاد خداع المنافقين على أنفسهم، لأن الله لا يتضرر بخداعهم، والمؤمنون لا يضرهم كيدهم.","g":"","b":[],"q":[{"t":"والمخادعة: أن يظهر المخادع لمن يخادعه شيئا، ويبطن خلافه لكي يتمكن من مقصوده ممن يخادع","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"لأن الله تعالى لا يتضرر بخداعهم [شيئا] وعباده المؤمنون، لا يضرهم كيدهم شيئا","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-marad","a":[10,10],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"المرض هنا مرض الشك والنفاق. وللقلب مرضان: مرض الشبهات (كالكفر والشكوك والبدع)، ومرض الشهوات (كمحبة المعاصي). و﴿فزادهم الله مرضًا﴾: عقوبة المعصية المعصية بعدها، كما أن من ثواب الحسنة الحسنة بعدها.","g":"","b":[],"q":[{"t":"والمراد بالمرض هنا: مرض الشك والشبهات والنفاق، لأن (٦) القلب يعرض له مرضان يخرجانه عن صحته واعتداله: مرض الشبهات الباطلة، ومرض الشهوات المردية","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"فعقوبة المعصية، المعصية بعدها، كما أن من ثواب الحسنة، الحسنة بعدها","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-fasad","a":[11,11],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"إذا نُهوا عن الإفساد في الأرض بالكفر والمعاصي قالوا: إنما نحن مصلحون؛ فجمعوا بين فعل الفساد واعتقاده إصلاحًا، وهذا أعظم جناية ممن يعصي وهو يعلم أنها معصية.","g":"","b":[],"q":[{"t":"أي: إذا نهي هؤلاء المنافقون عن الإفساد في الأرض، وهو العمل بالكفر والمعاصي، ومنه إظهار سرائر المؤمنين لعدوهم وموالاتهم للكافرين ﴿قَالُوا إِنَّمَا نَحْنُ مُصْلِحُونَ﴾ فجمعوا بين العمل بالفساد في الأرض، وإظهارهم أنه ليس بإفساد بل هو إصلاح","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ١١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"السياق","taf":false,"items":[{"id":"m-ctx-nifaq-madina","a":[8,11],"lv":["التمكين"],"st":"ثابت","s":"لم يكن النفاق موجودًا قبل الهجرة، فلما كانت وقعة بدر وأعز الله المؤمنين أظهر بعض من في المدينة الإسلام خوفًا ومخادعة لتحقن دماؤهم وأموالهم.","g":"","b":[],"q":[{"t":"ولم يكن النفاق موجودا قبل هجرة الرسول ﷺ [من مكة] إلى المدينة، وبعد أن هاجر، فلما كانت وقعة \"بدر \" (١) وأظهر الله المؤمنين وأعزهم، ذل (٢) من في المدينة ممن لم يسلم، فأظهر بعضهم الإسلام خوفا ومخادعة","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-ctx-structure","a":[6,11],"lv":["التمكين"],"st":"ثابت","s":"بعد أربع آيات في المؤمنين جاءت آيتان في الكافرين ثم آيات في المنافقين، كما قال مجاهد.","g":"","b":[],"q":[{"t":"أخرج الفريابي وابن جرير عن مجاهد قال أربع آيات من أول البقرة نزلت في المؤمنين وآيتان في الكافرين وثلاث عشرة آية في المنافقين","src":"لباب النقول","au":"السيوطي","v":null,"p":7,"h":null,"ch":"سورة البقرة","ed":"لباب النقول"}]}]},{"name":"أسباب النزول","taf":false,"items":[{"id":"m-asb-6","a":[6,7],"lv":["التفقّه"],"st":"يحتاج تحققًا","s":"في المقصودين بالآيتين أقوال: أبو جهل وأهل بيته (الضحاك)، واليهود (الكلبي)، ويهود المدينة (رواية عن ابن عباس). وهي أقوال في تعيين المراد تحتاج تحققًا.","g":"قول تفسيري","b":[],"q":[{"t":"قَالَ الضَّحَّاكُ: نَزَلَتْ فِي أَبِي جَهْلٍ وَخَمْسَةٍ مِنْ أَهْلِ بَيْتِهِ، وَقَالَ الْكَلْبِيُّ: يَعْنِي الْيَهُودَ.","src":"أسباب النزول","au":"الواحدي","v":null,"p":21,"h":null,"ch":"سورة البقرة","ed":"أسباب النزول ت الحميدان"},{"t":"عن ابن عباس في قوله إن الذين كفروا الآيتين أنهما نزلتا في يهود المدينة","src":"لباب النقول","au":"السيوطي","v":null,"p":7,"h":null,"ch":"سورة البقرة","ed":"لباب النقول"}]}]},{"name":"الحديث","taf":false,"items":[{"id":"m-had-ayat-munafiq","a":[8,10],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قال النبي ﷺ: «آية المنافق ثلاث: إذا حدّث كذب، وإذا وعد أخلف، وإذا اؤتمن خان»؛ وهذا من النفاق العملي.","g":"","b":[],"q":[{"t":"«آيَةُ الْمُنَافِقِ ثَلَاثٌ: إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ».","src":"صحيح البخاري","au":"البخاري","v":"1","p":16,"h":"33","ch":"","ed":"صحيح البخاري - ط السلطانية"}]}]},{"name":"العقيدة","taf":false,"items":[{"id":"m-aq-nifaq-types","a":[8,10],"lv":["التمكين"],"st":"ثابت","s":"النفاق نوعان: اعتقادي يُخرج من الإسلام، وهو المقصود في هذه الآيات، وعملي كالكذب وخلف الوعد والخيانة.","g":"","b":[],"q":[{"t":"واعلم أن النفاق هو: إظهار الخير وإبطان الشر، ويدخل في هذا التعريف النفاق الاعتقادي، والنفاق العملي","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وأما النفاق الاعتقادي المخرج عن دائرة الإسلام، فهو الذي وصف الله به المنافقين في هذه السورة وغيرها","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ٨","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"السيرة","taf":false,"items":[{"id":"m2-sir-ahbar","a":[6,7],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"قال ابن إسحاق: الآيتان في أحبار يهود فيما كذبوا به من الحق بعد معرفته.","g":"","b":[],"q":[{"t":"فَهَذَا فِي الأحْبار مِنْ يَهُودَ، فِيمَا كَذَّبُوا به من الحقِّ بعدَ معرفته.","src":"السيرة النبوية","au":"ابن هشام","v":"2","p":128,"h":null,"ch":"المجلد: الثاني › المتن","ed":"سيرة ابن هشام - ت طه عبد الرؤوف سعد"}]},{"id":"m2-sir-munafiqin","a":[8,11],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"قال ابن إسحاق في قوله ﴿ومن الناس من يقول آمنا بالله وباليوم الآخر﴾: يعني المنافقين من الأوس والخزرج ومن كان على أمرهم.","g":"","b":[],"q":[{"t":"يَعْنِي الْمُنَافِقِينَ مِنْ الْأَوْسِ وَالْخَزْرَجِ، وَمَنْ كَانَ عَلَى أَمْرِهِمْ","src":"السيرة النبوية","au":"ابن هشام","v":"2","p":128,"h":null,"ch":"المجلد: الثاني › المتن","ed":"سيرة ابن هشام - ت طه عبد الرؤوف سعد"}]}]},{"name":"التجويد","taf":false,"items":[{"id":"m2-tj-man-yaqul","a":[8,8],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإدغام بغنة: النون الساكنة والتنوين قبل أحد حروف «ينمو» تُدغم مع الغنة. مثاله في الدرس: ﴿مَنْ يَقُولُ﴾.","g":"","b":[],"q":[{"t":"لَكِنَّهَا قِسْمَانِ قِسْمٌ يُدْغَمَا ... فِيهِ بِغُنَّةٍ (بِيَنْمُو) عُلِمَا","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":3,"h":null,"ch":"أحكام النون الساكنة والتنوين","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}]},{"id":"m2-tj-adhab-alim","a":[10,10],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإظهار: النون الساكنة والتنوين قبل أحد حروف الحلق الستة تُنطق واضحة بلا غنة زائدة. مثاله في الدرس: ﴿عَذَابٌ أَلِيمٌ﴾.","g":"","b":[],"q":[{"t":"فَالأَوَّلُ الإظْهَارُ قَبْلَ أَحْرُفِ ... لِلْحَلْقِ سِتٌّ رُتِّبَتْ فَلْتَعْرِفِ","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":2,"h":null,"ch":"أحكام النون الساكنة والتنوين","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}]},{"id":"m2-tj-amanna","a":[8,8],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"مد البدل: همز يتقدم على حرف المد. مثاله في الدرس: ﴿آمَنَّا﴾.","g":"","b":[],"q":[{"t":"أَوْ قُدِّمَ الْهَمْزُ عَلَى المَدِّ وَذَا ... بَدَلْ كَآمَنُوا وَإِيمَانًا خُذَا","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":7,"h":null,"ch":"أحكام المد","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}]}]},{"name":"الوقف والابتداء","taf":false,"items":[{"id":"m2-waqf-azim","a":[7,7],"lv":["التمكين"],"st":"ثابت","s":"الوقف على ﴿عظيم﴾ في الآية السابعة تام، لأنه آخر قصة الكفار.","g":"","b":[],"q":[{"t":"﴿عَظِيمٌ (٧)﴾ [٧]، تام؛ لأنه آخر قصة الكفار.","src":"منار الهدى","au":"الأشموني","v":"1","p":60,"h":null,"ch":"بيان الوقف والابتداء › سورة البقرة","ed":"منار الهدى في بيان الوقف والابتدا ت عبد الرحيم الطرهوني"}]},{"id":"m2-waqf-nas","a":[8,8],"lv":["التمكين"],"st":"ثابت","s":"لا وقف من ﴿ومن الناس﴾ إلى ﴿بمؤمنين﴾.","g":"","b":[],"q":[{"t":"ولا وقف من قوله: «ومن الناس» إلى قوله: «بمؤمنين»","src":"منار الهدى","au":"الأشموني","v":"1","p":60,"h":null,"ch":"بيان الوقف والابتداء › سورة البقرة","ed":"منار الهدى في بيان الوقف والابتدا ت عبد الرحيم الطرهوني"}]}]},{"name":"القراءات","taf":false,"items":[{"id":"m2-qir-yukhadiun","a":[9,9],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"في ﴿وما يخدعون﴾: قرأ نافع وابن كثير وأبو عمرو «يُخادِعون» بضم الياء وألف بعد الخاء، وقرأ الباقون ﴿يَخْدَعون﴾ بفتح الياء وسكون الخاء بلا ألف.","g":"","b":[],"q":[{"t":"فَقَرَأَ نَافِعٌ وَابْنُ كَثِيرٍ وَأَبُو عَمْرٍو بِضَمِّ الْيَاءِ وَأَلِفٍ بَعْدَ الْخَاءِ وَكَسْرِ الدَّالِ. وَقَرَأَ الْبَاقُونَ بِفَتْحِ الْيَاءِ وَسُكُونِ الْخَاءِ وَفَتْحِ الدَّالِ مِنْ غَيْرِ أَلِفٍ","src":"النشر في القراءات العشر","au":"ابن الجزري","v":"2","p":207,"h":null,"ch":"باب فرش الحروف › سورة البقرة","ed":"النشر في القراءات العشر"}]},{"id":"m2-qir-yakdhibun","a":[10,10],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"في ﴿يكذبون﴾: قرأ الكوفيون بفتح الياء وتخفيف الذال (وهي قراءة حفص)، وقرأ الباقون بالضم والتشديد «يُكذِّبون».","g":"","b":[],"q":[{"t":"وَاخْتَلَفُوا فِي يَكْذِبُونَ فَقَرَأَ الْكُوفِيُّونَ بِفَتْحِ الْيَاءِ وَتَخْفِيفِ الذَّالِ","src":"النشر في القراءات العشر","au":"ابن الجزري","v":"2","p":207,"h":null,"ch":"باب فرش الحروف › سورة البقرة","ed":"النشر في القراءات العشر"},{"t":"وَقَرَأَ الْبَاقُونَ بِالضَّمِّ وَالتَّشْدِيدِ.","src":"النشر في القراءات العشر","au":"ابن الجزري","v":"2","p":208,"h":null,"ch":"باب فرش الحروف › سورة البقرة","ed":"النشر في القراءات العشر"}]},{"id":"m2-qir-qila","a":[11,11],"lv":["التفقّه"],"st":"ثابت","s":"في ﴿قيل﴾: قرأ الكسائي وهشام ورويس بإشمام الضم كسر القاف.","g":"","b":[],"q":[{"t":"فَقَرَأَ الْكِسَائِيُّ وَهِشَامٌ وَرُوَيْسٌ بِإِشْمَامِ الضَّمِّ كَسْرَ أَوَائِلِهِنَّ","src":"النشر في القراءات العشر","au":"ابن الجزري","v":"2","p":208,"h":null,"ch":"باب فرش الحروف › سورة البقرة","ed":"النشر في القراءات العشر"}]}]},{"name":"المتشابهات","taf":false,"items":[{"id":"m2-mut-sawa","a":[6,6],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"في البقرة ﴿سواء عليهم﴾ وفي يس ﴿وسواء﴾ بزيادة الواو؛ لأن ما في البقرة جملة هي خبر «إن»، وما في يس جملة معطوفة على جملة.","g":"","b":[],"q":[{"t":"قَوْله ﴿سَوَاء عَلَيْهِم﴾ وَفِي يس ﴿وَسَوَاء﴾ بِزِيَادَة وَاو لِأَن مَا فِي الْبَقَرَة جملَة هِيَ خبر عَن اسْم إِن وَمَا فِي يس جملَة عطفت بِالْوَاو على جملَة","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":67,"h":null,"ch":"سورة البقرة","ed":"أسرار التكرار في القرآن = البرهان في توجيه متشابه القرآن"}]},{"id":"m2-mut-billah","a":[8,8],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"﴿آمنا بالله وباليوم الآخر﴾ بتكرار الباء لا نظير له في القرآن؛ فالمنافقون أكدوا كلامهم نفيًا للريبة، فنفى الله عنهم الإيمان بأوكد الألفاظ: ﴿وما هم بمؤمنين﴾.","g":"","b":[],"q":[{"t":"وَهَذِه حِكَايَة كَلَام الْمُنَافِقين وهم أكدوا كَلَامهم نفيا للريبة وإبعادا للتُّهمَةِ","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":67,"h":null,"ch":"سورة البقرة","ed":"أسرار التكرار في القرآن = البرهان في توجيه متشابه القرآن"},{"t":"فنفى الله الْإِيمَان عَنْهُم بأوكد الْأَلْفَاظ فَقَالَ ﴿وَمَا هم بمؤمنين﴾","src":"البرهان في متشابه القرآن","au":"الكرماني","v":null,"p":67,"h":null,"ch":"سورة البقرة","ed":"أسرار التكرار في القرآن = البرهان في توجيه متشابه القرآن"}]}]},{"name":"التدبر","taf":false,"items":[{"id":"m-tad-sidq","a":[8,9],"lv":["التأسيس","التمكين"],"st":"","s":"الإيمان ما اتفق عليه القلب واللسان؛ فيحرص المؤمن أن يكون باطنه كظاهره.","g":"","b":["m-taf-nifaq"],"q":[]},{"id":"m-tad-hasana","a":[10,10],"lv":["التمكين"],"st":"","s":"الذنب يجرّ الذنب، والحسنة تجرّ الحسنة؛ فالمبادرة إلى التوبة تقطع سلسلة المعصية.","g":"","b":["m-taf-marad"],"q":[]}]},{"name":"التطبيق","taf":false,"items":[{"id":"m-app-promises","a":[8,10],"lv":["التأسيس","التمكين"],"st":"","s":"راقب نفسك اليوم في ثلاث: الصدق في الحديث، والوفاء بالوعد، وأداء الأمانة.","g":"","b":["m-had-ayat-munafiq"],"q":[]}]},{"name":"تحليل الحديث","taf":true,"items":[{"id":"m3-ha-sahih","a":[8,11],"lv":["التفقّه"],"st":"ثابت","s":"أحاديث البطاقة (آية المنافق) مخرّجة في صحيحي البخاري ومسلم، وقال ابن الصلاح: كتاباهما أصح الكتب بعد كتاب الله العزيز؛ فهي ثابتة لا يُحتاج في هذا المستوى إلى البحث في أسانيدها.","g":"","b":[],"q":[{"t":"وكتاباهما أصح الكتب بعد كتاب الله العزيز","src":"مقدمة ابن الصلاح","au":"ابن الصلاح","v":null,"p":18,"h":null,"ch":"النوع الأول من أنواع علوم الحديث: معرفة الصحيح من الحديث","ed":"مقدمة ابن الصلاح = معرفة أنواع علوم الحديث - ت عتر"}]},{"id":"m3-ha-asbab6","a":[6,7],"lv":["التفقّه"],"st":"ثابت","s":"في روايات المقصودين بالآيتين: طريق ابن إسحاق عن محمد بن أبي محمد عن عكرمة أو سعيد بن جبير عن ابن عباس (يهود المدينة) قال السيوطي: طرق جيدة وإسنادها حسن. أما طريق الكلبي فهو أوهى طرق التفسير عن ابن عباس، وطريق الضحاك عن ابن عباس منقطع.","g":"","b":[],"q":[{"t":"ومن ذلك طريق ابن إسحاق عن محمد بن أبي محمد مولى آل زيد بن ثابت عن عكرمة أو سعيد بن جبير- عنه، هكذا بالترديد وهي طرق جيدة وإسنادها حسن","src":"الإتقان","au":"السيوطي","v":"4","p":239,"h":null,"ch":"المجلد الرابع › النوع الثمانون: في طبقات المفسرين","ed":"الإتقان في علوم القرآن"},{"t":"وأوهى طرقه طريق الكلبي عن أبي صالح عن ابن عباس","src":"الإتقان","au":"السيوطي","v":"4","p":239,"h":null,"ch":"المجلد الرابع › النوع الثمانون: في طبقات المفسرين","ed":"الإتقان في علوم القرآن"},{"t":"وطريق الضحاك بن مزاحم عن ابن عباس منقطعة فإن الضحاك لم يلقه","src":"الإتقان","au":"السيوطي","v":"4","p":239,"h":null,"ch":"المجلد الرابع › النوع الثمانون: في طبقات المفسرين","ed":"الإتقان في علوم القرآن"}]}]},{"name":"اللغة والإعراب","taf":true,"items":[{"id":"m2-irab-inna","a":[6,6],"lv":["التفقّه"],"st":"ثابت","s":"قال النحاس: ﴿الذين﴾ منصوب بـ«إنّ»، وعملت «إن» لأنها أشبهت الفعل، وفيها معنى التحقيق.","g":"","b":[],"q":[{"t":"الَّذِينَ: نصب بإن وعملت إنّ لأنها أشبهت الفعل في الإضمار ويقع بعدها اسمان وفيها معنى التحقيق.","src":"إعراب القرآن","au":"النحاس","v":"1","p":27,"h":null,"ch":"[٢] شرح إعراب سورة البقرة › [سورة البقرة (٢) : آية ٦]","ed":"إعراب القرآن للنحاس"}]}]},{"name":"وجه الاستنباط","taf":true,"items":[{"id":"m3-inf-qalb","a":[7,7],"lv":["التفقّه"],"st":"خلاف معتبر","s":"استنبط القرطبي من تقديم ذكر القلوب في ﴿ختم الله على قلوبهم﴾ فضل القلب على سائر الجوارح، واستدل بعضهم بتقديم السمع على البصر على تفضيله؛ فهو استنباط من الترتيب في الذكر.","g":"","b":[],"q":[{"t":"(على قلوبهم) فيه دليل على فضل القلب على جميع الجوارح","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"1","p":187,"h":null,"ch":"تفسير سورة البقرة › [سورة البقرة (٢): آية ٧]","ed":"تفسير القرطبي = الجامع لأحكام القرآن"},{"t":"(وعلى سمعهم) استدل بها من فضل السمع على البصر لتقدمه عليه","src":"الجامع لأحكام القرآن","au":"القرطبي","v":"1","p":189,"h":null,"ch":"تفسير سورة البقرة › [سورة البقرة (٢): آية ٧]","ed":"تفسير القرطبي = الجامع لأحكام القرآن"}]}]}],"gaps":[{"f":"علوم القرآن","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لا مسألة من علوم القرآن خاصة بآيات هذا الدرس غير ما سُجّل في أقسام القراءات والوقف والمتشابه."},{"f":"الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"بُحث في آيات الدرس في القرطبي (مسائله الفقهية) وفي منهاج الطالبين، ولم يوجد حكم فقهي عملي مأخوذ من هذه الآيات."},{"f":"المناسبات","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"انتقال السورة من صفات المؤمنين إلى صفات الكفار مسجل في قسم السياق من السعدي؛ ولم يُستخرج من نظم الدرر نص مستقل لهذا الموضع."},{"f":"أقوال العلماء","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"أقوال السلف في هذه الآيات مسجلة ضمن التفسير منسوبة إلى أصحابها، ولم تُفرد لها مادة مستقلة."},{"f":"التزكية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مادة التزكية في هذا الدرس (التحذير من صفات النفاق) مسجلة في التدبر والتطبيق؛ ولم يوجد في رياض الصالحين والأذكار نص مرتبط بالآيات مباشرة."},{"f":"أصول الفقه","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة مسألة أصولية مستنبطة من آيات هذا الدرس."},{"f":"القواعد الفقهية","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم تُذكر في مصادر البطاقة قاعدة فقهية مرتبطة بآيات هذا الدرس."},{"f":"المقاصد","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"مقاصد سورة البقرة مسجلة في الدرس الثاني (أول السورة)؛ ولم يُذكر لهذا المقطع مقصد مستقل في المصادر."},{"f":"أسباب الخلاف","c":"لا مادة مرتبطة","code":"NO_RELATED_MATERIAL","note":"لم يُسجّل في آيات هذا الدرس خلاف معتبر يحتاج إلى بيان أسبابه غير ما سُجّل في القراءات والوقف."}],"unc":["قاعدة التجويد منقولة من تحفة الأطفال، أما اختيار المثال من آيات الدرس فمن إعداد المسودة، ويحتاج إلى مراجعة مقرئ مجاز قبل التعليم.","إسناد رواية ابن عباس في لباب النقول مكتوب «محمد بن أبي عكرمة عن سعيد»، وفي الإتقان «محمد بن أبي محمد عن عكرمة أو سعيد»؛ يبدو تصحيفًا في طبعة اللباب ويحتاج إلى تحقق."],"dis":["المراد بـ﴿الذين كفروا﴾ في الآية ٦."]},{"n":4,"surah":"البقرة","from":12,"to":16,"title":"البقرة ١٢–١٦: صفات المنافقين","theme":"كشف حال المنافقين: يفسدون ويزعمون الإصلاح، ويرمون المؤمنين بالسفه وهم السفهاء، ويظهرون للمؤمنين غير ما يبطنون، فاشتروا الضلالة بالهدى فما ربحت تجارتهم.","sections":[{"name":"المفردات","taf":false,"items":[{"id":"m-voc-sufaha","a":[13,13],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«السفهاء»: الجهلة، والسفه: الجهل.","g":"","b":[],"q":[{"t":"﴿قَالُوا أَنُؤْمِنُ كَمَا آمَنَ السُّفَهَاءُ﴾ ؟! أي: الجهلة","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":41,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-yamudd","a":[15,15],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«يمدهم»: يتمادى بهم ويطيل لهم. «طغيانهم»: عتوهم وتكبرهم. «يعمهون»: يركبون رؤوسهم فلا يبصرون.","g":"","b":[],"q":[{"t":"﴿وَيَمُدُّهُمْ﴾ أي: يتمادى بهم، ويطيل لهم.\n﴿فِي طُغْيَانِهِمْ﴾ أي: في عُتُوِّهِمْ وتكبُّرهم.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":41,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"},{"t":"﴿يَعْمَهُونَ﴾ يركبون رءُوسهم فلا يُبصرون.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":41,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]},{"id":"m-voc-ishtaraw","a":[16,16],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"«اشتروا الضلالة بالهدى»: استبدلوا.","g":"","b":[],"q":[{"t":"﴿أُولَئِكَ الَّذِينَ اشْتَرَوُا الضَّلالَةَ بِالْهُدَى﴾ أي: استبدلوا.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":42,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]}]},{"name":"المعنى الإجمالي","taf":false,"items":[{"id":"m2-gm-mufsidun","a":[12,12],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"لما حصر المنافقون الإصلاح في أنفسهم وضمنوا ذلك أن المؤمنين ليسوا مصلحين، قلب الله دعواهم فقال: ﴿ألا إنهم هم المفسدون﴾.","g":"","b":[],"q":[{"t":"قلب الله عليهم دعواهم بقوله: ﴿ألا إنهم هم المفسدون﴾","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ١١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"التفسير","taf":false,"items":[{"id":"m-taf-mufsidun","a":[12,12],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"قلب الله دعواهم فقال ﴿ألا إنهم هم المفسدون﴾؛ فلا أعظم فسادًا ممن كفر بآيات الله وصد عن سبيله وخادع أولياءه ثم زعم أن هذا إصلاح. والإصلاح في الأرض أن تُعمر بطاعة الله.","g":"","b":[],"q":[{"t":"قلب الله عليهم دعواهم بقوله: ﴿ألا إنهم هم المفسدون﴾ فإنه لا أعظم فسادا (٢) ممن كفر بآيات الله، وصد عن سبيل الله، وخادع الله وأولياءه، ووالى المحاربين لله ورسوله، وزعم مع ذلك أن هذا إصلاح","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ١١","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"ولأن الإصلاح في الأرض أن تعمر بطاعة الله والإيمان به","src":"تفسير السعدي","au":"السعدي","v":null,"p":42,"h":null,"ch":"البقرة › ١١","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-safah","a":[13,13],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"إذا قيل لهم آمنوا كإيمان الصحابة قالوا: أنؤمن كما آمن السفهاء؟ فرد الله عليهم بأنهم هم السفهاء؛ لأن حقيقة السفه جهل الإنسان بمصالح نفسه وسعيه فيما يضره، والعبرة بالأوصاف لا بالدعاوى.","g":"","b":[],"q":[{"t":"فرد الله ذلك عليهم، وأخبر أنهم هم السفهاء على الحقيقة، لأن حقيقة السفه (٣) جهل الإنسان بمصالح نفسه، وسعيه فيما يضرها","src":"تفسير السعدي","au":"السعدي","v":null,"p":43,"h":null,"ch":"البقرة › ١٣","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"فالعبرة بالأوصاف والبرهان، لا بالدعاوى المجردة، والأقوال الفارغة.","src":"تفسير السعدي","au":"السعدي","v":null,"p":43,"h":null,"ch":"البقرة › ١٣","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-wajhayn","a":[14,14],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"إذا اجتمعوا بالمؤمنين أظهروا أنهم معهم، وإذا خلوا إلى شياطينهم أي رؤسائهم في الشر قالوا: إنا معكم، إنما نحن مستهزئون.","g":"","b":[],"q":[{"t":"أنهم إذا اجتمعوا بالمؤمنين، أظهروا أنهم على طريقتهم وأنهم معهم، فإذا خلوا إلى شياطينهم - أي: رؤسائهم وكبرائهم في الشر - قالوا: إنا معكم في الحقيقة","src":"تفسير السعدي","au":"السعدي","v":null,"p":43,"h":null,"ch":"البقرة › ١٤","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-yastahzi","a":[15,15],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"﴿الله يستهزئ بهم﴾ جزاءً على استهزائهم: زيّن لهم ما هم فيه حتى ظنوا أنهم مع المؤمنين، ويوم القيامة يُعطَون نورًا ثم يُطفأ فيبقون في الظلمة متحيرين.","g":"","b":[],"q":[{"t":"وهذا جزاء لهم، على استهزائهم بعباده، فمن استهزائه بهم أن زين لهم ما كانوا فيه من الشقاء والحالة الخبيثة، حتى ظنوا أنهم مع المؤمنين","src":"تفسير السعدي","au":"السعدي","v":null,"p":43,"h":null,"ch":"البقرة › ١٤","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"ومن استهزائه بهم يوم القيامة، أنه يعطيهم مع المؤمنين نورا ظاهرا، فإذا مشى المؤمنون بنورهم، طفئ نور المنافقين","src":"تفسير السعدي","au":"السعدي","v":null,"p":43,"h":null,"ch":"البقرة › ١٤","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]},{"id":"m-taf-tijara","a":[16,16],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"رغبوا في الضلالة رغبة المشتري في السلعة فبذلوا الهدى ثمنًا لها؛ فإذا كان من بذل دينارًا في درهم خاسرًا، فكيف بمن بذل الهدى في الضلالة؟","g":"","b":[],"q":[{"t":"أي: رغبوا في الضلالة، رغبة المشتري بالسلعة، التي من رغبته فيها يبذل فيها الأثمان (١) النفيسة.","src":"تفسير السعدي","au":"السعدي","v":null,"p":43,"h":null,"ch":"البقرة › ١٦","ed":"تفسير السعدي = تيسير الكريم الرحمن"},{"t":"وإذا كان من بذل (٣) دينارا في مقابلة درهم خاسرا، فكيف من بذل جوهرة وأخذ عنها درهما؟","src":"تفسير السعدي","au":"السعدي","v":null,"p":43,"h":null,"ch":"البقرة › ١٦","ed":"تفسير السعدي = تيسير الكريم الرحمن"}]}]},{"name":"السياق","taf":false,"items":[{"id":"m2-ctx-nifaq","a":[12,16],"lv":["التمكين","التفقّه"],"st":"يحتاج تحققًا","s":"ذكر ابن إسحاق أن هذه الآيات من صدر البقرة الذي نزل في المنافقين من الأوس والخزرج.","g":"","b":[],"q":[{"t":"يَعْنِي الْمُنَافِقِينَ مِنْ الْأَوْسِ وَالْخَزْرَجِ، وَمَنْ كَانَ عَلَى أَمْرِهِمْ","src":"السيرة النبوية","au":"ابن هشام","v":"2","p":128,"h":null,"ch":"المجلد: الثاني › المتن","ed":"سيرة ابن هشام - ت طه عبد الرؤوف سعد"}]}]},{"name":"أسباب النزول","taf":false,"items":[{"id":"m-asb-ibn-ubayy","a":[14,14],"lv":["التفقّه"],"st":"رواية لا تثبت","s":"رُوي أن الآية ١٤ نزلت في عبد الله بن أُبيّ حين أثنى على أبي بكر وعمر وعلي نفاقًا. قال السيوطي: هذا الإسناد واهٍ جدًّا؛ فلا يُعتمد سببًا للنزول.","g":"لا يثبت","b":[],"q":[{"t":"هذا الإسناد واه جدا فإن السدي الصغير كذاب وكذا الكلبي وأبو صالح ضعيف","src":"لباب النقول","au":"السيوطي","v":null,"p":7,"h":null,"ch":"سورة البقرة","ed":"لباب النقول"}]}]},{"name":"العقيدة","taf":false,"items":[{"id":"m-aq-jaza","a":[15,15],"lv":["التمكين","التفقّه"],"st":"ثابت","s":"قال ابن قتيبة: ﴿الله يستهزئ بهم﴾ أي يجازيهم جزاء الاستهزاء، ومثله ﴿نسوا الله فنسيهم﴾.","g":"","b":[],"q":[{"t":"﴿اللَّهُ يَسْتَهْزِئُ بِهِمْ﴾ أي يجازيهم جزاء الاستهزاء.","src":"غريب القرآن","au":"ابن قتيبة","v":null,"p":41,"h":null,"ch":"غريب القرآن › سورة البقرة","ed":"غريب القرآن لابن قتيبة ت أحمد صقر"}]}]},{"name":"التجويد","taf":false,"items":[{"id":"m2-tj-sufaha","a":[13,13],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"المد المتصل: حرف المد وبعده همز في كلمة واحدة، ومده واجب. مثاله في الدرس: ﴿السُّفَهَاءُ﴾.","g":"","b":[],"q":[{"t":"فَوَاجِبٌ إِنْ جَاءَ هَمْزٌ بَعْدَ مَدْ ... فِي كِلْمَةٍ وَذَا بِمُتَّصِلٍ يُعَدْ","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":7,"h":null,"ch":"أحكام المد","ed":"تحفة الأطفال والغلمان في تجويد القرآن"}]},{"id":"m2-tj-lakin-la","a":[12,12],"lv":["التأسيس","التمكين"],"st":"ثابت","s":"الإدغام بلا غنة: النون الساكنة والتنوين قبل اللام والراء تُدغم بلا غنة. مثاله في الدرس: ﴿وَلَكِنْ لَا يَشْعُرُونَ﴾.","g":"","b":[],"q":[{"t":"وَالثَّانِ إِدْغَامٌ بِغَيْرِ غُنَّهْ ... فِي اللاَّمِ وَالرَّا ثُمَّ كَرِّرَنَّهْ","src":"تحفة الأطفال","au":"الجمزوري","v":null,"p":3,"h
